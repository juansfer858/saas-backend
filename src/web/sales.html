<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ventas · VantixGC Super Core</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--line:#e4e4e7;--text:#18221d;--muted:#61706a;--green:#0d6b43;--nav:#10241b;--nav2:#173429;--danger:#b42318;--blue:#175cd3;--warn:#b54708}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--nav);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh}.brand{padding:5px 8px 20px;font-weight:850}.nav a{display:block;padding:10px 11px;margin:3px 0;border-radius:10px;color:#dce8e3;text-decoration:none;font-size:14px}.nav a:hover,.nav a.active{background:var(--nav2);color:#fff}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0;z-index:10}.content{padding:24px;max-width:1600px;margin:auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.head h1{margin:0 0 4px;font-size:27px}.muted{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:750}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.danger{color:var(--danger);border-color:#fecaca}.btn.small{font-size:12px;padding:6px 8px}.input,.select,textarea{border:1px solid #d0d5dd;border-radius:9px;padding:9px 10px;background:#fff}.filters{padding:14px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:9px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{background:#fafafa;color:#475467;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:10px 12px;border-bottom:1px solid #f1f2f3}.money{text-align:right!important}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.draft{background:#f2f4f7;color:#475467}.issued{background:#ecfdf3;color:#027a48}.paid{background:#eff8ff;color:#175cd3}.cancelled{background:#fef3f2;color:#b42318}.dian-pending{background:#fffaeb;color:#b54708}.dian-ok{background:#ecfdf3;color:#027a48}.dian-bad{background:#fef3f2;color:#b42318}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.modal-back{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(1180px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:15px;padding:20px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.lines{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.line-head,.line{display:grid;grid-template-columns:2.2fr .65fr 1fr .8fr 42px;gap:8px;align-items:center;padding:9px 10px}.line-head{background:#fafafa;font-size:11px;font-weight:800;color:#475467}.line{border-top:1px solid #f0f1f2}.line input,.line select{width:100%}.totals{margin:16px 0 0 auto;width:min(430px,100%);border:1px solid var(--line);border-radius:12px;padding:14px}.row{display:flex;justify-content:space-between;padding:5px 0}.row.final{font-size:18px;font-weight:850;border-top:1px solid var(--line);margin-top:8px;padding-top:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice,.error{padding:11px 13px;border-radius:9px;margin-bottom:14px}.notice{background:#f0f9f4;border:1px solid #bbdec9;color:#166534}.error{background:#fff1f0;border:1px solid #fecaca;color:#b42318}.empty{padding:38px;text-align:center;color:var(--muted)}@media(max-width:900px){.app{display:block}.sidebar{display:none}.filters,.form-grid{grid-template-columns:1fr 1fr}.line-head{display:none}.line{grid-template-columns:1fr 1fr}.line>*:first-child{grid-column:span 2}}@media(max-width:600px){.content{padding:12px 8px}.head{flex-direction:column}.filters,.form-grid,.line{grid-template-columns:1fr}.line>*:first-child{grid-column:auto}}
</style></head><body><div id="root"></div><div id="modalRoot"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const sessionKey='vantixgc_core_session_v1';let session=null;try{session=JSON.parse(localStorage.getItem(sessionKey)||'null')}catch{}if(!session)location.replace('/app/login');
const st={customers:[],products:[],cash:[],sales:[],lines:[],editing:null};function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]))}function money(v){return new Intl.NumberFormat('es-CO',{style:'currency',currency:session?.tenant?.moneda||'COP',maximumFractionDigits:0}).format(Number(v||0))}function date(v){return v?new Intl.DateTimeFormat('es-CO',{dateStyle:'medium'}).format(new Date(v)):'—'}function dstr(v){return v?new Date(v).toISOString().slice(0,10):new Date().toISOString().slice(0,10)}
async function api(path,opts={}){const headers={'Content-Type':'application/json',Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain,...(opts.headers||{})};const r=await fetch(path,{...opts,headers});let b={};try{b=await r.json()}catch{}if(r.status===401){localStorage.removeItem(sessionKey);location.replace('/app/login');throw new Error('Sesión vencida')}if(!r.ok)throw new Error(b?.error?.message||b?.message||`HTTP ${r.status}`);return b}
function nav(h,t,a=false){return `<a class="${a?'active':''}" href="${h}">${t}</a>`}function shell(){return `<div class="app"><aside class="sidebar"><div class="brand">VantixGC<br><small>Super Core</small></div><nav class="nav">${nav('/app/dashboard','Dashboard')}${nav('/app/ventas','Ventas',true)}${nav('/app/compras','Compras')}${nav('/app/inventario','Inventarios / Kardex')}${nav('/app/tesoreria','Tesorería & Bancos')}${nav('/app/cartera','Cartera')}${nav('/app/contabilidad','Contabilidad')}${nav('/app/terceros','Terceros')}${nav('/app/configuracion','Configuración')}</nav></aside><main class="main"><header class="top"><div><strong>${esc(session.tenant?.nombreEmpresa||session.subdomain)}</strong><div class="muted">${esc(session.subdomain)}</div></div><button class="btn small" id="logout">Salir</button></header><section class="content"><div class="head"><div><h1>Ventas</h1><div class="muted">Borrador → emisión atómica: AU + Kardex/recetas + Cartera/Tesorería + cola DIAN.</div></div><button class="btn primary" id="newSale">+ Nueva venta</button></div><div id="flash"></div><div id="view"></div></section></main></div>`}function flash(m,e=false){$('#flash').innerHTML=`<div class="${e?'error':'notice'}">${esc(m)}</div>`}function modal(h){$('#modalRoot').innerHTML=`<div class="modal-back"><div class="modal">${h}</div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
function badge(s){const m={BORRADOR:['Borrador','draft'],EMITIDO:['Emitida','issued'],PAGADO_PARCIAL:['Parcial','paid'],PAGADO_TOTAL:['Pagada','paid'],ANULADO:['Anulada','cancelled']};const x=m[s]||[s,'draft'];return `<span class="badge ${x[1]}">${esc(x[0])}</span>`}function dianBadge(d){if(!d)return '<span class="muted">No encolado</span>';const c=d.state==='ACEPTADO'?'dian-ok':['RECHAZADO','CANCELADO'].includes(d.state)?'dian-bad':'dian-pending';return `<span class="badge ${c}">${esc(d.documentType)} · ${esc(d.state)}</span>`}
async function loadBase(){const [t,p,c]=await Promise.all([api('/api/v1/terceros?activo=true&limit=1000'),api('/api/v1/inventario/productos?activo=true&limit=1000'),api('/api/v1/tesoreria/cajas-bancos')]);st.customers=(t.data||[]).filter(x=>['CLIENTE','CLIENTE_PROVEEDOR'].includes(x.tipo));st.products=(p.data||[]).filter(x=>x.activo!==false);st.cash=(c.data||[]).filter(x=>x.activo!==false)}
function customerOptions(sel=''){return `<option value="">Consumidor final</option>`+st.customers.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.identificacion)} · ${esc(x.razonSocial||x.nombre)}</option>`).join('')}function productOptions(sel=''){return `<option value="">Producto/servicio</option>`+st.products.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''} data-price="${Number(x.precio1||0)}" data-iva="${Number(x.ivaPct||0)}">${esc(x.sku)} · ${esc(x.nombre)}</option>`).join('')}function cashOptions(sel=''){return `<option value="">Seleccione caja/banco</option>`+st.cash.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.nombre)} · ${esc(x.tipo)}</option>`).join('')}
async function loadList(){const q=new URLSearchParams();for(const [id,key] of [['fCustomer','terceroId'],['fState','estado'],['fFrom','desde'],['fTo','hasta']]){const v=$('#'+id)?.value;if(v)q.set(key,v)}q.set('limit','500');const r=await api('/api/v1/comercial/ventas?'+q);st.sales=r.data||[];renderList()}
function renderList(){const rows=st.sales.map(x=>`<tr><td><strong>${esc(x.numero)}</strong></td><td>${date(x.fecha)}</td><td>${esc(x.tercero?.razonSocial||x.tercero?.nombre||'Consumidor final')}</td><td>${badge(x.estado)}</td><td>${dianBadge(x.dianDocument)}</td><td class="money">${money(x.total)}</td><td class="money">${money(x.saldo)}</td><td><div class="toolbar"><button class="btn small" data-view="${x.id}">Ver</button>${x.estado==='BORRADOR'?`<button class="btn small" data-edit="${x.id}">Editar</button><button class="btn small primary" data-emit="${x.id}">Emitir</button>`:''}${x.estado==='EMITIDO'&&!x.dianDocument?.acceptedAt?`<button class="btn small danger" data-cancel="${x.id}">Anular</button>`:''}${x.asiento?.id?`<button class="btn small" onclick="location.href='/app/contabilidad?asiento=${x.asiento.id}'">AU</button>`:''}</div></td></tr>`).join('');$('#view').innerHTML=`<div class="panel"><div class="panel-head"><strong>Listado de ventas</strong><span class="muted">${st.sales.length} registros</span></div><div class="filters"><select id="fCustomer" class="select"><option value="">Todos los clientes</option>${st.customers.map(x=>`<option value="${x.id}">${esc(x.razonSocial||x.nombre)}</option>`).join('')}</select><select id="fState" class="select"><option value="">Todos los estados</option><option>BORRADOR</option><option>EMITIDO</option><option>PAGADO_PARCIAL</option><option>PAGADO_TOTAL</option><option>ANULADO</option></select><input id="fFrom" class="input" type="date"><input id="fTo" class="input" type="date"><button id="filterBtn" class="btn">Filtrar</button></div>${rows?`<div class="table-wrap"><table class="table"><thead><tr><th>Número</th><th>Fecha</th><th>Cliente</th><th>Estado</th><th>DIAN</th><th class="money">Total</th><th class="money">Saldo</th><th>Acciones</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No hay ventas.</div>'}</div>`;$('#filterBtn').onclick=loadList;$$('[data-view]').forEach(b=>b.onclick=()=>openDetail(b.dataset.view));$$('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));$$('[data-emit]').forEach(b=>b.onclick=()=>emitSale(b.dataset.emit));$$('[data-cancel]').forEach(b=>b.onclick=()=>cancelSale(b.dataset.cancel))}
function blankLine(){return {productoId:'',cantidad:1,precioUnitario:0,ivaPct:0}}function lineHtml(l,i){return `<div class="line" data-i="${i}"><select class="select product">${productOptions(l.productoId)}</select><input class="input qty" type="number" min="0.0001" step="0.0001" value="${Number(l.cantidad||1)}"><input class="input price" type="number" min="0" step="0.01" value="${Number(l.precioUnitario||0)}"><input class="input iva" type="number" min="0" max="100" step="0.01" value="${Number(l.ivaPct||0)}"><button class="btn small danger del">×</button></div>`}
function syncLines(){st.lines=$$('.line').map(row=>({productoId:row.querySelector('.product').value,cantidad:Number(row.querySelector('.qty').value||0),precioUnitario:Number(row.querySelector('.price').value||0),ivaPct:Number(row.querySelector('.iva').value||0),descuentoPct:0,impoconsumoPct:0}));renderTotals()}function renderLines(){$('#linesBox').innerHTML=st.lines.map(lineHtml).join('');$$('.line').forEach((row,i)=>{row.querySelectorAll('input').forEach(x=>x.oninput=syncLines);row.querySelector('.product').onchange=e=>{const opt=e.target.selectedOptions[0];if(opt?.dataset.price)row.querySelector('.price').value=opt.dataset.price;if(opt?.dataset.iva)row.querySelector('.iva').value=opt.dataset.iva;syncLines()};row.querySelector('.del').onclick=()=>{st.lines.splice(i,1);if(!st.lines.length)st.lines=[blankLine()];renderLines();renderTotals()}});renderTotals()}function renderTotals(){let sub=0,iva=0;for(const l of st.lines){const s=Number(l.cantidad||0)*Number(l.precioUnitario||0);sub+=s;iva+=s*Number(l.ivaPct||0)/100}$('#totals').innerHTML=`<div class="row"><span>Subtotal</span><strong>${money(sub)}</strong></div><div class="row"><span>IVA</span><strong>${money(iva)}</strong></div><div class="row final"><span>Total</span><span>${money(sub+iva)}</span></div>`}
async function openForm(id=null){let doc=null;if(id){const r=await api('/api/v1/comercial/ventas/'+id);doc=r.data}st.editing=doc;st.lines=(doc?.detalles||[]).map(x=>({productoId:x.productoId,cantidad:Number(x.cantidad),precioUnitario:Number(x.precioUnitario),ivaPct:Number(x.ivaPct)}));if(!st.lines.length)st.lines=[blankLine()];modal(`<h2>${doc?'Editar borrador':'Nueva venta'}</h2><div class="form-grid"><div class="field"><label>Tipo fiscal</label><select id="documentType" class="select"><option value="DOCUMENTO_EQUIVALENTE_POS" ${(doc?.documentType||'DOCUMENTO_EQUIVALENTE_POS')==='DOCUMENTO_EQUIVALENTE_POS'?'selected':''}>Documento Equivalente POS</option><option value="FACTURA_ELECTRONICA" ${doc?.documentType==='FACTURA_ELECTRONICA'?'selected':''}>Factura Electrónica</option></select></div><div class="field"><label>Cliente</label><select id="customer" class="select">${customerOptions(doc?.terceroId||'')}</select></div><div class="field"><label>Fecha</label><input id="saleDate" class="input" type="date" value="${dstr(doc?.fecha)}"></div><div class="field"><label>Forma de pago</label><select id="payment" class="select"><option value="EFECTIVO" ${doc?.formaPago==='EFECTIVO'?'selected':''}>Efectivo</option><option value="BANCO" ${doc?.formaPago==='BANCO'?'selected':''}>Banco</option><option value="CREDITO" ${doc?.formaPago==='CREDITO'?'selected':''}>Crédito</option></select></div><div class="field"><label>Caja/Banco</label><select id="cash" class="select">${cashOptions(doc?.cajaBancoId||'')}</select></div><div class="field" style="grid-column:span 3"><label>Notas</label><input id="notes" class="input" value="${esc(doc?.notesSale||doc?.notes||'')}"></div></div><div class="lines"><div class="line-head"><span>Producto/servicio</span><span>Cant.</span><span>Precio</span><span>% IVA</span><span></span></div><div id="linesBox"></div></div><button id="addLine" class="btn small" style="margin-top:9px">+ Agregar línea</button><div id="totals" class="totals"></div><div class="actions"><button id="close" class="btn">Cancelar</button><button id="saveDraft" class="btn">Guardar borrador</button><button id="saveEmit" class="btn primary">Emitir venta</button></div>`);renderLines();$('#addLine').onclick=()=>{syncLines();st.lines.push(blankLine());renderLines()};$('#close').onclick=closeModal;$('#saveDraft').onclick=()=>save(false);$('#saveEmit').onclick=()=>save(true)}
function payload(){syncLines();const payment=$('#payment').value;return {terceroId:$('#customer').value||null,cajaBancoId:payment==='CREDITO'?null:($('#cash').value||null),formaPago:payment,fecha:$('#saleDate').value+'T12:00:00.000Z',documentType:$('#documentType').value,notas:$('#notes').value||null,detalles:st.lines}}
async function save(emit){try{const p=payload();let r;if(st.editing){r=await api('/api/v1/comercial/ventas/'+st.editing.id,{method:'PATCH',body:JSON.stringify(p)});if(emit)r=await api('/api/v1/comercial/ventas/'+st.editing.id+'/emitir',{method:'POST'})}else{r=await api('/api/v1/comercial/ventas',{method:'POST',body:JSON.stringify({...p,estado:emit?'EMITIDO':'BORRADOR'})})}closeModal();flash(emit?'Venta emitida: AU, inventario/recetas, cartera/tesorería y DIAN sincronizados.':'Borrador guardado sin efectos operativos.');await loadList()}catch(e){flash(e.message,true)}}
async function emitSale(id){if(!confirm('¿Emitir esta venta? Después no será editable.'))return;try{await api('/api/v1/comercial/ventas/'+id+'/emitir',{method:'POST'});flash('Venta emitida.');await loadList()}catch(e){flash(e.message,true)}}async function cancelSale(id){const motivo=prompt('Motivo de anulación:');if(!motivo)return;try{await api('/api/v1/comercial/ventas/'+id+'/anular',{method:'POST',body:JSON.stringify({motivo})});flash('Venta anulada y efectos reversados.');await loadList()}catch(e){flash(e.message,true)}}async function openDetail(id){try{const r=await api('/api/v1/comercial/ventas/'+id);const x=r.data;modal(`<h2>${esc(x.numero)}</h2><p><strong>${esc(x.documentType)}</strong> · ${badge(x.estado)}</p><p>Cliente: ${esc(x.tercero?.razonSocial||x.tercero?.nombre||'Consumidor final')}</p><p>Total: <strong>${money(x.total)}</strong> · Saldo ${money(x.saldo)}</p><p>DIAN: ${dianBadge(x.dianDocument)}</p><p>Consumo receta: ${x.consumptionRun?`${money(x.consumptionRun.totalCost)} · ${x.consumptionRun.items.length} insumos`:'No aplica'}</p><div class="actions"><button class="btn" onclick="closeModal()">Cerrar</button></div>`)}catch(e){flash(e.message,true)}}
(async()=>{document.querySelector('#root').innerHTML=shell();$('#logout').onclick=()=>{localStorage.removeItem(sessionKey);location.replace('/app/login')};$('#newSale').onclick=()=>openForm();try{await loadBase();await loadList()}catch(e){flash(e.message,true)}})();
</script></body></html>
