<style>

}.document-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 18px;margin:14px 0}.document-meta div{padding:7px 0;border-bottom:1px solid #f1f2f3}.document-meta strong{display:block;font-size:11px;color:#667085;margin-bottom:3px;text-transform:uppercase}.document-note{margin-top:12px;padding:10px 12px;border:1px solid #d0d5dd;background:#f8fafc;border-radius:9px;color:#475467;font-size:12px}#salesPrintRoot{display:none}.sales-print-sheet{color:#000;background:#fff;font:12px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace}.sales-print-center{text-align:center}.sales-print-title{font-size:16px;font-weight:900}.sales-print-copy{font-weight:900;margin:4px 0}.sales-print-sep{border-top:1px dashed #000;margin:7px 0}.sales-print-pair,.sales-print-calc{display:flex;justify-content:space-between;gap:8px}.sales-print-item{padding:5px 0;border-bottom:1px dotted #bbb}.sales-print-desc{font-weight:800;overflow-wrap:anywhere}.sales-print-total{font-size:15px;font-weight:900}.sales-print-small{font-size:10px}.sales-print-footer{margin-top:10px;text-align:center}@media print{body.sales-print-mode{background:#fff!important}body.sales-print-mode #root,body.sales-print-mode #modalRoot{display:none!important}body.sales-print-mode #salesPrintRoot{display:block!important;margin:0 auto;max-width:74mm}body.sales-print-mode .sales-print-sheet{display:block!important}@page{size:auto;margin:3mm}}@media(max-width:900px){.app{display:block}.sidebar{display:none}.filters,.form-grid{grid-template-columns:1fr 1fr}.line-head{display:none}.line{grid-template-columns:1fr 1fr}.line>*:first-child{grid-column:span 2}}@media(max-width:600px){.content{padding:12px 8px}.head{flex-direction:column}.filters,.form-grid,.line,.document-meta{grid-template-columns:1fr}.line>*:first-child{grid-column:auto}}

<script>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const sessionKey='vantixgc_core_session_v1';let session=null;try{session=JSON.parse(localStorage.getItem(sessionKey)||'null')}catch{}if(!session)location.replace('/app/login');
const initialFilters=new URLSearchParams(location.search);const st={customers:[],products:[],cash:[],sales:[],meta:null,filters:{terceroId:initialFilters.get('terceroId')||'',estado:initialFilters.get('estado')||'',desde:initialFilters.get('desde')||'',hasta:initialFilters.get('hasta')||''},lines:[],editing:null};function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]))}function money(v){return new Intl.NumberFormat('es-CO',{style:'currency',currency:session?.tenant?.moneda||'COP',maximumFractionDigits:0}).format(Number(v||0))}function date(v){return v?new Intl.DateTimeFormat('es-CO',{dateStyle:'medium'}).format(new Date(v)):'—'}function dstr(v){return v?new Date(v).toISOString().slice(0,10):new Date().toISOString().slice(0,10)}
async function api(path,opts={}){const headers={'Content-Type':'application/json',Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain,...(opts.headers||{})};const r=await fetch(path,{...opts,headers});let b={};try{b=await r.json()}catch{}if(r.status===401){localStorage.removeItem(sessionKey);location.replace('/app/login');throw new Error('Sesión vencida')}if(!r.ok)throw new Error(b?.error?.message||b?.message||`HTTP ${r.status}`);return b}
function nav(h,t,a=false){return `<a class="${a?'active':''}" href="${h}">${t}</a>`}function shell(){return `<div class="app"><aside class="sidebar"><div class="brand">VantixGC<br><small>Super Core</small></div><nav class="nav">${nav('/app/dashboard','Dashboard')}${nav('/app/ventas','Ventas',true)}${nav('/app/compras','Compras')}${nav('/app/inventario','Inventarios / Kardex')}${nav('/app/tesoreria','Tesorería & Bancos')}${nav('/app/cartera','Cartera')}${nav('/app/contabilidad','Contabilidad')}${nav('/app/terceros','Terceros')}${nav('/app/configuracion','Configuración')}</nav></aside><main class="main"><header class="top"><div><strong>${esc(session.tenant?.nombreEmpresa||session.subdomain)}</strong><div class="muted">${esc(session.subdomain)}</div></div><button class="btn small" id="logout">Salir</button></header><section class="content"><div class="head"><div><h1>Ventas</h1><div class="muted">Borrador → emisión atómica: AU + Kardex/recetas + Cartera/Tesorería + cola DIAN.</div></div><button class="btn primary" id="newSale">+ Nueva venta</button></div><div id="flash"></div><div id="view"></div></section></main></div>`}function flash(m,e=false){$('#flash').innerHTML=`<div class="${e?'error':'notice'}">${esc(m)}</div>`}function modal(h){$('#modalRoot').innerHTML=`<div class="modal-back"><div class="modal">${h}</div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
function badge(s){const m={BORRADOR:['Borrador','draft'],EMITIDO:['Emitida','issued'],PAGADO_PARCIAL:['Parcial','paid'],PAGADO_TOTAL:['Pagada','paid'],ANULADO:['Anulada','cancelled']};const x=m[s]||[s,'draft'];return `<span class="badge ${x[1]}">${esc(x[0])}</span>`}function dianBadge(d){if(!d)return '<span class="muted">No encolado</span>';const c=d.state==='ACEPTADO'?'dian-ok':['RECHAZADO','CANCELADO'].includes(d.state)?'dian-bad':'dian-pending';return `<span class="badge ${c}">${esc(d.documentType)} · ${esc(d.state)}</span>`}
async function loadBase(){const [t,p,c]=await Promise.all([api('/api/v1/terceros?activo=true&limit=1000'),api('/api/v1/inventario/productos?activo=true&limit=1000'),api('/api/v1/tesoreria/cajas-bancos')]);st.customers=(t.data||[]).filter(x=>['CLIENTE','CLIENTE_PROVEEDOR'].includes(x.tipo));st.products=(p.data||[]).filter(x=>x.activo!==false);st.cash=(c.data||[]).filter(x=>x.activo!==false)}
function customerOptions(sel=''){return `<option value="">Consumidor final</option>`+st.customers.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.identificacion)} · ${esc(x.razonSocial||x.nombre)}</option>`).join('')}function productOptions(sel=''){return `<option value="">Producto/servicio</option>`+st.products.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''} data-price="${Number(x.precio1||0)}" data-iva="${Number(x.ivaPct||0)}">${esc(x.sku)} · ${esc(x.nombre)}</option>`).join('')}function cashOptions(sel=''){return `<option value="">Seleccione caja/banco</option>`+st.cash.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.nombre)} · ${esc(x.tipo)}</option>`).join('')}
function salesFilterQuery(capture=true){for(const [id,key] of [['fCustomer','terceroId'],['fState','estado'],['fFrom','desde'],['fTo','hasta']]){const node=$('#'+id);if(capture&&node)st.filters[key]=node.value||''}const q=new URLSearchParams();for(const [key,value] of Object.entries(st.filters)){if(value)q.set(key,value)}return q}function syncFilterUrl(){const q=salesFilterQuery(false);const url=new URL(location.href);for(const key of ['terceroId','estado','desde','hasta']){if(q.has(key))url.searchParams.set(key,q.get(key));else url.searchParams.delete(key)}history.replaceState(history.state||{},'',url.pathname+(url.searchParams.toString()?`?${url.searchParams}`:''))}
async function loadList(){const q=salesFilterQuery(true);q.set('pageSize','200');const r=await api('/api/v1/comercial/ventas?'+q);st.sales=r.data||[];st.meta=r.meta||null;syncFilterUrl();renderList()}
async function exportFilteredSales(){const q=salesFilterQuery(true);const btn=$('#exportBtn');if(btn)btn.disabled=true;try{const r=await fetch('/api/v1/comercial/ventas/exportar?'+q,{cache:'no-store',headers:{Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain}});if(r.status===401){localStorage.removeItem(sessionKey);location.replace('/app/login');return}if(!r.ok){let b={};try{b=await r.json()}catch{}throw new Error(b?.error?.message||b?.message||`HTTP ${r.status}`)}const blob=await r.blob();const disposition=r.headers.get('content-disposition')||'';const match=disposition.match(/filename="?([^";]+)"?/i);const filename=match?.[1]||`Ventas_${st.filters.desde||'inicio'}_${st.filters.hasta||'hoy'}.xls`;const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);flash(`Excel exportado con ${Number(st.meta?.total??st.sales.length)} venta(s) según el filtro aplicado.`)}catch(e){flash(e.message,true)}finally{if($('#exportBtn'))$('#exportBtn').disabled=false}}
function renderList(){const rows=st.sales.map(x=>`<tr><td><strong>${esc(x.numero)}</strong></td><td>${date(x.fecha)}</td><td>${esc(x.tercero?.razonSocial||x.tercero?.nombre||'Consumidor final')}</td><td>${badge(x.estado)}</td><td>${dianBadge(x.dianDocument)}</td><td class="money">${money(x.total)}</td><td class="money">${money(x.saldo)}</td><td><div class="toolbar"><button class="btn small" data-view="${x.id}">Ver</button>${x.estado==='BORRADOR'?`<button class="btn small" data-edit="${x.id}">Editar</button><button class="btn small primary" data-emit="${x.id}">Emitir</button>`:''}${x.estado==='EMITIDO'&&!x.dianDocument?.acceptedAt?`<button class="btn small danger" data-cancel="${x.id}">Anular</button>`:''}${x.asiento?.id?`<button class="btn small" onclick="location.href='/app/contabilidad?asiento=${x.asiento.id}'">AU</button>`:''}</div></td></tr>`).join('');const states=['BORRADOR','EMITIDO','PAGADO_PARCIAL','PAGADO_TOTAL','ANULADO'];const count=Number(st.meta?.total??st.sales.length);$('#view').innerHTML=`<div class="panel"><div class="panel-head"><strong>Listado de ventas</strong><span class="muted">${count} registros</span></div><div class="filters"><select id="fCustomer" class="select"><option value="">Todos los clientes</option>${st.customers.map(x=>`<option value="${x.id}" ${x.id===st.filters.terceroId?'selected':''}>${esc(x.razonSocial||x.nombre)}</option>`).join('')}</select><select id="fState" class="select"><option value="">Todos los estados</option>${states.map(state=>`<option value="${state}" ${state===st.filters.estado?'selected':''}>${state}</option>`).join('')}</select><input id="fFrom" class="input" type="date" value="${esc(st.filters.desde)}"><input id="fTo" class="input" type="date" value="${esc(st.filters.hasta)}"><button id="filterBtn" class="btn">Filtrar</button><button id="exportBtn" class="btn" ${count?'':'disabled'}>Exportar Excel</button></div>${rows?`<div class="table-wrap"><table class="table"><thead><tr><th>Número</th><th>Fecha</th><th>Cliente</th><th>Estado</th><th>DIAN</th><th class="money">Total</th><th class="money">Saldo</th><th>Acciones</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No hay ventas.</div>'}</div>`;$('#filterBtn').onclick=loadList;$('#exportBtn').onclick=exportFilteredSales;$$('[data-view]').forEach(b=>b.onclick=()=>openDetail(b.dataset.view));$$('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));$$('[data-emit]').forEach(b=>b.onclick=()=>emitSale(b.dataset.emit));$$('[data-cancel]').forEach(b=>b.onclick=()=>cancelSale(b.dataset.cancel))}
function blankLine(){return {productoId:'',cantidad:1,precioUnitario:0,ivaPct:0}}function lineHtml(l,i){return `<div class="line" data-i="${i}"><select class="select product">${productOptions(l.productoId)}</select><input class="input qty" type="number" min="0.0001" step="0.0001" value="${Number(l.cantidad||1)}"><input class="input price" type="number" min="0" step="0.01" value="${Number(l.precioUnitario||0)}"><input class="input iva" type="number" min="0" max="100" step="0.01" value="${Number(l.ivaPct||0)}"><button class="btn small danger del">×</button></div>`}
function syncLines(){st.lines=$$('.line').map(row=>({productoId:row.querySelector('.product').value,cantidad:Number(row.querySelector('.qty').value||0),precioUnitario:Number(row.querySelector('.price').value||0),ivaPct:Number(row.querySelector('.iva').value||0),descuentoPct:0,impoconsumoPct:0}));renderTotals()}function renderLines(){$('#linesBox').innerHTML=st.lines.map(lineHtml).join('');$$('.line').forEach((row,i)=>{row.querySelectorAll('input').forEach(x=>x.oninput=syncLines);row.querySelector('.product').onchange=e=>{const opt=e.target.selectedOptions[0];if(opt?.dataset.price)row.querySelector('.price').value=opt.dataset.price;if(opt?.dataset.iva)row.querySelector('.iva').value=opt.dataset.iva;syncLines()};row.querySelector('.del').onclick=()=>{st.lines.splice(i,1);if(!st.lines.length)st.lines=[blankLine()];renderLines();renderTotals()}});renderTotals()}function renderTotals(){let sub=0,iva=0;for(const l of st.lines){const s=Number(l.cantidad||0)*Number(l.precioUnitario||0);sub+=s;iva+=s*Number(l.ivaPct||0)/100}$('#totals').innerHTML=`<div class="row"><span>Subtotal</span><strong>${money(sub)}</strong></div><div class="row"><span>IVA</span><strong>${money(iva)}</strong></div><div class="row final"><span>Total</span><span>${money(sub+iva)}</span></div>`}
async function openForm(id=null){let doc=null;if(id){const r=await api('/api/v1/comercial/ventas/'+id);doc=r.data}st.editing=doc;st.lines=(doc?.detalles||[]).map(x=>({productoId:x.productoId,cantidad:Number(x.cantidad),precioUnitario:Number(x.precioUnitario),ivaPct:Number(x.ivaPct)}));if(!st.lines.length)st.lines=[blankLine()];modal(`<h2>${doc?'Editar borrador':'Nueva venta'}</h2><div class="form-grid"><div class="field"><label>Tipo fiscal</label><select id="documentType" class="select"><option value="DOCUMENTO_EQUIVALENTE_POS" ${(doc?.documentType||'DOCUMENTO_EQUIVALENTE_POS')==='DOCUMENTO_EQUIVALENTE_POS'?'selected':''}>Documento Equivalente POS</option><option value="FACTURA_ELECTRONICA" ${doc?.documentType==='FACTURA_ELECTRONICA'?'selected':''}>Factura Electrónica</option></select></div><div class="field"><label>Cliente</label><select id="customer" class="select">${customerOptions(doc?.terceroId||'')}</select></div><div class="field"><label>Fecha</label><input id="saleDate" class="input" type="date" value="${dstr(doc?.fecha)}"></div><div class="field"><label>Forma de pago</label><select id="payment" class="select"><option value="EFECTIVO" ${doc?.formaPago==='EFECTIVO'?'selected':''}>Efectivo</option><option value="BANCO" ${doc?.formaPago==='BANCO'?'selected':''}>Banco</option><option value="CREDITO" ${doc?.formaPago==='CREDITO'?'selected':''}>Crédito</option></select></div><div class="field"><label>Caja/Banco</label><select id="cash" class="select">${cashOptions(doc?.cajaBancoId||'')}</select></div><div class="field" style="grid-column:span 3"><label>Notas</label><input id="notes" class="input" value="${esc(doc?.notesSale||doc?.notes||'')}"></div></div><div class="lines"><div class="line-head"><span>Producto/servicio</span><span>Cant.</span><span>Precio</span><span>% IVA</span><span></span></div><div id="linesBox"></div></div><button id="addLine" class="btn small" style="margin-top:9px">+ Agregar línea</button><div id="totals" class="totals"></div><div class="actions"><button id="close" class="btn">Cancelar</button><button id="saveDraft" class="btn">Guardar borrador</button><button id="saveEmit" class="btn primary">Emitir venta</button></div>`);renderLines();$('#addLine').onclick=()=>{syncLines();st.lines.push(blankLine());renderLines()};$('#close').onclick=closeModal;$('#saveDraft').onclick=()=>save(false);$('#saveEmit').onclick=()=>save(true)}
function payload(){syncLines();const payment=$('#payment').value;return {terceroId:$('#customer').value||null,cajaBancoId:payment==='CREDITO'?null:($('#cash').value||null),formaPago:payment,fecha:$('#saleDate').value+'T12:00:00.000Z',documentType:$('#documentType').value,notas:$('#notes').value||null,detalles:st.lines}}
async function save(emit){try{const p=payload();let r;if(st.editing){r=await api('/api/v1/comercial/ventas/'+st.editing.id,{method:'PATCH',body:JSON.stringify(p)});if(emit)r=await api('/api/v1/comercial/ventas/'+st.editing.id+'/emitir',{method:'POST'})}else{r=await api('/api/v1/comercial/ventas',{method:'POST',body:JSON.stringify({...p,estado:emit?'EMITIDO':'BORRADOR'})})}closeModal();flash(emit?'Venta emitida: AU, inventario/recetas, cartera/tesorería y DIAN sincronizados.':'Borrador guardado sin efectos operativos.');await loadList()}catch(e){flash(e.message,true)}}
async function emitSale(id){if(!confirm('¿Emitir esta venta? Después no será editable.'))return;try{await api('/api/v1/comercial/ventas/'+id+'/emitir',{method:'POST'});flash('Venta emitida.');await loadList()}catch(e){flash(e.message,true)}}async function cancelSale(id){const motivo=prompt('Motivo de anulación:');if(!motivo)return;try{await api('/api/v1/comercial/ventas/'+id+'/anular',{method:'POST',body:JSON.stringify({motivo})});flash('Venta anulada y efectos reversados.');await loadList()}catch(e){flash(e.message,true)}}
function lineTotal(line){const stored=Number(line?.totalLinea);return Number.isFinite(stored)?stored:Number(line?.cantidad||0)*Number(line?.precioUnitario||0)}function paymentLabel(v){return ({EFECTIVO:'Efectivo',BANCO:'Transferencia / banco',CREDITO:'Crédito'})[String(v||'').toUpperCase()]||String(v||'—').replaceAll('_',' ')}function documentTypeLabel(v){return String(v||'Documento de venta').replaceAll('_',' ')}function documentLabel(t){const type=String(t?.tipoDocumento||'').trim().toUpperCase();return type==='NIT'?'NIT':(type||'Documento')}function customerName(t){return t?.razonSocial||t?.nombre||'Consumidor final'}function locationText(company){return [company?.address,[company?.city,company?.department].filter(Boolean).join(', ')].filter(Boolean).join(' · ')}
function printDocumentCopy(x){const root=$('#salesPrintRoot');if(!root)return;const tercero=x.tercero||null;const customer=customerName(tercero);const company=x.company||{};const companyName=company.nombreEmpresa||session.tenant?.nombreEmpresa||session.subdomain||'VantixGC';const companyLocation=locationText(company);const rows=(x.detalles||[]).map(line=>`<div class="sales-print-item"><div class="sales-print-desc">${esc(line.descripcion||line.producto?.nombre||'Producto')}</div><div class="sales-print-calc"><span>${esc(Number(line.cantidad||0))} x ${money(line.precioUnitario)}</span><strong>${money(lineTotal(line))}</strong></div></div>`).join('');const taxRows=`${Number(x.descuentoTotal||0)>0?`<div class="sales-print-pair"><span>Descuento</span><span>${money(x.descuentoTotal)}</span></div>`:''}${Number(x.ivaTotal||0)>0?`<div class="sales-print-pair"><span>IVA</span><span>${money(x.ivaTotal)}</span></div>`:''}${Number(x.impoconsumoTotal||0)>0?`<div class="sales-print-pair"><span>Impoconsumo</span><span>${money(x.impoconsumoTotal)}</span></div>`:''}`;root.innerHTML=`<section class="sales-print-sheet"><div class="sales-print-center"><div class="sales-print-title">${esc(companyName)}</div>${company.nit?`<div>NIT: ${esc(company.nit)}</div>`:''}${companyLocation?`<div>${esc(companyLocation)}</div>`:''}${company.phone?`<div>Tel: ${esc(company.phone)}</div>`:''}${company.email?`<div>${esc(company.email)}</div>`:''}<div class="sales-print-copy">COPIA / REIMPRESIÓN</div><div>${esc(documentTypeLabel(x.documentType))}</div><div class="sales-print-title">${esc(x.numero)}</div></div><div class="sales-print-sep"></div><div>Fecha: ${esc(date(x.emitidoEn||x.fecha))}</div><div><strong>Cliente:</strong> ${esc(customer)}</div>${tercero?.identificacion?`<div><strong>${esc(documentLabel(tercero))}:</strong> ${esc(tercero.identificacion)}</div>`:''}${tercero?.direccion?`<div><strong>Dirección:</strong> ${esc(tercero.direccion)}</div>`:''}${tercero?.telefono?`<div><strong>Teléfono:</strong> ${esc(tercero.telefono)}</div>`:''}${tercero?.email?`<div><strong>Correo:</strong> ${esc(tercero.email)}</div>`:''}<div>Estado: ${esc(String(x.estado||'').replaceAll('_',' '))}</div><div>Pago: ${esc(paymentLabel(x.formaPago))}</div><div class="sales-print-sep"></div>${rows||'<div>Sin líneas registradas</div>'}<div class="sales-print-sep"></div><div class="sales-print-pair"><span>Subtotal</span><span>${money(x.subtotal)}</span></div>${taxRows}<div class="sales-print-pair sales-print-total"><span>TOTAL</span><span>${money(x.total)}</span></div><div class="sales-print-sep"></div><div class="sales-print-footer sales-print-small">Copia del documento existente. No genera una nueva venta.</div></section>`;root.setAttribute('aria-hidden','false');document.body.classList.add('sales-print-mode');let cleaned=false;const cleanup=()=>{if(cleaned)return;cleaned=true;document.body.classList.remove('sales-print-mode');root.innerHTML='';root.setAttribute('aria-hidden','true')};window.addEventListener('afterprint',cleanup,{once:true});setTimeout(()=>{try{window.print();setTimeout(cleanup,1000)}catch(error){cleanup();const status=$('#detailStatus');if(status)status.innerHTML='<div class="error">No fue posible abrir la impresión. Intenta nuevamente.</div>'}},60)}
async function openDetail(id){try{const r=await api('/api/v1/comercial/ventas/'+id);const x=r.data;const details=(x.detalles||[]).map(line=>`<tr><td>${esc(Number(line.cantidad||0))}</td><td>${esc(line.descripcion||line.producto?.nombre||'Producto')}</td><td class="money">${money(line.precioUnitario)}</td><td class="money"><strong>${money(lineTotal(line))}</strong></td></tr>`).join('');const tercero=x.tercero||null;const customer=customerName(tercero);modal(`<h2>Documento ${esc(x.numero)}</h2><p><strong>${esc(documentTypeLabel(x.documentType))}</strong> · ${badge(x.estado)}</p><div class="document-meta"><div><strong>Fecha</strong>${esc(date(x.emitidoEn||x.fecha))}</div><div><strong>Cliente</strong>${esc(customer)}</div><div><strong>${esc(documentLabel(tercero))}</strong>${esc(tercero?.identificacion||'—')}</div><div><strong>Dirección</strong>${esc(tercero?.direccion||'—')}</div><div><strong>Teléfono</strong>${esc(tercero?.telefono||'—')}</div><div><strong>Correo</strong>${esc(tercero?.email||'—')}</div><div><strong>Forma de pago</strong>${esc(paymentLabel(x.formaPago))}</div></div><div class="panel" style="margin-top:14px"><div class="panel-head"><strong>Detalle del documento</strong><span class="muted">${(x.detalles||[]).length} línea(s)</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Cant.</th><th>Descripción</th><th class="money">Valor unitario</th><th class="money">Valor total</th></tr></thead><tbody>${details||'<tr><td colspan="4" class="empty">Sin líneas registradas</td></tr>'}</tbody></table></div></div><div class="totals"><div class="row"><span>Subtotal</span><strong>${money(x.subtotal)}</strong></div>${Number(x.descuentoTotal||0)>0?`<div class="row"><span>Descuento</span><strong>${money(x.descuentoTotal)}</strong></div>`:''}${Number(x.ivaTotal||0)>0?`<div class="row"><span>IVA</span><strong>${money(x.ivaTotal)}</strong></div>`:''}${Number(x.impoconsumoTotal||0)>0?`<div class="row"><span>Impoconsumo</span><strong>${money(x.impoconsumoTotal)}</strong></div>`:''}<div class="row final"><span>Total</span><span>${money(x.total)}</span></div><div class="row"><span>Saldo</span><strong>${money(x.saldo)}</strong></div></div><p>DIAN: ${dianBadge(x.dianDocument)}</p><p>Consumo receta: ${x.consumptionRun?`${money(x.consumptionRun.totalCost)} · ${x.consumptionRun.items.length} insumos`:'No aplica'}</p>${x.notesSale?`<p><strong>Notas:</strong> ${esc(x.notesSale)}</p>`:''}<div class="document-note">Reimprimir usa los datos completos de la empresa y del cliente asociados al documento. Solo abre una copia del documento existente: no crea otra venta, no modifica el pago y no vuelve a afectar inventario ni contabilidad.</div><div id="detailStatus"></div><div class="actions">${x.estado!=='BORRADOR'?'<button id="reprintDocument" class="btn primary">Reimprimir</button>':''}<button id="closeDetail" class="btn">Cerrar</button></div>`);$('#closeDetail').onclick=closeModal;if($('#reprintDocument'))$('#reprintDocument').onclick=()=>printDocumentCopy(x)}catch(e){flash(e.message,true)}}
(async()=>{document.querySelector('#root').innerHTML=shell();$('#logout').onclick=()=>{localStorage.removeItem(sessionKey);location.replace('/app/login')};$('#newSale').onclick=()=>openForm();try{await loadBase();await loadList()}catch(e){flash(e.message,true)}})();
</script></body></html>
