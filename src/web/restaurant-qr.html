<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido en mesa · VantixGC</title>
<style>:root{--g:#0d6b43;--soft:#ddf3e8;--bg:#f4f4f5;--b:#e4e4e7;--t:#18221d;--m:#61706a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t)}.wrap{max-width:620px;margin:auto;padding:18px}.brand{font-weight:900;color:var(--g)}.card{background:#fff;border:1px solid var(--b);border-radius:16px;padding:16px;margin:12px 0}.muted{color:var(--m);font-size:13px}.cat{margin:22px 0 8px}.item{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid #eee;padding:13px 0}.price{font-weight:900;color:var(--g)}button,input{font:inherit}.btn{border:1px solid var(--b);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800}.btn.primary{background:var(--g);border-color:var(--g);color:#fff}.qty{display:flex;gap:7px;align-items:center}.cart{position:sticky;bottom:0;background:#fff;border:1px solid var(--b);border-radius:16px;padding:14px;box-shadow:0 -5px 20px #0000000b}.line{display:flex;justify-content:space-between;gap:8px;padding:5px 0}.total{font-size:21px;font-weight:900;border-top:1px solid #eee;padding-top:10px;margin-top:8px;display:flex;justify-content:space-between}.input{border:1px solid #d0d5dd;border-radius:9px;padding:9px;width:100%;margin-top:8px}.notice{background:#effaf4;border:1px solid #b7dfc8;border-radius:11px;padding:12px}.error{background:#fff1f0;border:1px solid #fecaca;color:#b42318;border-radius:11px;padding:12px}.sent{text-align:center;padding:34px 12px}.sent b{display:block;font-size:24px;color:var(--g);margin:8px}</style></head>
<body><main class="wrap"><div class="brand">VantixGC Restaurante</div><div id="app"><div class="card">Cargando menú…</div></div></main>
<script>
const token=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');const S={ctx:null,cart:new Map()};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(v||0));
async function req(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let b={};try{b=await r.json()}catch{}if(!r.ok)throw new Error(b?.error?.message||'No fue posible continuar');return b.data}
function lineTotal(m,q){const p=Number(m.product.price||0),iva=Number(m.product.ivaPct||0),ic=Number(m.product.impoconsumoPct||0);const base=p*q;return Math.round((base+base*iva/100+base*ic/100)*100)/100}
function total(){let n=0;for(const [id,q] of S.cart){const m=S.ctx.menu.find(x=>x.id===id);if(m)n+=lineTotal(m,q)}return Math.round(n*100)/100}
function cartHtml(){if(!S.cart.size)return '<div class="muted">Aún no has agregado productos.</div>';let rows='';for(const [id,q] of S.cart){const m=S.ctx.menu.find(x=>x.id===id);rows+=`<div class="line"><span>${q}× ${esc(m.product.name)}</span><b>${money(lineTotal(m,q))}</b></div>`}return rows+`<div class="total"><span>Total</span><span>${money(total())}</span></div><input id="phone" class="input" inputmode="tel" placeholder="WhatsApp opcional, ej. +573001234567"><label class="muted" style="display:block;margin:9px 0"><input id="consent" type="checkbox"> Acepto recibir por WhatsApp avisos transaccionales de este pedido.</label><button id="confirm" class="btn primary" style="width:100%">Revisé el total · Confirmar pedido</button>`}
function render(){const c=S.ctx;if(!c.open){document.querySelector('#app').innerHTML=`<div class="card error"><b>${esc(c.table.name)}</b><p>La mesa todavía no está abierta. Solicita al personal abrirla antes de hacer el autopedido.</p></div>`;return}const cats=['ENTRADAS','FUERTES','BEBIDAS','POSTRES'];document.querySelector('#app').innerHTML=`<div class="card"><h1 style="margin:3px 0">${esc(c.table.name)}</h1><div class="muted">Pedido directo a cocina/barra · sin aprobación previa del mesero</div><div class="notice" style="margin-top:10px">Cuenta actual: ${money(c.currentTotal)}</div></div><div class="card">${cats.map(cat=>`<h2 class="cat">${cat}</h2>${c.menu.filter(x=>x.category===cat&&x.product).map(m=>`<div class="item"><div><b>${esc(m.product.name)}</b><div class="muted">${esc(m.station)}${!m.available?' · No disponible: receta pendiente':''}</div><div class="price">${money(lineTotal(m,1))}</div></div><div class="qty">${m.available?`<button class="btn" data-minus="${m.id}">−</button><b>${S.cart.get(m.id)||0}</b><button class="btn primary" data-plus="${m.id}">+</button>`:'<span class="muted">—</span>'}</div></div>`).join('')||'<div class="muted">Sin productos</div>'}`).join('')}</div><div class="cart"><h3 style="margin:0 0 8px">Tu pedido</h3><div id="cart">${cartHtml()}</div></div>`;document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{S.cart.set(b.dataset.plus,(S.cart.get(b.dataset.plus)||0)+1);render()});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const n=(S.cart.get(b.dataset.minus)||0)-1;n>0?S.cart.set(b.dataset.minus,n):S.cart.delete(b.dataset.minus);render()});document.querySelector('#confirm')?.addEventListener('click',send)}
async function send(){if(!S.cart.size)return;const phone=document.querySelector('#phone').value.trim();const consent=document.querySelector('#consent').checked;if(phone&&!consent)return alert('Marca el consentimiento si deseas usar tu número para avisos de este pedido.');const payload={items:[...S.cart.entries()].map(([menuItemId,quantity])=>({menuItemId,quantity})),confirmedTotal:total(),customerPhoneE164:phone||null,consentWhatsApp:Boolean(phone&&consent),externalRequestId:'QR-'+Date.now()+'-'+Math.random().toString(36).slice(2,9)};const btn=document.querySelector('#confirm');btn.disabled=true;btn.textContent='Enviando…';try{const order=await req(`/api/public/restaurante/qr/${encodeURIComponent(token)}/pedidos`,{method:'POST',body:JSON.stringify(payload)});document.querySelector('#app').innerHTML=`<div class="card sent"><div>✓</div><b>Pedido enviado</b><p>Entró de inmediato a las comandas del restaurante.</p><div class="muted">Pedido ${esc(order.id.slice(0,8))} · ${money(order.total)}</div><button class="btn primary" onclick="location.reload()">Agregar otro pedido</button></div>`}catch(e){btn.disabled=false;btn.textContent='Revisé el total · Confirmar pedido';alert(e.message)}}
req(`/api/public/restaurante/qr/${encodeURIComponent(token)}`).then(x=>{S.ctx=x;render()}).catch(e=>document.querySelector('#app').innerHTML=`<div class="card error">${esc(e.message)}</div>`);
</script></body></html>
