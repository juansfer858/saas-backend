<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VantixGC Restaurante</title>
  <link rel="stylesheet" href="/app/restaurant-theme.css?v=la-riel-v1">
  <link rel="stylesheet" href="/app/restaurant-control-center.css?v=workspace-v1">
  <link rel="stylesheet" href="/restaurantes/theme-v1.css">
</head>
<body>
  <div class="ri-shell">
    <header class="ri-header">
      <div>
        <div class="ri-brand-kicker">VantixGC Restaurante · La Riel</div>
        <div class="ri-brand" data-restaurant-name>Restaurante</div>
        <div class="ri-subline" id="tenantLine">Cargando identidad y operación…</div>
      </div>
      <div class="ri-user"><strong id="userName">Usuario</strong><span id="userRole"></span><br><a id="coreLink" class="ri-link" href="/app/dashboard">Super Core</a></div>
    </header>
    <div id="gate" class="ri-gate"><div id="gateInner" class="ri-gate-inner"><b>Modo funcional simulado</b><span>Consultando gates…</span></div></div>
    <div class="rail-wrap"><nav id="rail" class="rail" aria-label="La Riel · navegación por permisos"></nav><a class="cc-classic-link" href="/app/dashboard" data-restaurant-admin-link="true">← Administración</a></div>
    <main class="ri-main"><div id="message" class="ri-message"></div><div id="view"></div></main>
  </div>
  <script src="/app/restaurant-theme.js?v=la-riel-v1"></script>
  <script src="/app/restaurant-ui.js?v=identity-core-v1"></script>
  <script src="/app/restaurant-control-center.js?v=workspace-v1"></script>
  <script>
  (()=>{
    const ORIGIN_KEY='vantixgc_core_origin_v1',SESSION_KEY='vantixgc_core_session_v1',MAX_AGE_MS=4*60*60*1000;
    try{
      const session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
      const origin=JSON.parse(sessionStorage.getItem(ORIGIN_KEY)||'null');
      if(!origin||!origin.from||origin.targetPath!=='/app/centro-de-control'||Date.now()-Number(origin.createdAt||0)>MAX_AGE_MS)return;
      if(origin.tenant&&session?.subdomain&&origin.tenant!==session.subdomain)return;
      const from=new URL(origin.from,location.origin);if(from.origin!==location.origin||!from.pathname.startsWith('/app/'))return;
      const back=()=>{sessionStorage.removeItem(ORIGIN_KEY);location.assign(`${from.pathname}${from.search}${from.hash}`)};
      const admin=document.querySelector('[data-restaurant-admin-link]');if(admin){admin.href=`${from.pathname}${from.search}${from.hash}`;admin.textContent='← Atrás';admin.title='Volver a '+String(origin.fromLabel||'la pantalla anterior');admin.addEventListener('click',e=>{e.preventDefault();back()})}
      const core=document.querySelector('#coreLink');if(core){core.href=`${from.pathname}${from.search}${from.hash}`;core.textContent='← Atrás';core.addEventListener('click',e=>{e.preventDefault();back()})}
    }catch{}
  })();
  </script>
  <script>
  (()=>{
    const SESSION_KEY='vantixgc_core_session_v1';let session=null;try{session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{}
    if(!session?.token||!session?.subdomain)return;
    const api=async(path,opts={})=>{const r=await fetch(path,{...opts,cache:'no-store',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain,...(opts.headers||{})}});let b={};try{b=await r.json()}catch{}if(!r.ok)throw new Error(b?.error?.message||b?.message||`HTTP ${r.status}`);return b.data};
    const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[x]));
    function showInstallStatus(type,title,text,actionLabel,href){if(document.querySelector('[data-edge-install-status]'))return;const el=document.createElement('div');el.dataset.edgeInstallStatus='true';el.style.cssText='margin:12px 18px 0;padding:14px 16px;border-radius:13px;border:1px solid '+(type==='offline'?'#fdba74':'#fed7aa')+';background:'+(type==='offline'?'#ffedd5':'#fff7ed')+';color:#1c1917;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-family:Lora,Georgia,serif';el.innerHTML=`<div><b style="display:block;margin-bottom:3px">${esc(title)}</b><span style="font-size:13px;color:#57534e">${esc(text)}</span></div>${href?`<a href="${href}" style="display:inline-flex;padding:9px 12px;border-radius:9px;background:#f97316;color:white;text-decoration:none;font-weight:700;font-size:12px">${esc(actionLabel||'Continuar')}</a>`:''}`;const gate=document.querySelector('#gate');gate?.insertAdjacentElement('afterend',el)}
    async function grant(agentId,button){try{if(button){button.disabled=true;button.textContent='Abriendo sede…'}const data=await api(`/api/v1/edge/agents/${encodeURIComponent(agentId)}/local-access-grant`,{method:'POST',body:'{}'});location.href=data.localUrl}catch(e){if(button){button.disabled=false;button.textContent='Trabajar en sede'}const m=document.querySelector('#message');if(m)m.innerHTML=`<div class="ri-error">${esc(e.message)}</div>`}}
    async function init(){try{const rows=await api('/api/v1/edge/installations');const all=Array.isArray(rows)?rows:[];const installed=all.filter(x=>x.installation&&(x.installation.installationId||x.installation.id||x.installation.lastSeenAt||x.installation.softwareVersion));const online=all.filter(x=>x.agent?.state==='ACTIVE'&&x.installation?.online&&x.installation?.lanHost);if(!installed.length){showInstallStatus('pending','Estás trabajando en VantixGC Cloud','Este computador todavía no tiene VantixGC Edge instalado. Para trabajar por LAN y seguir operando si falla Internet, instala la sede.','Instalar esta sede','/app/onboarding#site');return}if(!online.length){showInstallStatus('offline','Sede instalada, pero Edge no está ONLINE','VantixGC Cloud sigue disponible. Revisa que el computador principal esté encendido y que el Supervisor de VantixGC esté activo.','Revisar instalación','/app/onboarding#site');return}showInstallStatus('ok','Sede instalada y ONLINE','Puedes seguir aquí en la nube o abrir el Centro de Control servido por el Edge local de la sede.');const box=document.querySelector('.ri-user');if(!box)return;const b=document.createElement('button');b.type='button';b.className='ri-btn small primary';b.style.marginTop='8px';b.textContent='Trabajar en sede';b.title='Abrir el Centro de Control servido por el Edge local de este restaurante';box.appendChild(document.createElement('br'));box.appendChild(b);const requested=new URLSearchParams(location.search).get('edge');const chosen=online.find(x=>x.agent.id===requested)||online[0];b.onclick=()=>grant(chosen.agent.id,b);if(requested&&chosen.agent.id===requested)setTimeout(()=>grant(chosen.agent.id,b),150)}catch{}
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
  })();
  </script>
</body>
</html>
