<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VantixGC Restaurante · Fase 2</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--border:#e4e4e7;--text:#18221d;--muted:#61706a;--green:#0d6b43;--green2:#118a57;--soft:#ddf3e8;--gold:#d4a62a;--red:#b42318;--amber:#b54708;--blue:#175cd3}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.top{background:#fff;border-bottom:1px solid var(--border);padding:14px 18px;position:sticky;top:0;z-index:20}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;max-width:1400px;margin:auto}.brand{font-weight:900;color:var(--green);font-size:18px}.muted{color:var(--muted);font-size:13px}.gate{max-width:1400px;margin:14px auto 0;padding:12px 14px;border:1px solid #f5c06a;background:#fff7ed;border-radius:12px}.gate strong{color:var(--amber)}.gate.ready{border-color:#a6d8bd;background:#effaf4}.gate.ready strong{color:var(--green)}.tabs{max-width:1400px;margin:14px auto 0;display:flex;gap:7px;flex-wrap:wrap}.tab,.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 12px;font-weight:750;cursor:pointer}.tab.active,.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.gold{background:#fff9e8;border-color:#e9cc72;color:#6f5200}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.wrap{max-width:1400px;margin:14px auto;padding:0 14px 40px}.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:14px}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px}.card h2,.card h3{margin:0 0 12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.input,.select,textarea{border:1px solid #d0d5dd;border-radius:9px;padding:8px 10px;background:#fff}.floor{position:relative;min-height:440px;background:#fafafa;border:1px dashed #cfd4d1;border-radius:12px;overflow:auto}.mesa{position:absolute;border:2px solid #d0d5dd;background:#fff;border-radius:14px;padding:9px;display:flex;flex-direction:column;justify-content:space-between;user-select:none;touch-action:none}.mesa.LIBRE{border-color:#86c6a4}.mesa.OCUPADA{border-color:#f59e0b;background:#fffbeb}.mesa.CUENTA_PEDIDA{border-color:#d4a62a;background:#fff9e8}.mesa.RESERVADA{border-color:#7c8ce0;background:#f2f4ff}.mesa .name{font-weight:850}.mesa .state{font-size:11px;color:var(--muted)}.mesa .mini{display:flex;gap:4px;flex-wrap:wrap}.list{display:grid;gap:8px}.row{border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.menu-item{border:1px solid var(--border);border-radius:11px;padding:11px;background:#fff}.menu-item.warn{border-color:#f5c06a}.menu-item strong{display:block}.price{font-weight:900;color:var(--green);margin:5px 0}.cart-line{display:grid;grid-template-columns:1fr 70px 90px 32px;gap:6px;align-items:center;border-bottom:1px solid #eee;padding:7px 0}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:900;padding-top:12px}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800;background:#f2f4f7}.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.command{border:1px solid var(--border);border-radius:12px;background:#fff;padding:13px}.command h3{display:flex;justify-content:space-between}.station{font-size:12px;font-weight:900;color:var(--green)}.cmd-item{padding:5px 0;border-bottom:1px solid #f1f1f1}.notice{padding:10px 12px;border-radius:10px;background:#eef8f3;border:1px solid #b9ddc9;margin:8px 0}.error{padding:10px 12px;border-radius:10px;background:#fff1f0;border:1px solid #fecaca;color:var(--red);margin:8px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px}.metric b{font-size:22px;display:block}.hidden{display:none!important}.qr-url{font-size:12px;overflow-wrap:anywhere;background:#f7f7f7;padding:8px;border-radius:8px}.full{grid-column:1/-1}@media(max-width:900px){.grid{grid-template-columns:1fr}.kds,.metrics{grid-template-columns:1fr 1fr}.menu-grid{grid-template-columns:1fr}}@media(max-width:600px){.kds,.metrics{grid-template-columns:1fr}.head{align-items:flex-start}.mesa{position:relative!important;left:auto!important;top:auto!important;width:auto!important;height:auto!important;margin:8px}.floor{padding:5px}.cart-line{grid-template-columns:1fr 60px 75px 30px}}
</style>
</head>
<body>
<header class="top"><div class="head"><div><div class="brand">VantixGC Restaurante</div><div class="muted" id="tenantLine">Fase 2 · cargando…</div></div><div><span id="userLine" class="muted"></span> <button class="btn small" onclick="location.href='/app/dashboard'">Super Core</button></div></div></header>
<div id="gate" class="gate"><strong>FUNCIONAL — VALIDADO CON IMPRESIÓN SIMULADA</strong><div class="muted">Consultando gates de producción…</div></div>
<nav class="tabs" id="tabs"></nav>
<main class="wrap"><div id="message"></div><div id="view"></div></main>
<script>
const sessionKey='vantixgc_core_session_v1';let session=null;try{session=JSON.parse(localStorage.getItem(sessionKey)||'null')}catch{}if(!session)location.replace('/app');
const S={tab:'salon',tables:[],menu:[],cart:[],selectedTableId:null,commands:[],status:null,cashShiftId:localStorage.getItem('restaurant_cash_shift')||null,poll:null};
const role=()=>session?.user?.rol||'';const isAdmin=()=>['ADMIN','SUPER_ADMIN'].includes(role());
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=v=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(v||0));
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.token,'x-tenant-subdomain':session.subdomain,...(opts.headers||{})}});let b={};try{b=await r.json()}catch{}if(r.status===401){localStorage.removeItem(sessionKey);location.replace('/app')}if(!r.ok)throw new Error(b?.error?.message||'HTTP '+r.status);return b.data}
function msg(text,error=false){document.querySelector('#message').innerHTML=text?`<div class="${error?'error':'notice'}">${esc(text)}</div>`:''}
function tabs(){const all=[['salon','Mesas y salón'],['mesero','Panel mesero'],['kds','Cocina / Barra'],['caja','Caja / cierre'],['estado','Estado del vertical']];document.querySelector('#tabs').innerHTML=all.map(([k,t])=>`<button class="tab ${S.tab===k?'active':''}" data-tab="${k}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();})}
async function loadBase(){document.querySelector('#tenantLine').textContent=`${session.tenant?.nombreEmpresa||session.subdomain} · ${session.subdomain}`;document.querySelector('#userLine').textContent=`${session.user?.nombre||''} · ${role()}`;S.status=await api('/api/v1/restaurante/status');const g=document.querySelector('#gate');g.classList.toggle('ready',S.status.productionReady);g.innerHTML=`<strong>${esc(S.status.label)}</strong> · <b>${esc(S.status.productionLabel)}</b><div class="muted">${S.status.limitations.length?S.status.limitations.map(esc).join(' · '):'Los gates registrados están cerrados.'}</div>`;}
async function loadTables(){S.tables=await api('/api/v1/restaurante/mesas');if(!S.selectedTableId&&S.tables[0])S.selectedTableId=S.tables[0].id;return S.tables}
async function loadMenu(){S.menu=await api('/api/v1/restaurante/menu');return S.menu}
function tableCard(t){const active=t.activeSession;return `<div class="mesa ${t.state}" data-id="${t.id}" style="left:${t.posX}px;top:${t.posY}px;width:${t.width}px;height:${t.height}px"><div><div class="name">${esc(t.name)}</div><div class="state">${esc(t.state)} · ${t.seats} puestos</div></div><div class="mini">${!active?`<button class="btn small primary" data-open="${t.id}">Abrir</button>`:`<button class="btn small" data-select="${t.id}">Ver cuenta</button>`}<button class="btn small gold" data-qr="${t.id}">QR</button>${isAdmin()?`<button class="btn small danger" data-del="${t.id}">×</button>`:''}</div></div>`}
async function renderSalon(){await loadTables();document.querySelector('#view').innerHTML=`<div class="grid"><section class="card"><div class="toolbar"><h2 style="margin-right:auto">Plano del salón</h2>${isAdmin()?'<button class="btn primary" id="addTable">Agregar mesa</button>':''}<button class="btn" id="refreshTables">Actualizar</button></div><div class="floor" id="floor">${S.tables.map(tableCard).join('')}</div></section><aside class="card"><h2>Estados</h2><div class="list">${['LIBRE','OCUPADA','CUENTA_PEDIDA','RESERVADA'].map(st=>`<div class="row"><span>${st}</span><b>${S.tables.filter(t=>t.state===st).length}</b></div>`).join('')}</div><p class="muted">En escritorio, un Administrador puede arrastrar las mesas para guardar su posición. El mesero solo ve sus mesas asignadas.</p></aside></div>`;bindTables();document.querySelector('#refreshTables').onclick=renderSalon;if(isAdmin())document.querySelector('#addTable').onclick=addTable;}
async function addTable(){const code=prompt('Código de mesa (ej. M7)');if(!code)return;const name=prompt('Nombre visible',`Mesa ${code.replace(/\D/g,'')||code}`)||code;try{await api('/api/v1/restaurante/mesas',{method:'POST',body:JSON.stringify({code,name,seats:4,posX:30,posY:30})});await renderSalon()}catch(e){msg(e.message,true)}}
function bindTables(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openTable(b.dataset.open));document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{S.selectedTableId=b.dataset.select;S.tab='mesero';render()});document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>showQr(b.dataset.qr));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeTable(b.dataset.del));if(isAdmin()&&matchMedia('(min-width:601px)').matches){document.querySelectorAll('.mesa').forEach(el=>{let sx,sy,ox,oy;el.onpointerdown=e=>{if(e.target.closest('button'))return;sx=e.clientX;sy=e.clientY;ox=parseInt(el.style.left);oy=parseInt(el.style.top);el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(sx===undefined)return;el.style.left=Math.max(0,ox+e.clientX-sx)+'px';el.style.top=Math.max(0,oy+e.clientY-sy)+'px'};el.onpointerup=async()=>{if(sx===undefined)return;sx=undefined;try{await api('/api/v1/restaurante/mesas/'+el.dataset.id,{method:'PATCH',body:JSON.stringify({posX:parseInt(el.style.left),posY:parseInt(el.style.top)})})}catch(e){msg(e.message,true)}}})}}
async function openTable(id){try{await api(`/api/v1/restaurante/mesas/${id}/abrir`,{method:'POST',body:JSON.stringify({guestCount:1})});S.selectedTableId=id;msg('Mesa abierta; se creó una venta BORRADOR única para acumular pedidos.');S.tab='mesero';render()}catch(e){msg(e.message,true)}}
async function removeTable(id){if(!confirm('¿Retirar esta mesa del plano?'))return;try{await api('/api/v1/restaurante/mesas/'+id,{method:'DELETE'});renderSalon()}catch(e){msg(e.message,true)}}
async function showQr(id){const t=S.tables.find(x=>x.id===id);if(!t)return;const url=location.origin+'/r/'+encodeURIComponent(t.qrToken);document.querySelector('#view').insertAdjacentHTML('afterbegin',`<div class="card" id="qrBox"><h3>Autopedido · ${esc(t.name)}</h3><p>Este es el destino que debe codificarse en el QR físico de la mesa:</p><div class="qr-url">${esc(url)}</div><div class="toolbar" style="margin-top:9px"><button class="btn" id="copyQr">Copiar enlace</button><button class="btn" id="openQr">Abrir como cliente</button><button class="btn" onclick="document.querySelector('#qrBox').remove()">Cerrar</button></div></div>`);document.querySelector('#copyQr').onclick=()=>navigator.clipboard.writeText(url);document.querySelector('#openQr').onclick=()=>window.open(url,'_blank')}
function selectedTable(){return S.tables.find(x=>x.id===S.selectedTableId)}
async function renderWaiter(){await Promise.all([loadTables(),loadMenu()]);const t=selectedTable();const active=t?.activeSession;const cats=['ENTRADAS','FUERTES','BEBIDAS','POSTRES'];document.querySelector('#view').innerHTML=`<div class="grid"><section class="card"><h2>Toma de pedido</h2><div class="toolbar"><select class="select" id="tableSelect">${S.tables.map(x=>`<option value="${x.id}" ${x.id===S.selectedTableId?'selected':''}>${esc(x.name)} · ${x.state}</option>`).join('')}</select>${t&&!active?`<button class="btn primary" id="openSelected">Abrir mesa</button>`:''}${active?`<button class="btn gold" id="requestBill">Pedir cuenta</button>`:''}</div>${active?`<div class="notice">Documento de mesa activo: <b>${esc(active.id)}</b>. Cada envío agrega líneas al mismo borrador.</div>`:'<div class="error">La mesa está libre. Ábrela antes de enviar pedidos o usar su QR.</div>'}${cats.map(c=>`<h3>${c}</h3><div class="menu-grid">${S.menu.filter(m=>m.category===c).map(m=>`<div class="menu-item ${m.warning?'warn':''}"><strong>${esc(m.product?.nombre||'Producto')}</strong><span class="badge">${esc(m.station)}</span><div class="price">${money(m.product?.precio1)}</div>${m.warning?`<div class="muted">${esc(m.warning)}</div>`:`<button class="btn small primary" data-add="${m.id}">Agregar</button>`}</div>`).join('')||'<span class="muted">Sin ítems</span>'}</div>`).join('')}</section><aside class="card"><h2>Pedido actual</h2><div id="cart">${cartHtml()}</div>${active?'<button class="btn primary" id="sendOrder" style="width:100%;margin-top:12px">Enviar comanda simulada</button>':''}${t?`<hr style="border:0;border-top:1px solid #eee;margin:16px 0"><div class="muted">Autopedido</div><div class="qr-url">${esc(location.origin+'/r/'+t.qrToken)}</div>`:''}</aside></div>`;document.querySelector('#tableSelect').onchange=e=>{S.selectedTableId=e.target.value;S.cart=[];renderWaiter()};document.querySelector('#openSelected')?.addEventListener('click',()=>openTable(S.selectedTableId));document.querySelector('#requestBill')?.addEventListener('click',async()=>{try{await api(`/api/v1/restaurante/mesas/${S.selectedTableId}/pedir-cuenta`,{method:'POST',body:'{}'});msg('Cuenta pedida.');renderWaiter()}catch(e){msg(e.message,true)}});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCart(b.dataset.add));document.querySelector('#sendOrder')?.addEventListener('click',sendOrder);}
function cartHtml(){if(!S.cart.length)return '<div class="muted">Agrega productos del menú.</div>';return S.cart.map((x,i)=>`<div class="cart-line"><span>${esc(x.name)}</span><input class="input" type="number" min="1" value="${x.qty}" data-qty="${i}"><b>${money(x.price*x.qty)}</b><button class="btn small" data-rm="${i}">×</button></div>`).join('')+`<div class="total"><span>Total aprox.</span><span>${money(S.cart.reduce((a,x)=>a+x.price*x.qty,0))}</span></div>`}
function addCart(id){const m=S.menu.find(x=>x.id===id);if(!m)return;const e=S.cart.find(x=>x.menuItemId===id);if(e)e.qty++;else S.cart.push({menuItemId:id,name:m.product.nombre,price:Number(m.product.precio1),qty:1});document.querySelector('#cart').innerHTML=cartHtml();bindCart()}
function bindCart(){document.querySelectorAll('[data-qty]').forEach(i=>i.onchange=()=>{S.cart[Number(i.dataset.qty)].qty=Math.max(1,Number(i.value)||1);document.querySelector('#cart').innerHTML=cartHtml();bindCart()});document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.cart.splice(Number(b.dataset.rm),1);document.querySelector('#cart').innerHTML=cartHtml();bindCart()})}
async function sendOrder(){const t=selectedTable(),active=t?.activeSession;if(!active||!S.cart.length)return;try{const order=await api(`/api/v1/restaurante/sesiones/${active.id}/pedidos`,{method:'POST',body:JSON.stringify({items:S.cart.map(x=>({menuItemId:x.menuItemId,quantity:x.qty}))})});S.cart=[];msg(`Pedido enviado. ${order.commands.length} comanda(s) enrutada(s) por estación.`);renderWaiter()}catch(e){msg(e.message,true)}}
function commandItems(c){return c.order.items.filter(i=>i.station===c.station)}
async function renderKds(){S.commands=await api('/api/v1/restaurante/comandas');document.querySelector('#view').innerHTML=`<div class="toolbar"><h2 style="margin-right:auto">KDS / comandas</h2><span class="muted">Actualización automática cada 2 s · impresión: simulada</span></div><div class="kds">${S.commands.filter(c=>!['ENTREGADA','CANCELADA'].includes(c.state)).map(c=>`<article class="command"><h3><span>${esc(c.order.session.table.name)}</span><span class="station">${esc(c.station)}</span></h3><div class="muted">${esc(c.order.source)} · ${new Date(c.creadoEn).toLocaleTimeString()}</div>${commandItems(c).map(i=>`<div class="cmd-item"><b>${esc(i.quantity)}×</b> ${esc(i.description)} ${i.notes?`<small>${esc(i.notes)}</small>`:''}</div>`).join('')}<div class="toolbar" style="margin-top:10px"><span class="badge">${esc(c.state)}</span><button class="btn small" data-print="${c.id}">Ver/PDF</button>${c.state==='PENDIENTE'?`<button class="btn small primary" data-cmd="${c.id}" data-state="EN_PREPARACION">Preparar</button>`:''}${c.state==='EN_PREPARACION'?`<button class="btn small primary" data-cmd="${c.id}" data-state="LISTA">Listo</button>`:''}${c.state==='LISTA'?`<button class="btn small" data-cmd="${c.id}" data-state="ENTREGADA">Entregar</button>`:''}</div></article>`).join('')||'<div class="card full muted">No hay comandas pendientes para esta estación.</div>'}</div>`;document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>setCommand(b.dataset.cmd,b.dataset.state));document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printCommand(S.commands.find(x=>x.id===b.dataset.print)));}
async function setCommand(id,state){try{const r=await api('/api/v1/restaurante/comandas/'+id,{method:'PATCH',body:JSON.stringify({state})});if(r.notification?.queued)msg('Pedido listo y notificación WhatsApp encolada.');await renderKds()}catch(e){msg(e.message,true)}}
function printCommand(c){const rec=c.simulationRecord||{};const items=commandItems(c);const w=open('','_blank','width=440,height=700');w.document.write(`<!doctype html><title>Comanda simulada</title><style>body{font:16px monospace;padding:18px}h1{font-size:20px}.warn{border:2px solid #000;padding:8px;margin:10px 0;font-weight:bold}.line{padding:7px 0;border-bottom:1px dashed #777}@media print{button{display:none}}</style><h1>VantixGC · COMANDA ${esc(c.station)}</h1><div class="warn">COMANDA SIMULADA — NO IMPRESA EN HARDWARE</div><p>${esc(c.order.session.table.name)} · ${esc(c.order.source)}</p>${items.map(i=>`<div class="line"><b>${esc(i.quantity)}×</b> ${esc(i.description)} ${i.notes?'— '+esc(i.notes):''}</div>`).join('')}<p>Registro: ${esc(rec.generatedAt||c.creadoEn)}</p><button onclick="print()">Imprimir / Guardar PDF</button>`);w.document.close()}
async function renderCash(){await loadTables();const cajas=await api('/api/v1/tesoreria/cajas-bancos');let summary=null;if(S.cashShiftId){try{summary=await api(`/api/v1/restaurante/caja/turnos/${S.cashShiftId}/resumen`)}catch{S.cashShiftId=null;localStorage.removeItem('restaurant_cash_shift')}}const openTables=S.tables.filter(t=>t.activeSession);document.querySelector('#view').innerHTML=`<div class="grid"><section class="card"><h2>Turno de caja</h2>${!S.cashShiftId?`<div class="toolbar"><select id="cashAccount" class="select">${cajas.filter(c=>c.tipo==='CAJA'&&c.activo).map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select><input id="opening" class="input" type="number" min="0" value="0" placeholder="Fondo inicial"><button id="openShift" class="btn primary">Abrir caja</button></div>`:`<div class="notice">Turno abierto: ${esc(S.cashShiftId)}</div><div class="metrics"><div class="metric"><span class="muted">Mesas cerradas</span><b>${summary?.tables?.length||0}</b></div><div class="metric"><span class="muted">Ventas restaurante</span><b>${money(summary?.restaurantClosedTablesTotal)}</b></div><div class="metric"><span class="muted">Ingresos efectivo</span><b>${money(summary?.restaurantCashRecorded)}</b></div><div class="metric"><span class="muted">Caja esperada</span><b>${money(summary?.systemCashExpected)}</b></div></div><div class="toolbar" style="margin-top:12px"><input id="physicalCount" class="input" type="number" min="0" placeholder="Conteo físico final"><button id="closeShift" class="btn gold">Cerrar X/Z</button></div>`}</section><aside class="card"><h2>Cerrar mesa</h2>${openTables.length?`<select id="closeTableId" class="select" style="width:100%;margin-bottom:8px">${openTables.map(t=>`<option value="${t.id}">${esc(t.name)} · ${esc(t.state)}</option>`).join('')}</select><select id="paymentCash" class="select" style="width:100%;margin-bottom:8px">${cajas.filter(c=>c.activo).map(c=>`<option value="${c.id}">${esc(c.nombre)} · ${c.tipo}</option>`).join('')}</select><input id="tip" class="input" type="number" min="0" value="0" placeholder="Propina" style="width:100%;margin-bottom:8px"><input id="parts" class="input" type="number" min="1" value="1" placeholder="Dividir entre" style="width:100%;margin-bottom:8px"><button id="closeTable" class="btn primary" style="width:100%">Cobrar y cerrar mesa</button>`:'<div class="muted">No hay mesas abiertas.</div>'}</aside></div>${summary?.tables?.length?`<div class="card" style="margin-top:14px"><h3>Mesas cerradas del turno</h3><div class="list">${summary.tables.map(x=>`<div class="row"><span>${esc(x.table)} · ${esc(x.saleNumber)}</span><span>${money(x.saleTotal)} + propina ${money(x.tipAmount)} = <b>${money(x.total)}</b></span></div>`).join('')}</div></div>`:''}`;document.querySelector('#openShift')?.addEventListener('click',async()=>{try{const x=await api('/api/v1/restaurante/caja/abrir',{method:'POST',body:JSON.stringify({cajaBancoId:document.querySelector('#cashAccount').value,saldoInicial:Number(document.querySelector('#opening').value||0)})});S.cashShiftId=x.id;localStorage.setItem('restaurant_cash_shift',x.id);msg('Turno de caja abierto.');renderCash()}catch(e){msg(e.message,true)}});document.querySelector('#closeTable')?.addEventListener('click',async()=>{const parts=Math.max(1,Number(document.querySelector('#parts').value||1));try{const x=await api(`/api/v1/restaurante/mesas/${document.querySelector('#closeTableId').value}/cerrar`,{method:'POST',body:JSON.stringify({formaPago:'EFECTIVO',cajaBancoId:document.querySelector('#paymentCash').value,tipAmount:Number(document.querySelector('#tip').value||0),split:parts>1?{mode:'EQUAL',parts}:{mode:'NONE'}})});msg(`Mesa cerrada. Documento ${x.fiscalDocument.mode}. AU e inventario procesados en la misma transacción.`);renderCash()}catch(e){msg(e.message,true)}});document.querySelector('#closeShift')?.addEventListener('click',async()=>{const v=document.querySelector('#physicalCount').value;if(v==='')return msg('Ingrese el conteo físico final.',true);try{const x=await api(`/api/v1/restaurante/caja/turnos/${S.cashShiftId}/cerrar`,{method:'POST',body:JSON.stringify({saldoFinal:Number(v)})});msg(`Turno cerrado. Descuadre: ${money(x.closed.descuadre)}.`);S.cashShiftId=null;localStorage.removeItem('restaurant_cash_shift');renderCash()}catch(e){msg(e.message,true)}})}
async function renderStatus(){await loadBase();const s=S.status;document.querySelector('#view').innerHTML=`<div class="card"><h2>Estado oficial del vertical</h2><p style="font-size:20px;font-weight:900">${esc(s.label)}</p><p><b>${esc(s.productionLabel)}</b></p><div class="metrics"><div class="metric"><span class="muted">Impresora física</span><b>${s.gates.physicalPrinterFieldPass?'OK':'PEND.'}</b></div><div class="metric"><span class="muted">Meta business_management</span><b>${s.gates.metaBusinessManagementReviewPass?'OK':'PEND.'}</b></div><div class="metric"><span class="muted">DIAN real</span><b>${s.gates.dianRealEnabled?'OK':'PEND.'}</b></div><div class="metric"><span class="muted">Decisión fiscal simulada</span><b>${s.gates.simulatedFiscalOperationExplicitlyAccepted?'SÍ':'NO'}</b></div></div><p class="muted">La impresión de comandas permanece en ${esc(s.printMode)}. Esta pantalla no puede convertir una prueba simulada en prueba física; los gates requieren evidencia administrativa.</p>${isAdmin()?`<div class="toolbar"><label><input type="checkbox" id="waReady" ${s.whatsappOrderReadyEnabled?'checked':''}> WhatsApp opcional “Pedido listo”</label><button class="btn" id="saveOp">Guardar configuración operativa</button></div>`:''}</div>`;document.querySelector('#saveOp')?.addEventListener('click',async()=>{try{await api('/api/v1/restaurante/config',{method:'PATCH',body:JSON.stringify({whatsappOrderReadyEnabled:document.querySelector('#waReady').checked})});msg('Configuración guardada. La notificación solo saldrá con plantilla aprobada y consentimiento.');renderStatus()}catch(e){msg(e.message,true)}})}
async function render(){clearInterval(S.poll);tabs();msg('');try{if(!S.status)await loadBase();if(S.tab==='salon')await renderSalon();if(S.tab==='mesero')await renderWaiter();if(S.tab==='kds'){await renderKds();S.poll=setInterval(()=>{if(S.tab==='kds')renderKds().catch(()=>{})},2000)}if(S.tab==='caja')await renderCash();if(S.tab==='estado')await renderStatus()}catch(e){msg(e.message,true);document.querySelector('#view').innerHTML='<div class="card muted">No fue posible cargar esta vista.</div>'}}
loadBase().then(render).catch(e=>msg(e.message,true));
</script>
</body></html>
