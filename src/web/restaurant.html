<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VantixGC Restaurante</title>
  <link rel="stylesheet" href="/app/restaurant-theme.css?v=la-riel-v1">
  <link rel="stylesheet" href="/app/restaurant-control-center.css?v=workspace-v7-kds">
  <link rel="stylesheet" href="/restaurantes/theme-v1.css">
</head>
<body>
  <div class="ri-shell">
    <div class="rail-wrap">
      <nav id="rail" class="rail" aria-label="La Riel · navegación por permisos"></nav>
      <a id="noticeToggle" class="rail-ticket" href="#avisos" aria-label="Abrir avisos operativos">Avisos</a>
      <a class="cc-classic-link" href="/app/dashboard" data-restaurant-admin-link="true" aria-label="Volver a Administración">← Volver a Administración</a>
    </div>

    <dialog id="noticePanel" class="ri-card" aria-label="Avisos operativos">
      <div class="ri-toolbar"><div><div class="ri-eyebrow">Estado del sistema</div><h2>Avisos operativos</h2><p class="ri-muted">Producción y estado de sede sin ocupar espacio dentro de la operación.</p></div><button type="button" id="noticeClose" class="ri-btn small push">Cerrar</button></div>
      <section><div class="ri-eyebrow">Producción</div><div id="gateInner" class="ri-gate-inner"><b>Modo funcional simulado</b><span>Consultando gates…</span></div></section>
      <section><div class="ri-eyebrow">Sede / Edge</div><div id="edgeStatusSlot" class="ri-notice">Consultando estado de la sede…</div></section>
    </dialog>

    <main class="ri-main"><div id="message" class="ri-message"></div><div id="view"></div></main>

    <div hidden aria-hidden="true">
      <span id="tenantLine"></span>
      <span id="userName"></span>
      <span id="userRole"></span>
      <a id="coreLink" href="/app/dashboard">Super Core</a>
      <span data-restaurant-name></span>
    </div>
  </div>

  <script>
  (()=>{
    const toggle=document.querySelector('#noticeToggle'),panel=document.querySelector('#noticePanel'),close=document.querySelector('#noticeClose');
    if(!toggle||!panel)return;
    toggle.addEventListener('click',e=>{e.preventDefault();if(typeof panel.showModal==='function')panel.showModal();else panel.setAttribute('open','')});
    close?.addEventListener('click',()=>panel.close?.());
    panel.addEventListener('click',e=>{if(e.target===panel)panel.close?.()});
  })();
  </script>
  <script src="/app/restaurant-theme.js?v=panel-font-v1"></script>
  <script src="/app/restaurant-ui.js?v=kds-v2"></script>
  <script src="/app/restaurant-control-center.js?v=workspace-v3-nav2"></script>
  <script>
  (()=>{
    const ORIGIN_KEY='vantixgc_core_origin_v1',SESSION_KEY='vantixgc_core_session_v1',MAX_AGE_MS=4*60*60*1000;
    try{
      const session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
      const origin=JSON.parse(sessionStorage.getItem(ORIGIN_KEY)||'null');
      if(!origin||!origin.from||origin.targetPath!=='/app/centro-de-control'||Date.now()-Number(origin.createdAt||0)>MAX_AGE_MS)return;
      if(origin.tenant&&session?.subdomain&&origin.tenant!==session.subdomain)return;
      const from=new URL(origin.from,location.origin);if(from.origin!==location.origin||!from.pathname.startsWith('/app/'))return;
      const back=()=>{sessionStorage.removeItem(ORIGIN_KEY);location.assign(`${from.pathname}${from.search}${from.hash}`)};
      const admin=document.querySelector('[data-restaurant-admin-link]');if(admin){admin.href=`${from.pathname}${from.search}${from.hash}`;admin.textContent='← Volver a Administración';admin.title='Volver a '+String(origin.fromLabel||'Administración');admin.addEventListener('click',e=>{e.preventDefault();back()})}
      const core=document.querySelector('#coreLink');if(core){core.href=`${from.pathname}${from.search}${from.hash}`;core.textContent='← Atrás';core.addEventListener('click',e=>{e.preventDefault();back()})}
    }catch{}
  })();
  </script>
  <script>
  (()=>{
    const SESSION_KEY='vantixgc_core_session_v1';let session=null;try{session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{}
    if(!session?.token||!session?.subdomain)return;
    const api=async(path,opts={})=>{const r=await fetch(path,{...opts,cache:'no-store',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain,...(opts.headers||{})}});let b={};try{b=await r.json()}catch{}if(!r.ok)throw new Error(b?.error?.message||b?.message||`HTTP ${r.status}`);return b.data};
    const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[x]));
    function showInstallStatus(type,title,text,actionLabel,href){
      const slot=document.querySelector('#edgeStatusSlot');if(!slot)return;
      slot.className=type==='ok'?'ri-notice':'ri-error';
      slot.dataset.edgeInstallStatus='true';
      slot.innerHTML=`<b>${esc(title)}</b><div>${esc(text)}</div>${href?`<div class="ri-actions"><a href="${href}" class="ri-btn small primary">${esc(actionLabel||'Continuar')}</a></div>`:''}`;
    }
    async function grant(agentId,button){try{if(button){button.disabled=true;button.textContent='Abriendo sede…'}const data=await api(`/api/v1/edge/agents/${encodeURIComponent(agentId)}/local-access-grant`,{method:'POST',body:'{}'});location.href=data.localUrl}catch(e){if(button){button.disabled=false;button.textContent='Trabajar en sede'}const m=document.querySelector('#message');if(m)m.innerHTML=`<div class="ri-error">${esc(e.message)}</div>`}}
    async function init(){try{
      const rows=await api('/api/v1/edge/installations');const all=Array.isArray(rows)?rows:[];const installed=all.filter(x=>x.installation&&(x.installation.installationId||x.installation.id||x.installation.lastSeenAt||x.installation.softwareVersion));const online=all.filter(x=>x.agent?.state==='ACTIVE'&&x.installation?.online&&x.installation?.lanHost);
      if(!installed.length){showInstallStatus('pending','Estás trabajando en VantixGC Cloud','Este computador todavía no tiene VantixGC Edge instalado. Para trabajar por LAN y seguir operando si falla Internet, instala la sede.','Instalar esta sede','/app/onboarding#site');return}
      if(!online.length){showInstallStatus('offline','Sede instalada, pero Edge no está ONLINE','VantixGC Cloud sigue disponible. Revisa que el computador principal esté encendido y que el Supervisor de VantixGC esté activo.','Revisar instalación','/app/onboarding#site');return}
      showInstallStatus('ok','Sede instalada y ONLINE','Puedes seguir aquí en la nube o abrir el Centro de Control servido por el Edge local de la sede.');
      const slot=document.querySelector('#edgeStatusSlot');if(!slot)return;const actions=document.createElement('div');actions.className='ri-actions';const b=document.createElement('button');b.type='button';b.className='ri-btn small primary';b.textContent='Trabajar en sede';b.title='Abrir el Centro de Control servido por el Edge local de este restaurante';actions.appendChild(b);slot.appendChild(actions);const requested=new URLSearchParams(location.search).get('edge');const chosen=online.find(x=>x.agent.id===requested)||online[0];b.onclick=()=>grant(chosen.agent.id,b);if(requested&&chosen.agent.id===requested)setTimeout(()=>grant(chosen.agent.id,b),150)
    }catch{const slot=document.querySelector('#edgeStatusSlot');if(slot){slot.className='ri-error';slot.innerHTML='<b>No fue posible consultar la sede</b><div>La operación Cloud continúa disponible.</div>'}}}
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
  })();
  </script>
</body>
</html>
