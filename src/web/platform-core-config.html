<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configuración avanzada · VantixGC Core</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--line:#e4e4e7;--text:#18221d;--muted:#61706a;--green:#0d6b43;--soft:#ddf3e8;--red:#b42318;--nav:#10241b;--nav2:#173429}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--nav);color:white;padding:18px 14px}.brand{font-weight:850;padding:8px 10px 22px}.nav a{display:block;color:#dce8e3;text-decoration:none;padding:10px 12px;border-radius:10px;margin:2px 0}.nav a.active,.nav a:hover{background:var(--nav2)}.main{min-width:0}.top{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px}.content{max-width:1500px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:700}.tab.active{background:var(--green);color:white;border-color:var(--green)}.panel{background:white;border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}.ph{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.pb{padding:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.input,.select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:9px 10px;background:white}.btn{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:9px;font-weight:750;cursor:pointer}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.danger{color:var(--red)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px 12px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.table th{background:#fafafa}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:800}.ok{background:#ecfdf3;color:#027a48}.bad{background:#fff1f0;color:#b42318}.warn{background:#fffaeb;color:#b54708}.notice,.error{padding:10px 12px;border-radius:9px;margin:10px 0}.notice{background:#f0f9f4;border:1px solid #b7dfc8}.error{background:#fff1f0;border:1px solid #fecaca;color:#b42318}.modal-back{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:18px;z-index:30}.modal{background:white;border-radius:14px;padding:20px;width:min(900px,100%);max-height:92vh;overflow:auto}.permission-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.check{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);padding:8px;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid var(--line);border-radius:12px;padding:12px}.card strong{display:block;margin-top:5px}.hidden{display:none}@media(max-width:900px){.app{display:block}.side{display:none}.grid,.cards{grid-template-columns:1fr 1fr}}@media(max-width:600px){.content{padding:14px 9px}.grid,.cards,.permission-grid{grid-template-columns:1fr}}
</style>
</head><body><div id="root"></div><div id="modal"></div>
<script>
const key='vantixgc_core_session_v1';let session=null;try{session=JSON.parse(localStorage.getItem(key)||'null')}catch{}if(!session)location.replace('/app/login');
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const state={tab:'dian',permissions:[],roles:[],accounts:[],thirds:[]};
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]))}function money(v){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(v||0))}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain,...(opts.headers||{})}});let b={};try{b=await r.json()}catch{}if(r.status===401){localStorage.removeItem(key);location.replace('/app/login');throw new Error('Sesión vencida')}if(!r.ok)throw new Error(b?.error?.message||`HTTP ${r.status}`);return b}
function shell(){return `<div class="app"><aside class="side"><div class="brand">VantixGC<br><small style="color:#9db3a8">Super Core</small></div><nav class="nav"><a href="/app/dashboard">Dashboard</a><a href="/app/ventas">Ventas</a><a href="/app/compras">Compras</a><a href="/app/inventario">Inventarios / Kardex</a><a href="/app/tesoreria">Tesorería & Bancos</a><a href="/app/cartera">Cartera</a><a href="/app/contabilidad">Contabilidad</a><a href="/app/terceros">Terceros</a><a href="/app/configuracion">Configuración</a><a class="active" href="/app/configuracion-avanzada">Configuración avanzada</a></nav></aside><main class="main"><header class="top"><div><strong>${esc(session.tenant?.nombreEmpresa||session.subdomain)}</strong><div class="muted" style="font-size:12px">${esc(session.subdomain)}</div></div><button class="btn" id="logout">Salir</button></header><section class="content"><div class="head"><div><h1 style="margin:0">Core transversal</h1><div class="muted">DIAN, permisos, impresión y nómina electrónica.</div></div></div><div class="tabs"><button class="tab active" data-tab="dian">DIAN</button><button class="tab" data-tab="roles">Roles y permisos</button><button class="tab" data-tab="print">Impresión</button><button class="tab" data-tab="payroll">Nómina electrónica</button></div><div id="flash"></div><div id="view"></div></section></main></div>`}
function flash(m,e=false){$('#flash').innerHTML=`<div class="${e?'error':'notice'}">${esc(m)}</div>`}function modal(h){$('#modal').innerHTML=`<div class="modal-back"><div class="modal">${h}</div></div>`}function closeModal(){$('#modal').innerHTML=''}
async function loadDian(){const [cfg,ready,ranges,docs]=await Promise.all([api('/api/v1/dian/configuracion'),api('/api/v1/dian/readiness'),api('/api/v1/dian/numeracion'),api('/api/v1/dian/documentos?limit=50')]);const c=cfg.data||{},rd=ready.data||{};$('#view').innerHTML=`<div class="cards"><div class="card"><small>Facturación</small><strong>${rd.invoiceReady?'<span class="badge ok">Lista</span>':'<span class="badge warn">Pendiente</span>'}</strong></div><div class="card"><small>Documento soporte</small><strong>${rd.supportReady?'<span class="badge ok">Listo</span>':'<span class="badge warn">Pendiente</span>'}</strong></div><div class="card"><small>Nómina</small><strong>${rd.payrollReady?'<span class="badge ok">Lista</span>':'<span class="badge warn">Pendiente</span>'}</strong></div><div class="card"><small>PT real</small><strong><span class="badge warn">Conector pendiente</span></strong></div></div><div class="panel"><div class="ph"><strong>Núcleo DIAN</strong><span class="muted">Credenciales compartidas entre facturación y nómina</span></div><div class="pb"><div class="grid"><div class="field"><label>Código PT</label><input class="input" id="dProviderCode" value="${esc(c.providerCode||'MOCK_PT')}"></div><div class="field"><label>Proveedor tecnológico</label><input class="input" id="dProviderName" value="${esc(c.providerName||'Adaptador habilitación VantixGC')}"></div><div class="field"><label>Ambiente</label><select class="select" id="dEnvironment"><option ${c.environment==='HABILITACION'?'selected':''}>HABILITACION</option><option ${c.environment==='PRODUCCION'?'selected':''}>PRODUCCION</option></select></div><div class="field"><label>Alias certificado</label><input class="input" id="dCert" value="${esc(c.certificateAlias||'')}"></div><div class="field"><label><input type="checkbox" id="dInvoice" ${c.invoiceEnabled?'checked':''}> Facturación habilitada</label></div><div class="field"><label><input type="checkbox" id="dPayroll" ${c.payrollEnabled?'checked':''}> Nómina habilitada</label></div><div class="field"><label><input type="checkbox" id="dCont" ${c.contingencyEnabled!==false?'checked':''}> Contingencia habilitada</label></div><div class="field"><label>API key / token (opcional)</label><input class="input" id="dCredential" type="password" placeholder="No se vuelve a mostrar"></div></div><div class="toolbar" style="margin-top:12px"><button class="btn primary" id="saveDian">Guardar configuración</button></div><div class="muted" style="margin-top:10px">La arquitectura y cola están listas. La transmisión real se activa cuando se implemente el adaptador contractual del PT seleccionado.</div></div></div><div class="panel"><div class="ph"><strong>Numeración fiscal</strong><button class="btn" id="newRange">+ Rango</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Tipo</th><th>Prefijo</th><th>Rango</th><th>Siguiente</th><th>Autorización</th><th>Activo</th></tr></thead><tbody>${(ranges.data||[]).map(r=>`<tr><td>${esc(r.documentType)}</td><td>${esc(r.prefix)}</td><td>${r.rangeFrom}–${r.rangeTo}</td><td>${r.nextNumber}</td><td>${esc(r.authorizationNumber||'—')}</td><td>${r.active?'Sí':'No'}</td></tr>`).join('')||'<tr><td colspan="6">Sin rangos configurados.</td></tr>'}</tbody></table></div></div><div class="panel"><div class="ph"><strong>Cola DIAN</strong><button class="btn" id="refreshDian">Actualizar</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Documento</th><th>Fiscal</th><th>Estado</th><th>Intentos</th><th>Error</th><th></th></tr></thead><tbody>${(docs.data||[]).map(d=>`<tr><td>${esc(d.documentType)}<br><small>${esc(d.internalNumber||d.originId)}</small></td><td>${esc(d.fiscalNumber||'—')}</td><td><span class="badge ${d.state==='ACEPTADO'?'ok':d.state==='RECHAZADO'?'bad':'warn'}">${esc(d.state)}</span></td><td>${d.retryCount}</td><td>${esc(d.lastError||'')}</td><td>${['ACEPTADO','CANCELADO'].includes(d.state)?'':`<button class="btn" data-retry="${d.id}">Reintentar</button>`}</td></tr>`).join('')||'<tr><td colspan="6">Sin documentos.</td></tr>'}</tbody></table></div></div>`;$('#saveDian').onclick=saveDian;$('#newRange').onclick=openRange;$('#refreshDian').onclick=loadDian;$$('[data-retry]').forEach(b=>b.onclick=async()=>{try{await api(`/api/v1/dian/documentos/${b.dataset.retry}/reintentar`,{method:'POST'});loadDian()}catch(e){flash(e.message,true)}})}
async function saveDian(){try{const body={providerCode:$('#dProviderCode').value.trim(),providerName:$('#dProviderName').value.trim(),environment:$('#dEnvironment').value,certificateAlias:$('#dCert').value.trim()||null,invoiceEnabled:$('#dInvoice').checked,payrollEnabled:$('#dPayroll').checked,contingencyEnabled:$('#dCont').checked};if($('#dCredential').value)body.credentials={apiKey:$('#dCredential').value};await api('/api/v1/dian/configuracion',{method:'PUT',body:JSON.stringify(body)});flash('Configuración DIAN guardada.');loadDian()}catch(e){flash(e.message,true)}}
function openRange(){modal(`<h2>Rango fiscal</h2><div class="grid"><div class="field"><label>Tipo</label><select class="select" id="rType"><option>FACTURA_ELECTRONICA</option><option>DOCUMENTO_EQUIVALENTE_POS</option><option>DOCUMENTO_SOPORTE</option><option>NOMINA_ELECTRONICA</option><option>NOTA_AJUSTE</option></select></div><div class="field"><label>Prefijo</label><input class="input" id="rPrefix"></div><div class="field"><label>Desde</label><input class="input" id="rFrom" type="number" value="1"></div><div class="field"><label>Hasta</label><input class="input" id="rTo" type="number" value="1000"></div><div class="field"><label>Siguiente</label><input class="input" id="rNext" type="number" value="1"></div><div class="field"><label>Autorización</label><input class="input" id="rAuth"></div></div><div class="toolbar" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="rSave">Guardar</button></div>`);$('#mClose').onclick=closeModal;$('#rSave').onclick=async()=>{try{await api('/api/v1/dian/numeracion',{method:'PUT',body:JSON.stringify({documentType:$('#rType').value,prefix:$('#rPrefix').value.trim(),rangeFrom:Number($('#rFrom').value),rangeTo:Number($('#rTo').value),nextNumber:Number($('#rNext').value),authorizationNumber:$('#rAuth').value.trim()||null,active:true})});closeModal();loadDian()}catch(e){alert(e.message)}}}
async function loadRoles(){const [roles,perms]=await Promise.all([api('/api/v1/seguridad/roles'),api('/api/v1/seguridad/permisos')]);state.roles=roles.data||[];state.permissions=perms.data||[];$('#view').innerHTML=`<div class="panel"><div class="ph"><strong>Roles</strong><button class="btn primary" id="newRole">+ Rol</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Nombre</th><th>Vertical</th><th>Permisos</th><th>Usuarios</th><th></th></tr></thead><tbody>${state.roles.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.vertical||'Core')}</td><td>${r.permissions.length}</td><td>${r._count?.assignments||0}</td><td><button class="btn" data-perm="${r.id}">Permisos</button></td></tr>`).join('')}</tbody></table></div></div><div class="notice">Los roles específicos de un vertical pueden tener <strong>vertical</strong> sin contaminar los roles base del Core. Los cambios quedan auditados también en Auditoría Contable.</div>`;$('#newRole').onclick=openRole;$$('[data-perm]').forEach(b=>b.onclick=()=>openPermissions(b.dataset.perm))}
function openRole(){modal(`<h2>Crear rol</h2><div class="grid"><div class="field"><label>Código</label><input class="input" id="roleCode"></div><div class="field"><label>Nombre</label><input class="input" id="roleName"></div><div class="field"><label>Vertical (opcional)</label><input class="input" id="roleVertical" placeholder="RESTAURANTE"></div></div><div class="toolbar" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="roleSave">Crear</button></div>`);$('#mClose').onclick=closeModal;$('#roleSave').onclick=async()=>{try{await api('/api/v1/seguridad/roles',{method:'POST',body:JSON.stringify({code:$('#roleCode').value.trim(),name:$('#roleName').value.trim(),vertical:$('#roleVertical').value.trim()||null})});closeModal();loadRoles()}catch(e){alert(e.message)}}}
function openPermissions(roleId){const role=state.roles.find(r=>r.id===roleId),selected=new Set((role.permissions||[]).map(x=>x.permission.code));modal(`<h2>Permisos · ${esc(role.name)}</h2><div class="permission-grid">${state.permissions.map(p=>`<label class="check"><input type="checkbox" value="${p.code}" ${selected.has(p.code)?'checked':''}><span><strong>${esc(p.code)}</strong><br><small class="muted">${esc(p.description||'')}</small></span></label>`).join('')}</div><div class="toolbar" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="permSave">Guardar permisos</button></div>`);$('#mClose').onclick=closeModal;$('#permSave').onclick=async()=>{try{const codes=$$('.check input:checked').map(x=>x.value);await api(`/api/v1/seguridad/roles/${roleId}/permisos`,{method:'PUT',body:JSON.stringify({permissionCodes:codes})});closeModal();loadRoles()}catch(e){alert(e.message)}}}
async function loadPrint(){const [cfg,printers]=await Promise.all([api('/api/v1/impresion/configuracion'),api('/api/v1/impresion/impresoras')]);const c=cfg.data||{};$('#view').innerHTML=`<div class="panel"><div class="ph"><strong>Plantilla por defecto</strong></div><div class="pb"><div class="grid"><div class="field"><label>POS / impresión</label><select class="select" id="pFormat">${['TERMICA_58','TERMICA_80','CARTA','MEDIA_CARTA'].map(x=>`<option ${c.defaultFormat===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>PDF fiscal</label><select class="select" id="pPdf">${['PDF_CARTA','PDF_MEDIA_CARTA'].map(x=>`<option ${c.invoicePdfFormat===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>QR reservado (mm)</label><input class="input" id="pQr" type="number" min="20" value="${c.qrMinimumMm||20}"></div><div class="field"><label>Logo URL</label><input class="input" id="pLogo" value="${esc(c.logoUrl||'')}"></div><div class="field" style="grid-column:span 2"><label>Encabezado</label><textarea id="pHead">${esc(c.headerText||'')}</textarea></div><div class="field" style="grid-column:span 2"><label>Pie</label><textarea id="pFoot">${esc(c.footerText||'')}</textarea></div></div><button class="btn primary" id="pSave" style="margin-top:12px">Guardar impresión</button><div class="muted" style="margin-top:10px">La DIAN exige QR en la representación gráfica. El piso de 20 mm se conserva como regla de producto solicitada; la calificación exacta como mínimo legal queda pendiente de validar contra el anexo técnico vigente.</div></div></div><div class="panel"><div class="ph"><strong>Impresoras</strong><button class="btn" id="addPrinter">+ Impresora</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Nombre</th><th>Transporte</th><th>Rol</th><th>Host</th><th>Formato</th></tr></thead><tbody>${(printers.data||[]).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.transport}</td><td>${esc(p.role)}</td><td>${esc(p.host||'—')}${p.port?':'+p.port:''}</td><td>${esc(p.format||'Predeterminado')}</td></tr>`).join('')||'<tr><td colspan="5">Sin impresoras configuradas.</td></tr>'}</tbody></table></div></div>`;$('#pSave').onclick=async()=>{try{await api('/api/v1/impresion/configuracion',{method:'PUT',body:JSON.stringify({defaultFormat:$('#pFormat').value,invoicePdfFormat:$('#pPdf').value,qrMinimumMm:Number($('#pQr').value),logoUrl:$('#pLogo').value.trim()||null,headerText:$('#pHead').value||null,footerText:$('#pFoot').value||null})});flash('Impresión guardada.');loadPrint()}catch(e){flash(e.message,true)}};$('#addPrinter').onclick=openPrinter}
function openPrinter(){modal(`<h2>Impresora</h2><div class="grid"><div class="field"><label>Nombre</label><input class="input" id="prName"></div><div class="field"><label>Transporte</label><select class="select" id="prTransport"><option>NAVEGADOR</option><option>LAN</option></select></div><div class="field"><label>Rol</label><input class="input" id="prRole" value="DOCUMENTOS" placeholder="COCINA / BARRA / DOCUMENTOS"></div><div class="field"><label>Formato</label><select class="select" id="prFormat"><option value="">Predeterminado</option><option>TERMICA_58</option><option>TERMICA_80</option><option>CARTA</option></select></div><div class="field"><label>Host LAN</label><input class="input" id="prHost"></div><div class="field"><label>Puerto LAN</label><input class="input" id="prPort" type="number"></div></div><div class="toolbar" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="prSave">Guardar</button></div>`);$('#mClose').onclick=closeModal;$('#prSave').onclick=async()=>{try{await api('/api/v1/impresion/impresoras',{method:'POST',body:JSON.stringify({name:$('#prName').value.trim(),transport:$('#prTransport').value,role:$('#prRole').value.trim(),format:$('#prFormat').value||null,host:$('#prHost').value.trim()||null,port:$('#prPort').value?Number($('#prPort').value):null,active:true})});closeModal();loadPrint()}catch(e){alert(e.message)}}}
async function loadPayroll(){const [cfg,employees,periods,accounts,thirds]=await Promise.all([api('/api/v1/nomina/configuracion'),api('/api/v1/nomina/empleados'),api('/api/v1/nomina/periodos'),api('/api/v1/contabilidad/cuentas?movimiento=true&limit=3000'),api('/api/v1/terceros?activo=true&limit=1000')]);state.accounts=accounts.data||[];state.thirds=thirds.data||[];const c=cfg.data||{},emps=employees.data||[];const opts=(id)=>`<option value="">Seleccione</option>`+state.accounts.map(a=>`<option value="${a.id}" ${id===a.id?'selected':''}>${esc(a.codigo)} · ${esc(a.nombre)}</option>`).join('');$('#view').innerHTML=`<div class="panel"><div class="ph"><strong>Parametrización contable de nómina</strong></div><div class="pb"><div class="grid"><div class="field"><label>Gasto de nómina</label><select class="select" id="nExpense">${opts(c.expenseAccountId)}</select></div><div class="field"><label>Nómina por pagar</label><select class="select" id="nPayable">${opts(c.payableAccountId)}</select></div><div class="field"><label>Aportes / deducciones</label><select class="select" id="nContrib">${opts(c.contributionAccountId)}</select></div><div class="field"><label>Días alerta</label><input class="input" id="nDays" type="number" value="${c.transmissionReminderDays||5}"></div></div><button class="btn primary" id="nCfgSave" style="margin-top:12px">Guardar</button></div></div><div class="panel"><div class="ph"><strong>Empleados</strong><button class="btn" id="newEmployee">+ Empleado</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Tercero</th><th>Contrato</th><th>Salario base</th></tr></thead><tbody>${emps.map(e=>`<tr><td>${esc(e.employeeCode)}</td><td>${esc(e.tercero?.razonSocial||e.tercero?.nombre||e.terceroId)}</td><td>${esc(e.contractType)}</td><td>${money(e.baseSalary)}</td></tr>`).join('')||'<tr><td colspan="4">Sin empleados.</td></tr>'}</tbody></table></div></div><div class="panel"><div class="ph"><strong>Periodos</strong><button class="btn" id="newPeriod" ${emps.length?'':'disabled'}>+ Periodo</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Periodo</th><th>Frecuencia</th><th>Estado</th><th>Empleados</th><th></th></tr></thead><tbody>${(periods.data||[]).map(p=>`<tr><td>${p.year}-${String(p.month).padStart(2,'0')}</td><td>${p.frequency}</td><td><span class="badge">${p.state}</span></td><td>${p.lines.length}</td><td>${p.state==='BORRADOR'?`<button class="btn primary" data-gen="${p.id}">Generar AU + DSNE</button>`:p.state==='GENERADO'?`<button class="btn" data-sync="${p.id}">Sincronizar DIAN</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">Sin periodos.</td></tr>'}</tbody></table></div></div>`;$('#nCfgSave').onclick=async()=>{try{await api('/api/v1/nomina/configuracion',{method:'PUT',body:JSON.stringify({expenseAccountId:$('#nExpense').value||null,payableAccountId:$('#nPayable').value||null,contributionAccountId:$('#nContrib').value||null,transmissionReminderDays:Number($('#nDays').value)})});flash('Configuración de nómina guardada.')}catch(e){flash(e.message,true)}};$('#newEmployee').onclick=openEmployee;$('#newPeriod').onclick=()=>openPeriod(emps);$$('[data-gen]').forEach(b=>b.onclick=async()=>{try{await api(`/api/v1/nomina/periodos/${b.dataset.gen}/generar`,{method:'POST'});flash('Nómina generada: AU y documentos electrónicos en cola.');loadPayroll()}catch(e){flash(e.message,true)}});$$('[data-sync]').forEach(b=>b.onclick=async()=>{try{await api(`/api/v1/nomina/periodos/${b.dataset.sync}/sincronizar-dian`,{method:'POST'});loadPayroll()}catch(e){flash(e.message,true)}})}
function openEmployee(){const options=state.thirds.map(t=>`<option value="${t.id}">${esc(t.identificacion)} · ${esc(t.razonSocial||t.nombre)}</option>`).join('');modal(`<h2>Empleado de nómina</h2><div class="grid"><div class="field"><label>Tercero</label><select class="select" id="eThird"><option value="">Seleccione</option>${options}</select></div><div class="field"><label>Código empleado</label><input class="input" id="eCode"></div><div class="field"><label>Tipo contrato</label><input class="input" id="eContract" value="LABORAL"></div><div class="field"><label>Salario base</label><input class="input" id="eSalary" type="number"></div><div class="field"><label>Inicio</label><input class="input" id="eStart" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="toolbar" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="eSave">Guardar</button></div>`);$('#mClose').onclick=closeModal;$('#eSave').onclick=async()=>{try{await api('/api/v1/nomina/empleados',{method:'POST',body:JSON.stringify({terceroId:$('#eThird').value,employeeCode:$('#eCode').value.trim(),contractType:$('#eContract').value.trim(),baseSalary:Number($('#eSalary').value),startDate:$('#eStart').value,active:true})});closeModal();loadPayroll()}catch(e){alert(e.message)}}}
function openPeriod(emps){const eo=emps.map(e=>`<option value="${e.id}">${esc(e.employeeCode)} · ${esc(e.tercero?.razonSocial||e.tercero?.nombre||'')}</option>`).join(''),now=new Date();modal(`<h2>Periodo de nómina</h2><div class="grid"><div class="field"><label>Año</label><input class="input" id="npYear" type="number" value="${now.getFullYear()}"></div><div class="field"><label>Mes</label><input class="input" id="npMonth" type="number" min="1" max="12" value="${now.getMonth()+1}"></div><div class="field"><label>Frecuencia</label><select class="select" id="npFreq"><option>MENSUAL</option><option>QUINCENAL</option></select></div><div class="field"><label>Empleado</label><select class="select" id="npEmp">${eo}</select></div><div class="field"><label>Total devengado</label><input class="input" id="npGross" type="number"></div><div class="field"><label>Total deducido</label><input class="input" id="npDed" type="number" value="0"></div><div class="field" style="grid-column:span 2"><label>Devengados (JSON opcional)</label><textarea id="npGrossJson">{}</textarea></div><div class="field" style="grid-column:span 2"><label>Deducciones (JSON opcional)</label><textarea id="npDedJson">{}</textarea></div></div><div class="toolbar" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="mClose">Cancelar</button><button class="btn primary" id="npSave">Guardar borrador</button></div>`);$('#mClose').onclick=closeModal;$('#npSave').onclick=async()=>{try{await api('/api/v1/nomina/periodos',{method:'POST',body:JSON.stringify({year:Number($('#npYear').value),month:Number($('#npMonth').value),frequency:$('#npFreq').value,lines:[{employeeId:$('#npEmp').value,totalDevengado:Number($('#npGross').value),totalDeducido:Number($('#npDed').value),devengados:JSON.parse($('#npGrossJson').value||'{}'),deducciones:JSON.parse($('#npDedJson').value||'{}')} ]})});closeModal();loadPayroll()}catch(e){alert(e.message)}}}
async function render(){state.tab=$$('.tab.active')[0]?.dataset.tab||state.tab;try{if(state.tab==='dian')await loadDian();else if(state.tab==='roles')await loadRoles();else if(state.tab==='print')await loadPrint();else await loadPayroll()}catch(e){$('#view').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
$('#root').innerHTML=shell();$('#logout').onclick=()=>{localStorage.removeItem(key);location.href='/app'};$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.tab=b.dataset.tab;render()});render();
</script></body></html>
