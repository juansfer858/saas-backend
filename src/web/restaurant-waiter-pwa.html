<body>
  <div class="ri-shell">
    <div class="rail-wrap" aria-hidden="true"><nav id="rail" class="rail"></nav><a id="noticeToggle" class="rail-ticket" href="#avisos">Avisos</a><a class="cc-classic-link" href="/app/dashboard" data-restaurant-admin-link="true">Administración</a></div>
    <dialog id="noticePanel" class="ri-card"><button type="button" id="noticeClose" class="ri-btn">Cerrar</button><div id="gateInner" class="ri-gate-inner"></div><div id="edgeStatusSlot"></div></dialog>
    <main class="ri-main"><div id="message" class="ri-message"></div><div id="view"></div></main>
    <div hidden aria-hidden="true"><span id="tenantLine"></span><span id="userName"></span><span id="userRole"></span><a id="coreLink" href="/app/dashboard">Core</a><span data-restaurant-name></span></div>
  </div>
  <script src="/app/restaurant-theme.js?v=panel-font-v1"></script>
  <script src="/app/restaurant-ui.js?v=waiter-full-v4"></script>
  <script>
  (()=>{
    'use strict';
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/app/centro-de-control/sw.js',{scope:'/app/centro-de-control'}).catch(()=>{});
    let forced=false;
    function closeOrder(){document.documentElement.classList.remove('waiter-order-open')}
    function enhance(){
      const view=document.querySelector('#view');if(!view)return;
      const meseroTab=document.querySelector('[data-tab="mesero"]');
      if(!forced&&meseroTab){forced=true;meseroTab.click();}
      const panel=view.querySelector('.waiter-order-panel');
      const catalog=view.querySelector('.waiter-catalog');
      if(panel&&catalog){
        let toggle=view.querySelector('.waiter-order-toggle');
        if(!toggle){toggle=document.createElement('button');toggle.type='button';toggle.className='waiter-order-toggle';toggle.innerHTML='<span>▤</span><b>VER PEDIDO</b>';toggle.addEventListener('click',()=>document.documentElement.classList.add('waiter-order-open'));catalog.parentNode?.appendChild(toggle);}
        const total=panel.querySelector('.waiter-total b')?.textContent?.trim();if(total)toggle.innerHTML=`<span>▤</span><b>VER PEDIDO · ${total}</b>`;
        if(!panel.querySelector('.waiter-order-close')){const close=document.createElement('button');close.type='button';close.className='waiter-order-close';close.setAttribute('aria-label','Cerrar pedido');close.textContent='×';close.addEventListener('click',closeOrder);panel.querySelector('.waiter-order-head')?.appendChild(close);}
        if(!document.querySelector('.waiter-order-backdrop')){const backdrop=document.createElement('button');backdrop.type='button';backdrop.className='waiter-order-backdrop';backdrop.setAttribute('aria-label','Cerrar pedido');backdrop.addEventListener('click',closeOrder);document.body.appendChild(backdrop);}
      }else closeOrder();
      const history=view.querySelector('#waiterHistory');
      if(history&&!history.querySelector('.waiter-history-toggle')){const toolbar=history.querySelector('.ri-toolbar');if(toolbar){const button=document.createElement('button');button.type='button';button.className='ri-btn small waiter-history-toggle';button.textContent='Ver rondas';button.addEventListener('click',()=>{const open=history.classList.toggle('waiter-history-open');button.textContent=open?'Ocultar rondas':'Ver rondas';});toolbar.appendChild(button);}}
    }
    const observer=new MutationObserver(enhance);observer.observe(document.documentElement,{childList:true,subtree:true});enhance();
  })();
  </script>
</body>
