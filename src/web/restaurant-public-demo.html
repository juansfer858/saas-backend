<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo · VantixGC Restaurantes</title>
<style>
:root{--bg:#f2f3f3;--card:#fff;--line:#dde1df;--text:#18221d;--muted:#66736d;--green:#0d6b43;--soft:#ddf3e8;--gold:#d4a62a;--dark:#5f676d;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,a{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:linear-gradient(145deg,#a8b0b5,#60686d 55%,#858e94);padding:18px 14px;color:white}.brand{font-weight:900;font-size:18px;display:flex;gap:10px;align-items:center;margin-bottom:20px}.mark{width:36px;height:36px;border-radius:10px;background:var(--green);display:grid;place-items:center}.side button{display:block;width:100%;border:1px solid #ffffff35;background:#ffffff28;color:#fff;border-radius:10px;padding:12px;text-align:left;margin:6px 0;font-weight:800;cursor:pointer}.side button.active{background:#0d6b4366}.back{display:block;color:#fff;margin-top:24px;font-size:13px}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 22px}.demo-pill{font-size:12px;font-weight:900;background:#fff4d6;color:#765c00;border-radius:999px;padding:7px 10px}.content{padding:24px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.head h1{margin:0 0 5px;font-size:27px}.head p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:10px;font-weight:800;cursor:pointer}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.gold{background:#fff8df;border-color:#e4c55d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.table{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;cursor:pointer;min-height:110px}.table.busy{border-color:#dfc26a;background:#fffcf2}.table.account{border-color:#dc8f75;background:#fff6f2}.table strong{font-size:19px}.table small{display:block;color:var(--muted);margin-top:6px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:24px;margin-top:6px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;margin-top:14px;overflow:hidden}.panel h2{font-size:16px;margin:0;padding:15px 17px;border-bottom:1px solid var(--line)}.rows{padding:0 17px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #eee;align-items:center}.row:last-child{border-bottom:0}.status{font-size:11px;font-weight:900;padding:6px 9px;border-radius:999px;background:var(--soft);color:var(--green)}.status.pending{background:#fff4d6;color:#765c00}.status.ready{background:#e7f6ed;color:#087843}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.product{border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px;cursor:pointer}.product:hover{border-color:#8fbba8}.product b{display:block}.product span{color:var(--green);font-weight:900}.cart{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.notice{padding:12px;border-radius:11px;background:#edf7f1;color:#24583e;margin-bottom:14px}.hidden{display:none!important}.modal-back{position:fixed;inset:0;background:#17201c99;display:grid;place-items:center;padding:20px}.modal{background:#fff;border-radius:18px;width:min(520px,100%);padding:22px}.modal h2{margin-top:0}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}@media(max-width:780px){.app{display:block}.side{position:static}.side button{display:inline-block;width:auto}.grid,.cards,.menu{grid-template-columns:1fr}.content{padding:16px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><span class="mark">V</span><span>VantixGC<br>Restaurantes</span></div><button data-view="dashboard" class="active">Centro de Control</button><button data-view="tables">Mesas</button><button data-view="order">Nuevo pedido</button><button data-view="kds">Cocina / KDS</button><button data-view="cash">Caja</button><a class="back" href="/restaurantes">← Volver a la página</a></aside><main class="main"><header class="top"><div><b>Restaurante Demo VantixGC</b><div style="font-size:12px;color:var(--muted)">Datos ficticios · se reinician al recargar</div></div><span class="demo-pill">DEMO INTERACTIVO</span></header><section class="content" id="view"></section></main></div>
<script>
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const state={view:'dashboard',tables:[1,2,3,4,5,6].map(i=>({id:i,name:`Mesa ${i}`,state:i===2?'OCUPADA':i===4?'CUENTA_PEDIDA':'LIBRE',total:i===2?48600:i===4?31200:0,items:i===2?[['Hamburguesa de la casa',2,44000],['Limonada natural',1,7000]]:i===4?[['Papas de entrada',2,18000],['Postre de la casa',1,10000]]:[]})),commands:[{id:1,table:'Mesa 2',item:'2 Hamburguesas',station:'COCINA',state:'EN_PREPARACION'},{id:2,table:'Mesa 2',item:'1 Limonada',station:'BARRA',state:'LISTA'},{id:3,table:'Mesa 4',item:'2 Papas',station:'COCINA',state:'PENDIENTE'}],menu:[['Hamburguesa de la casa',22000,'COCINA'],['Papas de entrada',9000,'COCINA'],['Limonada natural',7000,'BARRA'],['Postre de la casa',10000,'POSTRES']],cart:[],selectedTable:1,cashOpen:true,sales:194600};
const view=document.querySelector('#view');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function nav(v){state.view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function dashboard(){const busy=state.tables.filter(t=>t.state!=='LIBRE').length;return `<div class="head"><div><h1>Centro de Control</h1><p>Prueba el flujo sin crear cuenta.</p></div><a class="btn primary" href="/restaurantes/crear">Crear mi restaurante</a></div><div class="cards"><div class="metric"><small>Mesas ocupadas</small><strong>${busy} / ${state.tables.length}</strong></div><div class="metric"><small>Comandas activas</small><strong>${state.commands.filter(c=>c.state!=='ENTREGADA').length}</strong></div><div class="metric"><small>Listas</small><strong>${state.commands.filter(c=>c.state==='LISTA').length}</strong></div><div class="metric"><small>Ventas demo</small><strong>${money(state.sales)}</strong></div></div><div class="panel"><h2>Mesas</h2><div class="grid" style="padding:14px">${tableCards()}</div></div>`}
function tableCards(){return state.tables.map(t=>`<div class="table ${t.state==='OCUPADA'?'busy':t.state==='CUENTA_PEDIDA'?'account':''}" onclick="openTable(${t.id})"><strong>${t.name}</strong><small>${t.state==='LIBRE'?'Libre':t.state==='CUENTA_PEDIDA'?'Cuenta pedida':money(t.total)}</small></div>`).join('')}
function tables(){return `<div class="head"><div><h1>Mesas</h1><p>Haz clic en una mesa libre para abrirla o en una ocupada para ver su cuenta.</p></div></div><div class="grid">${tableCards()}</div>`}
function order(){const t=state.tables.find(x=>x.id===state.selectedTable)||state.tables[0];const total=state.cart.reduce((a,x)=>a+x[1],0);return `<div class="head"><div><h1>Nuevo pedido</h1><p>${esc(t.name)} · selecciona productos.</p></div><select class="btn" onchange="state.selectedTable=Number(this.value);render()">${state.tables.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="menu">${state.menu.map((p,i)=>`<button class="product" onclick="addProduct(${i})"><b>${esc(p[0])}</b><small>${p[2]}</small><span>${money(p[1])}</span></button>`).join('')}</div><div class="cart"><b>Pedido</b>${state.cart.length?state.cart.map(x=>`<div class="row"><span>${esc(x[0])}</span><strong>${money(x[1])}</strong></div>`).join(''):'<p style="color:var(--muted)">Aún no agregas productos.</p>'}<div class="row"><b>Total</b><strong>${money(total)}</strong></div><button class="btn primary" ${!state.cart.length?'disabled':''} onclick="sendOrder()">Enviar a cocina</button></div>`}
function kds(){return `<div class="head"><div><h1>Cocina / KDS</h1><p>Las estaciones reciben sólo lo que les corresponde.</p></div></div><div class="panel"><h2>Comandas</h2><div class="rows">${state.commands.map(c=>`<div class="row"><div><b>${c.table} · ${esc(c.item)}</b><div style="color:var(--muted);font-size:13px">${c.station}</div></div><div><span class="status ${c.state==='PENDIENTE'?'pending':c.state==='LISTA'?'ready':''}">${c.state}</span> ${c.state!=='LISTA'?`<button class="btn" onclick="advance(${c.id})">Avanzar</button>`:`<button class="btn" onclick="deliver(${c.id})">Entregar</button>`}</div></div>`).join('')||'<p>Sin comandas</p>'}</div></div>`}
function cash(){const payable=state.tables.filter(t=>t.state==='CUENTA_PEDIDA');return `<div class="head"><div><h1>Caja</h1><p>Turno demo ${state.cashOpen?'abierto':'cerrado'}.</p></div><button class="btn" onclick="state.cashOpen=!state.cashOpen;render()">${state.cashOpen?'Cerrar turno':'Abrir turno'}</button></div><div class="notice">En la instalación real, Caja, inventario y contabilidad quedan conectados al mismo cierre de mesa.</div><div class="panel"><h2>Cuentas por cobrar</h2><div class="rows">${payable.map(t=>`<div class="row"><div><b>${t.name}</b><div>${money(t.total)}</div></div><button class="btn primary" onclick="pay(${t.id})">Cobrar efectivo</button></div>`).join('')||'<div style="padding:18px;color:var(--muted)">No hay cuentas solicitadas.</div>'}</div></div>`}
function render(){view.innerHTML=state.view==='dashboard'?dashboard():state.view==='tables'?tables():state.view==='order'?order():state.view==='kds'?kds():cash()}
function openTable(id){const t=state.tables.find(x=>x.id===id);state.selectedTable=id;if(t.state==='LIBRE'){t.state='OCUPADA';t.total=0;nav('order')}else{modal(`<h2>${t.name}</h2><p>Estado: <b>${t.state}</b></p>${t.items.map(x=>`<div class="row"><span>${x[0]} × ${x[1]}</span><b>${money(x[2])}</b></div>`).join('')}<div class="row"><b>Total</b><b>${money(t.total)}</b></div><div class="actions"><button class="btn" onclick="closeModal()">Cerrar</button>${t.state==='OCUPADA'?`<button class="btn gold" onclick="requestAccount(${id});closeModal()">Pedir cuenta</button>`:''}</div>`)} }
function addProduct(i){const p=state.menu[i];state.cart.push([p[0],p[1],p[2]]);render()}
function sendOrder(){const t=state.tables.find(x=>x.id===state.selectedTable);if(t.state==='LIBRE')t.state='OCUPADA';let sum=0;state.cart.forEach(([name,price,station])=>{sum+=price;t.items.push([name,1,price]);state.commands.push({id:Date.now()+Math.random(),table:t.name,item:name,station,state:'PENDIENTE'})});t.total+=sum;state.cart=[];nav('kds')}
function advance(id){const c=state.commands.find(x=>x.id===id);c.state=c.state==='PENDIENTE'?'EN_PREPARACION':'LISTA';render()}
function deliver(id){state.commands=state.commands.filter(x=>x.id!==id);render()}
function requestAccount(id){state.tables.find(x=>x.id===id).state='CUENTA_PEDIDA';nav('cash')}
function pay(id){const t=state.tables.find(x=>x.id===id);state.sales+=t.total;t.total=0;t.items=[];t.state='LIBRE';render();modal('<h2>Cobro registrado</h2><p>La mesa quedó libre y la venta se sumó al cierre demo.</p><div class="actions"><button class="btn primary" onclick="closeModal()">Continuar</button></div>')}
function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><div class="modal">${html}</div></div>`)}function closeModal(){document.querySelector('#modal')?.remove()}
render();
</script>
</body></html>
