<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo real · VantixGC Restaurantes</title>
<meta name="description" content="Prueba la interfaz real V2 de VantixGC Restaurantes sobre un tenant demo aislado.">
<style>
:root{--ink:#171717;--orange:#f97316;--orange-deep:#ea580c;--cream:#fff7ed;--line:#e7e5e4;--muted:#78716c;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f4;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.demo-shell{height:100dvh;display:grid;grid-template-rows:auto 1fr;min-height:0}
.demo-bar{position:relative;z-index:20;min-height:58px;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px;justify-content:space-between;background:var(--ink);color:#fff;border-bottom:2px solid var(--orange)}
.demo-brand{display:flex;align-items:center;gap:10px;min-width:0}.demo-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--orange);font-weight:950;flex:0 0 auto}.demo-copy{min-width:0}.demo-copy b{display:block;font-size:13px;line-height:1.15}.demo-copy span{display:block;margin-top:2px;color:#d6d3d1;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #78350f;border-radius:999px;background:#431407;color:#fed7aa;font-size:10px;font-weight:950;letter-spacing:.08em;white-space:nowrap}.demo-pill:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(249,115,22,.18)}
.demo-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto}.demo-btn{min-height:38px;padding:8px 12px;border-radius:10px;border:1px solid #444;background:#2a2a2a;color:#fff;text-decoration:none;font-size:12px;font-weight:850;cursor:pointer}.demo-btn:hover{background:#363636}.demo-btn.primary{border-color:var(--orange);background:var(--orange);color:#fff}.demo-btn.primary:hover{background:var(--orange-deep)}
.demo-stage{position:relative;min-height:0;background:#f5f5f4}.demo-frame{display:block;width:100%;height:100%;border:0;background:#fff}
.demo-loading{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:#fafaf9}.demo-card{width:min(520px,100%);padding:28px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 24px 70px rgba(23,23,23,.10);text-align:center}.demo-spinner{width:42px;height:42px;margin:0 auto 18px;border:4px solid #ffedd5;border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}.demo-card h1{margin:0 0 8px;font-size:24px;letter-spacing:-.025em}.demo-card p{margin:0;color:var(--muted);line-height:1.55}.demo-error{margin-top:18px;padding:12px;border:1px solid #fecaca;border-radius:12px;background:#fff1f2;color:#991b1b;font-size:13px;text-align:left}.demo-retry{margin-top:16px;border:0;border-radius:10px;background:var(--orange);color:#fff;padding:10px 14px;font-weight:850;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){.demo-bar{align-items:flex-start;flex-wrap:wrap;gap:8px}.demo-copy span{max-width:220px}.demo-pill{order:3}.demo-actions{margin-left:auto}.demo-btn{padding:8px 9px}.demo-btn.primary{display:none}}
</style>
</head>
<body>
<div class="demo-shell">
  <header class="demo-bar">
    <div class="demo-brand"><span class="demo-mark">V</span><div class="demo-copy"><b>VantixGC Restaurantes</b><span>Estás usando la interfaz real sobre datos de demostración</span></div></div>
    <span class="demo-pill">MODO DEMOSTRACIÓN</span>
    <div class="demo-actions"><button class="demo-btn" id="backBtn" type="button">← Volver</button><button class="demo-btn primary" id="createBtn" type="button">Crear mi restaurante</button></div>
  </header>
  <main class="demo-stage">
    <iframe class="demo-frame" id="demoFrame" title="VantixGC Restaurantes · Demo real V2"></iframe>
    <section class="demo-loading" id="loading">
      <div class="demo-card"><div class="demo-spinner" id="spinner"></div><h1>Preparando el demo real</h1><p id="status">Conectando un tenant aislado a la interfaz V2…</p><div id="error"></div></div>
    </section>
  </main>
</div>
<script>
(() => {
  'use strict';
  const SESSION_KEY='vantixgc_core_session_v1';
  const BACKUP_KEY='vantixgc_public_demo_session_backup_v1';
  const ACCESS_PREFIX='vantixgc_core_restaurant_access_v2:';
  const frame=document.querySelector('#demoFrame');
  const loading=document.querySelector('#loading');
  const status=document.querySelector('#status');
  const errorBox=document.querySelector('#error');
  const spinner=document.querySelector('#spinner');
  let demoSession=null;
  let restored=false;

  function backupCurrentSession(){
    try{
      const current=localStorage.getItem(SESSION_KEY);
      if(!current)return;
      const parsed=JSON.parse(current);
      if(parsed?.demo===true)return;
      sessionStorage.setItem(BACKUP_KEY,current);
    }catch{}
  }

  function restoreSession(){
    if(restored)return;
    restored=true;
    try{
      if(demoSession?.subdomain&&demoSession?.user?.id)sessionStorage.removeItem(`${ACCESS_PREFIX}${demoSession.subdomain}:${demoSession.user.id}`);
      const backup=sessionStorage.getItem(BACKUP_KEY);
      if(backup)localStorage.setItem(SESSION_KEY,backup);
      else {
        const current=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
        if(current?.demo===true)localStorage.removeItem(SESSION_KEY);
      }
      sessionStorage.removeItem(BACKUP_KEY);
    }catch{}
  }

  function leave(path){restoreSession();location.href=path}
  document.querySelector('#backBtn').addEventListener('click',()=>leave('/restaurantes'));
  document.querySelector('#createBtn').addEventListener('click',()=>leave('/restaurantes/crear'));
  window.addEventListener('pagehide',restoreSession);

  function showError(message){
    spinner.style.display='none';
    status.textContent='No pudimos abrir el demo en este momento.';
    errorBox.innerHTML=`<div class="demo-error">${String(message||'Error inesperado').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</div><button class="demo-retry" type="button" id="retryDemo">Reintentar</button>`;
    document.querySelector('#retryDemo').onclick=boot;
  }

  async function boot(){
    restored=false;
    errorBox.innerHTML='';
    spinner.style.display='block';
    status.textContent='Conectando un tenant aislado a la interfaz V2…';
    try{
      backupCurrentSession();
      const response=await fetch('/api/public/restaurantes/demo-session',{method:'GET',cache:'no-store',headers:{Accept:'application/json'}});
      let body={};try{body=await response.json()}catch{}
      if(!response.ok||!body?.ok||!body?.data?.token)throw new Error(body?.error?.message||body?.message||`HTTP ${response.status}`);
      demoSession=body.data;
      localStorage.setItem(SESSION_KEY,JSON.stringify(demoSession));
      if(demoSession.subdomain&&demoSession.user?.id)sessionStorage.setItem(`${ACCESS_PREFIX}${demoSession.subdomain}:${demoSession.user.id}`,'1');
      status.textContent='Abriendo el Centro de Control V2 real…';
      frame.onload=()=>{loading.hidden=true};
      frame.src='/app/centro-de-control-v2';
    }catch(error){showError(error?.message||error)}
  }

  boot();
})();
</script>
</body>
</html>
