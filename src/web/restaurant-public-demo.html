<style>

.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.table-card{width:100%;min-height:150px;padding:15px;text-align:left;border:2px solid var(--rv2-line);border-radius:var(--rv2-radius);background:#fff;color:var(--rv2-ink);transition:.14s}.table-card:hover{transform:translateY(-2px);box-shadow:var(--rv2-shadow)}.table-card header{display:flex;justify-content:space-between;gap:8px}.table-card h3{margin:0;font-size:18px}.table-card .state{font-size:10px;font-weight:950;border:1px solid currentColor;border-radius:999px;padding:4px 7px}.table-card p{margin:13px 0 0;font-size:12px}.table-card strong{display:block;margin-top:6px;font-size:15px}.table-card.occupied{background:var(--rv2-table-occupied);color:#fff;border-color:var(--rv2-table-occupied);box-shadow:0 12px 26px rgba(194,65,12,.24)}.table-card.occupied p{color:#ffedd5}.table-card.account{background:var(--rv2-table-account);color:#fff;border-color:var(--rv2-table-account);animation:accountPulse 1.05s ease-in-out infinite;box-shadow:0 12px 30px rgba(220,38,38,.34)}.table-card.account p{color:#fee2e2}@keyframes accountPulse{0%,100%{background:#dc2626;transform:scale(1)}50%{background:#ea580c;transform:scale(1.018)}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stats article{padding:14px;border:1px solid var(--rv2-line);border-radius:12px;background:#fff}.stats small{display:block;color:var(--rv2-muted);font-size:9px;font-weight:900}.stats strong{display:block;margin-top:6px;font-size:23px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lane{min-height:390px;border:1px solid var(--rv2-line);border-radius:14px;background:#f1f5f9;padding:10px}.lane>header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px}.lane h2{margin:2px 0;font-size:16px}.lane header small{color:var(--rv2-muted);font-size:9px}.lane header>b{min-width:26px;height:26px;display:grid;place-items:center;border-radius:999px;background:#fff;border:1px solid var(--rv2-line);font-size:10px}.ticket{background:#fff;border:1px solid var(--rv2-line);border-radius:12px;padding:12px;margin-bottom:8px}.ticket .meta{font-size:8px;color:var(--rv2-muted);letter-spacing:.06em}.ticket b{display:block;font-size:11px;margin:4px 0}.ticket small{font-size:9px;color:var(--rv2-muted)}.ticket-actions{display:flex;gap:6px;margin-top:10px}.ticket-actions button{flex:1;min-height:34px;border:1px solid var(--rv2-line);border-radius:8px;background:#fff;font-size:9px;font-weight:850}.ticket-actions .primary{background:var(--rv2-primary);border-color:var(--rv2-primary);color:#fff}
.split-shell,.cash-shell{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(0,1.4fr);gap:12px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:15px;border-bottom:1px solid var(--rv2-line)}.panel-head small{color:var(--rv2-muted);font-size:9px;font-weight:900}.panel-head h2{margin:3px 0;font-size:18px}.queue,.detail{padding:14px}.queue-row{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:8px;padding:12px;border:1px solid var(--rv2-line);border-radius:11px;background:#fff;text-align:left}.queue-row.active{border-color:var(--rv2-primary);background:var(--rv2-primary-soft)}.queue-row b{font-size:11px}.queue-row small{display:block;color:var(--rv2-muted);font-size:9px;margin-top:3px}.grand-total{font-size:27px}.bill{margin-top:12px;padding:14px;border:1px solid var(--rv2-line);border-radius:12px}.bill-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid #e2e8f0;font-size:11px}.bill-row:last-child{border-bottom:0}.payment-methods{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:12px 0}.pay{min-height:42px;border:1px solid var(--rv2-line);border-radius:9px;background:#fff;font-size:10px;font-weight:850}.pay.active{border-color:var(--rv2-primary);background:var(--rv2-primary-soft);color:#c2410c}.fiscal-note{color:var(--rv2-muted);font-size:10px;line-height:1.45}.split-parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.part{padding:13px;border:1px solid var(--rv2-line);border-radius:12px;background:#fff}.part b{font-size:11px}.part strong{display:block;font-size:20px;margin-top:6px}.part small{color:var(--rv2-muted);font-size:9px}
.protected{position:relative;min-height:520px;overflow:hidden;border:1px solid var(--rv2-line);border-radius:14px;background:#fff}.protected-content{padding:20px;filter:blur(6px);opacity:.46;pointer-events:none;user-select:none}.fakebar{height:44px;border:1px solid var(--rv2-line);border-radius:10px;margin-bottom:12px;background:#f8fafc}.fakerow{display:grid;grid-template-columns:42px 1.5fr 1fr 90px;gap:10px;align-items:center;padding:12px;margin-bottom:8px;border:1px solid var(--rv2-line);border-radius:10px}.fakecircle{width:32px;height:32px;border-radius:50%;background:#e2e8f0}.fakeline{height:10px;border-radius:999px;background:#e2e8f0}.protect-overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(248,250,252,.35);backdrop-filter:blur(2px)}.protect-card{width:min(460px,100%);padding:25px;text-align:center;border:1px solid #cbd5e1;border-radius:18px;background:rgba(255,255,255,.96);box-shadow:var(--rv2-shadow)}.protect-card .lock{width:46px;height:46px;margin:0 auto 12px;display:grid;place-items:center;border-radius:13px;background:#eff6ff;color:#2563eb;font-size:22px}.protect-card h2{margin:0 0 8px;font-size:20px}.protect-card p{margin:0;color:var(--rv2-muted);font-size:11px;line-height:1.55}.protected-tag{display:inline-flex;margin-top:13px;padding:6px 9px;border:1px solid #cbd5e1;border-radius:999px;color:#64748b;font-size:9px;font-weight:900;letter-spacing:.08em}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;padding:11px 14px;border-radius:11px;background:#111827;color:#fff;font-size:11px;font-weight:750;box-shadow:0 14px 35px rgba(15,23,42,.25);opacity:0;transform:translateY(16px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:none}
@media(max-width:1000px){.order-shell{grid-template-columns:190px minmax(0,1fr)}.draft-panel{grid-column:1/-1}.board{grid-template-columns:1fr}.lane{min-height:0}.cash-shell,.split-shell{grid-template-columns:1fr}}

<body>
<div class="p11-shell">
  <aside class="p11-side">
    <div class="p11-brand"><span>V</span><div><b>VantixGC</b><small>RESTAURANTES · V2</small></div></div>
    <div class="p11-tenant"><b>Restaurante Demo VantixGC</b><span>Showcase comercial · datos ficticios</span></div>
    <nav id="nav" class="p11-nav" aria-label="Operación V2"></nav>
    <button class="p11-core-link" type="button" data-module="admin">← Administración general</button>
    <div class="demo-foot"><b>MODO DEMOSTRACIÓN · AISLADO DEL SISTEMA REAL</b>La apariencia replica Restaurante V2. Ningún dato sale de esta página.<button id="reset" type="button">Reiniciar demostración</button></div>
  </aside>
  <main class="p11-main">
    <button class="p11-hybrid-status" id="hybrid" type="button"><span class="p11-hybrid-dot"></span><strong>HÍBRIDO · Edge en línea</strong><small>Nube y Edge local disponibles · estado simulado para el demo</small><span class="p11-hybrid-open">Estado local y nube →</span></button>
    <section id="module" class="module"></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script>
(() => {
'use strict';
const MODULES={
 mesas:{label:'Mesas',hint:'Salón y estado de mesas'},pedidos:{label:'Pedidos',hint:'Tomar y revisar pedidos'},kds:{label:'Producción',hint:'Cocina · Barra · Postres'},division:{label:'División',hint:'Cuenta conjunta o individual'},caja:{label:'Caja',hint:'Cobro y cierre real'},domicilios:{label:'Domicilios',hint:'Pedidos para entrega',protected:true},carta:{label:'Carta',hint:'Productos que vende el restaurante',protected:true},empleados:{label:'Empleados',hint:'Usuarios, roles y asignaciones',protected:true},qrs:{label:'QR de mesas',hint:'Ver e imprimir QR físicos',protected:true},devices:{label:'Dispositivos',hint:'Meseros y producción',protected:true}
};
const products=[{id:'p1',name:'Hamburguesa artesanal',cat:'Fuertes',price:26000},{id:'p2',name:'Papas de la casa',cat:'Entradas',price:12000},{id:'p3',name:'Limonada natural',cat:'Bebidas',price:9000},{id:'p4',name:'Chuzo de pollo',cat:'Fuertes',price:24000},{id:'p5',name:'Cerveza sin alcohol',cat:'Bebidas',price:8000},{id:'p6',name:'Postre de la casa',cat:'Postres',price:14000}];
const initialState={tables:[{id:1,state:'free',people:0,total:0},{id:2,state:'occupied',people:3,total:51000},{id:3,state:'free',people:0,total:0},{id:4,state:'occupied',people:2,total:52000},{id:5,state:'account',people:2,total:28000},{id:6,state:'free',people:0,total:0},{id:7,state:'occupied',people:4,total:40000},{id:8,state:'free',people:0,total:0}],selectedTable:2,cart:[],commands:[{id:1,table:4,item:'2 × Hamburguesa artesanal',state:'pending'},{id:2,table:2,item:'1 × Chuzo de pollo',state:'preparing'},{id:3,table:7,item:'2 × Papas de la casa',state:'ready'}],payment:'EFECTIVO'};
let state=clone(initialState);let current='mesas';
const $=q=>document.querySelector(q);const money=n=>'$ '+Number(n||0).toLocaleString('es-CO');function clone(v){return JSON.parse(JSON.stringify(v))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function renderNav(){const nav=$('#nav');nav.innerHTML='<div class="p11-nav-label">Operación</div>'+Object.entries(MODULES).map(([key,m])=>`<button type="button" data-module="${key}" class="${key===current?'active':''}"><b>${m.label}</b><small>${m.hint}</small></button>`).join('');nav.onclick=e=>{const b=e.target.closest('[data-module]');if(b)openModule(b.dataset.module)}}
function header(k,title,subtitle,actions=''){return `<header class="rv2-module-top"><div><span>RESTAURANTE V2 · ${k}</span><h1>${title}</h1><p>${subtitle}</p></div><div class="rv2-top-actions">${actions}</div></header>`}
function openModule(key){current=key;renderNav();if(key==='admin'||MODULES[key]?.protected)return renderProtected(key);if(key==='mesas')renderMesas();else if(key==='pedidos')renderPedidos();else if(key==='kds')renderKds();else if(key==='division')renderDivision();else if(key==='caja')renderCaja()}
function renderMesas(){const body=state.tables.map(t=>`<button class="table-card ${t.state}" data-table="${t.id}" type="button"><header><h3>Mesa ${t.id}</h3><span class="state">${t.state==='free'?'LIBRE':t.state==='account'?'CUENTA SOLICITADA':'OCUPADA'}</span></header><p>${t.state==='free'?'Disponible':t.people+' comensales'}</p><strong>${t.state==='free'?'—':money(t.total)}</strong></button>`).join('');$('#module').innerHTML=header('MESAS','Restaurante Demo VantixGC','demo comercial · datos ficticios','<button class="rv2-btn" data-refresh>Actualizar</button>')+`<main class="module-main"><section class="notice">Salón cargado · información simulada</section><section class="toolbar"><div class="zone-tabs"><button class="rv2-btn rv2-btn-primary">Salón principal</button><button class="rv2-btn">Terraza</button></div><div class="legend"><span>Libre</span><span class="occupied">Ocupada</span><span class="account">Cuenta solicitada</span></div></section><section class="table-grid">${body}</section></main>`;document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{state.selectedTable=Number(b.dataset.table);current='pedidos';renderNav();renderPedidos()});document.querySelector('[data-refresh]').onclick=()=>toast('Mesas actualizadas en el demo')}
function renderPedidos(){const picks=state.tables.filter(t=>t.state!=='free').map(t=>`<button class="table-pick ${state.selectedTable===t.id?'active':''}" data-pick="${t.id}"><b>Mesa ${t.id}</b><small>${t.people} comensales · ${money(t.total)}</small></button>`).join('');const menu=products.map(p=>`<button class="product" data-add="${p.id}"><b>${p.name}</b><small>${p.cat}</small><strong>${money(p.price)}</strong><span class="plus">+</span></button>`).join('');const cart=state.cart.length?state.cart.map(c=>`<div class="cartline"><div><b>${esc(c.name)}</b><small>${money(c.price)} c/u</small></div><div class="qty"><button data-minus="${c.id}">−</button><b>${c.qty}</b><button data-plus="${c.id}">+</button></div></div>`).join(''):'<p class="rv2-muted" style="font-size:11px">Agrega productos de la carta.</p>';const total=state.cart.reduce((s,c)=>s+c.price*c.qty,0);$('#module').innerHTML=header('PEDIDOS','Pedidos','demo comercial · misma estructura visual de V2','<button class="rv2-btn" data-go="mesas">Mesas</button><button class="rv2-btn" data-refresh>Actualizar</button>')+`<main class="module-main"><section class="notice">Operación cargada · selecciona una mesa y arma un pedido ficticio.</section><div class="order-shell"><aside class="rv2-panel tables-panel"><h2>Mesas</h2><div class="table-list">${picks}</div></aside><section class="rv2-panel menu-panel"><div class="menu-head"><div><small class="rv2-muted">MESA ${state.selectedTable}</small><h2>Carta</h2></div><input class="rv2-input" value="" placeholder="Buscar en toda la carta…" disabled></div><div class="categories"><button class="rv2-btn rv2-btn-primary">Todos</button><button class="rv2-btn">Entradas</button><button class="rv2-btn">Fuertes</button><button class="rv2-btn">Bebidas</button></div><div class="menu-grid">${menu}</div></section><aside class="rv2-panel draft-panel"><div class="draft-head"><div><small>PEDIDO EN CURSO</small><h2>Mesa ${state.selectedTable}</h2></div><strong>${money(total)}</strong></div><div>${cart}</div><div class="carttotal"><span>Total</span><b>${money(total)}</b></div><button class="rv2-btn rv2-btn-primary review" id="send" ${state.cart.length?'':'disabled'}>CONFIRMAR Y ENVIAR A COCINA / BARRA</button></aside></div></main>`;bindGo();document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{state.selectedTable=Number(b.dataset.pick);renderPedidos()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.add),c=state.cart.find(x=>x.id===p.id);if(c)c.qty++;else state.cart.push({...p,qty:1});renderPedidos()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{state.cart.find(x=>x.id===b.dataset.plus).qty++;renderPedidos()});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const c=state.cart.find(x=>x.id===b.dataset.minus);c.qty--;state.cart=state.cart.filter(x=>x.qty>0);renderPedidos()});$('#send').onclick=()=>{const txt=state.cart.map(c=>`${c.qty} × ${c.name}`).join(' · ');state.commands.push({id:Date.now(),table:state.selectedTable,item:txt,state:'pending'});state.cart=[];toast('Pedido enviado al KDS del demo');openModule('kds')}}
function renderKds(){const lane=(kind,title,no)=>{const rows=state.commands.filter(c=>c.state===kind).map(c=>`<article class="ticket"><span class="meta">MESA ${c.table}</span><b>${esc(c.item)}</b><small>${kind==='pending'?'Pendiente de iniciar':kind==='preparing'?'En preparación':'Lista para entregar'}</small><div class="ticket-actions">${kind==='pending'?`<button class="primary" data-next="${c.id}" data-state="preparing">INICIAR</button>`:kind==='preparing'?`<button class="primary" data-next="${c.id}" data-state="ready">MARCAR LISTO</button>`:`<button class="primary" data-next="${c.id}" data-state="done">ENTREGAR</button>`}</div></article>`).join('')||'<p class="rv2-muted" style="font-size:10px">Sin comandas.</p>';return `<article class="lane"><header><div><small>0${no}</small><h2>${title}</h2></div><b>${state.commands.filter(c=>c.state===kind).length}</b></header>${rows}</article>`};const active=state.commands.filter(c=>c.state!=='done');$('#module').innerHTML=header('COCINA/KDS/PUSH P6','Cocina / KDS','demo comercial · estados simulados localmente','<button class="rv2-btn" data-go="mesas">Mesas</button><button class="rv2-btn" data-go="pedidos">Pedidos</button><button class="rv2-btn" data-refresh>Actualizar</button>')+`<main class="module-main"><section class="notice">KDS V2 conectado · tiempo real simulado sólo dentro del demo.</section><section class="stats"><article><small>PENDIENTES</small><strong>${active.filter(c=>c.state==='pending').length}</strong></article><article><small>EN PREPARACIÓN</small><strong>${active.filter(c=>c.state==='preparing').length}</strong></article><article><small>LISTAS</small><strong>${active.filter(c=>c.state==='ready').length}</strong></article><article><small>ACTIVAS</small><strong>${active.length}</strong></article></section><section class="board">${lane('pending','Pendientes',1)}${lane('preparing','En preparación',2)}${lane('ready','Listas para entregar',3)}</section></main>`;bindGo();document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{const c=state.commands.find(x=>String(x.id)===b.dataset.next);if(c)c.state=b.dataset.state;renderKds()})}
function selectedTable(){return state.tables.find(t=>t.id===state.selectedTable)||state.tables.find(t=>t.state!=='free')}
function renderDivision(){const t=selectedTable();const half=Math.round(t.total/2);$('#module').innerHTML=header('DIVISIÓN','División','Cuenta conjunta o individual · simulación local','<button class="rv2-btn" data-go="mesas">Mesas</button><button class="rv2-btn" data-go="caja">Caja</button>')+`<main class="module-main"><section class="notice">Mesa ${t.id} · división de cuenta demostrativa.</section><div class="split-shell"><section class="rv2-panel"><div class="panel-head"><div><small>CONSUMOS</small><h2>Mesa ${t.id}</h2></div><strong>${money(t.total)}</strong></div><div class="queue"><div class="bill-row"><span>Hamburguesa artesanal × 1</span><b>${money(26000)}</b></div><div class="bill-row"><span>Papas de la casa × 1</span><b>${money(12000)}</b></div><div class="bill-row"><span>Bebidas y otros</span><b>${money(Math.max(0,t.total-38000))}</b></div></div></section><section class="rv2-panel"><div class="panel-head"><div><small>DIVISIÓN V2</small><h2>Partes de la cuenta</h2></div></div><div class="detail"><div class="split-parts"><article class="part"><b>Persona 1</b><strong>${money(half)}</strong><small>Parte ficticia</small></article><article class="part"><b>Persona 2</b><strong>${money(t.total-half)}</strong><small>Parte ficticia</small></article></div><button class="rv2-btn rv2-btn-primary" style="width:100%;margin-top:12px" data-go="caja">CONTINUAR A CAJA</button></div></section></div></main>`;bindGo()}
function renderCaja(){const queue=state.tables.filter(t=>t.state==='account'||t.state==='occupied');let t=selectedTable();if(t.state==='free')t=queue[0];const rows=queue.map(x=>`<button class="queue-row ${x.id===t.id?'active':''}" data-cash="${x.id}"><div><b>Mesa ${x.id}</b><small>${x.state==='account'?'Pidieron cuenta':'Cuenta abierta'} · ${x.people} comensales</small></div><strong>${money(x.total)}</strong></button>`).join('');$('#module').innerHTML=header('CAJA P4','Caja','demo comercial · POS interno simulado','<button class="rv2-btn" data-go="mesas">Mesas</button><button class="rv2-btn" data-go="pedidos">Pedidos</button><button class="rv2-btn" data-refresh>Actualizar</button>')+`<main class="module-main"><section class="notice">Turno de Caja abierto · base inicial ficticia $ 200.000.</section><div class="cash-shell"><aside class="rv2-panel"><div class="panel-head"><div><small>OPERACIÓN ACTIVA</small><h2>Mesas por cobrar</h2></div><b>${queue.length}</b></div><div class="queue">${rows}</div></aside><section class="rv2-panel"><div class="panel-head"><div><small>MESA ${t.id}</small><h2>Cuenta actual</h2><span class="rv2-muted" style="font-size:10px">POS INTERNO</span></div><strong class="grand-total">${money(t.total)}</strong></div><div class="detail"><div class="bill"><div class="bill-row"><span>Consumos entregados</span><b>${money(t.total)}</b></div><div class="bill-row"><span>IVA / Impoconsumo</span><b>$ 0</b></div><div class="bill-row"><strong>Total</strong><strong>${money(t.total)}</strong></div></div><div class="payment-methods"><button class="pay ${state.payment==='EFECTIVO'?'active':''}" data-pay="EFECTIVO">Efectivo</button><button class="pay ${state.payment==='TRANSFERENCIA'?'active':''}" data-pay="TRANSFERENCIA">Transferencia</button><button class="pay ${state.payment==='TARJETA'?'active':''}" data-pay="TARJETA">Tarjeta</button><button class="pay ${state.payment==='CREDITO'?'active':''}" data-pay="CREDITO">Crédito</button></div><button class="rv2-btn rv2-btn-primary" id="charge" style="width:100%">COBRAR EN EL DEMO · ${money(t.total)}</button><p class="fiscal-note">Esta pantalla reproduce la estructura visual de Caja V2. El demo no registra ventas, tesorería, contabilidad, inventario ni impresión.</p></div></section></div></main>`;bindGo();document.querySelectorAll('[data-cash]').forEach(b=>b.onclick=()=>{state.selectedTable=Number(b.dataset.cash);renderCaja()});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{state.payment=b.dataset.pay;renderCaja()});$('#charge').onclick=()=>{const target=state.tables.find(x=>x.id===t.id);target.state='free';target.people=0;target.total=0;toast('Cobro ficticio completado. La mesa quedó libre.');setTimeout(()=>openModule('mesas'),500)}}
function renderProtected(key){const title=key==='admin'?'Administración general':MODULES[key]?.label||'Administración';$('#module').innerHTML=header('ADMINISTRACIÓN',title,'Vista protegida en el demo público')+`<main class="module-main"><section class="protected"><div class="protected-content"><div class="fakebar"></div>${Array.from({length:7},()=>'<div class="fakerow"><span class="fakecircle"></span><span class="fakeline"></span><span class="fakeline"></span><span class="fakeline"></span></div>').join('')}</div><div class="protect-overlay"><div class="protect-card"><div class="lock">⌁</div><h2>Módulo administrativo protegido</h2><p>En el producto real este módulo existe y conserva esta misma navegación. En el demo público no cargamos usuarios, configuraciones, dispositivos, QR ni datos administrativos.</p><span class="protected-tag">PROTEGIDO · SIN DATOS DEL CORE</span></div></div></section></main>`}
function bindGo(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openModule(b.dataset.go));document.querySelector('[data-refresh]')?.addEventListener('click',()=>toast('Vista actualizada en el demo'))}
$('#hybrid').onclick=()=>renderProtected('devices');$('#reset').onclick=()=>{state=clone(initialState);toast('Demostración reiniciada');openModule('mesas')};document.querySelector('.p11-core-link').onclick=()=>openModule('admin');renderNav();openModule('mesas');
})();
</script>
</body>
</html>
