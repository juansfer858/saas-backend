<style>

.splitbox{display:grid;grid-template-columns:1.05fr .95fr;gap:12px}.splititems{display:grid;gap:7px}.splititem{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:10px}.splititem b{font-size:10px}.splititem small{display:block;color:var(--muted);font-size:8px}.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.part{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.part b{font-size:11px}.part strong{display:block;font-size:18px;margin-top:6px}.part small{color:var(--muted);font-size:8px}

@media(max-width:1100px){.demo{grid-template-columns:200px minmax(0,1fr)}.tables{grid-template-columns:repeat(3,1fr)}.orderlayout{grid-template-columns:180px minmax(0,1fr)}.orderlayout>.card:last-child{grid-column:1/-1}.products{grid-template-columns:repeat(3,1fr)}.cashlayout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.demo{display:block}.sidebar{position:static;height:auto;padding:10px}.brand{padding-bottom:8px}.navlabel{display:none}.sidebar nav{display:flex;gap:5px;overflow:auto}.navbtn{width:auto;white-space:nowrap;padding:9px}.navbtn .lock{display:none}.sidebar-foot{display:none}.topbar{position:static;height:auto;min-height:62px;padding:9px 12px}.demo-status .pill.safe{display:none}.top-actions{display:none}.workspace{padding:13px}.pagehead{display:block}.toolbar{margin-top:10px}.metrics,.tables,.grid2,.grid3,.kdsgrid,.splitbox{grid-template-columns:1fr}.orderlayout{grid-template-columns:1fr}.products{grid-template-columns:1fr 1fr}.cashlayout{grid-template-columns:1fr}.kdscol{min-height:160px}.protected-wrap{min-height:420px}}
@media(max-width:480px){.products{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.metric strong{font-size:19px}.pagehead h1{font-size:23px}}

<body>
<div class="demo" id="demoRoot">
  <aside class="sidebar">
    <div class="brand"><span class="brandmark">V</span><div><b>VantixGC Restaurantes</b><small>Showcase comercial</small></div></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot"><small>DEMO AUTÓNOMO</small><small>Datos ficticios · sin conexión al sistema real</small><button class="reset" id="resetDemo" type="button">Reiniciar demostración</button></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="top-id"><b>Restaurante Demo VantixGC</b><small>Experiencia comercial simulada · ningún dato sale de esta página</small></div>
      <div class="demo-status"><span class="pill demo"><span class="dot"></span>MODO DEMOSTRACIÓN</span><span class="pill safe">AISLADO DEL SISTEMA REAL</span></div>
      <div class="top-actions"><a class="smallbtn" href="/restaurantes">Volver</a><a class="smallbtn primary" href="/restaurantes/crear">Crear mi restaurante</a></div>
    </header>
    <section class="workspace" id="view"></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<div id="modalHost"></div>
<script>
(() => {
'use strict';
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n||0));
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const nav=document.querySelector('#nav'),view=document.querySelector('#view'),toastEl=document.querySelector('#toast'),modalHost=document.querySelector('#modalHost');
const initialState=()=>({
  view:'mesas',selectedTable:2,payment:'EFECTIVO',sales:286400,cart:[],
  tables:[
    {id:1,name:'Mesa 1',status:'FREE',guests:0,items:[]},
    {id:2,name:'Mesa 2',status:'BUSY',guests:3,items:[{name:'Hamburguesa de la casa',qty:2,price:22000},{name:'Limonada natural',qty:1,price:7000}]},
    {id:3,name:'Mesa 3',status:'FREE',guests:0,items:[]},
    {id:4,name:'Mesa 4',status:'BUSY',guests:2,items:[{name:'Pasta cremosa',qty:2,price:26000}]},
    {id:5,name:'Mesa 5',status:'ACCOUNT',guests:2,items:[{name:'Papas de entrada',qty:2,price:9000},{name:'Postre de la casa',qty:1,price:10000}]},
    {id:6,name:'Mesa 6',status:'FREE',guests:0,items:[]},
    {id:7,name:'Mesa 7',status:'BUSY',guests:4,items:[{name:'Hamburguesa de la casa',qty:1,price:22000},{name:'Gaseosa',qty:3,price:6000}]},
    {id:8,name:'Mesa 8',status:'FREE',guests:0,items:[]}
  ],
  menu:[
    {id:'p1',name:'Hamburguesa de la casa',price:22000,station:'COCINA',cat:'Fuertes'},
    {id:'p2',name:'Pasta cremosa',price:26000,station:'COCINA',cat:'Fuertes'},
    {id:'p3',name:'Papas de entrada',price:9000,station:'COCINA',cat:'Entradas'},
    {id:'p4',name:'Limonada natural',price:7000,station:'BARRA',cat:'Bebidas'},
    {id:'p5',name:'Gaseosa',price:6000,station:'BARRA',cat:'Bebidas'},
    {id:'p6',name:'Postre de la casa',price:10000,station:'POSTRES',cat:'Postres'}
  ],
  commands:[
    {id:1,table:'Mesa 2',item:'2 Hamburguesas de la casa',station:'COCINA',status:'PREPARING'},
    {id:2,table:'Mesa 2',item:'1 Limonada natural',station:'BARRA',status:'READY'},
    {id:3,table:'Mesa 4',item:'2 Pasta cremosa',station:'COCINA',status:'PENDING'}
  ]
});
let state=initialState();
const modules=[
  ['Operación',[['mesas','Mesas'],['pedidos','Pedidos'],['kds','Producción / KDS'],['division','División'],['caja','Caja']]],
  ['Gestión',[['carta','Carta',1],['inventario','Inventario',1],['empleados','Empleados',1],['qrs','QR de mesas',1],['reportes','Reportes',1],['dispositivos','Dispositivos',1],['administracion','Administración',1]]]
];
function totalTable(t){return (t?.items||[]).reduce((s,i)=>s+(i.price*i.qty),0)}
function busyTables(){return state.tables.filter(t=>t.status!=='FREE')}
function notify(text){toastEl.textContent=text;toastEl.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>toastEl.classList.remove('show'),2200)}
function renderNav(){nav.innerHTML=modules.map(([label,items])=>`<div class="navlabel">${label}</div>${items.map(([key,name,locked])=>`<button type="button" class="navbtn ${state.view===key?'active':''}" data-view="${key}"><span>${name}</span>${locked?'<span class="lock">PROTEGIDO</span>':''}</button>`).join('')}`).join('');nav.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view))}
function go(key){state.view=key;renderNav();render()}
function header(title,desc,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="toolbar">${actions}</div>`:''}</div>`}
function metrics(){const occupied=state.tables.filter(t=>t.status==='BUSY').length,account=state.tables.filter(t=>t.status==='ACCOUNT').length,active=state.commands.filter(c=>c.status!=='DONE').length;return `<div class="metrics"><div class="metric"><small>Mesas ocupadas</small><strong>${occupied}</strong><span>de ${state.tables.length} mesas</span></div><div class="metric"><small>Cuentas pedidas</small><strong>${account}</strong><span>listas para Caja</span></div><div class="metric"><small>Comandas activas</small><strong>${active}</strong><span>Cocina · Barra · Postres</span></div><div class="metric"><small>Ventas demo</small><strong>${money(state.sales)}</strong><span>valor ficticio del turno</span></div></div>`}
function tableCard(t){const cls=t.status==='FREE'?'free':t.status==='ACCOUNT'?'account':'busy';const label=t.status==='FREE'?'LIBRE':t.status==='ACCOUNT'?'CUENTA':'OCUPADA';return `<button class="tablecard ${cls}" type="button" data-table="${t.id}"><span class="statusline ${cls}">${label}</span><b>${esc(t.name)}</b><small>${t.status==='FREE'?'Disponible':`${t.guests} comensal${t.guests===1?'':'es'}`}</small><strong>${t.status==='FREE'?'—':money(totalTable(t))}</strong></button>`}
function renderMesas(){view.innerHTML=header('Mesas','Salón interactivo con datos ficticios. Abre una mesa libre o entra a una ocupada.','<button class="btn primary" type="button" id="quickOrder">Nuevo pedido</button>')+metrics()+`<div class="card"><div class="cardhead"><b>Salón principal</b><small>Haz clic en cualquier mesa</small></div><div class="cardbody"><div class="tables">${state.tables.map(tableCard).join('')}</div></div></div>`;view.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>openTable(Number(b.dataset.table)));document.querySelector('#quickOrder').onclick=()=>go('pedidos')}
function openTable(id){const t=state.tables.find(x=>x.id===id);state.selectedTable=id;if(t.status==='FREE'){modalHost.innerHTML=`<div class="modalback"><div class="modal"><h2>Abrir ${esc(t.name)}</h2><p>Esta apertura existe solamente dentro del demo comercial.</p><div class="field"><label>Número de comensales</label><input id="guestCount" type="number" min="1" max="20" value="2"></div><div class="modalactions"><button class="btn" id="cancelModal">Cancelar</button><button class="btn primary" id="confirmOpen">Abrir mesa</button></div></div></div>`;document.querySelector('#cancelModal').onclick=()=>modalHost.innerHTML='';document.querySelector('#confirmOpen').onclick=()=>{t.status='BUSY';t.guests=Math.max(1,Number(document.querySelector('#guestCount').value)||1);modalHost.innerHTML='';notify(`${t.name} abierta en el demo`);go('pedidos')}}else if(t.status==='ACCOUNT')go('caja');else go('pedidos')}
function tablePicks(){return state.tables.filter(t=>t.status!=='FREE').map(t=>`<button type="button" class="tablepick ${state.selectedTable===t.id?'active':''}" data-pick="${t.id}"><b>${esc(t.name)}</b><small>${money(totalTable(t))} · ${t.guests} personas</small></button>`).join('')||'<div class="cartempty">No hay mesas abiertas. Ve a Mesas y abre una.</div>'}
function cartHtml(){if(!state.cart.length)return '<div class="cartempty">Selecciona productos para construir el pedido.</div>';const lines=state.cart.map((i,idx)=>`<div class="cartline"><div><b>${esc(i.name)}</b><small>${money(i.price)} · ${esc(i.station)}</small></div><div class="qty"><button data-minus="${idx}">−</button><span>${i.qty}</span><button data-plus="${idx}">+</button></div></div>`).join('');const total=state.cart.reduce((s,i)=>s+i.price*i.qty,0);return `${lines}<div class="carttotal"><span>Total pedido</span><span>${money(total)}</span></div><button class="sendbtn" id="sendOrder" type="button">ENVIAR A COCINA / BARRA</button>`}
function renderPedidos(){const selected=state.tables.find(t=>t.id===state.selectedTable&&t.status!=='FREE')||busyTables()[0];if(selected)state.selectedTable=selected.id;view.innerHTML=header('Pedidos','Flujo comercial simulado: mesa → productos → estaciones.')+`<div class="orderlayout"><div class="card"><div class="cardhead"><b>Mesas abiertas</b></div><div class="cardbody"><div class="tablelist">${tablePicks()}</div></div></div><div class="card"><div class="cardhead"><b>Carta demo</b><small>Productos ficticios</small></div><div class="cardbody"><div class="products">${state.menu.map(p=>`<button class="product" type="button" data-product="${p.id}"><span class="plus">+</span><b>${esc(p.name)}</b><small>${esc(p.cat)} · ${esc(p.station)}</small><strong>${money(p.price)}</strong></button>`).join('')}</div></div></div><div class="card"><div class="cardhead"><b>${selected?`Pedido · ${esc(selected.name)}`:'Pedido'}</b><small>Sin persistencia</small></div><div class="cardbody" id="cart">${cartHtml()}</div></div></div>`;view.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{state.selectedTable=Number(b.dataset.pick);renderPedidos()});view.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>addProduct(b.dataset.product));bindCart()}
function addProduct(id){if(!state.tables.find(t=>t.id===state.selectedTable&&t.status!=='FREE')){notify('Primero abre o selecciona una mesa');return}const p=state.menu.find(x=>x.id===id),line=state.cart.find(x=>x.id===id);if(line)line.qty++;else state.cart.push({...p,qty:1});document.querySelector('#cart').innerHTML=cartHtml();bindCart()}
function bindCart(){document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.minus);state.cart[i].qty--;if(state.cart[i].qty<=0)state.cart.splice(i,1);document.querySelector('#cart').innerHTML=cartHtml();bindCart()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{state.cart[Number(b.dataset.plus)].qty++;document.querySelector('#cart').innerHTML=cartHtml();bindCart()});const send=document.querySelector('#sendOrder');if(send)send.onclick=sendOrder}
function sendOrder(){const t=state.tables.find(x=>x.id===state.selectedTable);if(!t||!state.cart.length)return;state.cart.forEach(i=>{const existing=t.items.find(x=>x.name===i.name);if(existing)existing.qty+=i.qty;else t.items.push({name:i.name,qty:i.qty,price:i.price});state.commands.push({id:Date.now()+Math.random(),table:t.name,item:`${i.qty} ${i.name}`,station:i.station,status:'PENDING'})});state.cart=[];notify('Pedido enviado a las estaciones del demo');go('kds')}
function commandCard(c){const action=c.status==='PENDING'?'<button class="primary" data-next="PREPARING">PREPARAR</button>':c.status==='PREPARING'?'<button class="primary" data-next="READY">MARCAR LISTO</button>':c.status==='READY'?'<button class="primary" data-next="DONE">ENTREGAR</button>':'';return `<div class="command" data-command="${c.id}"><span class="meta">${esc(c.station)} · ${esc(c.table)}</span><b>${esc(c.item)}</b><small>${c.status==='PENDING'?'Pendiente':c.status==='PREPARING'?'En preparación':'Listo para entregar'}</small>${action?`<div class="cmd-actions">${action}</div>`:''}</div>`}
function renderKds(){const cols=[['PENDING','PENDIENTES'],['PREPARING','EN PREPARACIÓN'],['READY','LISTOS']];view.innerHTML=header('Producción / KDS','Mueve comandas ficticias entre estados para ver el flujo.')+`<div class="kdsgrid">${cols.map(([key,label])=>{const rows=state.commands.filter(c=>c.status===key);return `<section class="kdscol"><div class="kdstitle"><b>${label}</b><span class="count">${rows.length}</span></div>${rows.map(commandCard).join('')||'<div class="cartempty">Sin comandas</div>'}</section>`}).join('')}</div>`;view.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{const c=state.commands.find(x=>String(x.id)===String(b.closest('[data-command]').dataset.command));c.status=b.dataset.next;notify(c.status==='DONE'?'Producto entregado':'Comanda actualizada');renderKds()})}
function renderDivision(){const t=state.tables.find(x=>x.id===state.selectedTable&&x.status!=='FREE')||busyTables()[0];if(t)state.selectedTable=t.id;const total=totalTable(t);view.innerHTML=header('División','Simula una cuenta conjunta o dividida sin generar cobros reales.',`<button class="btn" type="button" id="equal2">Dividir en 2</button><button class="btn" type="button" id="equal3">Dividir en 3</button>`)+`<div class="splitbox"><div class="card"><div class="cardhead"><b>${t?esc(t.name):'Sin mesa seleccionada'}</b><small>${t?money(total):''}</small></div><div class="cardbody"><div class="splititems">${t?t.items.map(i=>`<div class="splititem"><div><b>${i.qty} × ${esc(i.name)}</b><small>Producto de demostración</small></div><strong>${money(i.qty*i.price)}</strong></div>`).join(''):'<div class="cartempty">Abre una mesa para probar División.</div>'}</div></div></div><div class="card"><div class="cardhead"><b>Partes de la cuenta</b><small id="splitLabel">2 partes</small></div><div class="cardbody"><div class="parts" id="parts">${partsHtml(total,2)}</div></div></div></div>`;document.querySelector('#equal2').onclick=()=>setParts(total,2);document.querySelector('#equal3').onclick=()=>setParts(total,3)}
function partsHtml(total,n){if(!total)return '<div class="cartempty">Sin valor para dividir.</div>';return Array.from({length:n},(_,i)=>`<div class="part"><b>Persona ${i+1}</b><strong>${money(Math.round(total/n))}</strong><small>Pago pendiente · demo</small></div>`).join('')}
function setParts(total,n){document.querySelector('#splitLabel').textContent=`${n} partes`;document.querySelector('#parts').innerHTML=partsHtml(total,n);notify(`Cuenta dividida en ${n} partes ficticias`)}
function cashRows(){return state.tables.filter(t=>t.status!=='FREE').map(t=>`<button class="cashrow ${state.selectedTable===t.id?'active':''}" type="button" data-cash-table="${t.id}"><div><b>${esc(t.name)}</b><small>${t.status==='ACCOUNT'?'Cuenta solicitada':'Cuenta abierta'} · ${t.items.length} líneas</small></div><strong>${money(totalTable(t))}</strong></button>`).join('')||'<div class="cartempty">No hay cuentas abiertas.</div>'}
function renderCaja(){let t=state.tables.find(x=>x.id===state.selectedTable&&x.status!=='FREE')||state.tables.find(x=>x.status==='ACCOUNT')||busyTables()[0];if(t)state.selectedTable=t.id;view.innerHTML=header('Caja','Cobro visual y ficticio. No registra ventas, tesorería ni contabilidad real.')+`<div class="cashlayout"><div class="card"><div class="cardhead"><b>Cuentas del turno demo</b><small>Selecciona una mesa</small></div><div class="cardbody"><div class="cashrows">${cashRows()}</div></div></div><div class="card"><div class="cardhead"><b>Cobrar ${t?esc(t.name):''}</b><small>SIMULACIÓN</small></div><div class="cardbody">${t?`<div class="receipt"><div class="rline"><span>Subtotal</span><span>${money(totalTable(t))}</span></div><div class="rline"><span>Servicio</span><span>${money(0)}</span></div><hr><div class="rline total"><span>TOTAL</span><span>${money(totalTable(t))}</span></div></div><div class="payment-options"><button class="pay ${state.payment==='EFECTIVO'?'active':''}" data-pay="EFECTIVO">Efectivo</button><button class="pay ${state.payment==='TARJETA'?'active':''}" data-pay="TARJETA">Tarjeta</button><button class="pay ${state.payment==='TRANSFERENCIA'?'active':''}" data-pay="TRANSFERENCIA">Transferencia</button><button class="pay ${state.payment==='CREDITO'?'active':''}" data-pay="CREDITO">Crédito</button></div><button class="sendbtn" id="chargeDemo">COBRAR EN EL DEMO</button>`:'<div class="cartempty">Sin mesa seleccionada.</div>'}</div></div></div>`;view.querySelectorAll('[data-cash-table]').forEach(b=>b.onclick=()=>{state.selectedTable=Number(b.dataset.cashTable);renderCaja()});view.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{state.payment=b.dataset.pay;renderCaja()});const charge=document.querySelector('#chargeDemo');if(charge)charge.onclick=()=>chargeDemo(t)}
function chargeDemo(t){const total=totalTable(t);state.sales+=total;modalHost.innerHTML=`<div class="modalback"><div class="modal"><h2>Cobro simulado</h2><p>La operación terminó únicamente dentro de esta demostración.</p><div class="receipt"><div style="text-align:center;font-weight:900">VANTIXGC RESTAURANTES · DEMO</div><div style="text-align:center">${esc(t.name)} · ${esc(state.payment)}</div><hr>${t.items.map(i=>`<div class="rline"><span>${i.qty} ${esc(i.name)}</span><span>${money(i.qty*i.price)}</span></div>`).join('')}<hr><div class="rline total"><span>TOTAL</span><span>${money(total)}</span></div><div style="text-align:center;margin-top:8px">DOCUMENTO FICTICIO · NO VÁLIDO</div></div><div class="modalactions"><button class="btn primary" id="finishCharge">Terminar</button></div></div></div>`;document.querySelector('#finishCharge').onclick=()=>{t.status='FREE';t.guests=0;t.items=[];modalHost.innerHTML='';notify('Mesa liberada en el demo');renderCaja()}}
function renderProtected(key){const names={carta:'Carta',inventario:'Inventario',empleados:'Empleados',qrs:'QR de mesas',reportes:'Reportes',dispositivos:'Dispositivos',administracion:'Administración'};const title=names[key]||'Administración';view.innerHTML=header(title,'La existencia del módulo se muestra, pero su contenido administrativo no se expone en el demo público.')+`<div class="protected-wrap"><div class="protected-content"><div class="fakebar"></div><div class="grid3"><div class="metric"><small>Configuración</small><strong>24</strong></div><div class="metric"><small>Registros</small><strong>128</strong></div><div class="metric"><small>Estado</small><strong>Activo</strong></div></div><div class="fakerows" style="margin-top:14px">${Array.from({length:7},()=>'<div class="fakerow"><span class="fakecircle"></span><span class="fakeline"></span><span class="fakeline"></span><span class="fakeline"></span></div>').join('')}</div></div><div class="protect-overlay"><div class="protect-card"><div class="lockicon">⌁</div><h2>${esc(title)} está protegido en el demo</h2><p>Mostramos que este módulo existe, pero no cargamos datos, configuración ni lógica administrativa del sistema real. En una cuenta activa tendrás acceso según tu rol.</p><div class="protect-actions"><button class="btn" type="button" id="backOperation">Volver a Mesas</button><a class="btn primary" href="/restaurantes/crear">Crear mi restaurante</a></div></div></div></div>`;document.querySelector('#backOperation').onclick=()=>go('mesas')}
function render(){if(['carta','inventario','empleados','qrs','reportes','dispositivos','administracion'].includes(state.view))return renderProtected(state.view);if(state.view==='pedidos')return renderPedidos();if(state.view==='kds')return renderKds();if(state.view==='division')return renderDivision();if(state.view==='caja')return renderCaja();return renderMesas()}
function resetDemo(){state=initialState();renderNav();render();notify('Demostración reiniciada')}
document.querySelector('#resetDemo').onclick=resetDemo;
if(new URLSearchParams(location.search).get('embedded')==='1')document.body.classList.add('embedded');
renderNav();render();
})();
</script>
</body>
</html>
