<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VantixGC · Panel SaaS</title>
<style>:root{--bg:#f4f4f5;--card:#fff;--line:#e4e4e7;--text:#18221d;--muted:#61706a;--green:#0d6b43;--red:#b42318;--nav:#10241b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.input,.select{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:10px}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;font-weight:750;cursor:pointer}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.danger{color:var(--red);border-color:#fecaca}.muted{color:var(--muted)}.error,.notice{padding:10px 12px;border-radius:9px;margin:10px 0}.error{background:#fff1f0;border:1px solid #fecaca;color:var(--red)}.notice{background:#f0f9f4;border:1px solid #b7dfc8}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--nav);color:#fff;padding:18px 14px}.brand{font-weight:850;padding:8px 10px 20px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#dce8e3;padding:10px 12px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#173429}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.content{max-width:1600px;margin:auto;padding:24px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.card small{color:var(--muted)}.card strong{display:block;font-size:24px;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:16px 0}.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.table-wrap{overflow:auto}.table{border-collapse:collapse;width:100%;font-size:13px}.table th,.table td{padding:10px 12px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}.table th{background:#fafafa}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f6}.badge.ok{background:#ecfdf3;color:#027a48}.badge.bad{background:#fff1f0;color:#b42318}.badge.warn{background:#fffaeb;color:#b54708}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.modal-back{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:18px;z-index:50}.modal{background:#fff;border-radius:14px;width:min(850px,100%);max-height:92vh;overflow:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:900px){.app{display:block}.side{position:static}.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.cards,.grid{grid-template-columns:1fr}.content{padding:14px 9px}}</style></head>
<body><div id="root"></div><div id="modal"></div><script>
const K='vantixgc_platform_session_v1';let s=null;try{s=JSON.parse(localStorage.getItem(K)||'null')}catch{}const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];let view='tenants',cache={tenants:[],metrics:null};function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]))}
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(s?.token)headers.Authorization=`Bearer ${s.token}`;const r=await fetch(path,{...opts,headers});let b={};try{b=await r.json()}catch{}if(r.status===401&&s){localStorage.removeItem(K);s=null;renderLogin();throw new Error('Sesión vencida')}if(!r.ok)throw new Error(b?.error?.message||`HTTP ${r.status}`);return b}
function renderLogin(){root.innerHTML=`<div class="login"><div class="login-card"><h1 style="margin-top:0">Panel SaaS VantixGC</h1><p class="muted">Acceso de plataforma independiente. Un ADMIN de un tenant no puede usar este login.</p><div id="err"></div><div class="field"><label>Correo super-administrador</label><input class="input" id="email" type="email"></div><div class="field"><label>Contraseña</label><input class="input" id="password" type="password"></div><button class="btn primary" id="login" style="width:100%">Ingresar al Panel SaaS</button></div></div>`;$('#login').onclick=async()=>{try{const r=await api('/platform/api/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});s=r.data;localStorage.setItem(K,JSON.stringify(s));renderShell()}catch(e){$('#err').innerHTML=`<div class="error">${esc(e.message)}</div>`}}}
function renderShell(){root.innerHTML=`<div class="app"><aside class="side"><div class="brand">VantixGC<br><small style="color:#9db3a8">Platform Control</small></div><div class="nav"><button data-v="tenants" class="active">Tenants</button><button data-v="metrics">Métricas</button><button data-v="audit">Auditoría plataforma</button></div></aside><main class="main"><header class="top"><div><strong>Super-Administración SaaS</strong><div class="muted" style="font-size:12px">Fuera del contexto de cualquier tenant</div></div><div>${esc(s.user?.name||s.user?.email||'Super Admin')} <button class="btn" id="logout">Salir</button></div></header><section class="content"><div id="flash"></div><div id="view"></div></section></main></div>`;$('#logout').onclick=()=>{localStorage.removeItem(K);s=null;renderLogin()};$$('[data-v]').forEach(b=>b.onclick=()=>{$$('[data-v]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.v;loadView()});loadView()}
function flash(msg,bad=false){$('#flash').innerHTML=`<div class="${bad?'error':'notice'}">${esc(msg)}</div>`}function modal(h){$('#modal').innerHTML=`<div class="modal-back"><div class="modal">${h}</div></div>`}function closeModal(){$('#modal').innerHTML=''}
async function loadTenants(){const r=await api('/platform/api/tenants');cache.tenants=r.data||[];$('#view').innerHTML=`<h1>Tenants</h1><div class="muted">Estado, plan, despliegue progresivo y usuarios desde una vista global.</div><div class="panel"><div class="ph"><strong>${cache.tenants.length} empresas</strong><button class="btn" id="refresh">Actualizar</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Empresa</th><th>Estado</th><th>Plan</th><th>Canal</th><th>Versión</th><th>Uso</th><th>Último acceso</th><th>Acciones</th></tr></thead><tbody>${cache.tenants.map(t=>`<tr><td><strong>${esc(t.nombreEmpresa)}</strong><br><small>${esc(t.subdomain)}</small></td><td><span class="badge ${t.activo?'ok':'bad'}">${t.activo?'ACTIVO':'SUSPENDIDO'}</span></td><td>${esc(t.control?.planCode||'CORE')}</td><td><span class="badge ${t.control?.rolloutChannel==='PILOTO'?'warn':''}">${esc(t.control?.rolloutChannel||'ESTABLE')}</span></td><td>${esc(t.control?.currentVersion||'—')} → ${esc(t.control?.targetVersion||'—')}</td><td>${t.usage?.activeUsers||0} usuarios · ${t.usage?.documents||0} docs · ${t.usage?.dianDocuments||0} DIAN</td><td>${t.control?.lastAccessAt?new Date(t.control.lastAccessAt).toLocaleString('es-CO'):'—'}</td><td><div class="toolbar"><button class="btn" data-control="${t.id}">Plan/versión</button><button class="btn" data-users="${t.id}">Usuarios</button><button class="btn ${t.activo?'danger':''}" data-state="${t.id}" data-active="${t.activo}">${t.activo?'Suspender':'Activar'}</button></div></td></tr>`).join('')}</tbody></table></div></div>`;$('#refresh').onclick=loadTenants;$$('[data-control]').forEach(b=>b.onclick=()=>openControl(b.dataset.control));$$('[data-users]').forEach(b=>b.onclick=()=>openUsers(b.dataset.users));$$('[data-state]').forEach(b=>b.onclick=()=>toggleTenant(b.dataset.state,b.dataset.active==='true'))}
function openControl(id){const t=cache.tenants.find(x=>x.id===id),c=t.control||{};modal(`<h2>${esc(t.nombreEmpresa)} · Control SaaS</h2><div class="grid"><div class="field"><label>Plan</label><input class="input" id="cPlan" value="${esc(c.planCode||'CORE')}"></div><div class="field"><label>Versión actual</label><input class="input" id="cCurrent" value="${esc(c.currentVersion||'')}"></div><div class="field"><label>Versión objetivo</label><input class="input" id="cTarget" value="${esc(c.targetVersion||'')}"></div><div class="field"><label>Canal de despliegue</label><select class="select" id="cChannel"><option ${c.rolloutChannel==='ESTABLE'?'selected':''}>ESTABLE</option><option ${c.rolloutChannel==='PILOTO'?'selected':''}>PILOTO</option><option ${c.rolloutChannel==='PAUSADO'?'selected':''}>PAUSADO</option></select></div><div class="field"><label>Máx. usuarios</label><input class="input" id="cUsers" type="number" value="${c.maxUsers||''}"></div><div class="field"><label>Máx. docs/mes</label><input class="input" id="cDocs" type="number" value="${c.maxDocumentsMonthly||''}"></div><div class="field"><label>Storage MB</label><input class="input" id="cStorage" type="number" value="${c.maxStorageMb||''}"></div><div class="field"><label>Alerta límite %</label><input class="input" id="cSoft" type="number" value="${c.softLimitPercent||80}"></div></div><div class="toolbar" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="close">Cancelar</button><button class="btn primary" id="save">Guardar</button></div>`);$('#close').onclick=closeModal;$('#save').onclick=async()=>{try{const body={planCode:$('#cPlan').value.trim(),currentVersion:$('#cCurrent').value.trim()||null,targetVersion:$('#cTarget').value.trim()||null,rolloutChannel:$('#cChannel').value,softLimitPercent:Number($('#cSoft').value)};if($('#cUsers').value)body.maxUsers=Number($('#cUsers').value);if($('#cDocs').value)body.maxDocumentsMonthly=Number($('#cDocs').value);if($('#cStorage').value)body.maxStorageMb=Number($('#cStorage').value);await api(`/platform/api/tenants/${id}/control`,{method:'PUT',body:JSON.stringify(body)});closeModal();flash('Control de tenant actualizado.');loadTenants()}catch(e){alert(e.message)}}}
async function openUsers(id){try{const r=await api(`/platform/api/tenants/${id}/users`),d=r.data;modal(`<h2>Usuarios · ${esc(d.tenant.nombreEmpresa)}</h2><div class="table-wrap"><table class="table"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol tenant</th><th>Estado</th><th></th></tr></thead><tbody>${d.users.map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.email)}</td><td>${esc(u.rol)}</td><td><span class="badge ${u.activo?'ok':'bad'}">${u.activo?'ACTIVO':'INACTIVO'}</span></td><td><button class="btn ${u.activo?'danger':''}" data-user="${u.id}" data-active="${u.activo}">${u.activo?'Desactivar':'Activar'}</button></td></tr>`).join('')}</tbody></table></div><div class="toolbar" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="close">Cerrar</button></div>`);$('#close').onclick=closeModal;$$('[data-user]').forEach(b=>b.onclick=async()=>{try{await api(`/platform/api/tenants/${id}/users/${b.dataset.user}/estado`,{method:'PUT',body:JSON.stringify({active:b.dataset.active!=='true'})});await openUsers(id)}catch(e){alert(e.message)}})}catch(e){flash(e.message,true)}}
async function toggleTenant(id,active){const reason=active?prompt('Motivo de suspensión (opcional):')||null:null;try{await api(`/platform/api/tenants/${id}/estado`,{method:'PUT',body:JSON.stringify({active:!active,reason})});flash(active?'Tenant suspendido sin borrar datos.':'Tenant activado.');loadTenants()}catch(e){flash(e.message,true)}}
async function loadMetrics(){const r=await api('/platform/api/metricas'),m=r.data;cache.metrics=m;$('#view').innerHTML=`<h1>Métricas de plataforma</h1><div class="cards"><div class="card"><small>Tenants activos</small><strong>${m.tenants.active}</strong></div><div class="card"><small>Suspendidos</small><strong>${m.tenants.suspended}</strong></div><div class="card"><small>Documentos DIAN</small><strong>${m.dian.total}</strong></div><div class="card"><small>DIAN pendientes/contingencia</small><strong>${m.dian.pendingOrContingency}</strong></div></div><div class="panel"><div class="ph"><strong>Estados DIAN agregados</strong></div><div class="table-wrap"><table class="table"><thead><tr><th>Estado</th><th>Cantidad</th></tr></thead><tbody>${(m.dian.byState||[]).map(x=>`<tr><td>${esc(x.state)}</td><td>${x._count._all}</td></tr>`).join('')||'<tr><td colspan="2">Sin documentos.</td></tr>'}</tbody></table></div></div>`}
async function loadAudit(){const r=await api('/platform/api/auditoria?limit=300');$('#view').innerHTML=`<h1>Auditoría plataforma</h1><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Acción</th><th>Entidad</th><th>Tenant</th><th>Metadata</th></tr></thead><tbody>${(r.data||[]).map(a=>`<tr><td>${new Date(a.creadoEn).toLocaleString('es-CO')}</td><td>${esc(a.action)}</td><td>${esc(a.entity)} ${esc(a.entityId||'')}</td><td>${esc(a.tenantId||'—')}</td><td><small>${esc(JSON.stringify(a.metadata||{}))}</small></td></tr>`).join('')||'<tr><td colspan="5">Sin eventos.</td></tr>'}</tbody></table></div></div>`}
function loadView(){if(view==='tenants')loadTenants().catch(e=>flash(e.message,true));else if(view==='metrics')loadMetrics().catch(e=>flash(e.message,true));else loadAudit().catch(e=>flash(e.message,true))}if(s)renderShell();else renderLogin();
</script></body></html>
