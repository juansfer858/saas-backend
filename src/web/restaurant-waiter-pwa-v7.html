<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111c2b">
  <meta name="referrer" content="no-referrer">
  <title>VantixGC Mesero</title>
  <link rel="manifest" href="/app/centro-de-control/manifest.webmanifest">
  <link rel="icon" href="/app/centro-de-control/waiter-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app/restaurant-theme.css?v=la-riel-v1">
  <link rel="stylesheet" href="/restaurantes/theme-v1.css">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212b;background:#f3f6f9}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3f6f9;overscroll-behavior:none}button,input,select{font:inherit}button{touch-action:manipulation}
    .wv-shell{min-height:100dvh;padding:8px 8px 92px}.wv-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;margin:0 auto 8px;max-width:1500px;padding:8px 10px;border:1px solid #dbe3ea;border-radius:15px;background:rgba(255,255,255,.96);box-shadow:0 5px 18px rgba(15,23,42,.08)}
    .wv-brand{min-width:0}.wv-brand small{display:block;font-size:9px;letter-spacing:.13em;font-weight:900;color:#137a53}.wv-brand b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}.wv-user{margin-left:auto;text-align:right;min-width:0}.wv-user small{display:block;font-size:9px;color:#64748b}.wv-user b{display:block;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.wv-online{width:9px;height:9px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px #dcfce7}.wv-online.off{background:#dc2626;box-shadow:0 0 0 3px #fee2e2}
    #wvMessage{max-width:1500px;margin:0 auto 8px}.wv-msg{padding:9px 11px;border-radius:11px;background:#ecfdf5;color:#166534;font-size:12px;font-weight:750}.wv-msg.err{background:#fff1f2;color:#9f1239}
    #wvApp{max-width:1500px;margin:auto}.wv-card{border:1px solid #dbe3ea;border-radius:15px;background:#fff;box-shadow:0 5px 18px rgba(15,23,42,.05)}
    .wv-top{padding:9px}.wv-zone-row{display:grid;grid-template-columns:128px minmax(0,1fr);gap:7px;align-items:stretch}.wv-zone{min-height:58px;width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;font-weight:800}.wv-tables{display:flex;gap:6px;overflow:auto;scrollbar-width:none;padding-bottom:1px}.wv-tables::-webkit-scrollbar{display:none}.wv-table{min-width:102px;min-height:58px;padding:7px 9px;border:1px solid #d9e1e7;border-radius:11px;background:#f8fafc;text-align:left}.wv-table b,.wv-table span{display:block}.wv-table b{font-size:13px}.wv-table span{margin-top:3px;font-size:10px;color:#64748b}.wv-table.active{border-color:#137a53;background:#e9f7f1;box-shadow:inset 0 0 0 1px #137a53}.wv-table.OCUPADA,.wv-table.CUENTA_PEDIDA{background:#fff7ed}.wv-table.CUENTA_PEDIDA{border-color:#d4a62a}
    .wv-body{margin-top:8px}.wv-loading,.wv-empty{padding:28px 16px;text-align:center;color:#64748b}.wv-loading b,.wv-empty b{display:block;color:#17212b;font-size:17px;margin-bottom:5px}.wv-spin{width:22px;height:22px;margin:0 auto 9px;border:3px solid #dbe3ea;border-top-color:#137a53;border-radius:50%;animation:wvspin .7s linear infinite}@keyframes wvspin{to{transform:rotate(360deg)}}
    .wv-open{padding:14px}.wv-open h2{margin:0 0 5px}.wv-open-grid{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;margin-top:12px}.wv-input,.wv-select{width:100%;min-height:48px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:11px;background:#fff}.wv-label{display:grid;gap:4px;font-size:10px;font-weight:850;color:#475569}.wv-mode{display:grid;grid-template-columns:1fr 1fr;gap:6px}.wv-btn{min-height:48px;padding:0 12px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;color:#17212b;font-weight:850}.wv-btn.primary{border-color:#137a53;background:#137a53;color:#fff}.wv-btn.brass{border-color:#b68b16;background:#d4a62a;color:#17212b}.wv-btn:disabled{opacity:.5}.wv-open-action{grid-column:1/-1;min-height:56px}
    .wv-service{display:grid;gap:8px}.wv-servicebar{padding:9px}.wv-servicebar-row{display:flex;gap:6px;overflow:auto;align-items:center}.wv-seat{min-width:104px}.wv-seat.active{background:#137a53;color:#fff;border-color:#137a53}
    .wv-work{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}.wv-catalog{padding:9px}.wv-tabs{display:flex;gap:5px;overflow:auto;margin-bottom:7px}.wv-tab{min-width:96px}.wv-tab.active{background:#111c2b;color:#fff;border-color:#111c2b}.wv-search-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-bottom:8px}.wv-search-meta{font-size:10px;color:#64748b;white-space:nowrap}.wv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.wv-product{min-height:142px;padding:9px;border:1px solid #dbe3ea;border-radius:13px;background:#fff;display:flex;flex-direction:column}.wv-product small{font-size:9px;color:#64748b;font-weight:800}.wv-product b{font-size:14px;line-height:1.18;margin-top:4px}.wv-product strong{margin-top:6px;font-size:16px}.wv-qty{display:grid;grid-template-columns:48px 1fr 48px;gap:4px;margin-top:auto;padding-top:8px}.wv-qty button{min-height:50px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;font-size:22px;font-weight:900}.wv-qty button.plus{background:#137a53;color:#fff;border-color:#137a53}.wv-qty span{display:grid;place-items:center;border-radius:10px;background:#f1f5f9;font-size:17px;font-weight:900}.wv-more{grid-column:1/-1}
    .wv-order-toggle{position:fixed;z-index:80;right:10px;bottom:max(10px,env(safe-area-inset-bottom));min-height:58px;padding:0 16px;border:0;border-radius:17px;background:#111c2b;color:#fff;font-weight:950;box-shadow:0 12px 30px rgba(15,23,42,.28)}.wv-backdrop{position:fixed;z-index:89;inset:0;background:rgba(15,23,42,.43);display:none}.wv-order{position:fixed;z-index:90;left:5px;right:5px;bottom:max(5px,env(safe-area-inset-bottom));max-height:86dvh;overflow:auto;padding:12px;border-radius:20px;transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none;transition:transform .18s ease,opacity .15s ease}.wv-order-open .wv-order{transform:translateY(0);opacity:1;pointer-events:auto}.wv-order-open .wv-backdrop{display:block}.wv-order-head{display:flex;align-items:center;gap:8px}.wv-order-head h2{margin:0}.wv-close{margin-left:auto;min-width:44px;width:44px;height:44px;padding:0}.wv-order-list{display:grid;gap:6px;margin:10px 0}.wv-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:8px;border:1px solid #e2e8f0;border-radius:10px}.wv-item b,.wv-item small{display:block}.wv-item small{margin-top:3px;color:#64748b;font-size:10px}.wv-total{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #e2e8f0;font-size:18px}.wv-actions{display:grid;gap:6px}.wv-actions .wv-btn{min-height:55px}.wv-history{padding:9px;margin-top:8px}.wv-history summary{cursor:pointer;font-weight:850}.wv-round{margin-top:7px;padding:8px;border:1px solid #e2e8f0;border-radius:10px;font-size:11px}.wv-round b{display:block;margin-bottom:3px}.wv-sync{position:fixed;z-index:120;left:50%;bottom:10px;transform:translateX(-50%);display:none;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:#111c2b;color:#fff;font-size:11px;font-weight:850;pointer-events:none}.wv-sync.show{display:flex}.wv-sync i{width:11px;height:11px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:wvspin .7s linear infinite}
    @media(min-width:700px){.wv-shell{padding:10px 10px 30px}.wv-zone-row{grid-template-columns:155px minmax(0,1fr)}.wv-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.wv-product{min-height:150px}.wv-order-toggle{right:16px;bottom:16px}.wv-order{left:auto;right:12px;width:min(430px,46vw);bottom:12px;max-height:calc(100dvh - 24px)}}
    @media(min-width:1100px){.wv-work{grid-template-columns:minmax(0,1.55fr) 390px;align-items:start}.wv-order{position:sticky;z-index:1;left:auto;right:auto;bottom:auto;top:72px;width:auto;max-height:calc(100dvh - 85px);transform:none;opacity:1;pointer-events:auto}.wv-order-toggle,.wv-backdrop,.wv-close{display:none!important}.wv-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
  <div class="wv-shell">
    <header class="wv-header"><span id="wvOnline" class="wv-online"></span><div class="wv-brand"><small>VANTIXGC RESTAURANTE</small><b id="wvRestaurant">Mesero</b></div><div class="wv-user"><small>Mesero conectado</small><b id="wvUser">—</b></div></header>
    <div id="wvMessage"></div>
    <main id="wvApp"><section class="wv-card wv-loading"><div class="wv-spin"></div><b>Cargando panel del mesero…</b><span>Preparando zonas, mesas y carta.</span></section></main>
  </div>
  <button id="wvBackdrop" class="wv-backdrop" type="button" aria-label="Cerrar pedido"></button>
  <div id="wvSync" class="wv-sync"><i></i><span>Sincronizando…</span></div>
  <script src="/app/restaurant-theme.js?v=panel-font-v1"></script>
  <script src="/app/restaurant-waiter-runtime-v7.js?v=waiter-runtime-v7"></script>
  <script>
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/app/centro-de-control/sw.js',{scope:'/app/centro-de-control'}).catch(()=>{});
  </script>
</body>
</html>
