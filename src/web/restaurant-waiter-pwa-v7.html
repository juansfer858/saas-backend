<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111c2b">
  <meta name="referrer" content="no-referrer">
  <title>VantixGC Mesero</title>
  <link rel="manifest" href="/app/centro-de-control/manifest.webmanifest">
  <link rel="icon" href="/app/centro-de-control/waiter-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app/restaurant-theme.css?v=la-riel-v1">
  <link rel="stylesheet" href="/restaurantes/theme-v1.css">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17212b;background:#f3f6f9;--wv-green:#168454;--wv-green-soft:#e9f7ef;--wv-navy:#0f1a2b;--wv-line:#d8e0e8;--wv-muted:#66758b;--wv-danger:#a72d45;--wv-danger-bg:#fff2f4}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3f6f9;overscroll-behavior:none}button,input,select{font:inherit}button{touch-action:manipulation}.wv-shell{min-height:100dvh;width:min(100%,1120px);margin:0 auto;padding:clamp(7px,2vw,14px) clamp(7px,2vw,14px) 96px}
    .wv-header{position:sticky;top:max(6px,env(safe-area-inset-top));z-index:50;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin:0 auto 10px;padding:14px 16px;border:1px solid var(--wv-line);border-radius:19px;background:rgba(255,255,255,.97);box-shadow:0 8px 24px rgba(15,23,42,.08);backdrop-filter:blur(12px)}
    .wv-brand{min-width:0}.wv-brand small{display:block;font-size:clamp(9px,2.5vw,12px);letter-spacing:.14em;font-weight:950;color:var(--wv-green)}.wv-brand b{display:block;margin-top:2px;font-size:clamp(22px,6vw,34px);line-height:1.02;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wv-persist{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:6px 10px;border-radius:999px;background:var(--wv-green-soft);color:#166534;font-size:clamp(10px,2.7vw,12px);font-weight:850}.wv-persist:before{content:'✓';display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--wv-green);color:#fff;font-size:11px}.wv-user{align-self:start;text-align:right;min-width:0;padding-top:3px}.wv-user small{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:clamp(10px,2.8vw,12px);color:#64748b}.wv-user small:before{content:'';width:9px;height:9px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px #dcfce7}.wv-user b{display:block;max-width:220px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(13px,3.7vw,17px)}.wv-online{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.wv-user.off small:before{background:#dc2626;box-shadow:0 0 0 3px #fee2e2}
    #wvMessage{margin:0 auto 10px}.wv-msg{padding:11px 13px;border-radius:14px;background:#ecfdf5;color:#166534;font-size:clamp(11px,3vw,13px);font-weight:750;line-height:1.35}.wv-msg.err{background:var(--wv-danger-bg);color:var(--wv-danger);border:1px solid #ffd6dd}
    #wvApp{margin:auto}.wv-card{border:1px solid var(--wv-line);border-radius:18px;background:#fff;box-shadow:0 5px 18px rgba(15,23,42,.045)}
    .wv-top{padding:10px}.wv-zone-row{display:grid;grid-template-columns:minmax(150px,.42fr) minmax(0,1fr);gap:8px;align-items:stretch}.wv-zone{min-height:68px;width:100%;padding:10px 38px 10px 13px;border:1px solid #ccd7e2;border-radius:14px;background:#fff;color:#17212b;font-size:clamp(14px,3.8vw,18px);font-weight:900;line-height:1.15;white-space:normal;text-overflow:ellipsis}.wv-tables{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:0 1px 1px;scroll-snap-type:x proximity}.wv-tables::-webkit-scrollbar{display:none}.wv-table{flex:0 0 auto;min-width:106px;max-width:150px;min-height:68px;padding:9px 11px;border:1px solid #d3dde6;border-radius:14px;background:#fff;text-align:left;scroll-snap-align:start;overflow:hidden}.wv-table b,.wv-table span{display:block;overflow-wrap:anywhere}.wv-table b{font-size:clamp(14px,3.8vw,18px);line-height:1.1}.wv-table span{margin-top:5px;font-size:clamp(10px,2.8vw,12px);line-height:1.2;color:var(--wv-muted)}.wv-table.active{border-color:var(--wv-green);background:#f1fbf6;box-shadow:inset 0 0 0 1px var(--wv-green)}.wv-table.OCUPADA,.wv-table.CUENTA_PEDIDA{background:#fffaf3}.wv-table.CUENTA_PEDIDA{border-color:#d4a62a}
    .wv-body{margin-top:9px}.wv-loading,.wv-empty{padding:30px 16px;text-align:center;color:#64748b}.wv-loading b,.wv-empty b{display:block;color:#17212b;font-size:17px;margin-bottom:5px}.wv-spin{width:22px;height:22px;margin:0 auto 9px;border:3px solid #dbe3ea;border-top-color:var(--wv-green);border-radius:50%;animation:wvspin .7s linear infinite}@keyframes wvspin{to{transform:rotate(360deg)}}
    .wv-open{padding:15px}.wv-open h2{margin:2px 0 6px}.wv-open-grid{display:grid;grid-template-columns:minmax(110px,.45fr) minmax(0,1fr);gap:9px;margin-top:12px}.wv-input,.wv-select{width:100%;min-height:52px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:13px;background:#fff;font-size:clamp(13px,3.5vw,16px)}.wv-label{display:grid;gap:5px;font-size:10px;font-weight:850;color:#475569}.wv-mode{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.wv-btn{min-width:0;min-height:50px;padding:8px 12px;border:1px solid #cbd5e1;border-radius:13px;background:#fff;color:#17212b;font-weight:850;line-height:1.15;white-space:normal;overflow-wrap:anywhere}.wv-btn.primary{border-color:var(--wv-green);background:var(--wv-green);color:#fff}.wv-btn.brass{border-color:#b68b16;background:#d4a62a;color:#17212b}.wv-btn:disabled{opacity:.5}.wv-open-action{grid-column:1/-1;min-height:56px}
    .wv-service{display:grid;gap:9px}.wv-servicebar{padding:11px 12px}.wv-servicebar-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-items:stretch;overflow:visible}.wv-servicebar-row+.wv-servicebar-row{display:flex!important;flex-wrap:wrap!important;gap:7px!important}.wv-servicebar-row>.wv-btn{width:100%;font-size:clamp(12px,3.3vw,16px)}.wv-seat{min-width:96px;width:auto!important}.wv-seat.active{background:var(--wv-green);color:#fff;border-color:var(--wv-green)}
    .wv-work{display:grid;grid-template-columns:minmax(0,1fr);gap:9px}.wv-catalog{padding:11px}.wv-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:9px;overflow:visible}.wv-tab{min-width:0!important;padding:8px 5px!important;font-size:clamp(10px,2.8vw,14px);letter-spacing:.01em;text-align:center}.wv-tab.active{background:var(--wv-navy);color:#fff;border-color:var(--wv-navy)}.wv-search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:9px}.wv-search-row .wv-input{min-width:0}.wv-search-meta{font-size:clamp(10px,2.7vw,12px);color:var(--wv-muted);white-space:nowrap}.wv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.wv-product{min-width:0;min-height:162px;padding:11px;border:1px solid #dbe3ea;border-radius:15px;background:#fff;display:flex;flex-direction:column;overflow:hidden}.wv-product small{font-size:9px;color:#5d7087;font-weight:900;letter-spacing:.03em}.wv-product b{margin-top:5px;font-size:clamp(13px,3.5vw,17px);line-height:1.14;overflow-wrap:anywhere;word-break:normal}.wv-product strong{margin-top:7px;font-size:clamp(16px,4.3vw,20px)}.wv-qty{display:grid;grid-template-columns:minmax(44px,.8fr) minmax(42px,.9fr) minmax(44px,.8fr);gap:5px;margin-top:auto;padding-top:10px}.wv-qty button{min-width:0;min-height:50px;padding:0;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:24px;font-weight:900}.wv-qty button.plus{background:var(--wv-green);color:#fff;border-color:var(--wv-green)}.wv-qty span{display:grid;place-items:center;min-width:0;border-radius:11px;background:#f1f5f9;font-size:18px;font-weight:900}.wv-more{grid-column:1/-1}
    .wv-order-toggle{position:fixed;z-index:80;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));min-height:62px;padding:0 18px;border:0;border-radius:22px;background:var(--wv-navy);color:#fff;font-size:clamp(14px,4vw,18px);font-weight:950;box-shadow:0 16px 34px rgba(15,23,42,.30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wv-backdrop{position:fixed;z-index:89;inset:0;background:rgba(15,23,42,.43);display:none}.wv-order{position:fixed;z-index:90;left:5px;right:5px;bottom:max(5px,env(safe-area-inset-bottom));max-height:86dvh;overflow:auto;padding:13px;border-radius:22px;transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none;transition:transform .18s ease,opacity .15s ease}.wv-order-open .wv-order{transform:translateY(0);opacity:1;pointer-events:auto}.wv-order-open .wv-backdrop{display:block}.wv-order-head{display:flex;align-items:center;gap:8px}.wv-order-head h2{margin:0}.wv-close{margin-left:auto;min-width:44px;width:44px;height:44px;padding:0}.wv-order-list{display:grid;gap:6px;margin:10px 0}.wv-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:8px;border:1px solid #e2e8f0;border-radius:10px}.wv-item b,.wv-item small{display:block;overflow-wrap:anywhere}.wv-item small{margin-top:3px;color:#64748b;font-size:10px}.wv-total{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #e2e8f0;font-size:18px}.wv-actions{display:grid;gap:6px}.wv-actions .wv-btn{min-height:55px}.wv-history{padding:9px;margin-top:8px}.wv-history summary{cursor:pointer;font-weight:850}.wv-round{margin-top:7px;padding:8px;border:1px solid #e2e8f0;border-radius:10px;font-size:11px}.wv-round b{display:block;margin-bottom:3px}.wv-sync{position:fixed;z-index:120;left:50%;bottom:82px;transform:translateX(-50%);display:none;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:#111c2b;color:#fff;font-size:11px;font-weight:850;pointer-events:none}.wv-sync.show{display:flex}.wv-sync i{width:11px;height:11px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:wvspin .7s linear infinite}
    @media(max-width:430px){.wv-header{padding:12px}.wv-user b{max-width:130px}.wv-zone-row{grid-template-columns:minmax(126px,.43fr) minmax(0,1fr)}.wv-zone{font-size:14px}.wv-table{min-width:98px}.wv-servicebar{padding:9px}.wv-servicebar-row{gap:5px}.wv-btn{padding:7px 8px}.wv-tabs{gap:4px}.wv-catalog{padding:9px}.wv-grid{gap:7px}.wv-product{padding:9px}.wv-search-row{grid-template-columns:1fr}.wv-search-meta{padding-left:2px}}
    @media(max-width:350px){.wv-header{grid-template-columns:1fr}.wv-user{text-align:left}.wv-user small{justify-content:flex-start}.wv-user b{max-width:none}.wv-zone-row{grid-template-columns:1fr}.wv-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.wv-grid{grid-template-columns:1fr}.wv-servicebar-row{grid-template-columns:1fr}.wv-product{min-height:145px}.wv-order-toggle{font-size:14px}}
    @media(min-width:700px){.wv-shell{padding-bottom:34px}.wv-header{padding:15px 18px}.wv-zone-row{grid-template-columns:210px minmax(0,1fr)}.wv-table{min-width:125px}.wv-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.wv-product{min-height:170px}.wv-order-toggle{left:auto;right:16px;width:min(430px,45vw);bottom:16px}.wv-order{left:auto;right:12px;width:min(440px,46vw);bottom:12px;max-height:calc(100dvh - 24px)}}
    @media(min-width:1100px){.wv-work{grid-template-columns:minmax(0,1.55fr) 400px;align-items:start}.wv-order{position:sticky;z-index:1;left:auto;right:auto;bottom:auto;top:90px;width:auto;max-height:calc(100dvh - 110px);transform:none;opacity:1;pointer-events:auto}.wv-order-toggle,.wv-backdrop,.wv-close{display:none!important}.wv-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
  <div class="wv-shell">
    <header class="wv-header">
      <span id="wvOnline" class="wv-online"></span>
      <div class="wv-brand"><small>VANTIXGC RESTAURANTE</small><b id="wvRestaurant">Mesero</b><span class="wv-persist">Dispositivo vinculado · acceso guardado</span></div>
      <div id="wvUserBox" class="wv-user"><small>Mesero conectado</small><b id="wvUser">—</b></div>
    </header>
    <div id="wvMessage"></div>
    <main id="wvApp"><section class="wv-card wv-loading"><div class="wv-spin"></div><b>Cargando panel del mesero…</b><span>Preparando zonas, mesas y carta.</span></section></main>
  </div>
  <button id="wvBackdrop" class="wv-backdrop" type="button" aria-label="Cerrar pedido"></button>
  <div id="wvSync" class="wv-sync"><i></i><span>Sincronizando…</span></div>
  <script src="/app/restaurant-theme.js?v=panel-font-v1"></script>
  <script src="/app/restaurant-waiter-runtime-v7.js?v=waiter-runtime-v8"></script>
  <script>
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/app/centro-de-control/sw.js',{scope:'/app/centro-de-control'}).catch(()=>{});
  </script>
</body>
</html>
