<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compras · VantixGC Super Core</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--line:#e4e4e7;--text:#18221d;--muted:#61706a;--green:#0d6b43;--soft:#ddf3e8;--danger:#b42318;--blue:#175cd3;--nav:#10241b;--nav2:#173429;--warn:#b54708}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--nav);color:white;padding:18px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;padding:5px 8px 20px;font-weight:850}.mark{width:34px;height:34px;border-radius:10px;background:white;color:var(--green);display:grid;place-items:center}.nav-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#92aa9f;padding:12px 10px 7px}.nav a{display:flex;gap:10px;padding:10px 11px;margin:3px 0;border-radius:10px;color:#dce8e3;text-decoration:none;font-size:14px}.nav a:hover,.nav a.active{background:var(--nav2);color:#fff}.main{min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0;z-index:10}.content{padding:24px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.pagehead h1{font-size:27px;margin:0 0 4px}.muted{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:750;text-decoration:none}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--danger);border-color:#fecaca;background:#fff7f7}.btn.small{font-size:12px;padding:6px 8px}.btn:disabled{opacity:.45;cursor:not-allowed}.input,.select,textarea{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:9px 10px;outline:none}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{background:#fafafa;color:#475467;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:10px 12px;border-bottom:1px solid #f0f1f2;vertical-align:middle}.money{text-align:right!important;font-variant-numeric:tabular-nums}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.draft{background:#f2f4f7;color:#475467}.issued{background:#ecfdf3;color:#027a48}.partial{background:#eff8ff;color:#175cd3}.paid{background:#e0f2fe;color:#075985}.cancelled{background:#fef3f2;color:#b42318}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;padding:15px}.filters>*{min-width:0}.empty{padding:42px;text-align:center;color:var(--muted)}.error,.notice{padding:11px 13px;border-radius:9px;margin-bottom:14px}.error{background:#fff1f0;border:1px solid #fecaca;color:#b42318}.notice{background:#f0f9f4;border:1px solid #bbdec9;color:#166534}.modal-back{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(1180px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:15px;border:1px solid var(--line);padding:20px}.modal h2{margin:0 0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.lines{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.line-head,.line{display:grid;grid-template-columns:2.3fr .65fr 1fr 1fr 1fr 42px;gap:8px;align-items:center;padding:9px 10px}.line-head{background:#fafafa;font-size:11px;font-weight:800;color:#475467}.line{border-top:1px solid #f0f1f2}.line input,.line select{width:100%}.totals{margin:16px 0 0 auto;width:min(460px,100%);border:1px solid var(--line);border-radius:12px;padding:14px}.total-row{display:flex;justify-content:space-between;padding:5px 0}.total-row.final{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-size:18px;font-weight:850}.ret-list{font-size:12px;color:var(--muted);margin-top:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.card{border:1px solid var(--line);border-radius:12px;padding:13px}.card small{color:var(--muted)}.card strong{display:block;margin-top:5px}.loading{padding:35px;text-align:center;color:var(--muted)}@media(max-width:900px){.app{display:block}.sidebar{display:none}.filters,.form-grid{grid-template-columns:1fr 1fr}.line-head{display:none}.line{grid-template-columns:1fr 1fr}.line>*:first-child{grid-column:span 2}.cards{grid-template-columns:1fr 1fr}}@media(max-width:600px){.content{padding:14px 9px}.pagehead{flex-direction:column}.filters,.form-grid,.cards{grid-template-columns:1fr}.line{grid-template-columns:1fr}.line>*:first-child{grid-column:auto}}
</style>
</head>
<body><div id="root"></div><div id="modalRoot"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sessionKey='vantixgc_core_session_v1';let session=null;try{session=JSON.parse(localStorage.getItem(sessionKey)||'null')}catch{}if(!session)location.replace('/app/login');
const st={suppliers:[],products:[],vats:[],purchases:[],meta:{},editing:null,lines:[],tax:null};
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]))}
function money(v){return new Intl.NumberFormat('es-CO',{style:'currency',currency:session?.tenant?.moneda||'COP',maximumFractionDigits:0}).format(Number(v||0))}
function dstr(v){return v?new Date(v).toISOString().slice(0,10):''}function date(v){return v?new Intl.DateTimeFormat('es-CO',{dateStyle:'medium'}).format(new Date(v)):'—'}
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{}),Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain};const r=await fetch(path,{...opts,headers});let b={};try{b=await r.json()}catch{}if(r.status===401){localStorage.removeItem(sessionKey);location.replace('/app/login');throw new Error('Sesión vencida')}if(!r.ok)throw new Error(b?.error?.message||b?.message||`Error HTTP ${r.status}`);return b}
function nav(href,icon,text,active=false){return `<a href="${href}" class="${active?'active':''}"><span>${icon}</span><span>${text}</span></a>`}
function shell(){return `<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">V</div><div>VantixGC<br><small style="color:#9db3a8;font-weight:500">Super Core</small></div></div><div class="nav-title">Navegación</div><nav class="nav">${nav('/app/dashboard','▦','Dashboard')}${nav('/app/ventas','🛒','Ventas')}${nav('/app/compras','🛍','Compras',true)}${nav('/app/inventario','▣','Inventarios / Kardex')}${nav('/app/tesoreria','🏦','Tesorería & Bancos')}${nav('/app/cartera','📑','Cartera')}${nav('/app/contabilidad','📒','Contabilidad')}${nav('/app/terceros','👥','Terceros')}${nav('/app/configuracion','⚙','Configuración')}</nav></aside><main class="main"><header class="topbar"><div><strong>${esc(session.tenant?.nombreEmpresa||session.subdomain)}</strong><div class="muted" style="font-size:12px">${esc(session.subdomain)}</div></div><div><strong>${esc(session.user?.nombre||'Usuario')}</strong> <button class="btn small" id="logout">Salir</button></div></header><section class="content"><div class="pagehead"><div><h1>Compras</h1><div class="muted">Borradores, emisión, Kardex, CxP y asiento AU en una sola operación.</div></div><button class="btn primary" id="newPurchase">+ Nueva compra</button></div><div id="flash"></div><div id="view"><div class="panel"><div class="loading">Cargando compras…</div></div></div></section></main></div>`}
function flash(msg,type='ok'){const el=$('#flash');if(el)el.innerHTML=`<div class="${type==='error'?'error':'notice'}">${esc(msg)}</div>`}
function badge(x){const map={BORRADOR:['Borrador','draft'],EMITIDO:['Emitida','issued'],PAGADO_PARCIAL:['Parcialmente pagada','partial'],PAGADO_TOTAL:['Pagada','paid'],ANULADO:['Anulada','cancelled']};const [t,c]=map[x]||[x,'draft'];return `<span class="badge ${c}">${esc(t)}</span>`}
function modal(html){$('#modalRoot').innerHTML=`<div class="modal-back"><div class="modal">${html}</div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
async function loadBase(){const [s,p,v]=await Promise.all([api('/api/v1/terceros?activo=true&limit=1000'),api('/api/v1/inventario/productos?activo=true&limit=1000'),api('/api/v1/contabilidad/impuestos/iva')]);st.suppliers=(s.data||[]).filter(x=>['PROVEEDOR','CLIENTE_PROVEEDOR'].includes(x.tipo));st.products=(p.data||[]).filter(x=>x.tipo==='PRODUCTO');st.vats=(v.data||[]).filter(x=>x.activa!==false)}
function supplierOptions(sel=''){return `<option value="">Seleccione proveedor</option>`+st.suppliers.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.identificacion)} · ${esc(x.razonSocial||x.nombre)}</option>`).join('')}
function productOptions(sel=''){return `<option value="">Seleccione producto</option>`+st.products.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.sku)} · ${esc(x.nombre)}</option>`).join('')}
function vatOptions(pct=0){return st.vats.map(v=>`<option value="${v.id}" data-pct="${Number(v.porcentaje)}" ${Number(v.porcentaje)===Number(pct)?'selected':''}>${esc(v.nombre)}${v.categoria==='EXCLUIDO'?' · Excluido':''}</option>`).join('')}
async function loadList(){const q=new URLSearchParams();const supplier=$('#fSupplier')?.value,state=$('#fState')?.value,from=$('#fFrom')?.value,to=$('#fTo')?.value;if(supplier)q.set('proveedorId',supplier);if(state)q.set('estado',state);if(from)q.set('desde',from);if(to)q.set('hasta',to);q.set('pageSize','200');const r=await api(`/api/v1/comercial/compras?${q}`);st.purchases=r.data||[];st.meta=r.meta||{};renderList()}
function renderList(){const rows=st.purchases.map(x=>{const canCancel=x.estado==='EMITIDO'&&Number(x.pagosAplicados||0)===0;const cancelTitle=Number(x.pagosAplicados||0)>0?'No se puede anular una compra con pagos aplicados. Reverse los pagos desde Tesorería primero.':'Anular compra';return `<tr><td><strong>${esc(x.numero)}</strong><div class="muted">${esc(x.referenciaExterna||'')}</div></td><td>${date(x.fecha)}</td><td>${esc(x.tercero?.razonSocial||x.tercero?.nombre||'—')}</td><td>${badge(x.estado)}</td><td class="money">${money(x.total)}</td><td class="money">${money(x.saldo)}</td><td><div class="toolbar"><button class="btn small" data-view="${x.id}">Ver</button>${x.estado==='BORRADOR'?`<button class="btn small" data-edit="${x.id}">Editar</button>`:''}${x.asiento?.id?`<button class="btn small" data-journal="${x.asiento.id}">Asiento AU</button>`:''}${x.estado==='EMITIDO'?`<button class="btn small danger" data-cancel="${x.id}" ${canCancel?'':`disabled title="${esc(cancelTitle)}"`}>Anular</button>`:''}</div></td></tr>`}).join('');$('#view').innerHTML=`<div class="panel"><div class="panel-head"><strong>Listado de Compras</strong><span class="muted">${st.meta.total??st.purchases.length} registros</span></div><div class="filters"><select class="select" id="fSupplier"><option value="">Todos los proveedores</option>${st.suppliers.map(x=>`<option value="${x.id}">${esc(x.razonSocial||x.nombre)}</option>`).join('')}</select><select class="select" id="fState"><option value="">Todos los estados</option><option>BORRADOR</option><option value="EMITIDA">EMITIDA</option><option value="PAGADA">PAGADA</option><option value="ANULADA">ANULADA</option></select><input class="input" id="fFrom" type="date"><input class="input" id="fTo" type="date"><button class="btn" id="filterBtn">Filtrar</button></div>${rows?`<div class="table-wrap"><table class="table"><thead><tr><th>Consecutivo / Factura proveedor</th><th>Fecha</th><th>Proveedor</th><th>Estado</th><th class="money">Total</th><th class="money">Saldo pendiente</th><th>Acciones</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No hay compras registradas.</div>'}</div>`;$('#filterBtn').onclick=loadList;$$('[data-view]').forEach(b=>b.onclick=()=>openDetail(b.dataset.view));$$('[data-edit]').forEach(b=>b.onclick=()=>openPurchaseForm(b.dataset.edit));$$('[data-journal]').forEach(b=>b.onclick=()=>openJournal(b.dataset.journal));$$('[data-cancel]').forEach(b=>b.onclick=()=>cancelPurchase(b.dataset.cancel))}
function newLine(x={}){return {productoId:x.productoId||'',cantidad:Number(x.cantidad||1),costoUnitario:Number(x.costoUnitario||0),ivaPct:Number(x.ivaPct||0)}}
function renderLines(){const el=$('#purchaseLines');if(!el)return;el.innerHTML=st.lines.map((l,i)=>`<div class="line" data-i="${i}"><select class="select product">${productOptions(l.productoId)}</select><input class="input qty" type="number" min="0.0001" step="0.0001" value="${l.cantidad}"><input class="input cost" type="number" min="0.01" step="0.01" value="${l.costoUnitario||''}"><select class="select vat">${vatOptions(l.ivaPct)}</select><div class="money lineTotal">${money(l.cantidad*l.costoUnitario*(1+l.ivaPct/100))}</div><button class="btn small danger rm" type="button">×</button></div>`).join('');bindLines();recalc()}
function bindLines(){$$('.line').forEach(row=>{const i=Number(row.dataset.i);row.querySelector('.product').onchange=e=>{st.lines[i].productoId=e.target.value};row.querySelector('.qty').oninput=e=>{st.lines[i].cantidad=Number(e.target.value||0);recalc()};row.querySelector('.cost').oninput=e=>{st.lines[i].costoUnitario=Number(e.target.value||0);recalc()};row.querySelector('.vat').onchange=e=>{st.lines[i].ivaPct=Number(e.target.selectedOptions[0]?.dataset.pct||0);recalc()};row.querySelector('.rm').onclick=()=>{st.lines.splice(i,1);renderLines()}})}
let taxTimer;function recalc(){let sub=0,iva=0;st.lines.forEach((l,i)=>{const s=Number(l.cantidad||0)*Number(l.costoUnitario||0),v=s*Number(l.ivaPct||0)/100;sub+=s;iva+=v;const row=$(`.line[data-i="${i}"] .lineTotal`);if(row)row.textContent=money(s+v)});if($('#sumSub')){$('#sumSub').textContent=money(sub);$('#sumIva').textContent=money(iva);$('#sumGross').textContent=money(sub+iva)}clearTimeout(taxTimer);taxTimer=setTimeout(()=>previewTax(sub,iva),250)}
async function previewTax(sub,iva){const supplierId=$('#pSupplier')?.value;if(!supplierId||sub<=0){st.tax=null;renderTax(sub,iva);return}try{const r=await api('/api/v1/contabilidad/impuestos/calcular',{method:'POST',body:JSON.stringify({terceroId:supplierId,tipoOperacion:'COMPRA',base:sub,ivaValue:iva})});st.tax=r.data;renderTax(sub,iva)}catch(e){st.tax=null;if($('#taxDetail'))$('#taxDetail').innerHTML=`<span style="color:var(--danger)">${esc(e.message)}</span>`}}
function renderTax(sub,iva){const rets=st.tax?.retenciones||[],rt=Number(st.tax?.totalRetenciones||0),net=sub+iva-rt;if($('#sumRet'))$('#sumRet').textContent=money(rt);if($('#sumNet'))$('#sumNet').textContent=money(net);if($('#taxDetail'))$('#taxDetail').innerHTML=rets.length?rets.map(r=>`${esc(r.codigo)} · ${esc(r.nombre)}: <strong>${money(r.valor)}</strong>`).join('<br>'):'Sin retenciones automáticas aplicables.'}
function syncForm(){st.lines=$$('.line').map(row=>({productoId:row.querySelector('.product').value,cantidad:Number(row.querySelector('.qty').value),costoUnitario:Number(row.querySelector('.cost').value),ivaPct:Number(row.querySelector('.vat').selectedOptions[0]?.dataset.pct||0)}));return {proveedorId:$('#pSupplier').value,fecha:$('#pDate').value,referenciaExterna:$('#pRef').value.trim(),condicionPagoDias:Number($('#pTerms').value),notas:$('#pNotes').value.trim()||null,detalles:st.lines}}
async function openPurchaseForm(id=null){let doc=null;if(id)doc=(await api(`/api/v1/comercial/compras/${id}`)).data;st.editing=id;st.lines=(doc?.detalles||[]).map(x=>newLine({productoId:x.productoId,cantidad:x.cantidad,costoUnitario:x.precioUnitario,ivaPct:x.ivaPct}));if(!st.lines.length)st.lines=[newLine()];const sup=doc?.terceroId||'',days=Number(doc?.condicionPagoDias??0);modal(`<h2>${id?'Editar compra en borrador':'Nueva compra'}</h2><div id="formError"></div><div class="form-grid"><div class="field"><label>Proveedor *</label><select class="select" id="pSupplier">${supplierOptions(sup)}</select><div id="supplierFlags" class="muted" style="font-size:11px;margin-top:5px"></div></div><div class="field"><label>Fecha *</label><input class="input" id="pDate" type="date" value="${dstr(doc?.fecha)||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Factura proveedor / referencia externa *</label><input class="input" id="pRef" value="${esc(doc?.referenciaExterna||'')}"></div><div class="field"><label>Condición de pago</label><select class="select" id="pTerms"><option value="0" ${days===0?'selected':''}>Contado</option><option value="30" ${days===30?'selected':''}>Crédito 30 días</option><option value="60" ${days===60?'selected':''}>Crédito 60 días</option>${![0,30,60].includes(days)?`<option value="${days}" selected>${days} días</option>`:''}</select></div></div><div class="toolbar" style="margin-top:14px"><strong>Productos</strong><button class="btn small" id="addLine">+ Agregar línea</button><button class="btn small" id="quickProduct">+ Crear producto</button></div><div class="lines"><div class="line-head"><div>Producto</div><div>Cantidad</div><div>Costo unitario</div><div>IVA</div><div class="money">Total línea</div><div></div></div><div id="purchaseLines"></div></div><div class="field" style="margin-top:14px"><label>Notas</label><textarea class="input" id="pNotes" rows="2">${esc(doc?.notasCompra||'')}</textarea></div><div class="totals"><div class="total-row"><span>Subtotal</span><strong id="sumSub">$0</strong></div><div class="total-row"><span>IVA</span><strong id="sumIva">$0</strong></div><div class="total-row"><span>Total bruto</span><strong id="sumGross">$0</strong></div><div class="total-row"><span>Retenciones</span><strong id="sumRet">$0</strong></div><div class="ret-list" id="taxDetail"></div><div class="total-row final"><span>Total neto a pagar</span><strong id="sumNet">$0</strong></div></div><div class="modal-actions"><button class="btn" id="cancelForm">Cancelar</button><button class="btn" id="saveDraft">Guardar borrador</button><button class="btn primary" id="emitPurchase">Emitir compra</button></div>`);$('#cancelForm').onclick=closeModal;$('#addLine').onclick=()=>{syncForm();st.lines.push(newLine());renderLines()};$('#quickProduct').onclick=openQuickProduct;$('#pSupplier').onchange=()=>{applySupplierDefault();recalc()};$('#saveDraft').onclick=()=>savePurchase(false);$('#emitPurchase').onclick=()=>savePurchase(true);renderLines();showSupplierFlags();if(!id)applySupplierDefault()}
function showSupplierFlags(){const s=st.suppliers.find(x=>x.id===$('#pSupplier')?.value),el=$('#supplierFlags');if(el)el.textContent=s?`ReteFuente: ${s.sujetoRetefuente?'Sí':'No'} · ReteICA: ${s.sujetoReteIca?'Sí':'No'} · ReteIVA: ${s.sujetoReteIva?'Sí':'No'}`:''}
function applySupplierDefault(){const s=st.suppliers.find(x=>x.id===$('#pSupplier')?.value);if(s&&$('#pTerms')){const d=Number(s.diasPlazo||0);if(![...$('#pTerms').options].some(o=>Number(o.value)===d))$('#pTerms').add(new Option(`${d} días`,String(d)));$('#pTerms').value=String(d)}showSupplierFlags()}
async function savePurchase(emitNow){try{const payload=syncForm();if(!payload.proveedorId)throw new Error('Seleccione un proveedor.');if(!payload.referenciaExterna)throw new Error('El número de factura del proveedor es obligatorio.');if(!payload.detalles.length||payload.detalles.some(x=>!x.productoId||x.cantidad<=0||x.costoUnitario<=0))throw new Error('Todas las líneas deben tener producto, cantidad y costo mayores que cero.');let id=st.editing;if(id)await api(`/api/v1/comercial/compras/${id}`,{method:'PATCH',body:JSON.stringify(payload)});else{id=(await api('/api/v1/comercial/compras',{method:'POST',body:JSON.stringify(payload)})).data.id;st.editing=id}if(emitNow)await api(`/api/v1/comercial/compras/${id}/emitir`,{method:'POST'});closeModal();flash(emitNow?'Compra emitida: asiento AU, Kardex y CxP sincronizados.':'Borrador guardado sin efectos contables.');await loadList()}catch(e){if($('#formError'))$('#formError').innerHTML=`<div class="error">${esc(e.message)}</div>`;else alert(e.message)}}
async function openQuickProduct(){try{syncForm();const sku=prompt('SKU del nuevo producto:');if(!sku)return;const nombre=prompt('Nombre del nuevo producto:');if(!nombre)return;const defaultVat=st.vats.find(v=>Number(v.porcentaje)===19)||st.vats[0];const r=await api('/api/v1/inventario/productos',{method:'POST',body:JSON.stringify({tipo:'PRODUCTO',sku:sku.trim(),nombre:nombre.trim(),unidadMedida:'UND',controlaInventario:true,costoPromedio:0,stockActual:0,precio1:0,ivaPct:Number(defaultVat?.porcentaje||0),impoconsumoPct:0,activo:true})});st.products.push(r.data);st.lines.push(newLine({productoId:r.data.id,ivaPct:r.data.ivaPct||0}));renderLines();flash('Producto creado y agregado a la compra.')}catch(e){alert(e.message)}}
async function openDetail(id){try{const x=(await api(`/api/v1/comercial/compras/${id}`)).data;const rows=(x.detalles||[]).map(l=>`<tr><td>${esc(l.producto?.sku||'')}</td><td>${esc(l.producto?.nombre||l.descripcion)}</td><td class="money">${Number(l.cantidad)}</td><td class="money">${money(l.precioUnitario)}</td><td class="money">${Number(l.ivaPct)}%</td><td class="money">${money(l.totalLinea)}</td></tr>`).join('');modal(`<h2>Compra ${esc(x.numero)}</h2><div class="cards"><div class="card"><small>Estado</small><strong>${badge(x.estado)}</strong></div><div class="card"><small>Factura proveedor</small><strong>${esc(x.referenciaExterna||'—')}</strong></div><div class="card"><small>Total</small><strong>${money(x.total)}</strong></div><div class="card"><small>Saldo</small><strong>${money(x.saldo)}</strong></div></div><p><strong>Proveedor:</strong> ${esc(x.tercero?.razonSocial||x.tercero?.nombre||'—')} · <strong>Fecha:</strong> ${date(x.fecha)} · <strong>Vence:</strong> ${date(x.fechaVencimiento)}</p><div class="table-wrap"><table class="table"><thead><tr><th>SKU</th><th>Producto</th><th class="money">Cantidad</th><th class="money">Costo</th><th class="money">IVA</th><th class="money">Total</th></tr></thead><tbody>${rows}</tbody></table></div><div class="totals"><div class="total-row"><span>Subtotal</span><strong>${money(x.subtotal)}</strong></div><div class="total-row"><span>IVA</span><strong>${money(x.ivaTotal)}</strong></div><div class="total-row"><span>Retenciones</span><strong>${money(x.retencionTotal)}</strong></div><div class="ret-list">${(x.retenciones||[]).map(r=>`${esc(r.codigo)}: ${money(r.valor)}`).join('<br>')||'Sin retenciones.'}</div><div class="total-row final"><span>Neto</span><strong>${money(x.netoPagar||x.total)}</strong></div></div><div class="modal-actions"><button class="btn" id="detailClose">Cerrar</button>${x.estado==='BORRADOR'?`<button class="btn" id="detailEdit">Editar</button><button class="btn primary" id="detailEmit">Emitir</button>`:''}${x.asiento?.id?`<button class="btn" id="detailJournal">Ver asiento AU</button>`:''}${x.estado==='EMITIDO'?`<button class="btn danger" id="detailCancel" ${x.pagosAplicados?'disabled title="No se puede anular una compra con pagos aplicados. Reverse los pagos desde Tesorería primero."':''}>Anular</button>`:''}</div>`);$('#detailClose').onclick=closeModal;if($('#detailEdit'))$('#detailEdit').onclick=()=>openPurchaseForm(id);if($('#detailEmit'))$('#detailEmit').onclick=async()=>{try{await api(`/api/v1/comercial/compras/${id}/emitir`,{method:'POST'});closeModal();flash('Compra emitida correctamente.');await loadList()}catch(e){alert(e.message)}};if($('#detailJournal'))$('#detailJournal').onclick=()=>openJournal(x.asiento.id);if($('#detailCancel'))$('#detailCancel').onclick=()=>cancelPurchase(id)}catch(e){alert(e.message)}}
async function openJournal(id){try{const j=(await api(`/api/v1/contabilidad/asientos/${id}`)).data;const rows=j.detalles.map(l=>`<tr><td>${esc(l.cuenta.codigo)} · ${esc(l.cuenta.nombre)}</td><td>${esc(l.tercero?.nombre||'—')}</td><td class="money">${money(l.debito)}</td><td class="money">${money(l.credito)}</td></tr>`).join('');modal(`<h2>Asiento ${esc(j.numeroComprobante||'AU')}</h2><div class="notice">Origen: ${esc(j.origen)} · Referencia: ${esc(j.referencia||'')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Cuenta</th><th>Tercero</th><th class="money">Débito</th><th class="money">Crédito</th></tr></thead><tbody>${rows}</tbody></table></div><div class="totals"><div class="total-row"><span>Débitos</span><strong>${money(j.totalDebito)}</strong></div><div class="total-row"><span>Créditos</span><strong>${money(j.totalCredito)}</strong></div></div><div class="modal-actions"><a class="btn" href="/app/contabilidad">Abrir Contabilidad</a><button class="btn" id="jClose">Cerrar</button></div>`);$('#jClose').onclick=closeModal}catch(e){alert(e.message)}}
async function cancelPurchase(id){const motivo=prompt('Motivo de anulación:');if(!motivo)return;try{await api(`/api/v1/comercial/compras/${id}/anular`,{method:'POST',body:JSON.stringify({motivo})});closeModal();flash('Compra anulada. Asiento, Kardex y Cartera fueron reversados.');await loadList()}catch(e){alert(e.message)}}
async function init(){document.querySelector('#root').innerHTML=shell();$('#logout').onclick=()=>{localStorage.removeItem(sessionKey);location.href='/app'};$('#newPurchase').onclick=()=>openPurchaseForm();try{await loadBase();await loadList()}catch(e){$('#view').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
init();
</script>
</body></html>
