<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido · VantixGC</title>
<style>:root{--bg:#f4f4f5;--card:#fff;--line:#e4e4e7;--text:#18221d;--muted:#61706a;--green:#0d6b43;--soft:#ddf3e8;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:680px;margin:auto;padding:18px}.head,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.head{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}.muted{color:var(--muted)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--green)}h1,h2{margin:0}.cat{margin:16px 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.price{font-weight:850}.actions{display:flex;align-items:center;gap:7px}.qty{width:62px;padding:8px;border:1px solid #d0d5dd;border-radius:9px}.btn,input,textarea,select{font:inherit}.btn{border:1px solid #d0d5dd;border-radius:10px;padding:9px 12px;background:#fff;font-weight:800;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}.field textarea{min-height:70px}.total{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:900;margin:14px 0}.notice{padding:12px;border-radius:11px;background:#eff8ff}.error{background:#fff1f0;color:var(--danger)}.success{background:#ecfdf3;color:#027a48}.hidden{display:none!important}@media(max-width:520px){.wrap{padding:10px}.item{grid-template-columns:1fr}.actions{justify-content:flex-end}}</style></head>
<body><div class="wrap"><div class="head"><div class="logo">V</div><div><h1 id="tenant">VantixGC</h1><div id="channel" class="muted">Cargando canal…</div><div class="chips"><span class="chip" id="kind">PEDIDO</span><span class="chip" id="tableChip"></span></div></div></div><div id="flash"></div><div class="card"><h2>Menú</h2><div id="menu"><div class="muted">Cargando…</div></div></div><div class="card"><h2>Tu pedido</h2><div id="cart" class="muted">Agrega productos del menú.</div><div id="customerFields"><div class="field"><label>Nombre</label><input id="customerName" maxlength="120" autocomplete="name"></div><div class="field"><label>Teléfono</label><input id="customerPhone" maxlength="40" inputmode="tel" autocomplete="tel"></div><div class="field hidden" id="addressWrap"><label>Dirección de entrega</label><input id="deliveryAddress" maxlength="300" autocomplete="street-address"></div><div class="field"><label>Observaciones</label><textarea id="notes" maxlength="500"></textarea></div><div class="field"><label>Forma de pago</label><select id="paymentMode"><option value="CASH">Efectivo</option><option value="MANUAL_EXTERNAL_PENDING">Pago externo / transferencia pendiente de confirmar</option></select></div></div><div class="total"><span>Total estimado</span><span id="total">$0</span></div><button id="submit" class="btn primary">Confirmar pedido</button></div></div>
<script>
const token=location.pathname.split('/').filter(Boolean).pop();let ctx=null;const cart=new Map();const money=v=>new Intl.NumberFormat('es-CO',{style:'currency',currency:ctx?.tenant?.moneda||'COP',maximumFractionDigits:0}).format(Number(v||0));const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]));async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let b={};try{b=await r.json()}catch{}if(!r.ok)throw new Error(b?.error?.message||b?.message||`HTTP ${r.status}`);return b}function flash(t,type='notice'){document.querySelector('#flash').innerHTML=`<div class="notice ${type}">${esc(t)}</div>`;if(type!=='success')setTimeout(()=>document.querySelector('#flash').innerHTML='',7000)}function calcLine(item,q){const p=item.product,s=Number(p.price||0)*q;return s+s*Number(p.ivaPct||0)/100+s*Number(p.impoconsumoPct||0)/100}function renderCart(){const rows=[...cart.values()].filter(x=>x.quantity>0);if(!rows.length){document.querySelector('#cart').innerHTML='<span class="muted">Agrega productos del menú.</span>';document.querySelector('#total').textContent=money(0);return}let sum=0;document.querySelector('#cart').innerHTML=rows.map(x=>{const item=ctx.menu.find(m=>m.id===x.menuItemId);const line=calcLine(item,x.quantity);sum+=line;return `<div class="item"><div><strong>${esc(item.product.name)}</strong><div class="muted">${x.quantity} × ${money(item.product.price)}</div></div><strong>${money(line)}</strong></div>`}).join('');document.querySelector('#total').textContent=money(sum)}function renderMenu(){const available=(ctx.menu||[]).filter(x=>x.available&&x.product);const groups=new Map();for(const item of available){if(!groups.has(item.category))groups.set(item.category,[]);groups.get(item.category).push(item)}document.querySelector('#menu').innerHTML=[...groups.entries()].map(([cat,items])=>`<div class="cat">${esc(cat)}</div>${items.map(item=>`<div class="item"><div><strong>${esc(item.product.name)}</strong><div class="muted">${esc(item.station)}</div><div class="price">${money(item.product.price)}</div></div><div class="actions"><input class="qty" id="q-${item.id}" type="number" min="1" max="999" value="1"><button class="btn" data-add="${item.id}">Agregar</button></div></div>`).join('')}`).join('')||'<div class="muted">No hay productos disponibles.</div>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const id=b.dataset.add,q=Math.max(1,Number(document.querySelector(`#q-${id}`).value||1));const current=cart.get(id)||{menuItemId:id,quantity:0};current.quantity+=q;cart.set(id,current);renderCart()})}async function load(){const r=await api(`/edge/remote/${encodeURIComponent(token)}/context`);ctx=r.data;tenant.textContent=ctx.tenant?.nombreEmpresa||'VantixGC';channel.textContent=ctx.channel?.name||ctx.channel?.type||'Pedido';kind.textContent=ctx.channel?.type||'PEDIDO';tableChip.textContent=ctx.channel?.table?.name||'';tableChip.classList.toggle('hidden',!ctx.channel?.table);addressWrap.classList.toggle('hidden',ctx.channel?.type!=='DOMICILIO');renderMenu();renderCart()}submit.onclick=async()=>{try{const items=[...cart.values()].filter(x=>x.quantity>0);if(!items.length)throw new Error('Agrega al menos un producto.');if(ctx.channel.type==='DOMICILIO'&&!deliveryAddress.value.trim())throw new Error('Escribe la dirección de entrega.');submit.disabled=true;const r=await api(`/edge/remote/${encodeURIComponent(token)}/orders`,{method:'POST',body:JSON.stringify({customerName:customerName.value.trim()||null,customerPhone:customerPhone.value.trim()||null,deliveryAddress:deliveryAddress.value.trim()||null,notes:notes.value.trim()||null,paymentMode:paymentMode.value,items})});cart.clear();renderCart();const state=r.data.state==='PENDING_CONFIRMATION'?'Pendiente de confirmación del restaurante':'Recibido por el restaurante';flash(`Pedido ${state}. Código: ${r.data.id.slice(0,8).toUpperCase()}`,'success')}catch(e){flash(e.message,'error')}finally{submit.disabled=false}};load().catch(e=>flash(e.message,'error'));
</script></body></html>
