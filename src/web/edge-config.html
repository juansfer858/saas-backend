<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edge Agents · VantixGC</title>
<style>body{font-family:Inter,system-ui,sans-serif;background:#f4f4f5;color:#18221d;margin:0}main{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,textarea,button{font:inherit;padding:9px 10px;border-radius:9px;border:1px solid #d0d5dd}textarea{width:100%;min-height:70px}button{cursor:pointer;font-weight:700}.primary{background:#0d6b43;color:#fff;border-color:#0d6b43}.danger{color:#b42318}.muted{color:#61706a}.ok{color:#027a48}.bad{color:#b42318}.warn{color:#b54708}.key{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;word-break:break-all}.policy-note{padding:11px;background:#fffaeb;border:1px solid #fedf89;border-radius:9px;margin:10px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee;font-size:13px;vertical-align:top}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#f2f4f7;font-size:11px;font-weight:800}.toolbar{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}</style></head>
<body><main><div class="top"><div><h1>Edge Offline-First</h1><div class="muted">Puntos de venta, política de contingencia y alertas de reconciliación.</div></div><a href="/app/configuracion-avanzada">← Configuración</a></div><div id="flash"></div>
<div class="card"><h3>Política de cobro durante caída de Internet</h3><div class="grid"><select id="policy"><option value="CASH_ONLY">A · Solo efectivo</option><option value="MANUAL_EXTERNAL_PENDING">B · Datáfono/QR externo pendiente de confirmar</option><option value="PAUSE_SALES">C · Pausar nuevas ventas</option></select><div style="grid-column:span 3"><textarea id="manualNote" placeholder="Instrucción opcional al cajero, ej. Conserve el voucher del datáfono para conciliarlo al volver la conexión."></textarea></div></div><div id="policyHelp" class="policy-note"></div><button class="primary" id="savePolicy">Guardar política</button></div>
<div class="card"><h3>Provisionar punto</h3><div class="grid"><input id="name" placeholder="Nombre del punto"><input id="code" placeholder="Código, ej. CAJA-01"><select id="customer"><option value="">Cliente por defecto automático</option></select><select id="cash"><option value="">Caja por defecto automática</option></select></div><p><button class="primary" id="create">Crear Edge Agent</button></p><div id="secret"></div></div>
<div class="card"><h3>Agentes</h3><div id="agents"></div></div>
<div class="card"><div class="top"><div><h3>Alertas de reconciliación</h3><div class="muted">CONFIG_DRIFT y NEGATIVE_STOCK viven en esta misma bandeja.</div></div><select id="alertState"><option value="OPEN">Abiertas</option><option value="ACKNOWLEDGED">Revisadas</option><option value="">Todas</option></select></div><div id="alerts"></div></div></main>
<script>
const sessionKey='vantixgc_core_session_v1';let session=null;try{session=JSON.parse(localStorage.getItem(sessionKey)||'null')}catch{}if(!session)location.replace('/app/login');
const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]));
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain,...(opts.headers||{})}});let b={};try{b=await r.json()}catch{}if(!r.ok)throw new Error(b?.error?.message||b?.message||`HTTP ${r.status}`);return b}
function msg(t,e=false){document.querySelector('#flash').innerHTML=`<div class="card ${e?'bad':'ok'}">${esc(t)}</div>`;setTimeout(()=>document.querySelector('#flash').innerHTML='',6000)}
function policyCopy(v){return v==='CASH_ONLY'?'<strong>Solo efectivo:</strong> al quedar offline la UI deshabilita otros medios y dice claramente que solo se acepta efectivo.':v==='MANUAL_EXTERNAL_PENDING'?'<strong>Registro manual:</strong> se puede usar un datáfono/QR externo independiente. El Core no inventa autorización: sincroniza la venta como CxC pendiente para confirmar después desde Tesorería.':'<strong>Pausa:</strong> si el Edge no puede confirmar conexión con el Core, no permite nuevas ventas.'}function renderPolicyHelp(){policyHelp.innerHTML=policyCopy(policy.value);manualNote.disabled=policy.value!=='MANUAL_EXTERNAL_PENDING'}
async function loadPolicy(){const r=await api('/api/v1/edge/policy');policy.value=r.data.paymentPolicy||'CASH_ONLY';manualNote.value=r.data.manualPaymentNote||'';renderPolicyHelp()}
async function loadBase(){const [t,c]=await Promise.all([api('/api/v1/terceros?activo=true&limit=1000'),api('/api/v1/tesoreria/cajas-bancos')]);for(const x of (t.data||[]).filter(x=>['CLIENTE','CLIENTE_PROVEEDOR'].includes(x.tipo)))customer.insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.identificacion)} · ${esc(x.razonSocial||x.nombre)}</option>`);for(const x of (c.data||[]).filter(x=>x.activo!==false))cash.insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.nombre)} · ${esc(x.tipo)}</option>`)}
async function loadAgents(){const r=await api('/api/v1/edge/agents');const rows=(r.data||[]).map(x=>`<tr><td>${esc(x.pointCode)}</td><td>${esc(x.name)}</td><td>${x.state==='ACTIVE'?'<span class="ok">ACTIVO</span>':'<span class="bad">REVOCADO</span>'}</td><td>${x.lastSeenAt?new Date(x.lastSeenAt).toLocaleString():'—'}</td><td>${x.lastSyncAt?new Date(x.lastSyncAt).toLocaleString():'—'}</td><td>${x.state==='ACTIVE'?`<button onclick="rotate('${x.id}')">Rotar clave</button> <button class="danger" onclick="revoke('${x.id}')">Revocar</button>`:''}</td></tr>`).join('');agents.innerHTML=`<table><thead><tr><th>Punto</th><th>Nombre</th><th>Estado</th><th>Última señal</th><th>Última sync</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6">Sin agentes.</td></tr>'}</tbody></table>`}
function driftDetails(x){if(x.type!=='CONFIG_DRIFT'||!x.details)return '';const c=x.details.captured||{},n=x.details.current||{};return `<div class="muted">Capturado: ${Number(c.precio||0).toLocaleString('es-CO')} · IVA ${Number(c.ivaPct||0)}% &nbsp;→&nbsp; Actual: ${Number(n.precio||0).toLocaleString('es-CO')} · IVA ${Number(n.ivaPct||0)}%</div>`}
async function loadAlerts(){const q=new URLSearchParams();if(alertState.value)q.set('state',alertState.value);const r=await api('/api/v1/edge/alerts?'+q);const rows=(r.data||[]).map(x=>`<tr><td><span class="tag">${esc(x.type)}</span></td><td>${esc(x.agent?.pointCode)}</td><td>${esc(x.message)}${driftDetails(x)}</td><td>${x.state==='OPEN'?'<span class="warn">ABIERTA</span>':'<span class="ok">REVISADA</span>'}<br>${x.acknowledgedAt?new Date(x.acknowledgedAt).toLocaleString():''}</td><td>${new Date(x.creadoEn).toLocaleString()}</td><td><div class="toolbar">${x.state==='OPEN'?`<button onclick="ack('${x.id}')">Revisada, sin acción</button>`:''}${x.type==='CONFIG_DRIFT'?`<button onclick="location.href='/app/contabilidad'">Ajuste manual en Contabilidad</button>`:''}</div></td></tr>`).join('');alerts.innerHTML=`<table><thead><tr><th>Tipo</th><th>Punto</th><th>Detalle</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>${rows||'<tr><td colspan="6">Sin alertas para este filtro.</td></tr>'}</tbody></table>`}
policy.onchange=renderPolicyHelp;alertState.onchange=loadAlerts;savePolicy.onclick=async()=>{try{await api('/api/v1/edge/policy',{method:'PUT',body:JSON.stringify({paymentPolicy:policy.value,manualPaymentNote:manualNote.value.trim()||null})});msg('Política offline guardada. Los Edge la recibirán en su próxima sincronización.');await loadPolicy()}catch(e){msg(e.message,true)}};
create.onclick=async()=>{try{const body={name:name.value.trim(),pointCode:code.value.trim(),defaultCustomerId:customer.value||null,defaultCashAccountId:cash.value||null};const r=await api('/api/v1/edge/agents',{method:'POST',body:JSON.stringify(body)});secret.innerHTML=`<div class="key"><strong>EDGE_AGENT_ID</strong>: ${esc(r.data.id)}<br><strong>EDGE_AGENT_KEY</strong>: ${esc(r.data.edgeKey)}<br><small>Guárdelos ahora. La clave no vuelve a mostrarse.</small></div>`;name.value='';code.value='';await loadAgents()}catch(e){msg(e.message,true)}};
window.revoke=async id=>{if(!confirm('¿Revocar este punto? Dejará de sincronizar inmediatamente.'))return;try{await api(`/api/v1/edge/agents/${id}/revoke`,{method:'POST'});await loadAgents();msg('Edge Agent revocado.')}catch(e){msg(e.message,true)}};
window.rotate=async id=>{try{const r=await api(`/api/v1/edge/agents/${id}/rotate-key`,{method:'POST'});secret.innerHTML=`<div class="key"><strong>Nueva EDGE_AGENT_KEY</strong>: ${esc(r.data.edgeKey)}<br><small>Actualice el equipo local. La clave anterior dejó de funcionar.</small></div>`}catch(e){msg(e.message,true)}};
window.ack=async id=>{try{await api(`/api/v1/edge/alerts/${id}/ack`,{method:'POST'});await loadAlerts();msg('Alerta marcada como revisada. La acción quedó en auditoría.')}catch(e){msg(e.message,true)}};
(async()=>{try{await Promise.all([loadBase(),loadPolicy()]);await Promise.all([loadAgents(),loadAlerts()])}catch(e){msg(e.message,true)}})();
</script></body></html>
