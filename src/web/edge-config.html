<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edge Agents · VantixGC</title>
<style>body{font-family:Inter,system-ui,sans-serif;background:#f4f4f5;color:#18221d;margin:0}main{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,button{font:inherit;padding:9px 10px;border-radius:9px;border:1px solid #d0d5dd}button{cursor:pointer;font-weight:700}.primary{background:#0d6b43;color:#fff;border-color:#0d6b43}.danger{color:#b42318}.muted{color:#61706a}.ok{color:#027a48}.bad{color:#b42318}.key{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;word-break:break-all}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}</style></head>
<body><main><div class="top"><div><h1>Edge Agents</h1><div class="muted">Puntos de venta offline-first. La clave solo se muestra al crear o rotar.</div></div><a href="/app/configuracion-avanzada">← Configuración</a></div><div id="flash"></div>
<div class="card"><h3>Provisionar punto</h3><div class="grid"><input id="name" placeholder="Nombre del punto"><input id="code" placeholder="Código, ej. CAJA-01"><select id="customer"><option value="">Cliente por defecto automático</option></select><select id="cash"><option value="">Caja por defecto automática</option></select></div><p><button class="primary" id="create">Crear Edge Agent</button></p><div id="secret"></div></div>
<div class="card"><h3>Agentes</h3><div id="agents"></div></div><div class="card"><h3>Alertas de reconciliación</h3><div id="alerts"></div></div></main>
<script>
const sessionKey='vantixgc_core_session_v1';let session=null;try{session=JSON.parse(localStorage.getItem(sessionKey)||'null')}catch{}if(!session)location.replace('/app/login');
const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]));
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain,...(opts.headers||{})}});let b={};try{b=await r.json()}catch{}if(!r.ok)throw new Error(b?.error?.message||b?.message||`HTTP ${r.status}`);return b}
function msg(t,e=false){document.querySelector('#flash').innerHTML=`<div class="card ${e?'bad':'ok'}">${esc(t)}</div>`}
async function loadBase(){const [t,c]=await Promise.all([api('/api/v1/terceros?activo=true&limit=1000'),api('/api/v1/tesoreria/cajas-bancos')]);for(const x of (t.data||[]).filter(x=>['CLIENTE','CLIENTE_PROVEEDOR'].includes(x.tipo)))customer.insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.identificacion)} · ${esc(x.razonSocial||x.nombre)}</option>`);for(const x of (c.data||[]).filter(x=>x.activo!==false))cash.insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.nombre)} · ${esc(x.tipo)}</option>`)}
async function loadAgents(){const r=await api('/api/v1/edge/agents');const rows=(r.data||[]).map(x=>`<tr><td>${esc(x.pointCode)}</td><td>${esc(x.name)}</td><td>${x.state==='ACTIVE'?'<span class="ok">ACTIVO</span>':'<span class="bad">REVOCADO</span>'}</td><td>${x.lastSeenAt?new Date(x.lastSeenAt).toLocaleString():'—'}</td><td>${x.lastSyncAt?new Date(x.lastSyncAt).toLocaleString():'—'}</td><td>${x.state==='ACTIVE'?`<button onclick="rotate('${x.id}')">Rotar clave</button> <button class="danger" onclick="revoke('${x.id}')">Revocar</button>`:''}</td></tr>`).join('');agents.innerHTML=`<table><thead><tr><th>Punto</th><th>Nombre</th><th>Estado</th><th>Última señal</th><th>Última sync</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6">Sin agentes.</td></tr>'}</tbody></table>`}
async function loadAlerts(){const r=await api('/api/v1/edge/alerts?state=OPEN');const rows=(r.data||[]).map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.agent?.pointCode)}</td><td>${esc(x.message)}</td><td>${new Date(x.creadoEn).toLocaleString()}</td><td><button onclick="ack('${x.id}')">Reconocer</button></td></tr>`).join('');alerts.innerHTML=`<table><thead><tr><th>Tipo</th><th>Punto</th><th>Detalle</th><th>Fecha</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5">Sin alertas abiertas.</td></tr>'}</tbody></table>`}
create.onclick=async()=>{try{const body={name:name.value.trim(),pointCode:code.value.trim(),defaultCustomerId:customer.value||null,defaultCashAccountId:cash.value||null};const r=await api('/api/v1/edge/agents',{method:'POST',body:JSON.stringify(body)});secret.innerHTML=`<div class="key"><strong>EDGE_AGENT_ID</strong>: ${esc(r.data.id)}<br><strong>EDGE_AGENT_KEY</strong>: ${esc(r.data.edgeKey)}<br><small>Guárdelos ahora. La clave no vuelve a mostrarse.</small></div>`;name.value='';code.value='';await loadAgents()}catch(e){msg(e.message,true)}};
window.revoke=async id=>{if(!confirm('¿Revocar este punto? Dejará de sincronizar inmediatamente.'))return;try{await api(`/api/v1/edge/agents/${id}/revoke`,{method:'POST'});await loadAgents();msg('Edge Agent revocado.')}catch(e){msg(e.message,true)}};
window.rotate=async id=>{try{const r=await api(`/api/v1/edge/agents/${id}/rotate-key`,{method:'POST'});secret.innerHTML=`<div class="key"><strong>Nueva EDGE_AGENT_KEY</strong>: ${esc(r.data.edgeKey)}<br><small>Actualice el equipo local. La clave anterior dejó de funcionar.</small></div>`}catch(e){msg(e.message,true)}};
window.ack=async id=>{try{await api(`/api/v1/edge/alerts/${id}/ack`,{method:'POST'});await loadAlerts()}catch(e){msg(e.message,true)}};
(async()=>{try{await loadBase();await Promise.all([loadAgents(),loadAlerts()])}catch(e){msg(e.message,true)}})();
</script></body></html>
