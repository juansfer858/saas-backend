<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<link rel="manifest" href="/app/produccion/manifest.webmanifest">
<title>VantixGC Producción</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#10233f;--muted:#64748b;--line:#d8e0ea;--green:#137a53;--green-soft:#ecfdf5;--amber:#b45309;--amber-soft:#fff7ed;--red:#b42318;--red-soft:#fff1f0;--blue:#1d4ed8;--blue-soft:#eff6ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button{font:inherit}.app{min-height:100vh;padding:12px}.top{position:sticky;top:0;z-index:20;margin-bottom:10px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 5px 20px rgba(15,23,42,.08);display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px}.mark{width:39px;height:39px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:950}.title small{display:block;font-size:9px;font-weight:900;letter-spacing:.12em;color:var(--muted)}.title b{display:block;font-size:22px}.push{margin-left:auto}.pill{padding:7px 10px;border-radius:999px;background:var(--green-soft);color:#166534;font-size:11px;font-weight:900}.toolbar{display:flex;gap:7px;align-items:center}.btn{border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--text);min-height:42px;padding:8px 11px;font-weight:850;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:8px;margin-bottom:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px}.stat small{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.stat b{display:block;margin-top:4px;font-size:22px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.lane{min-height:calc(100vh - 176px);border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}.lane>header{display:flex;align-items:center;gap:8px;padding:12px 13px;border-bottom:1px solid var(--line);background:#fbfdff}.lane>header h2{margin:0;font-size:15px}.lane>header span{margin-left:auto;padding:4px 7px;border-radius:999px;background:#f1f5f9;color:var(--muted);font-size:10px;font-weight:900}.scroll{padding:9px;display:grid;gap:9px;align-content:start}.ticket{border:1px solid var(--line);border-left:5px solid #94a3b8;border-radius:13px;padding:11px;background:#fff;box-shadow:0 3px 10px rgba(15,23,42,.05)}.ticket.PENDIENTE{border-left-color:var(--amber);background:linear-gradient(90deg,var(--amber-soft),#fff 22%)}.ticket.EN_PREPARACION{border-left-color:var(--blue);background:linear-gradient(90deg,var(--blue-soft),#fff 22%)}.ticket.LISTA{border-left-color:var(--green);background:linear-gradient(90deg,var(--green-soft),#fff 22%)}.ticket.late{outline:2px solid #fca5a5;animation:latePulse 1.3s ease-in-out infinite}@keyframes latePulse{50%{box-shadow:0 0 0 5px rgba(239,68,68,.12)}}.ticket-head{display:flex;justify-content:space-between;gap:9px;align-items:flex-start}.ticket-head b{font-size:16px}.ticket-head small{display:block;color:var(--muted);margin-top:2px}.stamp{font-size:9px;font-weight:950;letter-spacing:.04em;padding:5px 7px;border-radius:999px;background:#f1f5f9;white-space:nowrap}.items{margin-top:9px;border-top:1px dashed #dbe2ea}.item{padding:8px 0;border-bottom:1px dashed #e6ebf1;font-size:14px}.item:last-child{border-bottom:0}.item strong{font-size:15px}.note{display:block;margin-top:4px;padding:6px 8px;border-radius:8px;background:#fff7ed;color:#9a3412;font-size:12px;font-weight:800}.actions{display:flex;gap:7px;margin-top:10px}.actions .btn{flex:1}.empty{min-height:240px;display:grid;place-items:center;text-align:center;padding:25px;color:var(--muted);border:1px dashed #cbd5e1;border-radius:12px}.empty b{display:block;color:var(--text);margin-bottom:4px}.fatal{max-width:620px;margin:10vh auto;padding:24px;border:1px solid #fecaca;border-radius:18px;background:#fff;color:var(--red);text-align:center}.fatal .btn{margin-top:12px}.hidden{display:none!important}@media(max-width:950px){.board{grid-template-columns:1fr}.lane{min-height:auto}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.app{padding:7px}.top{border-radius:12px;padding:9px}.title b{font-size:18px}.toolbar{width:100%}.toolbar .btn{flex:1}.stats{grid-template-columns:repeat(2,1fr)}.push{margin-left:auto}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><div class="mark">V</div><div class="title"><small>VANTIXGC RESTAURANTES · PRODUCCIÓN</small><b id="stationTitle">Cargando…</b></div></div>
    <span class="pill push" id="connection">EN VIVO</span>
    <div class="toolbar"><button type="button" class="btn" id="sound">🔊 Sonido ON</button><button type="button" class="btn" id="refresh">↻ Actualizar</button><button type="button" class="btn" id="fullscreen">⛶ Pantalla completa</button></div>
  </header>
  <section class="stats"><div class="stat"><small>Pendientes</small><b id="statPending">0</b></div><div class="stat"><small>En preparación</small><b id="statPreparing">0</b></div><div class="stat"><small>Listas</small><b id="statReady">0</b></div><div class="stat"><small>Tiempo prom.</small><b id="statAge">0 min</b></div></section>
  <main class="board" id="board"></main>
</div>
<div id="fatal" class="fatal hidden"><h2>Tablet no vinculada</h2><p id="fatalText">Genera un QR desde Administración → Empleados y vincula esta tablet.</p><button type="button" class="btn" id="retry">Reintentar</button></div>
<script>
(() => {
  'use strict';
  const MARKER='VANTIX_RESTAURANT_PRODUCTION_TABLET_V63';
  const STORAGE_KEY='vantixgc_restaurant_production_device_v63';
  const SOUND_KEY='vantixgc_restaurant_production_sound_v63';
  const ACTIVE_STATES=['PENDIENTE','EN_PREPARACION','LISTA'];
  const POLL_MS=2000;
  let session=null,rows=[],known=new Set(),timer=null,loading=false;
  let soundEnabled=localStorage.getItem(SOUND_KEY)!=='off';
  let audioUnlocked=false;
  const $=(id)=>document.getElementById(id);
  const esc=(v)=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const roleLabel=(role)=>role==='COCINA'?'COCINA':role==='BARRA'?'BARRA':role==='POSTRES'?'POSTRES':'PRODUCCIÓN';
  const stationIcon=(role)=>role==='COCINA'?'♨':role==='BARRA'?'▥':'◇';
  function readSession(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch{return null}}
  function ageMinutes(row){const time=new Date(row?.creadoEn||0).getTime();return time?Math.max(0,Math.floor((Date.now()-time)/60000)):0}
  function ageLabel(row){const m=ageMinutes(row);if(m<1)return'ahora';if(m<60)return`${m} min`;return`${Math.floor(m/60)} h ${m%60} min`}
  function commandItems(command){return (command.order?.items||[]).filter(item=>!item.station||item.station===command.station)}
  function tableName(command){return command.order?.session?.table?.name||'Mesa'}
  function showFatal(text){clearTimeout(timer);$('app').classList.add('hidden');$('fatal').classList.remove('hidden');$('fatalText').textContent=text||'Genera un QR desde Administración → Empleados y vincula esta tablet.'}
  function ensureSession(){session=readSession();if(!session?.token||!session?.subdomain||!['COCINA','BARRA','POSTRES'].includes(String(session.user?.rol||session.station||'').toUpperCase())){showFatal('Esta tablet no tiene una vinculación válida de Cocina, Barra o Postres.');return false}return true}
  async function api(path,options={}){
    const response=await fetch(path,{...options,cache:'no-store',headers:{Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain,'Content-Type':'application/json',...(options.headers||{})}});
    let body={};try{body=await response.json()}catch{}
    if(response.status===401||response.status===403){localStorage.removeItem(STORAGE_KEY);throw Object.assign(new Error(body?.error?.message||'Esta tablet fue desautorizada. Vincúlala otra vez desde Administración.'),{terminal:true})}
    if(!response.ok)throw new Error(body?.error?.message||body?.message||`HTTP ${response.status}`);
    return body.data;
  }
  function unlockAudio(){if(audioUnlocked)return;try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=new Ctx();ctx.resume?.();const osc=ctx.createOscillator(),gain=ctx.createGain();gain.gain.value=.0001;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.01);osc.onended=()=>ctx.close?.();audioUnlocked=true}catch{}}
  function beep(){if(!soundEnabled)return;try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=new Ctx(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=880;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.16,ctx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.25);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.28);osc.onended=()=>ctx.close?.()}catch{}}
  function lane(state,label,list){return `<section class="lane"><header><h2>${state==='PENDIENTE'?'●':state==='EN_PREPARACION'?'♨':'✓'} ${label}</h2><span>${list.length} comanda(s)</span></header><div class="scroll">${list.length?list.map(ticket).join(''):`<div class="empty"><div><b>Sin comandas ${label.toLowerCase()}</b><span>Los nuevos pedidos de ${esc(roleLabel(session.user?.rol).toLowerCase())} aparecerán aquí automáticamente.</span></div></div>`}</div></section>`}
  function ticket(command){const state=String(command.state||'');const age=ageMinutes(command);const late=['PENDIENTE','EN_PREPARACION'].includes(state)&&age>=12;let action='';if(state==='PENDIENTE')action=`<button class="btn primary" data-command="${esc(command.id)}" data-state="EN_PREPARACION">TOMAR</button>`;if(state==='EN_PREPARACION')action=`<button class="btn primary" data-command="${esc(command.id)}" data-state="LISTA">✓ MARCAR LISTO</button>`;if(state==='LISTA')action=`<button class="btn" data-command="${esc(command.id)}" data-state="ENTREGADA">MARCAR ENTREGADO</button>`;return `<article class="ticket ${esc(state)} ${late?'late':''}" data-ticket="${esc(command.id)}"><div class="ticket-head"><div><b>${esc(tableName(command))}</b><small>${esc(command.order?.source==='QR'?'Cliente · QR':command.waiter?.nombre||'Mesero')} · ${esc(ageLabel(command))}</small></div><span class="stamp">${esc(state.replaceAll('_',' '))}</span></div><div class="items">${commandItems(command).map(item=>`<div class="item"><strong>${esc(item.quantity)}×</strong> ${esc(item.description||'Producto')}${item.notes?`<span class="note">NOTA: ${esc(item.notes)}</span>`:''}</div>`).join('')||'<div class="item">Sin productos visibles.</div>'}</div><div class="actions">${action}</div></article>`}
  function render(){const visible=rows.filter(row=>ACTIVE_STATES.includes(String(row.state||'')));const pending=visible.filter(r=>r.state==='PENDIENTE'),preparing=visible.filter(r=>r.state==='EN_PREPARACION'),ready=visible.filter(r=>r.state==='LISTA');$('statPending').textContent=pending.length;$('statPreparing').textContent=preparing.length;$('statReady').textContent=ready.length;$('statAge').textContent=(visible.length?Math.round(visible.reduce((s,r)=>s+ageMinutes(r),0)/visible.length):0)+' min';$('board').innerHTML=lane('PENDIENTE','Pendientes',pending)+lane('EN_PREPARACION','En preparación',preparing)+lane('LISTA','Listas',ready);document.querySelectorAll('[data-command]').forEach(button=>button.addEventListener('click',()=>setState(button.dataset.command,button.dataset.state,button)))}
  async function load({manual=false}={}){if(loading)return;loading=true;try{const next=await api('/api/v1/restaurante/comandas?limit=200');const relevant=(Array.isArray(next)?next:[]).filter(row=>ACTIVE_STATES.includes(String(row.state||'')));const currentIds=new Set(relevant.map(row=>row.id));if(known.size&&[...currentIds].some(id=>!known.has(id)))beep();known=currentIds;rows=relevant;$('connection').textContent='EN VIVO · '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});$('connection').style.background='var(--green-soft)';render()}catch(error){if(error.terminal)return showFatal(error.message);$('connection').textContent='SIN CONEXIÓN · reintentando';$('connection').style.background='var(--amber-soft)';if(manual)alert(error.message)}finally{loading=false;schedule()}}
  function schedule(){clearTimeout(timer);timer=setTimeout(()=>load().catch(()=>{}),POLL_MS)}
  async function setState(id,state,button){unlockAudio();button.disabled=true;try{await api('/api/v1/restaurante/comandas/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({state})});await load({manual:true})}catch(error){if(error.terminal)return showFatal(error.message);alert(error.message);button.disabled=false}}
  function init(){if(!ensureSession())return;const role=String(session.user?.rol||session.station).toUpperCase();$('stationTitle').textContent=stationIcon(role)+' '+roleLabel(role);document.title='VantixGC · '+roleLabel(role);$('sound').textContent=soundEnabled?'🔊 Sonido ON':'🔇 Sonido OFF';$('sound').addEventListener('click',()=>{unlockAudio();soundEnabled=!soundEnabled;localStorage.setItem(SOUND_KEY,soundEnabled?'on':'off');$('sound').textContent=soundEnabled?'🔊 Sonido ON':'🔇 Sonido OFF';if(soundEnabled)beep()});$('refresh').addEventListener('click',()=>load({manual:true}));$('fullscreen').addEventListener('click',async()=>{unlockAudio();try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}});document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'Salir pantalla completa':'⛶ Pantalla completa'});document.addEventListener('pointerdown',unlockAudio,{once:true});$('retry').addEventListener('click',()=>location.reload());document.documentElement.dataset.productionTabletV63=MARKER;load({manual:true})}
  init();
})();
</script>
</body>
</html>
