<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contabilidad · VantixGC Super Core</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--line:#e4e4e7;--text:#18221d;--muted:#61706a;--green:#0d6b43;--soft:#ddf3e8;--danger:#b42318;--warn:#b54708;--nav:#10241b;--nav2:#173429;--blue:#175cd3}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--nav);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:5px 8px 20px;font-weight:850}.mark{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--green);display:grid;place-items:center}.nav-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#92aa9f;padding:12px 10px 7px}.nav a{display:flex;gap:10px;padding:10px 11px;margin:3px 0;border-radius:10px;color:#dce8e3;text-decoration:none;font-size:14px}.nav a:hover,.nav a.active{background:var(--nav2);color:#fff}.main{min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0;z-index:10}.tenant strong{display:block}.tenant small,.muted{color:var(--muted)}.user{display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--green);display:grid;place-items:center;font-weight:850}.content{padding:24px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.pagehead h1{font-size:27px;margin:0 0 4px}.pagehead p{margin:0;color:var(--muted)}.tabs{display:flex;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px;margin-bottom:18px}.tab{border:0;background:transparent;padding:9px 11px;border-radius:9px;color:#667085;cursor:pointer;font-weight:750}.tab.active{background:var(--soft);color:var(--green)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel-head h2{font-size:16px;margin:0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:750}.btn:hover{background:#fafafa}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--danger);border-color:#fecaca;background:#fff7f7}.btn.warn{color:var(--warn);border-color:#fed7aa;background:#fffaf4}.btn.small{font-size:12px;padding:6px 8px}.input,.select,textarea{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:9px 10px;outline:none}.input:focus,.select:focus,textarea:focus{border-color:#8cbda8;box-shadow:0 0 0 3px #e7f4ed}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{background:#fafafa;color:#475467;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:10px 12px;border-bottom:1px solid #f0f1f2;vertical-align:middle}.table tr.clickable{cursor:pointer}.table tr.clickable:hover td{background:#f8fbf9}.money{text-align:right!important;font-variant-numeric:tabular-nums}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800}.b-ok{background:#ecfdf3;color:#027a48}.b-info{background:#eff8ff;color:#175cd3}.b-gray{background:#f2f4f7;color:#475467}.b-warn{background:#fff4ed;color:#b54708}.b-danger{background:#fef3f2;color:#b42318}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.card .label{font-size:12px;color:var(--muted)}.card .value{font-size:23px;font-weight:850;margin-top:6px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.journal-lines{padding:0 16px 16px}.line{display:grid;grid-template-columns:2.1fr 1.5fr 1.5fr 1fr 1fr 42px;gap:8px;align-items:end;padding:9px 0;border-bottom:1px solid #f0f1f2}.line label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.line input,.line select{width:100%}.balancebar{display:flex;justify-content:flex-end;gap:22px;padding:15px 17px;border-top:1px solid var(--line);background:#fafafa;flex-wrap:wrap}.difference{padding:5px 8px;border-radius:8px}.okbg{background:#ecfdf3;color:#027a48}.badbg{background:#fef3f2;color:#b42318}.empty{padding:42px;text-align:center;color:var(--muted)}.tree-code{font-weight:800;min-width:72px;display:inline-block}.indent-CLASE{padding-left:0}.indent-GRUPO{padding-left:14px}.indent-CUENTA{padding-left:28px}.indent-SUBCUENTA{padding-left:42px}.indent-AUXILIAR{padding-left:56px}.modal-back{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(960px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;border:1px solid var(--line);padding:20px}.modal h2{margin:0 0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{padding:11px 13px;border-radius:9px;margin-bottom:14px;background:#f0f9f4;border:1px solid #bbdec9;color:#166534}.error{padding:11px 13px;border-radius:9px;margin-bottom:14px;background:#fff1f0;border:1px solid #fecaca;color:#b42318}.report-section{padding:14px 17px;border-top:1px solid #eee}.report-section h3{margin:0 0 9px;font-size:14px}.subtotal{font-weight:850;background:#fafafa}.mobile{display:none}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.smallnote{font-size:12px;color:var(--muted)}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr 1fr}.line{grid-template-columns:1fr 1fr 1fr}.line>div:first-child{grid-column:span 3}.split{grid-template-columns:1fr}}
@media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:40;width:250px;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.mobile{display:inline-flex}.topbar{padding:0 12px}.content{padding:16px 10px}.pagehead{flex-direction:column}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}.line>div:first-child{grid-column:span 2}}
</style>
</head>
<body><div id="root"></div><div id="modalRoot"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sessionKey='vantixgc_core_session_v1';
let session=null;try{session=JSON.parse(localStorage.getItem(sessionKey)||'null')}catch{}
if(!session){location.replace('/app/login')}
const st={tab:'puc',accounts:[],third:[],types:[],vats:[],retentions:[],assets:[],banks:[],periods:[],manual:[]};
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]))}
function money(v){return new Intl.NumberFormat('es-CO',{style:'currency',currency:session?.tenant?.moneda||'COP',maximumFractionDigits:0}).format(Number(v||0))}
function num(v){return Number(v||0)}
function date(v){return v?new Intl.DateTimeFormat('es-CO',{dateStyle:'medium'}).format(new Date(v)):'—'}
function qs(obj){const p=new URLSearchParams();Object.entries(obj||{}).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=='')p.set(k,v)});return p.toString()}
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{}),Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain};const r=await fetch(path,{...opts,headers});let body={};try{body=await r.json()}catch{}if(r.status===401){localStorage.removeItem(sessionKey);location.replace('/app/login');throw new Error('Sesión vencida')}if(!r.ok)throw new Error(body?.error?.message||body?.message||`Error HTTP ${r.status}`);return body}
async function download(path,filename){const r=await fetch(path,{headers:{Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain}});if(!r.ok){let b={};try{b=await r.json()}catch{}throw new Error(b?.error?.message||`Error HTTP ${r.status}`)}const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}
function nav(href,icon,text,active=false){return `<a href="${href}" class="${active?'active':''}"><span>${icon}</span><span>${text}</span></a>`}
function shell(){return `<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="mark">V</div><div>VantixGC<br><small style="color:#9db3a8;font-weight:500">Super Core</small></div></div><div class="nav-title">Navegación</div><nav class="nav">${nav('/app/dashboard','▦','Dashboard')}${nav('/app/ventas','🛒','Ventas')}${nav('/app/compras','🛍','Compras')}${nav('/app/inventario','▣','Inventarios / Kardex')}${nav('/app/tesoreria','🏦','Tesorería & Bancos')}${nav('/app/cartera','📑','Cartera')}${nav('/app/contabilidad','📒','Contabilidad',true)}${nav('/app/terceros','👥','Terceros')}${nav('/app/configuracion','⚙','Configuración')}</nav></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn small mobile" id="menu">☰</button><div class="tenant"><strong>${esc(session.tenant?.nombreEmpresa||session.subdomain)}</strong><small>${esc(session.subdomain)} · ${esc(session.tenant?.pais||'')}</small></div></div><div class="user"><div style="text-align:right"><strong>${esc(session.user?.nombre||'Usuario')}</strong><div class="muted" style="font-size:12px">${esc(session.user?.rol||'')}</div></div><div class="avatar">${esc((session.user?.nombre||'U')[0])}</div><button class="btn small" id="logout">Salir</button></div></header><section class="content"><div class="pagehead"><div><h1>Contabilidad</h1><p>PUC, Diario, Mayor, estados financieros, cierres, impuestos, activos y conciliación.</p></div><button class="btn primary" id="quickJournal">+ Nuevo Asiento</button></div><div id="flash"></div><div class="tabs" id="tabs">${[['puc','Plan de Cuentas'],['diario','Libro Diario'],['manual','Comprobante Manual'],['mayor','Libro Mayor'],['reportes','Reportes'],['terceros','Terceros'],['periodos','Periodos'],['impuestos','Impuestos'],['activos','Activos Fijos'],['conciliacion','Conciliación']].map(([k,t],i)=>`<button class="tab ${i===0?'active':''}" data-tab="${k}">${t}</button>`).join('')}</div><div id="view"></div></section></main></div>`}
function flash(msg,type='ok'){const el=$('#flash');if(el)el.innerHTML=`<div class="${type==='error'?'error':'notice'}">${esc(msg)}</div>`}
function modal(html){$('#modalRoot').innerHTML=`<div class="modal-back" id="modalBack"><div class="modal">${html}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function moveAccounts(){return st.accounts.filter(a=>a.activa&&a.permiteMovimiento)}
function accountOptions(sel='',pred=()=>true){return moveAccounts().filter(pred).map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.codigo)} · ${esc(a.nombre)}</option>`).join('')}
function thirdOptions(sel=''){return `<option value="">Sin tercero</option>`+st.third.filter(t=>t.activo!==false).map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.identificacion)} · ${esc(t.nombre)}</option>`).join('')}
function typeOptions(sel=''){return st.types.filter(t=>t.activo).map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.codigo)} · ${esc(t.nombre)}</option>`).join('')}
async function loadBase(){const [a,t,types,vats,ret,assets,banks,periods]=await Promise.all([api('/api/v1/contabilidad/cuentas?limit=3000'),api('/api/v1/terceros?limit=1000'),api('/api/v1/contabilidad/tipos-comprobante'),api('/api/v1/contabilidad/impuestos/iva'),api('/api/v1/contabilidad/impuestos/retenciones'),api('/api/v1/contabilidad/activos-fijos'),api('/api/v1/tesoreria/cajas-bancos'),api('/api/v1/contabilidad/periodos?limit=120')]);st.accounts=a.data||[];st.third=t.data||[];st.types=types.data||[];st.vats=vats.data||[];st.retentions=ret.data||[];st.assets=assets.data||[];st.banks=(banks.data||[]).filter(x=>x.tipo==='BANCO'&&x.activo);st.periods=periods.data||[]}
function bindShell(){$('#logout').onclick=()=>{localStorage.removeItem(sessionKey);location.href='/app'};$('#menu')?.addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$$('#tabs .tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('#quickJournal').onclick=()=>setTab('manual')}
function setTab(tab){st.tab=tab;$$('#tabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderTab()}
async function renderTab(){const v=$('#view');v.innerHTML='<div class="panel"><div class="empty">Cargando...</div></div>';try{if(st.tab==='puc')return renderPuc();if(st.tab==='diario')return renderDiario();if(st.tab==='manual')return renderManual();if(st.tab==='mayor')return renderMayor();if(st.tab==='reportes')return renderReports();if(st.tab==='terceros')return renderThird();if(st.tab==='periodos')return renderPeriods();if(st.tab==='impuestos')return renderTaxes();if(st.tab==='activos')return renderAssets();if(st.tab==='conciliacion')return renderReconciliation()}catch(e){v.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function refreshBase(){await loadBase();return renderTab()}

function renderPuc(){const rows=st.accounts.map(a=>`<tr><td><div class="indent-${a.nivel}"><span class="tree-code">${esc(a.codigo)}</span>${esc(a.nombre)}</div></td><td>${esc(a.nivel)}</td><td>${esc(a.naturaleza)}</td><td>${a.permiteMovimiento?'<span class="badge b-ok">Sí</span>':'No'}</td><td>${esc(a.clasificacionESF||'—')}</td><td>${esc(a.categoriaResultado||'—')}</td><td>${a.versionCatalogo==='CUSTOM'?'<span class="badge b-gray">Personalizada</span>':esc(a.versionCatalogo||'')}</td></tr>`);$('#view').innerHTML=`<div class="cards"><div class="card"><div class="label">Cuentas</div><div class="value">${st.accounts.length}</div></div><div class="card"><div class="label">Con movimiento</div><div class="value">${moveAccounts().length}</div></div><div class="card"><div class="label">Personalizadas</div><div class="value">${st.accounts.filter(x=>x.versionCatalogo==='CUSTOM').length}</div></div><div class="card"><div class="label">Catálogo</div><div class="value" style="font-size:13px">${esc(st.accounts.find(x=>x.versionCatalogo!=='CUSTOM')?.versionCatalogo||'—')}</div></div></div><div class="panel"><div class="panel-head"><h2>Plan de Cuentas</h2><button class="btn primary" id="newAccount">+ Crear Cuenta / Subcuenta</button></div>${table(['Código / Cuenta','Nivel','Naturaleza','Movimiento','ESF','P&G','Origen'],rows)}</div>`;$('#newAccount').onclick=openAccountModal}
function openAccountModal(){const parents=st.accounts.map(a=>`<option value="${a.id}">${esc(a.codigo)} · ${esc(a.nombre)}</option>`).join('');modal(`<h2>Crear cuenta / subcuenta</h2><form id="accountForm"><div class="form-grid"><div class="field"><label>Código</label><input class="input" name="codigo" required></div><div class="field"><label>Nombre</label><input class="input" name="nombre" required></div><div class="field"><label>Nivel</label><select class="select" name="nivel"><option>SUBCUENTA</option><option>AUXILIAR</option><option>CUENTA</option><option>GRUPO</option><option>CLASE</option></select></div><div class="field"><label>Naturaleza</label><select class="select" name="naturaleza"><option>DEBITO</option><option>CREDITO</option></select></div><div class="field"><label>Cuenta padre</label><select class="select" name="parentId"><option value="">Sin padre</option>${parents}</select></div><div class="field"><label>Clasificación ESF</label><select class="select" name="clasificacionESF"><option value="">—</option>${['ACTIVO_CORRIENTE','ACTIVO_NO_CORRIENTE','PASIVO_CORRIENTE','PASIVO_NO_CORRIENTE','PATRIMONIO','RESULTADO','ORDEN'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Categoría P&G</label><select class="select" name="categoriaResultado"><option value="">—</option>${['INGRESO_OPERACIONAL','COSTO_VENTAS','GASTO_ADMINISTRACION','GASTO_VENTAS','INGRESO_NO_OPERACIONAL','GASTO_NO_OPERACIONAL','IMPUESTO_RENTA'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label><input type="checkbox" name="permiteMovimiento" checked> Permite movimiento</label><label><input type="checkbox" name="requiereTercero"> Exige tercero</label></div></div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Crear</button></div></form>`);$('#cancel').onclick=closeModal;$('#accountForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api('/api/v1/contabilidad/cuentas',{method:'POST',body:JSON.stringify({codigo:f.get('codigo'),nombre:f.get('nombre'),nivel:f.get('nivel'),naturaleza:f.get('naturaleza'),parentId:f.get('parentId')||null,clasificacionESF:f.get('clasificacionESF')||null,categoriaResultado:f.get('categoriaResultado')||null,permiteMovimiento:f.get('permiteMovimiento')==='on',requiereTercero:f.get('requiereTercero')==='on',activa:true})});closeModal();flash('Cuenta creada');await refreshBase()}catch(x){alert(x.message)}}}

async function renderDiario(){const r=await api('/api/v1/contabilidad/asientos?pageSize=300');const rows=(r.data||[]).map(j=>`<tr class="clickable" data-id="${j.id}"><td>${date(j.fecha)}</td><td><strong>${esc(j.numeroComprobante||j.referencia||'—')}</strong></td><td>${esc(j.concepto)}</td><td><span class="badge ${j.origen==='REVERSO'?'b-warn':j.origen==='CIERRE'?'b-info':j.origen==='MANUAL'?'b-gray':'b-info'}">${esc(j.origen)}</span></td><td><span class="badge ${j.estado==='ANULADO'?'b-danger':j.estado==='BORRADOR'?'b-gray':'b-ok'}">${esc(j.estado)}</span></td><td class="money">${money(j.totalDebito)}</td><td class="money">${money(j.totalCredito)}</td></tr>`);$('#view').innerHTML=`<div class="panel"><div class="panel-head"><h2>Libro Diario</h2><div class="toolbar"><button class="btn" id="xls">Exportar a Excel</button><button class="btn" id="pdf">Exportar a PDF</button></div></div>${rows.length?table(['Fecha','Comprobante','Concepto','Origen','Estado','Débito','Crédito'],rows):'<div class="empty">No hay asientos.</div>'}</div>`;$$('tr[data-id]').forEach(tr=>tr.onclick=()=>openJournal(tr.dataset.id));$('#xls').onclick=()=>download('/api/v1/contabilidad/reportes/diario/exportar?formato=xls','Libro_Diario.xls').catch(e=>alert(e.message));$('#pdf').onclick=()=>download('/api/v1/contabilidad/reportes/diario/exportar?formato=pdf','Libro_Diario.pdf').catch(e=>alert(e.message))}
async function openJournal(id){try{const r=await api(`/api/v1/contabilidad/asientos/${id}`),j=r.data;const lines=j.detalles.map(x=>`<tr><td>${esc(x.cuenta.codigo)} · ${esc(x.cuenta.nombre)}</td><td>${esc(x.tercero?.nombre||'—')}</td><td>${esc(x.concepto||'')}</td><td class="money">${money(x.debito)}</td><td class="money">${money(x.credito)}</td></tr>`);const aud=(j.auditoria||[]).map(a=>`<tr><td>${date(a.creadoEn)}</td><td>${esc(a.accion)}</td><td>${esc(a.user?.nombre||'')}</td><td>${esc(JSON.stringify(a.metadata||{}))}</td></tr>`);const sup=(j.soportes||[]).map(s=>`<tr><td>${esc(s.nombre)}</td><td>${esc(s.mimeType)}</td><td>${Math.round(s.tamano/1024)} KB</td><td><button class="btn small" data-support="${s.id}">Abrir</button></td></tr>`);modal(`<h2>${esc(j.numeroComprobante||j.referencia||'Asiento')}</h2><div class="cards"><div class="card"><div class="label">Estado</div><div class="value" style="font-size:15px">${esc(j.estado)}</div></div><div class="card"><div class="label">Origen</div><div class="value" style="font-size:15px">${esc(j.origen)}</div></div><div class="card"><div class="label">Débitos</div><div class="value">${money(j.totalDebito)}</div></div><div class="card"><div class="label">Créditos</div><div class="value">${money(j.totalCredito)}</div></div></div><p><strong>${esc(j.concepto)}</strong></p>${table(['Cuenta','Tercero','Concepto','Débito','Crédito'],lines)}<h3>Soportes</h3>${sup.length?table(['Archivo','Tipo','Tamaño',''],sup):'<p class="muted">Sin soportes.</p>'}<div class="toolbar"><input type="file" id="supportFile" accept="application/pdf,image/png,image/jpeg,image/webp"><button class="btn" id="uploadSupport">Adjuntar soporte</button></div><h3>Auditoría</h3>${aud.length?table(['Fecha','Acción','Usuario','Detalle'],aud):'<p class="muted">Sin eventos.</p>'}<div class="modal-actions"><button class="btn" id="close">Cerrar</button>${j.estado==='CONTABILIZADO'&&j.origen!=='REVERSO'?'<button class="btn danger" id="reverse">Anular asiento</button>':''}</div>`);$('#close').onclick=closeModal;$$('[data-support]').forEach(b=>b.onclick=async()=>{const r=await fetch(`/api/v1/contabilidad/asientos/${id}/soportes/${b.dataset.support}`,{headers:{Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain}});if(!r.ok)return alert('No fue posible abrir el soporte');const blob=await r.blob();window.open(URL.createObjectURL(blob),'_blank')});$('#uploadSupport').onclick=async()=>{const file=$('#supportFile').files[0];if(!file)return alert('Seleccione un archivo');const base64=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result).split(',')[1]);fr.onerror=reject;fr.readAsDataURL(file)});try{await api(`/api/v1/contabilidad/asientos/${id}/soportes`,{method:'POST',body:JSON.stringify({nombre:file.name,mimeType:file.type,base64})});closeModal();await openJournal(id)}catch(e){alert(e.message)}};if($('#reverse'))$('#reverse').onclick=async()=>{const motivo=prompt('Motivo de anulación/reversión:');if(!motivo)return;try{await api(`/api/v1/contabilidad/asientos/${id}/anular`,{method:'POST',body:JSON.stringify({motivo})});closeModal();flash('Asiento anulado mediante reversión');renderDiario()}catch(e){alert(e.message)}}}catch(e){alert(e.message)}}

/button></div></div>`;bindManual()}
function syncManual(){st.manual=[];$$('.line[data-i]').forEach(row=>st.manual.push({cuentaId:row.querySelector('.m-account').value,terceroId:row.querySelector('.m-third').value||null,concepto:row.querySelector('.m-concept').value,debito:num(row.querySelector('.m-debit').value),credito:num(row.querySelector('.m-credit').value)}));const d=st.manual.reduce((a,x)=>a+x.debito,0),c=st.manual.reduce((a,x)=>a+x.credito,0),dif=Math.round((d-c)*100)/100;$('#td').textContent=money(d);$('#tc').textContent=money(c);$('#diff').textContent=`Diferencia ${money(dif)}`;$('#diff').className=`difference ${Math.abs(dif)<0.005&&d>0?'okbg':'badbg'}`;return {d,c,dif}}

async function submitManual(draft){const bal=syncManual();if(Math.abs(bal.dif)>=0.005||bal.d<=0)return alert('La partida doble no está balanceada');const payload={fecha:$('#mDate').value,concepto:$('#mConcept').value,tipoComprobanteId:$('#mType').value||null,referenciaExterna:$('#mRef').value||null,detalles:st.manual};if(!payload.concepto)return alert('Ingrese el concepto');try{await api(draft?'/api/v1/contabilidad/asientos/borrador':'/api/v1/contabilidad/asientos',{method:'POST',body:JSON.stringify(payload)});st.manual=[];flash(draft?'Borrador guardado':'Asiento contabilizado con partida doble');setTab('diario')}catch(e){alert(e.message)}}

poDocumento:f.get('tipoDocumento'),identificacion:f.get('identificacion'),nombre:f.get('nombre'),razonSocial:f.get('razonSocial')||null,tipo:f.get('tipo'),telefono:f.get('telefono')||null,email:f.get('email')||null,direccion:f.get('direccion')||null,responsableIva:f.get('responsableIva')==='on',sujetoRetefuente:f.get('sujetoRetefuente')==='on',sujetoReteIca:f.get('sujetoReteIca')==='on',sujetoReteIva:f.get('sujetoReteIva')==='on'};try{await api(t?`/api/v1/terceros/${t.id}`:'/api/v1/terceros',{method:t?'PATCH':'POST',body:JSON.stringify(payload)});closeModal();await refreshBase()}catch(e){alert(e.message)}}}

async function renderTaxes(){const cfg=(await api('/api/v1/contabilidad/configuracion')).data;const vatRows=st.vats.map(v=>`<tr><td>${esc(v.codigo)}</td><td>${esc(v.nombre)}</td><td>${v.porcentaje}%</td><td>${esc(v.categoria)}</td><td>${esc(v.cuentaGenerado?.codigo||'—')}</td><td>${esc(v.cuentaDescontable?.codigo||'—')}</td><td><span class="badge ${v.activa?'b-ok':'b-gray'}">${v.activa?'Activa':'Inactiva'}</span></td><td><button class="btn small" data-vat="${v.id}">Editar</button></td></tr>`);const retRows=st.retentions.map(r=>`<tr><td>${esc(r.codigo)}</td><td>${esc(r.nombre)}</td><td>${esc(r.tipo)}</td><td>${r.porcentaje}%</td><td>${money(r.baseMinima)}</td><td>${esc(r.cuenta.codigo)}</td><td>${r.automatico?'Sí':'No'}</td><td><span class="badge ${r.activo?'b-ok':'b-gray'}">${r.activo?'Activo':'Inactivo'}</span></td><td><button class="btn small" data-ret="${r.id}">Editar</button></td></tr>`);$('#view').innerHTML=`<div class="panel"><div class="panel-head"><h2>Configuración fiscal</h2></div><div class="form-grid"><div class="field"><label>Tasa impuesto de renta (%)</label><input id="incomeTaxRate" class="input" type="number" min="0" max="100" step="0.01" value="${num(cfg?.tasaImpuestoRenta)}"></div><div class="field"><label>Cuenta gasto renta</label><select id="incomeTaxExp" class="select">${accountOptions(cfg?.cuentaImpuestoRentaId||'')}</select></div><div class="field"><label>Cuenta renta por pagar</label><select id="incomeTaxPay" class="select">${accountOptions(cfg?.cuentaImpuestoRentaPorPagarId||'')}</select></div><div class="field"><label>&nbsp;</label><button class="btn primary" id="saveTaxCfg" style="width:100%">Guardar configuración</button></div></div></div><div class="panel"><div class="panel-head"><h2>Tarifas IVA</h2><button class="btn primary" id="newVat">+ Tarifa IVA</button></div>${table(['Código','Nombre','Tarifa','Categoría','IVA generado','IVA descontable','Estado',''],vatRows)}</div><div class="panel"><div class="panel-head"><h2>Retenciones</h2><button class="btn primary" id="newRet">+ Concepto retención</button></div><div class="notice">Las tarifas de retención son configurables por empresa. Las plantillas iniciales no se activan con porcentajes legales hardcodeados.</div>${table(['Código','Concepto','Tipo','Tarifa','Base mínima','Cuenta','Auto','Estado',''],retRows)}</div><div class="panel"><div class="panel-head"><h2>Calculadora de impuestos</h2></div><div class="form-grid"><div class="field"><label>Operación</label><select id="taxOp" class="select"><option>VENTA</option><option>COMPRA</option></select></div><div class="field"><label>Base</label><input id="taxBase" class="input" type="number" min="0"></div><div class="field"><label>IVA</label><select id="taxVat" class="select"><option value="">Sin IVA</option>${st.vats.filter(x=>x.activa).map(v=>`<option value="${v.id}">${esc(v.nombre)}</option>`).join('')}</select></div><div class="field"><label>Tercero</label><select id="taxThird" class="select">${thirdOptions()}</select></div></div><div class="toolbar" style="padding:0 16px 16px"><button class="btn" id="calcTax">Calcular</button></div><div id="taxResult"></div></div>`;$('#saveTaxCfg').onclick=async()=>{try{await api('/api/v1/contabilidad/configuracion',{method:'PATCH',body:JSON.stringify({tasaImpuestoRenta:num($('#incomeTaxRate').value),cuentaImpuestoRentaId:$('#incomeTaxExp').value,cuentaImpuestoRentaPorPagarId:$('#incomeTaxPay').value})});flash('Configuración fiscal actualizada')}catch(e){alert(e.message)}};$('#newVat').onclick=()=>openVat();$$('[data-vat]').forEach(b=>b.onclick=()=>openVat(st.vats.find(x=>x.id===b.dataset.vat)));$('#newRet').onclick=()=>openRetention();$$('[data-ret]').forEach(b=>b.onclick=()=>openRetention(st.retentions.find(x=>x.id===b.dataset.ret)));$('#calcTax').onclick=async()=>{try{const r=await api('/api/v1/contabilidad/impuestos/calcular',{method:'POST',body:JSON.stringify({tipoOperacion:$('#taxOp').value,base:num($('#taxBase').value),tarifaIvaId:$('#taxVat').value||null,terceroId:$('#taxThird').value||null})}),d=r.data;$('#taxResult').innerHTML=`<div class="report-section">IVA: <strong>${money(d.iva?.valor||0)}</strong> · Retenciones: <strong>${money(d.totalRetenciones)}</strong><br>${(d.retenciones||[]).map(x=>`${esc(x.codigo)} ${money(x.valor)}`).join(' · ')||'<span class="muted">Sin retenciones automáticas aplicables.</span>'}</div>`}catch(e){alert(e.message)}}}
function openVat(v=null){modal(`<h2>${v?'Editar':'Crear'} tarifa IVA</h2><form id="vatForm"><div class="form-grid"><div class="field"><label>Código</label><input name="codigo" class="input" value="${esc(v?.codigo||'')}" required></div><div class="field"><label>Nombre</label><input name="nombre" class="input" value="${esc(v?.nombre||'')}" required></div><div class="field"><label>Porcentaje</label><input name="porcentaje" type="number" min="0" max="100" step="0.01" class="input" value="${num(v?.porcentaje)}"></div><div class="field"><label>Categoría</label><select name="categoria" class="select">${['GRAVADO','EXENTO','EXCLUIDO'].map(x=>`<option ${v?.categoria===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Cuenta IVA generado</label><select name="cuentaGeneradoId" class="select"><option value="">—</option>${accountOptions(v?.cuentaGeneradoId||'')}</select></div><div class="field"><label>Cuenta IVA descontable</label><select name="cuentaDescontableId" class="select"><option value="">—</option>${accountOptions(v?.cuentaDescontableId||'')}</select></div><div class="field"><label><input type="checkbox" name="activa" ${v?.activa!==false?'checked':''}> Activa</label></div></div><div class="modal-actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);$('#cancel').onclick=closeModal;$('#vatForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),p={codigo:f.get('codigo'),nombre:f.get('nombre'),porcentaje:num(f.get('porcentaje')),categoria:f.get('categoria'),cuentaGeneradoId:f.get('cuentaGeneradoId')||null,cuentaDescontableId:f.get('cuentaDescontableId')||null,activa:f.get('activa')==='on'};try{await api(v?`/api/v1/contabilidad/impuestos/iva/${v.id}`:'/api/v1/contabilidad/impuestos/iva',{method:v?'PATCH':'POST',body:JSON.stringify(p)});closeModal();await refreshBase()}catch(e){alert(e.message)}}}
function openRetention(r=null){modal(`<h2>${r?'Editar':'Crear'} concepto de retención</h2><form id="retForm"><div class="form-grid"><div class="field"><label>Código</label><input name="codigo" class="input" value="${esc(r?.codigo||'')}" required></div><div class="field"><label>Nombre</label><input name="nombre" class="input" value="${esc(r?.nombre||'')}" required></div><div class="field"><label>Tipo</label><select name="tipo" class="select">${['RETEFUENTE','RETEICA','RETEIVA'].map(x=>`<option ${r?.tipo===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Porcentaje</label><input name="porcentaje" type="number" min="0" max="100" step="0.0001" class="input" value="${num(r?.porcentaje)}"></div><div class="field"><label>Base mínima</label><input name="baseMinima" type="number" min="0" class="input" value="${num(r?.baseMinima)}"></div><div class="field"><label>Cuenta</label><select name="cuentaId" class="select">${accountOptions(r?.cuentaId||'')}</select></div><div class="field"><label>Naturaleza</label><select name="naturaleza" class="select"><option ${r?.naturaleza==='PAGAR'?'selected':''}>PAGAR</option><option ${r?.naturaleza==='COBRAR'?'selected':''}>COBRAR</option></select></div><div class="field"><label><input type="checkbox" name="automatico" ${r?.automatico?'checked':''}> Automático</label><label><input type="checkbox" name="activo" ${r?.activo!==false?'checked':''}> Activo</label></div></div><div class="modal-actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);$('#cancel').onclick=closeModal;$('#retForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),p={codigo:f.get('codigo'),nombre:f.get('nombre'),tipo:f.get('tipo'),porcentaje:num(f.get('porcentaje')),baseMinima:num(f.get('baseMinima')),cuentaId:f.get('cuentaId'),naturaleza:f.get('naturaleza'),automatico:f.get('automatico')==='on',activo:f.get('activo')==='on'};try{await api(r?`/api/v1/contabilidad/impuestos/retenciones/${r.id}`:'/api/v1/contabilidad/impuestos/retenciones',{method:r?'PATCH':'POST',body:JSON.stringify(p)});closeModal();await refreshBase()}catch(e){alert(e.message)}}}

function renderAssets(){const rows=st.assets.map(a=>`<tr><td>${esc(a.codigo)}</td><td>${esc(a.nombre)}</td><td class="money">${money(a.valorAdquisicion)}</td><td>${a.vidaUtilMeses} meses</td><td>${esc(a.metodo)}</td><td>${a.depreciaciones.length}</td><td><button class="btn small" data-dep="${a.id}">Depreciar mes</button></td></tr>`);$('#view').innerHTML=`<div class="panel"><div class="panel-head"><h2>Activos Fijos</h2><button class="btn primary" id="newAsset">+ Registrar activo</button></div>${rows.length?table(['Código','Activo','Valor','Vida útil','Método','Meses depreciados',''],rows):'<div class="empty">No hay activos fijos.</div>'}</div>`;$('#newAsset').onclick=openAsset;$$('[data-dep]').forEach(b=>b.onclick=async()=>{const raw=prompt('Periodo a depreciar (AAAA-MM):',new Date().toISOString().slice(0,7));if(!raw)return;const [y,m]=raw.split('-').map(Number);try{await api(`/api/v1/contabilidad/activos-fijos/${b.dataset.dep}/depreciar`,{method:'POST',body:JSON.stringify({anio:y,mes:m})});flash('Depreciación contabilizada');await refreshBase()}catch(e){alert(e.message)}})}
function openAsset(){const find=code=>st.accounts.find(a=>a.codigo===code)?.id||'';modal(`<h2>Registrar activo fijo</h2><form id="assetForm"><div class="form-grid"><div class="field"><label>Código</label><input name="codigo" class="input" required></div><div class="field"><label>Nombre</label><input name="nombre" class="input" required></div><div class="field"><label>Valor adquisición</label><input name="valorAdquisicion" type="number" min="0" class="input" required></div><div class="field"><label>Valor residual</label><input name="valorResidual" type="number" min="0" class="input" value="0"></div><div class="field"><label>Fecha compra</label><input name="fechaCompra" type="date" class="input" required></div><div class="field"><label>Inicio depreciación</label><input name="fechaInicioDepreciacion" type="date" class="input"></div><div class="field"><label>Vida útil (meses)</label><input name="vidaUtilMeses" type="number" min="1" class="input" required></div><div class="field"><label>Proveedor / tercero</label><select name="terceroId" class="select">${thirdOptions()}</select></div><div class="field"><label>Cuenta activo</label><select name="cuentaActivoId" class="select">${accountOptions(find('152405'))}</select></div><div class="field"><label>Depreciación acumulada</label><select name="cuentaDepAcumuladaId" class="select">${accountOptions(find('159215'))}</select></div><div class="field"><label>Gasto depreciación</label><select name="cuentaGastoDepreciacionId" class="select">${accountOptions(find('516015'))}</select></div></div><div class="modal-actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Registrar</button></div></form>`);$('#cancel').onclick=closeModal;$('#assetForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),p={codigo:f.get('codigo'),nombre:f.get('nombre'),valorAdquisicion:num(f.get('valorAdquisicion')),valorResidual:num(f.get('valorResidual')),fechaCompra:f.get('fechaCompra'),fechaInicioDepreciacion:f.get('fechaInicioDepreciacion')||undefined,vidaUtilMeses:num(f.get('vidaUtilMeses')),terceroId:f.get('terceroId')||null,cuentaActivoId:f.get('cuentaActivoId'),cuentaDepAcumuladaId:f.get('cuentaDepAcumuladaId'),cuentaGastoDepreciacionId:f.get('cuentaGastoDepreciacionId')};try{await api('/api/v1/contabilidad/activos-fijos',{method:'POST',body:JSON.stringify(p)});closeModal();await refreshBase()}catch(e){alert(e.message)}}}

async function renderReconciliation(){const r=await api('/api/v1/contabilidad/conciliaciones'),items=r.data||[];const rows=items.map(x=>`<tr><td>${date(x.fechaCorte)}</td><td>${esc(x.cajaBanco.nombre)}</td><td class="money">${money(x.saldoExtracto)}</td><td>${x.partidas.filter(p=>p.estado==='CONCILIADA').length}/${x.partidas.length}</td><td><span class="badge ${x.estado==='CERRADA'?'b-gray':'b-ok'}">${x.estado}</span></td><td><button class="btn small" data-rec="${x.id}">Abrir</button></td></tr>`);$('#view').innerHTML=`<div class="panel"><div class="panel-head"><h2>Conciliación Bancaria</h2><button class="btn primary" id="newRec">+ Registrar extracto</button></div>${st.banks.length?rows.length?table(['Corte','Banco','Saldo extracto','Conciliadas','Estado',''],rows):'<div class="empty">No hay conciliaciones.</div>':'<div class="empty">Primero cree una cuenta tipo BANCO en Tesorería.</div>'}</div>`;$('#newRec').onclick=openRec;$$('[data-rec]').forEach(b=>b.onclick=()=>openRecDetail(items.find(x=>x.id===b.dataset.rec)))}
function openRec(){modal(`<h2>Registrar extracto bancario</h2><form id="recForm"><div class="form-grid"><div class="field"><label>Cuenta bancaria</label><select name="cajaBancoId" class="select">${st.banks.map(b=>`<option value="${b.id}">${esc(b.nombre)}</option>`).join('')}</select></div><div class="field"><label>Fecha de corte</label><input name="fechaCorte" type="date" class="input" required></div><div class="field"><label>Saldo extracto</label><input name="saldoExtracto" type="number" step="0.01" class="input" required></div></div><div class="field"><label>Partidas del extracto (una por línea: FECHA|DEBITO/CREDITO|VALOR|DESCRIPCION|REFERENCIA)</label><textarea name="partidas" class="input" rows="8" placeholder="2026-08-19|DEBITO|30000|Consignación cliente|REF-1"></textarea></div><div class="modal-actions"><button type="button" id="cancel" class="btn">Cancelar</button><button class="btn primary">Crear conciliación</button></div></form>`);$('#cancel').onclick=closeModal;$('#recForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const partidas=String(f.get('partidas')||'').split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{const [fecha,tipo,valor,descripcion,referencia]=line.split('|');return {fecha,tipo,valor:num(valor),descripcion:descripcion||'',referencia:referencia||null}});await api('/api/v1/contabilidad/conciliaciones',{method:'POST',body:JSON.stringify({cajaBancoId:f.get('cajaBancoId'),fechaCorte:f.get('fechaCorte'),saldoExtracto:num(f.get('saldoExtracto')),partidas})});closeModal();renderReconciliation()}catch(e){alert(e.message)}}}
async function openRecDetail(rec){try{const mv=(await api(`/api/v1/contabilidad/conciliaciones/${rec.id}/movimientos`)).data||[];const rows=rec.partidas.map(p=>`<tr><td>${date(p.fecha)}</td><td>${esc(p.descripcion)}</td><td>${esc(p.tipo)}</td><td class="money">${money(p.valor)}</td><td><select class="select match" data-entry="${p.id}" ${rec.estado==='CERRADA'?'disabled':''}><option value="">Pendiente</option>${mv.map(m=>`<option value="${m.id}" ${p.movimientoTesoreriaId===m.id?'selected':''}>${date(m.creadoEn)} · ${esc(m.referencia||m.concepto||m.tipo)} · ${money(m.monto)}</option>`).join('')}</select></td></tr>`);modal(`<h2>Conciliación ${esc(rec.cajaBanco.nombre)}</h2>${table(['Fecha','Descripción','Tipo','Valor','Movimiento de libro'],rows)}<div class="modal-actions"><button class="btn" id="close">Cerrar ventana</button>${rec.estado==='BORRADOR'?'<button class="btn primary" id="closeRec">Cerrar conciliación</button>':''}</div>`);$('#close').onclick=closeModal;$$('.match').forEach(s=>s.onchange=async()=>{try{await api(`/api/v1/contabilidad/conciliaciones/${rec.id}/partidas/${s.dataset.entry}`,{method:'PATCH',body:JSON.stringify({movimientoTesoreriaId:s.value||null})})}catch(e){alert(e.message)}});if($('#closeRec'))$('#closeRec').onclick=async()=>{try{const r=await api(`/api/v1/contabilidad/conciliaciones/${rec.id}/cerrar`,{method:'POST'});alert(`Conciliación cerrada. Diferencia libro/extracto: ${money(r.data.diferencia)}`);closeModal();renderReconciliation()}catch(e){alert(e.message)}}}catch(e){alert(e.message)}}

document.querySelector('#root').innerHTML=shell();bindShell();loadBase().then(renderTab).catch(e=>{$('#view').innerHTML=`<div class="error">${esc(e.message)}</div>`});
