<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contabilidad · VantixGC Super Core</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--line:#e4e4e7;--text:#18221d;--muted:#61706a;--green:#0d6b43;--green2:#118a57;--soft:#ddf3e8;--gold:#d4a62a;--danger:#b42318;--warn:#b54708;--nav:#10241b;--nav2:#173429;--blue:#175cd3}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--nav);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:5px 8px 20px;font-weight:850}.mark{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--green);display:grid;place-items:center}.nav-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#92aa9f;padding:12px 10px 7px}.nav a{display:flex;gap:10px;padding:10px 11px;margin:3px 0;border-radius:10px;color:#dce8e3;text-decoration:none;font-size:14px}.nav a:hover,.nav a.active{background:var(--nav2);color:#fff}.main{min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0;z-index:10}.tenant strong{display:block}.tenant small,.muted{color:var(--muted)}.user{display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--green);display:grid;place-items:center;font-weight:850}.content{padding:24px;max-width:1550px;margin:auto}.pagehead{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.pagehead h1{font-size:27px;margin:0 0 4px}.pagehead p{margin:0;color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px;margin-bottom:18px}.tab{border:0;background:transparent;padding:10px 13px;border-radius:9px;color:#667085;cursor:pointer;font-weight:750}.tab.active{background:var(--soft);color:var(--green)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel-head h2{font-size:16px;margin:0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:750}.btn:hover{background:#fafafa}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--danger);border-color:#fecaca;background:#fff7f7}.btn.small{font-size:13px;padding:7px 9px}.input,.select,textarea{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:9px 10px;outline:none}.input:focus,.select:focus,textarea:focus{border-color:#8cbda8;box-shadow:0 0 0 3px #e7f4ed}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:14px}.table th{background:#fafafa;color:#475467;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:11px 12px;border-bottom:1px solid #f0f1f2;vertical-align:middle}.table tr.clickable{cursor:pointer}.table tr.clickable:hover td{background:#f8fbf9}.money{text-align:right!important;font-variant-numeric:tabular-nums}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800}.b-auto{background:#eff8ff;color:#175cd3}.b-manual{background:#f2f4f7;color:#475467}.b-rev{background:#fff4ed;color:#b54708}.ok{color:#027a48;font-weight:800}.bad{color:var(--danger);font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.card .label{font-size:12px;color:var(--muted)}.card .value{font-size:23px;font-weight:850;margin-top:6px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.journal-lines{padding:0 16px 16px}.line{display:grid;grid-template-columns:2.2fr 1.5fr 1.2fr 1fr 1fr 42px;gap:8px;align-items:end;padding:9px 0;border-bottom:1px solid #f0f1f2}.line label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.line input,.line select{width:100%}.balancebar{display:flex;justify-content:flex-end;gap:22px;padding:15px 17px;border-top:1px solid var(--line);background:#fafafa;flex-wrap:wrap}.balancebar .total{font-weight:850}.balancebar .difference{padding:5px 8px;border-radius:8px}.difference.okbg{background:#ecfdf3;color:#027a48}.difference.badbg{background:#fef3f2;color:#b42318}.empty{padding:42px;text-align:center;color:var(--muted)}.tree-code{font-weight:800;min-width:72px;display:inline-block}.indent-CLASE{padding-left:0}.indent-GRUPO{padding-left:14px}.indent-CUENTA{padding-left:28px}.indent-SUBCUENTA{padding-left:42px}.indent-AUXILIAR{padding-left:56px}.modal-back{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;border:1px solid var(--line);padding:20px}.modal h2{margin:0 0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{padding:11px 13px;border-radius:9px;margin-bottom:14px;background:#f0f9f4;border:1px solid #bbdec9;color:#166534}.error{padding:11px 13px;border-radius:9px;margin-bottom:14px;background:#fff1f0;border:1px solid #fecaca;color:#b42318}.report-block{padding:14px 17px}.report-title{font-weight:850;margin:8px 0}.mobile{display:none}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr 1fr}.line{grid-template-columns:1fr 1fr 1fr}.line>div:first-child{grid-column:span 3}}
@media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:40;width:250px;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.mobile{display:inline-flex}.topbar{padding:0 12px}.content{padding:16px 10px}.pagehead{flex-direction:column}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.line{grid-template-columns:1fr 1fr}.line>div:first-child{grid-column:span 2}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sessionKey='vantixgc_core_session_v1';
let session=null, accounts=[], thirdParties=[], currentTab='puc', manualLines=[];
try{session=JSON.parse(localStorage.getItem(sessionKey)||'null')}catch{}
if(!session){location.replace('/app/login')}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]))}
function money(v){return new Intl.NumberFormat('es-CO',{style:'currency',currency:session?.tenant?.moneda||'COP',maximumFractionDigits:0}).format(Number(v||0))}
function date(v){if(!v)return '—';return new Intl.DateTimeFormat('es-CO',{dateStyle:'medium'}).format(new Date(v))}
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{}),Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain};const r=await fetch(path,{...opts,headers});let body={};try{body=await r.json()}catch{}if(r.status===401){localStorage.removeItem(sessionKey);location.replace('/app/login');throw new Error('Sesión vencida')}if(!r.ok)throw new Error(body?.error?.message||body?.message||`Error HTTP ${r.status}`);return body}
function navLink(href,icon,text,active=false){return `<a href="${href}" class="${active?'active':''}"><span>${icon}</span><span>${text}</span></a>`}
function shell(){return `<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="mark">V</div><div>VantixGC<br><small style="color:#9db3a8;font-weight:500">Super Core</small></div></div><div class="nav-title">Navegación</div><nav class="nav">${navLink('/app/dashboard','▦','Dashboard')}${navLink('/app/ventas','🛒','Ventas')}${navLink('/app/compras','🛍','Compras')}${navLink('/app/inventario','▣','Inventarios / Kardex')}${navLink('/app/tesoreria','🏦','Tesorería & Bancos')}${navLink('/app/cartera','📑','Cartera')}${navLink('/app/contabilidad','📒','Contabilidad PUC',true)}${navLink('/app/terceros','👥','Terceros')}${navLink('/app/configuracion','⚙','Configuración')}</nav></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn small mobile" id="menu">☰</button><div class="tenant"><strong>${esc(session.tenant?.nombreEmpresa||session.subdomain)}</strong><small>${esc(session.subdomain)} · ${esc(session.tenant?.pais||'')}</small></div></div><div class="user"><div style="text-align:right"><strong>${esc(session.user?.nombre||'Usuario')}</strong><div class="muted" style="font-size:12px">${esc(session.user?.rol||'')}</div></div><div class="avatar">${esc((session.user?.nombre||'U')[0])}</div><button class="btn small" id="logout">Salir</button></div></header><section class="content"><div class="pagehead"><div><h1>Contabilidad</h1><p>PUC, Libro Diario, partida doble, Mayor y estados financieros.</p></div><div class="toolbar"><button class="btn primary" id="quickJournal">+ Nuevo Asiento</button></div></div><div id="flash"></div><div class="tabs" id="tabs"><button class="tab active" data-tab="puc">Plan de Cuentas (PUC)</button><button class="tab" data-tab="diario">Libro Diario</button><button class="tab" data-tab="manual">Comprobante Manual</button><button class="tab" data-tab="mayor">Libro Mayor / Auxiliar</button><button class="tab" data-tab="reportes">Reportes Financieros</button></div><div id="view"></div></section></main></div>`}
function flash(msg,type='ok'){const el=$('#flash');if(el)el.innerHTML=`<div class="${type==='error'?'error':'notice'}">${esc(msg)}</div>`}
function bindShell(){$('#logout').onclick=()=>{localStorage.removeItem(sessionKey);location.href='/app'};$('#menu')?.addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$$('#tabs .tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('#quickJournal').onclick=()=>setTab('manual')}
function setTab(tab){currentTab=tab;$$('#tabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderTab()}
async function loadBase(){const [a,t]=await Promise.all([api('/api/v1/contabilidad/cuentas?limit=2000'),api('/api/v1/terceros?limit=500')]);accounts=a.data||[];thirdParties=t.data||[]}
function movementAccounts(){return accounts.filter(a=>a.activa&&a.permiteMovimiento)}
function accountOptions(selected=''){return movementAccounts().map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.codigo)} · ${esc(a.nombre)}</option>`).join('')}
function thirdPartyOptions(selected=''){return `<option value="">Sin tercero</option>`+thirdParties.map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${esc(t.identificacion)} · ${esc(t.nombre)}</option>`).join('')}
async function renderTab(){const v=$('#view');v.innerHTML='<div class="panel"><div class="empty">Cargando...</div></div>';try{if(currentTab==='puc')await renderPuc();if(currentTab==='diario')await renderDiario();if(currentTab==='manual')renderManual();if(currentTab==='mayor')renderMayor();if(currentTab==='reportes')renderReports()}catch(e){v.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function renderPuc(){const rows=accounts.map(a=>`<tr><td><div class="indent-${a.nivel}"><span class="tree-code">${esc(a.codigo)}</span>${esc(a.nombre)}</div></td><td>${esc(a.nivel)}</td><td>${esc(a.naturaleza)}</td><td>${a.permiteMovimiento?'<span class="ok">Sí</span>':'No'}</td><td>${a.versionCatalogo==='CUSTOM'?'<span class="badge b-manual">Personalizada</span>':esc(a.versionCatalogo||'')}</td></tr>`).join('');$('#view').innerHTML=`<div class="cards"><div class="card"><div class="label">Cuentas cargadas</div><div class="value">${accounts.length}</div></div><div class="card"><div class="label">Auxiliares con movimiento</div><div class="value">${movementAccounts().length}</div></div><div class="card"><div class="label">Versión catálogo</div><div class="value" style="font-size:15px">${esc(accounts.find(a=>a.versionCatalogo&&a.versionCatalogo!=='CUSTOM')?.versionCatalogo||'—')}</div></div><div class="card"><div class="label">Cuentas personalizadas</div><div class="value">${accounts.filter(a=>a.versionCatalogo==='CUSTOM').length}</div></div></div><div class="panel"><div class="panel-head"><h2>Plan de Cuentas</h2><button class="btn primary" id="newAccount">+ Crear Cuenta / Subcuenta</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Código / Cuenta</th><th>Nivel</th><th>Naturaleza</th><th>Movimiento</th><th>Origen</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">Sin cuentas</td></tr>'}</tbody></table></div></div>`;$('#newAccount').onclick=openAccountModal}
function openAccountModal(){const parentOptions=`<option value="">Sin cuenta padre</option>`+accounts.map(a=>`<option value="${a.id}">${esc(a.codigo)} · ${esc(a.nombre)}</option>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="accountModal"><form class="modal" id="accountForm"><h2>Crear Cuenta / Subcuenta</h2><div class="form-grid" style="padding:0"><div class="field"><label>Código</label><input class="input" name="codigo" required></div><div class="field"><label>Nombre</label><input class="input" name="nombre" required></div><div class="field"><label>Nivel</label><select class="select" name="nivel"><option>SUBCUENTA</option><option>AUXILIAR</option><option>CUENTA</option><option>GRUPO</option><option>CLASE</option></select></div><div class="field"><label>Naturaleza</label><select class="select" name="naturaleza"><option>DEBITO</option><option>CREDITO</option></select></div><div class="field" style="grid-column:span 2"><label>Cuenta padre</label><select class="select" name="parentId">${parentOptions}</select></div><div class="field"><label><input type="checkbox" name="permiteMovimiento" checked> Permite movimiento</label></div><div class="field"><label><input type="checkbox" name="requiereTercero"> Exige tercero</label></div></div><div class="modal-actions"><button type="button" class="btn" id="cancelAccount">Cancelar</button><button class="btn primary">Crear cuenta</button></div></form></div>`);$('#cancelAccount').onclick=()=>$('#accountModal').remove();$('#accountForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api('/api/v1/contabilidad/cuentas',{method:'POST',body:JSON.stringify({codigo:f.get('codigo'),nombre:f.get('nombre'),nivel:f.get('nivel'),naturaleza:f.get('naturaleza'),parentId:f.get('parentId')||null,permiteMovimiento:f.get('permiteMovimiento')==='on',requiereTercero:f.get('requiereTercero')==='on',activa:true})});$('#accountModal').remove();await loadBase();flash('Cuenta contable creada.');renderPuc()}catch(x){alert(x.message)}}}
async function renderDiario(){const r=await api('/api/v1/contabilidad/asientos?pageSize=200');const items=r.data||[];const rows=items.map(j=>`<tr class="clickable" data-journal="${j.id}"><td>${date(j.fecha)}</td><td>${esc(j.referencia||'—')}</td><td>${esc(j.concepto)}</td><td><span class="badge ${j.origen==='MANUAL'?'b-manual':j.origen==='REVERSO'?'b-rev':'b-auto'}">${esc(j.origen)}</span></td><td>${esc(j.estado)}</td><td class="money">${money(j.totalDebito)}</td><td class="money">${money(j.totalCredito)}</td></tr>`).join('');$('#view').innerHTML=`<div class="panel"><div class="panel-head"><h2>Libro Diario · Asientos Contables</h2><div class="toolbar"><span class="muted">${r.meta?.total??items.length} asientos</span><button class="btn primary" id="journalFromDaily">+ Nuevo Asiento</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Referencia</th><th>Concepto</th><th>Origen</th><th>Estado</th><th class="money">Débitos</th><th class="money">Créditos</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Aún no hay asientos.</td></tr>'}</tbody></table></div></div>`;$('#journalFromDaily').onclick=()=>setTab('manual');$$('[data-journal]').forEach(tr=>tr.onclick=()=>openJournal(tr.dataset.journal))}
async function openJournal(id){const r=await api(`/api/v1/contabilidad/asientos/${id}`),j=r.data;const rows=(j.detalles||[]).map(l=>`<tr><td>${esc(l.cuenta?.codigo)}</td><td>${esc(l.cuenta?.nombre)}</td><td>${esc(l.tercero?.nombre||'—')}</td><td>${esc(l.concepto||'')}</td><td class="money">${Number(l.debito)?money(l.debito):'—'}</td><td class="money">${Number(l.credito)?money(l.credito):'—'}</td></tr>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="journalModal"><div class="modal"><h2>Asiento · ${esc(j.referencia||j.id)}</h2><div class="toolbar" style="margin-bottom:14px"><span class="badge ${j.origen==='MANUAL'?'b-manual':'b-auto'}">${esc(j.origen)}</span><span>${date(j.fecha)}</span><strong>${esc(j.concepto)}</strong></div><div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Cuenta</th><th>Tercero</th><th>Concepto</th><th class="money">Débito</th><th class="money">Crédito</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="4">Totales</th><th class="money">${money(j.totalDebito)}</th><th class="money">${money(j.totalCredito)}</th></tr></tfoot></table></div><div class="notice" style="margin-top:12px">Partida doble: <strong>${Number(j.totalDebito)===Number(j.totalCredito)?'BALANCEADA':'REVISAR'}</strong></div><div class="modal-actions"><button class="btn" id="closeJournal">Cerrar</button></div></div></div>`);$('#closeJournal').onclick=()=>$('#journalModal').remove()}
function newLine(){return {cuentaId:movementAccounts()[0]?.id||'',terceroId:'',concepto:'',debito:0,credito:0}}
function renderManual(){if(manualLines.length<2)manualLines=[newLine(),newLine()];$('#view').innerHTML=`<form class="panel" id="journalForm"><div class="panel-head"><h2>+ Nuevo Asiento Manual</h2><span class="muted">Solo se contabiliza si Débitos = Créditos</span></div><div class="form-grid"><div class="field"><label>Fecha</label><input class="input" type="date" id="jDate" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Referencia</label><input class="input" id="jRef" placeholder="Ej. AJ-0001"></div><div class="field" style="grid-column:span 2"><label>Concepto general</label><input class="input" id="jConcept" placeholder="Descripción del asiento" required></div></div><div class="journal-lines"><div id="lineList"></div><button type="button" class="btn" id="addLine">+ Agregar línea</button></div><div class="balancebar"><div>Total Débitos: <span class="total" id="debitTotal">$0</span></div><div>Total Créditos: <span class="total" id="creditTotal">$0</span></div><div class="difference badbg" id="balanceState">Diferencia $0</div><button class="btn primary" id="postJournal" type="submit" disabled>Contabilizar Asiento</button></div></form>`;drawLines();$('#addLine').onclick=()=>{manualLines.push(newLine());drawLines()};$('#journalForm').onsubmit=submitJournal}
function drawLines(){const box=$('#lineList');box.innerHTML=manualLines.map((l,i)=>`<div class="line" data-i="${i}"><div><label>Cuenta auxiliar</label><select class="select line-account">${accountOptions(l.cuentaId)}</select></div><div><label>Tercero (si aplica)</label><select class="select line-third">${thirdPartyOptions(l.terceroId)}</select></div><div><label>Concepto línea</label><input class="input line-concept" value="${esc(l.concepto)}"></div><div><label>Débito</label><input class="input line-debit" type="number" min="0" step="0.01" value="${Number(l.debito)||''}"></div><div><label>Crédito</label><input class="input line-credit" type="number" min="0" step="0.01" value="${Number(l.credito)||''}"></div><button type="button" class="btn danger remove">×</button></div>`).join('');$$('.line').forEach(row=>{const i=Number(row.dataset.i),sync=()=>{manualLines[i]={cuentaId:row.querySelector('.line-account').value,terceroId:row.querySelector('.line-third').value,concepto:row.querySelector('.line-concept').value,debito:Number(row.querySelector('.line-debit').value||0),credito:Number(row.querySelector('.line-credit').value||0)};validateLive()};row.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',sync));row.querySelector('.remove').onclick=()=>{if(manualLines.length<=2)return alert('El asiento requiere al menos dos líneas.');manualLines.splice(i,1);drawLines()}});validateLive()}
function validateLive(){let d=0,c=0,validLines=true;for(const l of manualLines){d+=Number(l.debito||0);c+=Number(l.credito||0);const oneSide=(Number(l.debito)>0)!==(Number(l.credito)>0);if(!l.cuentaId||!oneSide)validLines=false}const diff=Math.abs(d-c);$('#debitTotal').textContent=money(d);$('#creditTotal').textContent=money(c);const balanced=validLines&&d>0&&diff<0.005;const state=$('#balanceState');state.textContent=balanced?'Partida doble balanceada':`Diferencia ${money(diff)}`;state.className=`difference ${balanced?'okbg':'badbg'}`;$('#postJournal').disabled=!balanced}
async function submitJournal(e){e.preventDefault();try{const payload={fecha:$('#jDate').value,referencia:$('#jRef').value||null,concepto:$('#jConcept').value,detalles:manualLines.map(l=>({cuentaId:l.cuentaId,terceroId:l.terceroId||null,concepto:l.concepto||null,debito:Number(l.debito||0),credito:Number(l.credito||0)}))};const r=await api('/api/v1/contabilidad/asientos',{method:'POST',body:JSON.stringify(payload)});manualLines=[];flash(`Asiento contabilizado: ${r.data.referencia||r.data.id}`);setTab('diario')}catch(x){flash(x.message,'error')}}
function renderMayor(){const opts=accountOptions();const today=new Date(),start=new Date(Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),1)).toISOString().slice(0,10),end=today.toISOString().slice(0,10);$('#view').innerHTML=`<div class="panel"><div class="panel-head"><h2>Libro Mayor / Auxiliar por Cuenta</h2></div><div class="form-grid"><div class="field" style="grid-column:span 2"><label>Cuenta</label><select class="select" id="ledgerAccount">${opts}</select></div><div class="field"><label>Desde</label><input class="input" type="date" id="ledgerFrom" value="${start}"></div><div class="field"><label>Hasta</label><input class="input" type="date" id="ledgerTo" value="${end}"></div></div><div style="padding:0 16px 16px"><button class="btn primary" id="loadLedger">Consultar Mayor</button></div><div id="ledgerResult"></div></div>`;$('#loadLedger').onclick=loadLedger}
async function loadLedger(){try{const id=$('#ledgerAccount').value,from=$('#ledgerFrom').value,to=$('#ledgerTo').value;const r=await api(`/api/v1/contabilidad/mayor?cuentaId=${encodeURIComponent(id)}&desde=${from}&hasta=${to}`),d=r.data;const rows=(d.movimientos||[]).map(m=>`<tr class="clickable" data-ledger-journal="${m.asientoId}"><td>${date(m.fecha)}</td><td>${esc(m.referencia||'—')}</td><td>${esc(m.concepto)}</td><td>${esc(m.tercero?.nombre||'—')}</td><td class="money">${Number(m.debito)?money(m.debito):'—'}</td><td class="money">${Number(m.credito)?money(m.credito):'—'}</td><td class="money"><strong>${money(m.saldo)}</strong></td></tr>`).join('');$('#ledgerResult').innerHTML=`<div class="cards" style="padding:0 16px"><div class="card"><div class="label">Cuenta</div><div class="value" style="font-size:16px">${esc(d.cuenta.codigo)} ${esc(d.cuenta.nombre)}</div></div><div class="card"><div class="label">Saldo inicial</div><div class="value">${money(d.saldoInicial)}</div></div><div class="card"><div class="label">Movimientos</div><div class="value">${d.movimientos.length}</div></div><div class="card"><div class="label">Saldo final</div><div class="value">${money(d.saldoFinal)}</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Referencia</th><th>Concepto</th><th>Tercero</th><th class="money">Débito</th><th class="money">Crédito</th><th class="money">Saldo</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Sin movimientos en el periodo.</td></tr>'}</tbody></table></div>`;$$('[data-ledger-journal]').forEach(tr=>tr.onclick=()=>openJournal(tr.dataset.ledgerJournal))}catch(x){flash(x.message,'error')}}
function renderReports(){const today=new Date(),start=new Date(Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),1)).toISOString().slice(0,10),end=today.toISOString().slice(0,10);$('#view').innerHTML=`<div class="panel"><div class="panel-head"><h2>Reportes Financieros</h2><div class="toolbar"><button class="btn primary" id="trialBtn">Balance de Prueba</button><button class="btn" id="plBtn">Estado de Resultados (P&G)</button></div></div><div class="form-grid"><div class="field"><label>Desde</label><input class="input" type="date" id="repFrom" value="${start}"></div><div class="field"><label>Hasta</label><input class="input" type="date" id="repTo" value="${end}"></div></div><div id="reportResult"></div></div>`;$('#trialBtn').onclick=loadTrial;$('#plBtn').onclick=loadPL;loadTrial()}
async function loadTrial(){try{const from=$('#repFrom').value,to=$('#repTo').value,r=await api(`/api/v1/contabilidad/reportes/balance-prueba?desde=${from}&hasta=${to}`),d=r.data;const rows=(d.rows||[]).map(x=>`<tr><td>${esc(x.codigo)}</td><td>${esc(x.nombre)}</td><td class="money">${money(x.debitos)}</td><td class="money">${money(x.creditos)}</td><td class="money">${money(x.saldoDebito)}</td><td class="money">${money(x.saldoCredito)}</td></tr>`).join('');$('#reportResult').innerHTML=`<div class="report-block"><div class="notice">Balance de prueba: <strong>${d.balanceado?'DÉBITOS = CRÉDITOS':'REVISAR DESCUADRE'}</strong></div><div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Cuenta</th><th class="money">Débitos</th><th class="money">Créditos</th><th class="money">Saldo Débito</th><th class="money">Saldo Crédito</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">Sin movimientos.</td></tr>'}</tbody><tfoot><tr><th colspan="2">Totales</th><th class="money">${money(d.totals.debitos)}</th><th class="money">${money(d.totals.creditos)}</th><th class="money">${money(d.totals.saldoDebito)}</th><th class="money">${money(d.totals.saldoCredito)}</th></tr></tfoot></table></div></div>`}catch(x){flash(x.message,'error')}}
async function loadPL(){try{const from=$('#repFrom').value,to=$('#repTo').value,r=await api(`/api/v1/contabilidad/reportes/estado-resultados?desde=${from}&hasta=${to}`),d=r.data;const section=(title,rows,total)=>`<div class="report-title">${title}</div><div class="table-wrap"><table class="table"><tbody>${rows.map(x=>`<tr><td>${esc(x.codigo)}</td><td>${esc(x.nombre)}</td><td class="money">${money(x.valor)}</td></tr>`).join('')||'<tr><td class="muted">Sin movimientos</td></tr>'}</tbody><tfoot><tr><th colspan="2">Total ${title}</th><th class="money">${money(total)}</th></tr></tfoot></table></div>`;$('#reportResult').innerHTML=`<div class="report-block">${section('Ingresos',d.ingresos,d.totales.totalIngresos)}${section('Costos de ventas',d.costos,d.totales.totalCostos)}${section('Gastos',d.gastos,d.totales.totalGastos)}<div class="card" style="margin-top:14px"><div class="label">Resultado del periodo</div><div class="value">${money(d.totales.utilidad)}</div></div></div>`}catch(x){flash(x.message,'error')}}
async function boot(){document.querySelector('#root').innerHTML=shell();bindShell();try{await loadBase();renderTab()}catch(e){flash(e.message,'error')}}
boot();
</script>
</body>
</html>
