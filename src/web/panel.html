<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VantixGC Super Core</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--border:#e4e4e7;--text:#18221d;--muted:#61706a;--green:#0d6b43;--green2:#118a57;--soft:#ddf3e8;--gold:#d4a62a;--danger:#b42318;--warn:#b54708;--blue:#175cd3;--nav:#10241b;--nav2:#173429}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:var(--nav);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px;font-weight:800;font-size:18px}.brandmark{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#fff,#dff2e8);color:var(--green);display:grid;place-items:center;font-weight:900}.nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#92aa9f;padding:14px 10px 8px}.nav a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#d9e6e0;padding:10px 11px;margin:3px 0;border-radius:10px;font-size:14px}.nav a:hover,.nav a.active{background:var(--nav2);color:#fff}.nav .icon{width:22px;text-align:center}.main{min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10}.tenant{font-weight:800}.tenant small{display:block;color:var(--muted);font-weight:500;margin-top:2px}.userbox{display:flex;align-items:center;gap:12px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--green);display:grid;place-items:center;font-weight:800}.content{padding:26px;max-width:1500px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.pagehead h1{font-size:26px;margin:0 0 5px}.pagehead p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}.btn:hover{background:#fafafa}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:#fff5f5;color:var(--danger);border-color:#fecaca}.btn.small{padding:7px 10px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:25px;font-weight:850;margin-top:8px}.metric .hint{font-size:12px;color:var(--muted);margin-top:5px}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:18px}.panel-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-head h2{font-size:16px;margin:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.input,.select,textarea{border:1px solid #d0d5dd;background:#fff;border-radius:9px;padding:9px 11px;outline:none;color:var(--text)}.input:focus,.select:focus,textarea:focus{border-color:#8cbda8;box-shadow:0 0 0 3px #e7f4ed}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:14px}.table th{background:#fafafa;color:#475467;text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}.table td{padding:12px 14px;border-bottom:1px solid #f0f1f2;vertical-align:middle}.table tr:hover td{background:#fcfcfc}.money{text-align:right!important;font-variant-numeric:tabular-nums}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.b-draft{background:#f2f4f7;color:#475467}.b-issued{background:#eff8ff;color:#175cd3}.b-partial{background:#fff7ed;color:#b54708}.b-paid{background:#ecfdf3;color:#027a48}.b-cancel{background:#fef3f2;color:#b42318}.tabs{display:flex;gap:5px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--border)}.tab{border:0;background:transparent;padding:8px 11px;border-radius:8px;cursor:pointer;color:#667085;font-weight:700}.tab.active{background:var(--soft);color:var(--green)}.empty{padding:46px;text-align:center;color:var(--muted)}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef7f2,#f8f8f7)}.login{width:min(440px,100%);background:#fff;border:1px solid var(--border);border-radius:18px;padding:28px}.login h1{margin:0 0 6px}.login p{color:var(--muted);margin:0 0 22px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{width:100%}.error{background:#fff1f0;color:#b42318;border:1px solid #fecaca;border-radius:9px;padding:10px 12px;margin:10px 0;font-size:13px}.notice{background:#f0f9f4;color:#166534;border:1px solid #bbdec9;border-radius:10px;padding:11px 13px;margin-bottom:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.line-editor{display:grid;grid-template-columns:2fr .7fr 1fr .65fr .8fr 42px;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid #f0f1f2}.line-editor label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}.line-editor input,.line-editor select{width:100%}.totals{margin-left:auto;width:min(390px,100%);padding:16px}.total-row{display:flex;justify-content:space-between;padding:6px 0;color:#475467}.total-row.final{font-size:20px;font-weight:850;color:var(--text);border-top:1px solid var(--border);margin-top:6px;padding-top:12px}.invoice{max-width:1000px;margin:auto}.invoice-top{display:flex;justify-content:space-between;gap:20px}.invoice-number{text-align:right}.invoice-number strong{font-size:22px}.audit-tabs{display:flex;gap:5px;border-bottom:1px solid var(--border);padding:0 16px}.audit-tab{padding:12px 10px;border:0;background:none;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:2px solid transparent}.audit-tab.active{color:var(--green);border-color:var(--green)}.audit-body{padding:18px}.kv{display:grid;grid-template-columns:170px 1fr;gap:7px 14px;font-size:14px}.kv div:nth-child(odd){color:var(--muted)}.modal-back{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:20px;z-index:50}.modal{background:#fff;border-radius:16px;width:min(520px,100%);padding:22px}.modal h2{margin:0 0 16px}.loading{padding:40px;text-align:center;color:var(--muted)}.pager{display:flex;justify-content:flex-end;gap:8px;padding:14px}.mobile-toggle{display:none}.muted{color:var(--muted)}.danger-text{color:var(--danger)}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.line-editor{grid-template-columns:1fr 1fr 1fr}.line-editor>div:first-child{grid-column:span 3}.line-editor>button{width:42px}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:40;width:250px;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.mobile-toggle{display:inline-flex}.topbar{padding:0 14px}.content{padding:18px 12px}.cards{grid-template-columns:1fr}.grid2,.grid3{grid-template-columns:1fr}.pagehead{flex-direction:column}.line-editor{grid-template-columns:1fr 1fr}.line-editor>div:first-child{grid-column:span 2}.invoice-top{flex-direction:column}.invoice-number{text-align:left}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={session:null,cache:{},salesTab:'TODAS',auditTab:'general'};
const sessionKey='vantixgc_core_session_v1';
function loadSession(){try{state.session=JSON.parse(localStorage.getItem(sessionKey)||'null')}catch{state.session=null}}
function saveSession(s){state.session=s;localStorage.setItem(sessionKey,JSON.stringify(s))}
function logout(){localStorage.removeItem(sessionKey);state.session=null;location.href='/app'}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]))}
function money(v){return new Intl.NumberFormat('es-CO',{style:'currency',currency:state.session?.tenant?.moneda||'COP',maximumFractionDigits:0}).format(Number(v||0))}
function date(v){if(!v)return '—';return new Intl.DateTimeFormat('es-CO',{dateStyle:'medium'}).format(new Date(v))}
function stateBadge(s){const c={BORRADOR:'b-draft',EMITIDO:'b-issued',CONFIRMADO:'b-issued',PAGADO_PARCIAL:'b-partial',PAGADO_TOTAL:'b-paid',ANULADO:'b-cancel'}[s]||'b-draft';return `<span class="badge ${c}">${esc(s)}</span>`}
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(state.session){headers.Authorization=`Bearer ${state.session.token}`;headers['x-tenant-subdomain']=state.session.subdomain}const r=await fetch(path,{...opts,headers});let body={};try{body=await r.json()}catch{}if(r.status===401&&state.session){logout();throw new Error('Sesión vencida')}if(!r.ok)throw new Error(body?.error?.message||body?.message||`Error HTTP ${r.status}`);return body}
function nav(path){history.pushState({},'',path);render()}
window.addEventListener('popstate',render);
function icon(x){return `<span class="icon">${x}</span>`}
const navItems=[['/app/dashboard','▦','Dashboard'],['/app/ventas','🛒','Ventas'],['/app/compras','🛍','Compras'],['/app/inventario','▣','Inventarios / Kardex'],['/app/tesoreria','🏦','Tesorería & Bancos'],['/app/cartera','📑','Cartera'],['/app/contabilidad','📒','Contabilidad PUC'],['/app/terceros','👥','Terceros'],['/app/configuracion','⚙','Configuración']];
function shell(content){const p=location.pathname;return `<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">V</div><div>VantixGC<br><small style="font-weight:500;color:#9db3a8">Super Core</small></div></div><div class="nav-title">Navegación</div><nav class="nav">${navItems.map(([href,i,t])=>`<a href="${href}" data-nav class="${p===href||p.startsWith(href+'/')?'active':''}">${icon(i)}<span>${t}</span></a>`).join('')}</nav></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn small mobile-toggle" id="menuToggle">☰</button><div class="tenant">${esc(state.session.tenant?.nombreEmpresa||state.session.subdomain)}<small>${esc(state.session.subdomain)} · ${esc(state.session.tenant?.pais||'')}</small></div></div><div class="userbox"><div style="text-align:right"><strong>${esc(state.session.user?.nombre||'Usuario')}</strong><div class="muted" style="font-size:12px">${esc(state.session.user?.rol||'')}</div></div><div class="avatar">${esc((state.session.user?.nombre||'U')[0])}</div><button class="btn small" id="logout">Salir</button></div></header><section class="content">${content}</section></main></div>`}
function bindShell(){document.querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();nav(a.getAttribute('href'))});$('#logout')?.addEventListener('click',logout);$('#menuToggle')?.addEventListener('click',()=>$('#sidebar').classList.toggle('open'))}
function renderLogin(){document.querySelector('#root').innerHTML=`<div class="login-wrap"><form class="login" id="loginForm"><div class="brand" style="color:var(--text);padding:0 0 20px"><div class="brandmark" style="background:var(--soft)">V</div><div>VantixGC Super Core</div></div><h1>Panel administrativo</h1><p>Ingresa a la empresa usando el subdominio asignado y tu usuario.</p><div id="loginError"></div><div class="field"><label>Subdominio de empresa</label><input class="input" name="subdomain" placeholder="miempresa" required autocomplete="organization"></div><div class="field"><label>Correo electrónico</label><input class="input" type="email" name="email" required autocomplete="username"></div><div class="field"><label>Contraseña</label><input class="input" type="password" name="password" required autocomplete="current-password"></div><button class="btn primary" style="width:100%" type="submit">Ingresar al Super Core</button><div class="muted" style="font-size:12px;margin-top:14px">El tenant se resuelve en el servidor. El token JWT nunca define por sí solo la empresa activa.</div></form></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),subdomain=String(f.get('subdomain')).trim().toLowerCase();const err=$('#loginError');err.innerHTML='';try{const login=await api('/api/v1/auth/login',{method:'POST',headers:{'x-tenant-subdomain':subdomain},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});const token=login.data.token;const sessionResp=await fetch('/api/v1/auth/session',{headers:{Authorization:`Bearer ${token}`,'x-tenant-subdomain':subdomain}});const sj=await sessionResp.json();if(!sessionResp.ok)throw new Error(sj?.error?.message||'No fue posible abrir la sesión');saveSession({token,subdomain,tenant:sj.data.tenant,user:sj.data.user});location.href='/app/dashboard'}catch(x){err.innerHTML=`<div class="error">${esc(x.message)}</div>`}}}
async function viewDashboard(){let sales=[],products=[],cartera=[];try{[sales,products,cartera]=await Promise.all([api('/api/v1/comercial/ventas?page=1&pageSize=200'),api('/api/v1/inventario/productos?limit=200'),api('/api/v1/tesoreria/cartera?limit=200')])}catch(e){return errorView(e)}const s=sales.data||[],p=products.data||[],c=cartera.data||[];const emitted=s.filter(x=>x.estado!=='BORRADOR'&&x.estado!=='ANULADO');const total=emitted.reduce((a,x)=>a+Number(x.total||0),0),pending=c.filter(x=>['PENDIENTE','PARCIAL'].includes(x.estado)).reduce((a,x)=>a+Number(x.saldo||0),0);return `<div class="pagehead"><div><h1>Dashboard</h1><p>Resumen operativo del tenant actual.</p></div><div class="actions"><button class="btn primary" onclick="nav('/app/ventas/nueva')">+ Nueva venta</button></div></div><div class="cards"><div class="card metric"><div class="label">Ventas registradas</div><div class="value">${s.length}</div><div class="hint">Última página consultada</div></div><div class="card metric"><div class="label">Valor de ventas</div><div class="value">${money(total)}</div><div class="hint">Sin borradores ni anuladas</div></div><div class="card metric"><div class="label">Cartera pendiente</div><div class="value">${money(pending)}</div><div class="hint">CxC / CxP abiertas</div></div><div class="card metric"><div class="label">Productos activos</div><div class="value">${p.filter(x=>x.activo).length}</div><div class="hint">Catálogo del tenant</div></div></div><div class="panel"><div class="panel-head"><h2>Ventas recientes</h2><button class="btn small" onclick="nav('/app/ventas')">Ver todas</button></div>${salesTable(s.slice(0,8))}</div>`}
function salesTable(items){if(!items.length)return `<div class="empty">No hay ventas para mostrar.</div>`;return `<div class="table-wrap"><table class="table"><thead><tr><th>N° Factura</th><th>Fecha</th><th>Cliente</th><th class="money">Total</th><th class="money">Saldo</th><th>Estado</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td><strong>${esc(x.numero)}</strong></td><td>${date(x.fecha)}</td><td>${esc(x.tercero?.nombre||x.tercero?.razonSocial||'Cliente genérico')}</td><td class="money">${money(x.total)}</td><td class="money">${money(x.saldo)}</td><td>${stateBadge(x.estado)}</td><td><button class="btn small" onclick="nav('/app/ventas/${x.id}')">Ver</button></td></tr>`).join('')}</tbody></table></div>`}
async function viewSales(){const qs=new URLSearchParams(location.search);const tab=qs.get('estado')||state.salesTab||'TODAS';state.salesTab=tab;let q=new URLSearchParams({page:qs.get('page')||1,pageSize:50});if(!['TODAS','PAGADO'].includes(tab))q.set('estado',tab);['desde','hasta','terceroId','montoMin','montoMax'].forEach(k=>{if(qs.get(k))q.set(k,qs.get(k))});let r;try{r=await api('/api/v1/comercial/ventas?'+q)}catch(e){return errorView(e)}let items=r.data||[];if(tab==='PAGADO')items=items.filter(x=>['PAGADO_PARCIAL','PAGADO_TOTAL'].includes(x.estado));return `<div class="pagehead"><div><h1>Ventas</h1><p>Ciclo documental completo, desde borrador hasta pago o anulación.</p></div><div class="actions"><button class="btn primary" onclick="nav('/app/ventas/nueva')">+ Nueva venta</button></div></div><div class="panel"><div class="tabs">${['TODAS','BORRADOR','EMITIDO','PAGADO','ANULADO'].map(t=>`<button class="tab ${t===tab?'active':''}" onclick="filterSales('${t}')">${t}</button>`).join('')}</div><div class="panel-head"><div class="toolbar"><input class="input" type="date" id="vDesde" value="${esc(qs.get('desde')||'')}"><input class="input" type="date" id="vHasta" value="${esc(qs.get('hasta')||'')}"><input class="input" type="number" id="vMin" placeholder="Monto mínimo" value="${esc(qs.get('montoMin')||'')}"><input class="input" type="number" id="vMax" placeholder="Monto máximo" value="${esc(qs.get('montoMax')||'')}"><button class="btn small" onclick="applySalesFilters()">Filtrar</button></div><span class="muted">${r.meta?.total??items.length} registros</span></div>${salesTable(items)}<div class="pager"><button class="btn small" ${Number(r.meta?.page||1)<=1?'disabled':''} onclick="salesPage(-1)">Anterior</button><span class="muted" style="padding:8px">Página ${r.meta?.page||1} de ${r.meta?.pages||1}</span><button class="btn small" ${Number(r.meta?.page||1)>=Number(r.meta?.pages||1)?'disabled':''} onclick="salesPage(1)">Siguiente</button></div></div>`}
function filterSales(t){const q=new URLSearchParams(location.search);q.set('estado',t);q.set('page','1');history.pushState({},'',`/app/ventas?${q}`);render()}
function applySalesFilters(){const q=new URLSearchParams(location.search);[['desde','#vDesde'],['hasta','#vHasta'],['montoMin','#vMin'],['montoMax','#vMax']].forEach(([k,s])=>{const v=$(s).value;if(v)q.set(k,v);else q.delete(k)});q.set('page','1');history.pushState({},'',`/app/ventas?${q}`);render()}
function salesPage(d){const q=new URLSearchParams(location.search);q.set('page',String(Math.max(1,Number(q.get('page')||1)+d)));history.pushState({},'',`/app/ventas?${q}`);render()}
async function viewNewSale(){let thirds,products,cash;try{[thirds,products,cash]=await Promise.all([api('/api/v1/terceros?activo=true&limit=500'),api('/api/v1/inventario/productos?activo=true&limit=500'),api('/api/v1/tesoreria/cajas-bancos')])}catch(e){return errorView(e)}state.cache.clients=(thirds.data||[]).filter(x=>['CLIENTE','CLIENTE_PROVEEDOR'].includes(x.tipo));state.cache.products=products.data||[];state.cache.cash=cash.data||[];return `<div class="pagehead"><div><h1>Nueva venta</h1><p>Guarda como borrador o emite con afectación atómica.</p></div><button class="btn" onclick="nav('/app/ventas')">← Volver</button></div><form id="saleForm"><div class="panel"><div class="panel-head"><h2>Datos generales</h2></div><div style="padding:18px" class="grid3"><div class="field"><label>Cliente</label><select class="select" id="cliente"><option value="">Cliente genérico</option>${state.cache.clients.map(x=>`<option value="${x.id}">${esc(x.identificacion)} · ${esc(x.nombre)}</option>`).join('')}</select></div><div class="field"><label>Forma de pago</label><select class="select" id="forma" onchange="toggleCash()"><option value="CREDITO">Crédito</option><option value="EFECTIVO">Efectivo</option><option value="BANCO">Transferencia / Banco</option></select></div><div class="field hidden" id="cashField"><label>Caja / Banco</label><select class="select" id="caja"><option value="">Seleccionar</option>${state.cache.cash.map(x=>`<option value="${x.id}">${esc(x.nombre)} · ${esc(x.tipo)}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input class="input" id="fecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Vencimiento</label><input class="input" id="vence" type="date"></div><div class="field"><label>Observaciones</label><input class="input" id="obs" maxlength="500" placeholder="Opcional"></div></div></div><div class="panel"><div class="panel-head"><h2>Productos</h2><button class="btn small" type="button" onclick="addLine()">+ Agregar línea</button></div><div style="padding:8px 18px" id="lines"></div><div class="totals"><div class="total-row"><span>Subtotal</span><strong id="sub">$0</strong></div><div class="total-row"><span>IVA</span><strong id="iva">$0</strong></div><div class="total-row"><span>Impoconsumo</span><strong id="imp">$0</strong></div><div class="total-row final"><span>Total</span><span id="total">$0</span></div></div></div><div id="saleError"></div><div class="actions" style="justify-content:flex-end"><button class="btn" type="button" onclick="submitSale('BORRADOR')">Guardar borrador</button><button class="btn primary" type="button" onclick="submitSale('EMITIDO')">Emitir factura</button></div></form>`}
let lineSeq=0;function addLine(seed={}){const id=++lineSeq,wrap=document.createElement('div');wrap.className='line-editor';wrap.dataset.id=id;wrap.innerHTML=`<div><label>Producto</label><select class="select prod" onchange="productChanged(this)"><option value="">Seleccione producto</option>${(state.cache.products||[]).map(p=>`<option value="${p.id}" ${seed.productoId===p.id?'selected':''}>${esc(p.sku)} · ${esc(p.nombre)} · Stock ${Number(p.stockActual||0)}</option>`).join('')}</select><div class="muted stock" style="font-size:11px;margin-top:4px"></div></div><div><label>Cantidad</label><input class="input qty" type="number" min="0.0001" step="0.0001" value="${seed.cantidad||1}" oninput="calcSale()"></div><div><label>Precio unitario</label><input class="input price" type="number" min="0" step="0.01" value="${seed.precioUnitario||0}" oninput="calcSale()"></div><div><label>IVA %</label><input class="input vat" type="number" min="0" max="100" step="0.01" value="${seed.ivaPct||0}" oninput="calcSale()"></div><div><label>Total línea</label><input class="input lineTotal" readonly value="$0"></div><button class="btn small danger" type="button" onclick="this.closest('.line-editor').remove();calcSale()">×</button>`;$('#lines').appendChild(wrap);if(seed.productoId)productChanged(wrap.querySelector('.prod'));calcSale()}
function productChanged(sel){const p=(state.cache.products||[]).find(x=>x.id===sel.value),row=sel.closest('.line-editor');if(p){row.querySelector('.price').value=Number(p.precio1||0);row.querySelector('.vat').value=Number(p.ivaPct||0);row.querySelector('.stock').textContent=`Disponible: ${Number(p.stockActual||0)} ${p.unidadMedida||''}`;}else row.querySelector('.stock').textContent='';calcSale()}
function calcSale(){let sub=0,iva=0,imp=0;$$('.line-editor').forEach(r=>{const q=Number(r.querySelector('.qty').value||0),p=Number(r.querySelector('.price').value||0),v=Number(r.querySelector('.vat').value||0),prod=(state.cache.products||[]).find(x=>x.id===r.querySelector('.prod').value),ic=Number(prod?.impoconsumoPct||0),base=q*p,iv=base*v/100,ip=base*ic/100,total=base+iv+ip;sub+=base;iva+=iv;imp+=ip;r.querySelector('.lineTotal').value=money(total)});if($('#sub')){$('#sub').textContent=money(sub);$('#iva').textContent=money(iva);$('#imp').textContent=money(imp);$('#total').textContent=money(sub+iva+imp)}}
function toggleCash(){const cash=$('#cashField');cash.classList.toggle('hidden',$('#forma').value==='CREDITO')}
function salePayload(estado){const details=$$('.line-editor').map(r=>{const prod=(state.cache.products||[]).find(x=>x.id===r.querySelector('.prod').value);return {productoId:r.querySelector('.prod').value||undefined,cantidad:Number(r.querySelector('.qty').value),precioUnitario:Number(r.querySelector('.price').value),ivaPct:Number(r.querySelector('.vat').value),impoconsumoPct:Number(prod?.impoconsumoPct||0)}}).filter(x=>x.productoId);const forma=$('#forma').value;return {estado,terceroId:$('#cliente').value||undefined,formaPago:forma,cajaBancoId:forma==='CREDITO'?undefined:($('#caja').value||undefined),fecha:$('#fecha').value||undefined,fechaVencimiento:$('#vence').value||undefined,observaciones:$('#obs').value||undefined,detalles:details}}
async function submitSale(estado){const err=$('#saleError');err.innerHTML='';const payload=salePayload(estado);if(!payload.detalles.length){err.innerHTML='<div class="error">Agrega al menos un producto.</div>';return}if(payload.formaPago!=='CREDITO'&&!payload.cajaBancoId){err.innerHTML='<div class="error">Selecciona la caja o banco para una venta de contado.</div>';return}try{const r=await api('/api/v1/comercial/ventas',{method:'POST',body:JSON.stringify(payload)});nav('/app/ventas/'+r.data.id)}catch(e){err.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function viewSaleDetail(id){let r,cash;try{[r,cash]=await Promise.all([api('/api/v1/comercial/ventas/'+id),api('/api/v1/tesoreria/cajas-bancos')])}catch(e){return errorView(e)}const d=r.data;state.cache.cash=cash.data||[];const tab=state.auditTab;return `<div class="pagehead"><div><h1>Venta ${esc(d.numero)}</h1><p>${stateBadge(d.estado)} · ${date(d.fecha)}</p></div><div class="actions">${['EMITIDO','PAGADO_PARCIAL'].includes(d.estado)&&Number(d.saldo)>0?`<button class="btn primary" onclick="openPayment('${d.id}',${Number(d.saldo)})">Registrar abono</button>`:''}${d.estado==='BORRADOR'?`<button class="btn primary" onclick="emitSale('${d.id}')">Emitir factura</button>`:''}${!['ANULADO','BORRADOR'].includes(d.estado)?`<button class="btn danger" onclick="cancelSale('${d.id}')">Anular</button>`:''}<button class="btn" onclick="nav('/app/ventas')">Volver</button></div></div><div class="panel invoice"><div class="audit-tabs">${[['general','📄 General'],['kardex','📦 Kardex'],['asiento','📒 Asiento contable'],['pagos','💳 Pagos / Cartera']].map(([k,t])=>`<button class="audit-tab ${tab===k?'active':''}" onclick="audit('${k}')">${t}</button>`).join('')}</div><div class="audit-body">${auditBody(d,tab)}</div></div>`}
function audit(k){state.auditTab=k;render()}
function auditBody(d,tab){if(tab==='general')return `<div class="invoice-top"><div><h2 style="margin-top:0">${esc(state.session.tenant?.nombreEmpresa||'Empresa')}</h2><div class="muted">Cliente</div><strong>${esc(d.tercero?.nombre||d.tercero?.razonSocial||'Cliente genérico')}</strong></div><div class="invoice-number"><div class="muted">Factura</div><strong>${esc(d.numero)}</strong><div>${date(d.fecha)}</div></div></div><div class="table-wrap" style="margin-top:20px"><table class="table"><thead><tr><th>Descripción</th><th class="money">Cantidad</th><th class="money">Precio</th><th class="money">IVA</th><th class="money">Total</th></tr></thead><tbody>${(d.detalles||[]).map(x=>`<tr><td>${esc(x.descripcion)}</td><td class="money">${Number(x.cantidad)}</td><td class="money">${money(x.precioUnitario)}</td><td class="money">${money(x.ivaValor)}</td><td class="money">${money(x.totalLinea)}</td></tr>`).join('')}</tbody></table></div><div class="totals"><div class="total-row"><span>Subtotal</span><strong>${money(d.subtotal)}</strong></div><div class="total-row"><span>IVA</span><strong>${money(d.ivaTotal)}</strong></div><div class="total-row"><span>Saldo pendiente</span><strong>${money(d.saldo)}</strong></div><div class="total-row final"><span>Total</span><span>${money(d.total)}</span></div></div>`;if(tab==='kardex'){const m=d.movimientosInventario||[];return m.length?`<table class="table"><thead><tr><th>Tipo</th><th>Producto</th><th class="money">Cantidad</th><th class="money">Costo</th><th class="money">Stock anterior</th><th class="money">Stock nuevo</th></tr></thead><tbody>${m.map(x=>`<tr><td>${esc(x.tipo)}</td><td>${esc(x.productoId)}</td><td class="money">${Number(x.cantidad)}</td><td class="money">${money(x.costoTotal)}</td><td class="money">${Number(x.stockAnterior)}</td><td class="money">${Number(x.stockNuevo)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Este documento no tiene movimientos de Kardex.</div>'}if(tab==='asiento'){const a=d.asiento;if(!a)return '<div class="empty">Aún no existe asiento contable para este documento.</div>';return `<div class="notice">Débitos ${money(a.totalDebito)} · Créditos ${money(a.totalCredito)} · ${Number(a.totalDebito)===Number(a.totalCredito)?'Partida doble balanceada':'REVISAR BALANCE'}</div><table class="table"><thead><tr><th>Cuenta</th><th>Concepto</th><th class="money">Débito</th><th class="money">Crédito</th></tr></thead><tbody>${(a.detalles||[]).map(x=>`<tr><td>${esc(x.cuenta?.codigo||x.cuentaId)} ${esc(x.cuenta?.nombre||'')}</td><td>${esc(x.concepto||'')}</td><td class="money">${money(x.debito)}</td><td class="money">${money(x.credito)}</td></tr>`).join('')}</tbody></table>`}const c=d.cartera||[];return c.length?c.map(x=>`<div class="card" style="margin-bottom:10px"><div class="grid2"><div><div class="muted">Cartera</div><strong>${esc(x.tipo)} · ${esc(x.estado)}</strong></div><div><div class="muted">Saldo</div><strong>${money(x.saldo)}</strong></div></div>${(x.movimientos||[]).length?`<table class="table" style="margin-top:12px"><tbody>${x.movimientos.map(m=>`<tr><td>${esc(m.tipo)}</td><td>${date(m.creadoEn)}</td><td>${esc(m.referencia||'')}</td><td class="money">${money(m.valor)}</td><td class="money">Saldo ${money(m.saldoNuevo)}</td></tr>`).join('')}</tbody></table>`:''}</div>`).join(''):'<div class="empty">No hay cartera ni pagos pendientes asociados.</div>'}
async function emitSale(id){try{await api(`/api/v1/comercial/ventas/${id}/emitir`,{method:'POST',body:'{}'});render()}catch(e){alert(e.message)}}
async function cancelSale(id){const motivo=prompt('Motivo de anulación (se crearán los reversos automáticos):');if(!motivo)return;try{await api(`/api/v1/comercial/ventas/${id}/anular`,{method:'POST',body:JSON.stringify({motivo})});render()}catch(e){alert(e.message)}}
function openPayment(id,saldo){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="payModal"><form class="modal" id="payForm"><h2>Registrar abono</h2><div class="notice">Saldo disponible: <strong>${money(saldo)}</strong></div><div class="field"><label>Monto</label><input class="input" id="payMonto" type="number" min="0.01" max="${saldo}" step="0.01" value="${saldo}" required></div><div class="field"><label>Método</label><select class="select" id="payMetodo"><option value="EFECTIVO">Efectivo</option><option value="TRANSFERENCIA">Transferencia</option><option value="TARJETA">Tarjeta</option></select></div><div class="field"><label>Caja / Banco</label><select class="select" id="payCaja" required>${(state.cache.cash||[]).map(x=>`<option value="${x.id}">${esc(x.nombre)} · ${esc(x.tipo)}</option>`).join('')}</select></div><div class="field"><label>Referencia</label><input class="input" id="payRef" placeholder="Opcional"></div><div id="payError"></div><div class="actions" style="justify-content:flex-end"><button class="btn" type="button" onclick="$('#payModal').remove()">Cancelar</button><button class="btn primary" type="submit">Registrar pago</button></div></form></div>`);$('#payForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/v1/pagos',{method:'POST',body:JSON.stringify({documentoId:id,monto:Number($('#payMonto').value),metodoPago:$('#payMetodo').value,cajaBancoId:$('#payCaja').value,referencia:$('#payRef').value||undefined,sourceId:`WEB-${id}-${Date.now()}`})});$('#payModal').remove();render()}catch(x){$('#payError').innerHTML=`<div class="error">${esc(x.message)}</div>`}}}
async function viewGeneric(kind){const defs={terceros:['Terceros','Clientes y proveedores','/api/v1/terceros?limit=200',['identificacion','nombre','tipo','telefono','email']],inventario:['Inventarios / Kardex','Productos y existencias','/api/v1/inventario/productos?limit=200',['sku','nombre','stockActual','costoPromedio','precio1']],tesoreria:['Tesorería & Bancos','Cajas y cuentas bancarias','/api/v1/tesoreria/cajas-bancos',['nombre','tipo','banco','numeroCuenta','saldoActual']],cartera:['Cartera','Cuentas por cobrar y pagar','/api/v1/tesoreria/cartera?limit=200',['tipo','estado','referencia','valorOriginal','saldo']],compras:['Compras','Documentos de proveedores','/api/v1/comercial/compras?page=1&pageSize=100',['numero','fecha','estado','total','saldo']],contabilidad:['Contabilidad PUC','Plan de cuentas del tenant','/api/v1/contabilidad/cuentas?limit=1000',['codigo','nombre','nivel','naturaleza','activa']]};const d=defs[kind];let r;try{r=await api(d[2])}catch(e){return errorView(e)}const rows=r.data||[];return `<div class="pagehead"><div><h1>${d[0]}</h1><p>${d[1]}</p></div>${kind==='compras'?'<button class="btn primary" disabled>Nueva compra · próxima iteración</button>':''}</div><div class="panel"><div class="panel-head"><h2>${d[0]}</h2><span class="muted">${r.meta?.total??rows.length} registros</span></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr>${d[3].map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(x=>`<tr>${d[3].map(k=>`<td>${k==='total'||k==='saldo'||k==='valorOriginal'||k==='precio1'||k==='costoPromedio'?money(x[k]):esc(x[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay registros.</div>'}</div>`}
function viewConfig(){const t=state.session.tenant,u=state.session.user;return `<div class="pagehead"><div><h1>Configuración del Tenant</h1><p>Identidad y sesión activa.</p></div></div><div class="panel"><div class="panel-head"><h2>Empresa</h2></div><div class="audit-body kv"><div>Empresa</div><div><strong>${esc(t?.nombreEmpresa)}</strong></div><div>Subdominio</div><div>${esc(state.session.subdomain)}</div><div>País</div><div>${esc(t?.pais)}</div><div>Moneda</div><div>${esc(t?.moneda)}</div><div>Usuario</div><div>${esc(u?.nombre)} · ${esc(u?.email||'')}</div><div>Rol</div><div>${esc(u?.rol)}</div></div></div>`}
function errorView(e){return `<div class="error"><strong>No fue posible cargar el módulo.</strong><br>${esc(e.message)}</div>`}
async function render(){loadSession();if(!state.session){renderLogin();return}const root=$('#root');root.innerHTML=shell('<div class="loading">Cargando módulo…</div>');bindShell();const path=location.pathname;let html;try{if(path==='/app'||path==='/app/') {history.replaceState({},'','/app/dashboard');return render()}if(path==='/app/dashboard')html=await viewDashboard();else if(path==='/app/ventas/nueva')html=await viewNewSale();else if(/^\/app\/ventas\/[^/]+$/.test(path))html=await viewSaleDetail(path.split('/').pop());else if(path==='/app/ventas')html=await viewSales();else if(path==='/app/configuracion')html=viewConfig();else if(path==='/app/terceros')html=await viewGeneric('terceros');else if(path==='/app/inventario')html=await viewGeneric('inventario');else if(path==='/app/tesoreria')html=await viewGeneric('tesoreria');else if(path==='/app/cartera')html=await viewGeneric('cartera');else if(path==='/app/compras')html=await viewGeneric('compras');else if(path==='/app/contabilidad')html=await viewGeneric('contabilidad');else html='<div class="empty">Ruta no encontrada.</div>'}catch(e){html=errorView(e)}root.innerHTML=shell(html);bindShell();if(path==='/app/ventas/nueva'){lineSeq=0;addLine();toggleCash()}}
render();
</script>
</body></html>
