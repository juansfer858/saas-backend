<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VantixGC Super Core · UI Sandbox</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--accent:#2563eb;--accent-soft:#eff6ff;--bg:#f8fafc;--panel:#fff;--panel2:#f8fafc;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--shadow:0 1px 2px rgba(15,23,42,.04),0 10px 34px rgba(15,23,42,.06);--font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--sidebar:264px}
*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;font-family:var(--font)}body{background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.dark{--bg:#09090b;--panel:#111113;--panel2:#18181b;--text:#fafafa;--muted:#a1a1aa;--line:#27272a;--shadow:0 1px 2px rgba(0,0,0,.28),0 18px 40px rgba(0,0,0,.18)}
.shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr;transition:grid-template-columns .18s}.shell.collapsed{--sidebar:78px}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:16px 12px;z-index:20}.brand{height:52px;display:flex;align-items:center;gap:10px;padding:0 8px 12px}.brandmark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900;box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 25%,transparent)}.brandtext{line-height:1.05}.brandtext b{display:block;font-size:14px}.brandtext span{font-size:11px;color:var(--muted)}.collapsed .brandtext,.collapsed .nav-label,.collapsed .section-title,.collapsed .sidebar-foot .label{display:none}.section-title{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted);padding:16px 10px 8px;text-transform:uppercase}.nav{display:flex;flex-direction:column;gap:4px;overflow:auto}.nav button{width:100%;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;cursor:pointer;text-align:left;font-size:13px;font-weight:650}.nav button:hover{background:var(--panel2);color:var(--text)}.nav button.active{background:var(--accent-soft);color:var(--accent)}.dark .nav button.active{background:color-mix(in srgb,var(--accent) 18%,var(--panel))}.nav-icon{width:20px;min-width:20px;text-align:center;font-size:16px}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.sidebar-foot button{width:100%;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:9px;cursor:pointer;display:flex;gap:9px;align-items:center}.sidebar-foot button:hover{background:var(--panel2);color:var(--text)}
.main{min-width:0}.topbar{height:68px;position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top-left,.top-actions,.row{display:flex;align-items:center;gap:10px}.icon-btn{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;display:grid;place-items:center;cursor:pointer}.breadcrumb{font-size:12px;color:var(--muted)}.tenant-select,.user-pill{height:38px;border:1px solid var(--line);background:var(--panel);border-radius:10px;color:var(--text);padding:0 11px}.user-pill{display:flex;align-items:center;gap:8px}.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;color:white;font-size:11px;font-weight:800}.notify{position:relative}.notify:after{content:'3';position:absolute;right:-3px;top:-5px;width:16px;height:16px;border-radius:999px;background:var(--danger);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;border:2px solid var(--panel)}
.content{padding:26px;max-width:1680px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.pagehead h1{font-size:26px;line-height:1.2;margin:0 0 5px;letter-spacing:-.02em}.pagehead p{margin:0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}.btn:hover{background:var(--panel2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{border-color:color-mix(in srgb,var(--danger) 35%,var(--line));color:var(--danger)}.btn.ghost{border-color:transparent;background:transparent}.btn.sm{padding:6px 9px;font-size:12px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.card-pad{padding:17px}.metric{padding:17px}.metric-top{display:flex;justify-content:space-between;align-items:flex-start}.metric-icon{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}.metric-label{font-size:12px;color:var(--muted);font-weight:650}.metric-value{font-size:22px;font-weight:800;margin-top:7px}.metric-trend{font-size:11px;color:var(--success);margin-top:5px}.split-main{display:grid;grid-template-columns:1.1fr 1.5fr .8fr;gap:14px;margin-top:14px}.card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.card-head h3{margin:0;font-size:14px}.list{padding:4px 0}.activity{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line)}.activity:last-child{border-bottom:0}.dot-icon{width:30px;height:30px;border-radius:9px;background:var(--panel2);display:grid;place-items:center}.activity-main{min-width:0;flex:1}.activity-main b{font-size:12px;display:block}.activity-main span,.activity-side{font-size:11px;color:var(--muted)}.activity-side{text-align:right}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:var(--muted);font-weight:700;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800}.ok{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}.warn{background:color-mix(in srgb,var(--warning) 15%,transparent);color:#b45309}.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}.info{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.input,.select,.textarea{height:39px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:0 11px;outline:0}.textarea{height:auto;min-height:86px;padding:10px}.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}.field .input,.field .select,.field .textarea{width:100%}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.divider{height:1px;background:var(--line);margin:14px 0}.tables-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.table-card{padding:14px;cursor:pointer;transition:.15s;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.table-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.table-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}.table-card h3{margin:0 0 7px;font-size:15px}.order-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:13px;cursor:pointer;color:var(--text);text-align:left}.product:hover{border-color:var(--accent)}.product b{font-size:12px}.product span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.cart-line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.qty{display:inline-flex;gap:5px;align-items:center}.qty button{width:24px;height:24px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;cursor:pointer}.total{display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin-top:12px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 10px;border-bottom:2px solid transparent;font-weight:700;font-size:12px;cursor:pointer}.tab.active{color:var(--accent);border-color:var(--accent)}
.theme-fab{position:fixed;right:22px;bottom:22px;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);color:var(--text);cursor:pointer;z-index:50;font-size:18px}.theme-panel{position:fixed;right:20px;bottom:78px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:0 22px 60px rgba(15,23,42,.18);z-index:50;padding:16px}.theme-panel h3{margin:0 0 3px;font-size:14px}.theme-panel p{margin:0 0 14px;color:var(--muted);font-size:11px}.swatches{display:flex;gap:8px}.swatch{width:30px;height:30px;border-radius:9px;border:2px solid transparent;cursor:pointer}.swatch.active{border-color:var(--text)}.theme-row{margin-top:13px}.theme-row label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}.sandbox-note{font-size:11px;color:var(--muted);background:var(--panel2);border:1px dashed var(--line);padding:9px 11px;border-radius:10px}.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:1200px){.grid4{grid-template-columns:repeat(2,1fr)}.split-main{grid-template-columns:1fr 1fr}.split-main>:last-child{grid-column:1/-1}.tables-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.shell{display:block}.sidebar{position:fixed;left:0;transform:translateX(-100%);width:264px;transition:.2s}.sidebar.mobile-open{transform:none}.content{padding:18px 12px}.grid3,.grid2,.order-layout{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,1fr)}.tables-grid{grid-template-columns:repeat(2,1fr)}.user-pill{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n||0));
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const navItems=[['dashboard','⌂','Dashboard'],['restaurante','♨','Restaurante / Mesas'],['ventas','🛒','Ventas / POS'],['compras','▣','Compras'],['inventario','◇','Inventarios / Kardex'],['tesoreria','🏦','Tesorería & Bancos'],['cartera','▤','Cartera'],['terceros','◉','Terceros'],['contabilidad','▥','Contabilidad'],['parametrizacion','☷','Parametrización Contable'],['configuracion','⚙','Configuración avanzada']];
const products=[{id:'p1',name:'Hamburguesa Clásica',price:22000,cat:'Platos'},{id:'p2',name:'Hamburguesa Especial',price:28500,cat:'Platos'},{id:'p3',name:'Papas Francesas',price:9000,cat:'Acompañantes'},{id:'p4',name:'Limonada Natural',price:6500,cat:'Bebidas'},{id:'p5',name:'Coca-Cola',price:5000,cat:'Bebidas'},{id:'p6',name:'Postre de la Casa',price:11000,cat:'Postres'}];
const defaults={view:'dashboard',collapsed:false,mobile:false,themeOpen:false,selectedTable:'M2',accountTab:'asientos',theme:{mode:'light',accent:'#2563eb',soft:'#eff6ff',font:'Inter,ui-sans-serif,system-ui,sans-serif'},tables:[{id:'M1',state:'Libre',guests:0,total:0},{id:'M2',state:'Ocupada',guests:3,total:64500},{id:'M3',state:'Libre',guests:0,total:0},{id:'M4',state:'Cuenta Pedida',guests:2,total:52000},{id:'M5',state:'Ocupada',guests:4,total:91000},{id:'M6',state:'Libre',guests:0,total:0}],cart:[{id:'p1',qty:1},{id:'p4',qty:2}],entries:[{id:'AU-202608-000002',detail:'Venta POS',debit:30360,credit:30360}],accounts:[{code:'110505',name:'Caja general',nature:'Débito'},{code:'413505',name:'Ventas',nature:'Crédito'},{code:'143505',name:'Inventarios',nature:'Débito'}]};
const store={...defaults};
try{const saved=JSON.parse(localStorage.getItem('vantixgc_ui_sandbox_theme')||'null');if(saved)store.theme={...store.theme,...saved}}catch{}
function useState(key,initial){if(!(key in store))store[key]=typeof initial==='function'?initial():initial;return[store[key],value=>{store[key]=typeof value==='function'?value(store[key]):value;render()}]}
function setState(key,value){store[key]=typeof value==='function'?value(store[key]):value;render()}
function badge(text,type='info'){return `<span class="badge ${type}">${esc(text)}</span>`}
function pageHead(title,subtitle,action=''){return `<div class="pagehead"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>${action}</div>`}
function metric(icon,label,value,trend){return `<div class="card metric"><div class="metric-top"><div><div class="metric-label">${esc(label)}</div><div class="metric-value">${esc(value)}</div><div class="metric-trend">${esc(trend)}</div></div><div class="metric-icon">${icon}</div></div></div>`}
function dashboard(){return `${pageHead('Dashboard','Resumen general de la operación · datos simulados')}<div class="grid4">${metric('🛒','Ventas hoy','$ 24.850.000','↑ 18.4% vs ayer')}${metric('▣','Compras','$ 8.650.000','↓ 6.2% vs ayer')}${metric('🏦','Caja / Bancos','$ 152.350.000','↑ 7.6%')}${metric('▤','Cuentas por cobrar','$ 63.420.000','9 vencimientos')}</div><div class="split-main"><div class="card"><div class="card-head"><h3>Actividad reciente</h3><button class="btn ghost sm">Ver todo</button></div><div class="list">${[['🛒','Venta POS #POS-12548','Mesa 7 · hace 5 min','$ 320.000'],['▣','Compra #COMP-0387','Proveedor del Sur · hace 23 min','$ 1.450.000'],['🏦','Pago recibido #REC-2175','Distribuidora del Café · hace 1 h','$ 2.800.000'],['◇','Ajuste de inventario','Kardex Bebidas · hace 3 h','- $ 150.000']].map(x=>`<div class="activity"><div class="dot-icon">${x[0]}</div><div class="activity-main"><b>${x[1]}</b><span>${x[2]}</span></div><div class="activity-side">${x[3]}</div></div>`).join('')}</div></div><div class="card"><div class="card-head"><h3>Ventas recientes</h3>${badge('Mock local','info')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Documento</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody>${[['POS-12548','Consumidor Final','$ 320.000','Pagada'],['POS-12547','Juan Pérez','$ 185.000','Pagada'],['FAC-08912','Distribuidora del Café','$ 2.800.000','Pendiente'],['POS-12545','Consumidor Final','$ 140.000','Pagada']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${badge(r[3],r[3]==='Pendiente'?'warn':'ok')}</td></tr>`).join('')}</tbody></table></div></div><div class="card card-pad"><div class="metric-label">Estado del sistema</div><div style="margin-top:12px;display:grid;gap:10px">${[['Base de datos','Operativo','ok'],['Servidor de aplicación','Operativo','ok'],['Servicios POS','Operativo','ok'],['Integración DIAN','Advertencia','warn']].map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;font-size:11px"><span>${x[0]}</span>${badge(x[1],x[2])}</div>`).join('')}</div><div class="divider"></div><div class="metric-label">Restaurante en tiempo real</div><p style="font-size:12px">Mesas ocupadas: <b>3 / 6</b></p><p style="font-size:12px">Pedidos en cocina: <b>8</b></p><button class="btn ghost sm" data-nav="restaurante" style="padding-left:0;color:var(--accent)">Ver operación →</button></div></div>`}
function tableStateClass(s){return s==='Libre'?'ok':s==='Ocupada'?'info':'warn'}
function restaurante(){const t=store.tables.find(x=>x.id===store.selectedTable)||store.tables[0];return `${pageHead('Restaurante / Mesas','Prueba estados visuales y una comanda local.','<span class="sandbox-note">Datos completamente locales</span>')}<div class="tables-grid">${store.tables.map(x=>`<button class="table-card ${x.id===store.selectedTable?'selected':''}" data-table="${x.id}"><div style="display:flex;justify-content:space-between"><h3>${x.id}</h3>${badge(x.state,tableStateClass(x.state))}</div><div style="font-size:11px;color:var(--muted)">${x.guests?x.guests+' personas':'Sin ocupantes'}</div><div style="font-weight:800;margin-top:8px">${money(x.total)}</div></button>`).join('')}</div><div class="grid2" style="margin-top:14px"><div class="card card-pad"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="metric-label">Mesa seleccionada</div><h2 style="margin:4px 0 0">${t.id}</h2></div>${badge(t.state,tableStateClass(t.state))}</div><div class="divider"></div><div class="row"><button class="btn sm" data-table-state="Libre">Marcar Libre</button><button class="btn sm" data-table-state="Ocupada">Marcar Ocupada</button><button class="btn sm" data-table-state="Cuenta Pedida">Cuenta Pedida</button></div></div><div class="card card-pad"><div class="metric-label">Comanda de prueba</div>${cartHtml()}</div></div>`}
function cartHtml(){const lines=store.cart.map(c=>({...c,p:products.find(p=>p.id===c.id)})).filter(x=>x.p);const total=lines.reduce((s,x)=>s+x.qty*x.p.price,0);return `<div style="margin-top:10px">${lines.length?lines.map(x=>`<div class="cart-line"><div><b style="font-size:12px">${x.p.name}</b><div style="font-size:10px;color:var(--muted)">${money(x.p.price)}</div></div><div class="qty"><button data-cart-dec="${x.id}">−</button><b>${x.qty}</b><button data-cart-inc="${x.id}">+</button></div><button class="btn danger sm" data-cart-remove="${x.id}">Quitar</button></div>`).join(''):'<div class="empty">Sin productos.</div>'}</div><div class="total"><span>Total</span><span>${money(total)}</span></div>`}
function ventas(){return `${pageHead('Ventas / POS','Borrador de venta editable, sin afectar producción.','<button class="btn primary" data-action="clear-cart">Nueva venta</button>')}<div class="order-layout"><div><div class="toolbar"><input class="input" placeholder="Buscar producto…"><select class="select"><option>Todas las categorías</option><option>Platos</option><option>Bebidas</option></select></div><div class="product-grid">${products.map(p=>`<button class="product" data-add-product="${p.id}"><b>${p.name}</b><span>${p.cat}</span><strong style="display:block;margin-top:8px">${money(p.price)}</strong></button>`).join('')}</div></div><div class="card card-pad"><div style="display:flex;justify-content:space-between"><b>Venta borrador</b>${badge('LOCAL','info')}</div>${cartHtml()}<button class="btn primary" style="width:100%;justify-content:center;margin-top:12px">Confirmar visualmente</button></div></div>`}
function generic(title,subtitle,cards){return `${pageHead(title,subtitle)}<div class="grid3">${cards.map(x=>`<div class="card card-pad"><div class="metric-icon">${x[0]}</div><h3 style="margin:12px 0 5px;font-size:14px">${x[1]}</h3><p style="font-size:11px;color:var(--muted)">${x[2]}</p>${badge(x[3],x[4]||'ok')}</div>`).join('')}</div>`}
function contabilidad(){if(store.accountTab==='asientos')return `${pageHead('Contabilidad','Prueba formularios locales para asientos y plan de cuentas.')}<div class="tabs"><button class="tab active" data-account-tab="asientos">Asientos</button><button class="tab" data-account-tab="cuentas">Plan de cuentas</button><button class="tab" data-account-tab="reportes">Reportes</button></div><div class="grid2"><div class="card"><div class="card-head"><h3>Nuevo asiento mock</h3>${badge('LOCAL')}</div><form class="card-pad" id="entryForm"><div class="field"><label>Detalle</label><input class="input" name="detail" placeholder="Ej. Ajuste de caja" required></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>Débito</label><input class="input" name="debit" type="number"></div><div class="field"><label>Crédito</label><input class="input" name="credit" type="number"></div></div><button class="btn primary" style="margin-top:12px">Agregar asiento</button></form></div><div class="card"><div class="card-head"><h3>Asientos creados</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Número</th><th>Detalle</th><th>Débito</th><th>Crédito</th></tr></thead><tbody>${store.entries.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.detail)}</td><td>${money(x.debit)}</td><td>${money(x.credit)}</td></tr>`).join('')}</tbody></table></div></div></div>`;if(store.accountTab==='cuentas')return `${pageHead('Contabilidad','Prueba formularios locales para asientos y plan de cuentas.')}<div class="tabs"><button class="tab" data-account-tab="asientos">Asientos</button><button class="tab active" data-account-tab="cuentas">Plan de cuentas</button><button class="tab" data-account-tab="reportes">Reportes</button></div><div class="grid2"><div class="card"><div class="card-head"><h3>Nueva cuenta mock</h3></div><form class="card-pad" id="accountForm"><div class="form-grid"><div class="field"><label>Código</label><input class="input" name="code" required></div><div class="field"><label>Naturaleza</label><select class="select" name="nature"><option>Débito</option><option>Crédito</option></select></div></div><div class="field" style="margin-top:12px"><label>Nombre</label><input class="input" name="name" required></div><button class="btn primary" style="margin-top:12px">Crear cuenta</button></form></div><div class="card"><div class="card-head"><h3>Plan de cuentas</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Cuenta</th><th>Naturaleza</th></tr></thead><tbody>${store.accounts.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.name)}</td><td>${esc(x.nature)}</td></tr>`).join('')}</tbody></table></div></div></div>`;return `${pageHead('Contabilidad','Reportes de prueba.')}<div class="tabs"><button class="tab" data-account-tab="asientos">Asientos</button><button class="tab" data-account-tab="cuentas">Plan de cuentas</button><button class="tab active" data-account-tab="reportes">Reportes</button></div><div class="grid3">${metric('↔','Débitos','$ 52.860','Cuadra')}${metric('↔','Créditos','$ 52.860','Cuadra')}${metric('✓','Diferencia','$ 0','Balanceado')}</div>`}
function parametrizacion(){const groups=[['Cuentas contables',['Plan de cuentas','Cuentas por terceros','Cuentas por productos']],['Terceros y proveedores',['Cuentas por cobrar','Cuentas por pagar','Anticipos y avances']],['Inventarios',['Cuentas de inventario','Variaciones y ajustes','Costos de venta']],['Ventas',['Cuentas de ingresos','Impuestos y retenciones','Descuentos y devoluciones']],['Compras',['Cuentas de gastos','Impuestos descontables','Costos y fletes']],['Tesorería & Bancos',['Cuentas bancarias','Conciliación bancaria','Comisiones e intereses']]];return `${pageHead('Parametrización Contable','Vista propuesta para configurar y validar el mapeo contable.','<button class="btn primary">Ver reporte</button>')}<div class="grid3">${groups.map((g,gi)=>`<div class="card card-pad"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px"><b style="font-size:13px">${g[0]}</b><span style="font-size:10px;color:var(--muted)">${g[1].length} parámetros</span></div>${g[1].map((x,i)=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:${i?'1px solid var(--line)':'0'};font-size:11px"><span>${x}</span>${badge((gi+i)%4===2?'Pendiente':'Listo',(gi+i)%4===2?'warn':'ok')}</div>`).join('')}<button class="btn ghost sm" style="padding-left:0;color:var(--accent);margin-top:6px">Ver detalle →</button></div>`).join('')}</div>`}
function configuracion(){return generic('Configuración avanzada','Agrupación moderna de configuraciones transversales.',[['⚙','DIAN','Facturación, numeración y proveedor tecnológico','Advertencia','warn'],['◉','Roles y permisos','Usuarios y permisos por módulo','Operativo','ok'],['▣','Impresión','Formatos, impresoras y agente local','Operativo','ok'],['◇','Nómina electrónica','Configuración y transmisión','Pendiente','warn'],['♧','Notificaciones','Canales, plantillas y consentimiento','Operativo','ok']])}
const views={dashboard,restaurante,ventas,compras:()=>generic('Compras','Nueva experiencia para compras y proveedores.',[['▣','Órdenes abiertas','8 documentos','Operativo'],['◉','Proveedores','18 activos','Operativo'],['▤','CxP','$ 22.500 pendientes','Advertencia','warn']]),inventario:()=>generic('Inventarios / Kardex','Stock, movimientos y alertas.',[['◇','Productos','426 activos','Operativo'],['↔','Movimientos','38 hoy','Operativo'],['!','Stock mínimo','7 alertas','Advertencia','warn']]),tesoreria:()=>generic('Tesorería & Bancos','Caja, bancos y movimientos.',[['🏦','Caja general','$ 23.760','Operativo'],['▤','Bancos','$ 152.350.000','Operativo'],['↔','Conciliaciones','2 pendientes','Advertencia','warn']]),cartera:()=>generic('Cartera','Cuentas por cobrar y pagar.',[['▤','CxC','$ 63.420.000','Operativo'],['▣','CxP','$ 22.500','Operativo'],['!','Vencidos','9 documentos','Advertencia','warn']]),terceros:()=>generic('Terceros','Clientes y proveedores.',[['◉','Clientes','284 activos','Operativo'],['◉','Proveedores','18 activos','Operativo'],['✓','Datos completos','96%','Operativo']]),contabilidad,parametrizacion,configuracion};
function themePanel(){const accents=[['#2563eb','#eff6ff'],['#0d9488','#ecfdf5'],['#7c3aed','#f5f3ff'],['#ea580c','#fff7ed'],['#18181b','#f4f4f5']];return `<div class="theme-panel"><div style="display:flex;justify-content:space-between"><div><h3>Personalizar interfaz</h3><p>Solo afecta este sandbox.</p></div><button class="btn ghost sm" data-action="theme-close">✕</button></div><div class="theme-row"><label>Color de acento</label><div class="swatches">${accents.map(a=>`<button class="swatch ${store.theme.accent===a[0]?'active':''}" style="background:${a[0]}" data-accent="${a[0]}" data-soft="${a[1]}"></button>`).join('')}</div></div><div class="theme-row"><label>Modo</label><div class="row"><button class="btn sm ${store.theme.mode==='light'?'primary':''}" data-mode="light">Claro</button><button class="btn sm ${store.theme.mode==='dark'?'primary':''}" data-mode="dark">Oscuro</button></div></div><div class="theme-row"><label>Tipografía</label><select class="select" style="width:100%" id="fontSelect"><option value="Inter,ui-sans-serif,system-ui,sans-serif">Inter / System</option><option value="'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif">Plus Jakarta Sans</option><option value="Roboto,Arial,sans-serif">Roboto</option><option value="Georgia,serif">Serif editorial</option></select></div><div class="theme-row"><button class="btn danger sm" data-action="theme-reset">Restablecer tema</button></div></div>`}
function applyTheme(){document.documentElement.style.setProperty('--accent',store.theme.accent);document.documentElement.style.setProperty('--accent-soft',store.theme.soft);document.documentElement.style.setProperty('--font',store.theme.font);document.body.classList.toggle('dark',store.theme.mode==='dark');try{localStorage.setItem('vantixgc_ui_sandbox_theme',JSON.stringify(store.theme))}catch{}}
function shell(){const label=navItems.find(x=>x[0]===store.view)?.[2]||'Dashboard';const current=views[store.view]||dashboard;return `<div class="shell ${store.collapsed?'collapsed':''}"><aside class="sidebar ${store.mobile?'mobile-open':''}"><div class="brand"><div class="brandmark">V</div><div class="brandtext"><b>VantixGC</b><span>Super Core · V2 Preview</span></div></div><div class="section-title">Navegación</div><nav class="nav">${navItems.map(n=>`<button class="${store.view===n[0]?'active':''}" data-nav="${n[0]}"><span class="nav-icon">${n[1]}</span><span class="nav-label">${n[2]}</span></button>`).join('')}</nav><div class="sidebar-foot"><button data-action="collapse"><span>⇤</span><span class="label">${store.collapsed?'Expandir':'Colapsar sidebar'}</span></button></div></aside><main class="main"><header class="topbar"><div class="top-left"><button class="icon-btn" data-action="mobile">☰</button><div class="breadcrumb">V2 Preview / ${esc(label)}</div></div><div class="top-actions"><select class="tenant-select"><option>VantixGC Demo SAS</option><option>Restaurante Demo</option></select><button class="icon-btn notify">♧</button><div class="user-pill"><div class="avatar">AG</div><div><b style="display:block;font-size:11px">Andrés Gómez</b><span style="display:block;font-size:9px;color:var(--muted)">Administrador</span></div></div></div></header><section class="content">${current()}</section></main><button class="theme-fab" data-action="theme-toggle" title="Personalizar tema">◐</button>${store.themeOpen?themePanel():''}</div>`}
function render(){applyTheme();document.getElementById('app').innerHTML=shell();const fs=document.getElementById('fontSelect');if(fs)fs.value=store.theme.font}
function updateCart(id,delta){const found=store.cart.find(x=>x.id===id);if(!found&&delta>0)store.cart.push({id,qty:1});else if(found){found.qty+=delta;if(found.qty<=0)store.cart=store.cart.filter(x=>x.id!==id)}render()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){store.view=nav.dataset.nav;store.mobile=false;render();return}const table=e.target.closest('[data-table]');if(table){store.selectedTable=table.dataset.table;render();return}const ts=e.target.closest('[data-table-state]');if(ts){store.tables=store.tables.map(x=>x.id===store.selectedTable?{...x,state:ts.dataset.tableState,guests:ts.dataset.tableState==='Libre'?0:Math.max(x.guests,2)}:x);render();return}const add=e.target.closest('[data-add-product]');if(add){updateCart(add.dataset.addProduct,1);return}const inc=e.target.closest('[data-cart-inc]');if(inc){updateCart(inc.dataset.cartInc,1);return}const dec=e.target.closest('[data-cart-dec]');if(dec){updateCart(dec.dataset.cartDec,-1);return}const rem=e.target.closest('[data-cart-remove]');if(rem){store.cart=store.cart.filter(x=>x.id!==rem.dataset.cartRemove);render();return}const tab=e.target.closest('[data-account-tab]');if(tab){store.accountTab=tab.dataset.accountTab;render();return}const accent=e.target.closest('[data-accent]');if(accent){store.theme={...store.theme,accent:accent.dataset.accent,soft:accent.dataset.soft};render();return}const mode=e.target.closest('[data-mode]');if(mode){store.theme={...store.theme,mode:mode.dataset.mode};render();return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='collapse')store.collapsed=!store.collapsed;if(action==='mobile')store.mobile=!store.mobile;if(action==='theme-toggle')store.themeOpen=!store.themeOpen;if(action==='theme-close')store.themeOpen=false;if(action==='theme-reset')store.theme={mode:'light',accent:'#2563eb',soft:'#eff6ff',font:'Inter,ui-sans-serif,system-ui,sans-serif'};if(action==='clear-cart')store.cart=[];render()});
document.addEventListener('change',e=>{if(e.target.id==='fontSelect'){store.theme={...store.theme,font:e.target.value};render()}});
document.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);if(e.target.id==='entryForm'){store.entries=[...store.entries,{id:'AU-MOCK-'+String(store.entries.length+1).padStart(3,'0'),detail:String(fd.get('detail')||''),debit:Number(fd.get('debit')||0),credit:Number(fd.get('credit')||0)}];render()}if(e.target.id==='accountForm'){store.accounts=[...store.accounts,{code:String(fd.get('code')||''),name:String(fd.get('name')||''),nature:String(fd.get('nature')||'Débito')}];render()}});
window.VantixGCUISandbox={version:'mock-local-v2',runtime:'self-contained',useState};
render();
</script>
</body>
</html>
