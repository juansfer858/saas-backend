<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VantixGC Super Core · UI Sandbox</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--accent:#2563eb;--accent-soft:#eff6ff;--bg:#f8fafc;--panel:#fff;--panel2:#f8fafc;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--shadow:0 1px 2px rgba(15,23,42,.04),0 8px 28px rgba(15,23,42,.05);--font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--sidebar:264px}
*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;font-family:var(--font)}body{background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.dark{--bg:#09090b;--panel:#111113;--panel2:#18181b;--text:#fafafa;--muted:#a1a1aa;--line:#27272a;--shadow:0 1px 2px rgba(0,0,0,.28),0 18px 40px rgba(0,0,0,.18)}
.shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr;transition:grid-template-columns .2s ease}.shell.collapsed{--sidebar:78px}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 96%,var(--bg));display:flex;flex-direction:column;padding:16px 12px;z-index:20}.brand{height:52px;display:flex;align-items:center;gap:10px;padding:0 8px 12px}.brandmark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900;box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 25%,transparent)}.brandtext{line-height:1.05}.brandtext b{display:block;font-size:14px}.brandtext span{font-size:11px;color:var(--muted)}.collapsed .brandtext,.collapsed .nav-label,.collapsed .section-title,.collapsed .sidebar-foot span{display:none}.section-title{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted);padding:16px 10px 8px;text-transform:uppercase}.nav{display:flex;flex-direction:column;gap:4px;overflow:auto}.nav button{width:100%;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;cursor:pointer;text-align:left;font-size:13px;font-weight:650}.nav button:hover{background:var(--panel2);color:var(--text)}.nav button.active{background:var(--accent-soft);color:var(--accent)}.dark .nav button.active{background:color-mix(in srgb,var(--accent) 18%,var(--panel))}.nav-icon{width:20px;min-width:20px;text-align:center;font-size:16px}.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.sidebar-foot button{width:100%;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:9px;cursor:pointer;display:flex;gap:9px;align-items:center}.sidebar-foot button:hover{background:var(--panel2);color:var(--text)}
.main{min-width:0}.topbar{height:68px;position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top-left{display:flex;align-items:center;gap:12px}.icon-btn{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;display:grid;place-items:center;cursor:pointer}.breadcrumb{font-size:12px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:9px}.tenant-select,.user-pill{height:38px;border:1px solid var(--line);background:var(--panel);border-radius:10px;color:var(--text);padding:0 11px}.user-pill{display:flex;align-items:center;gap:8px}.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;color:white;font-size:11px;font-weight:800}.notify{position:relative}.notify:after{content:'3';position:absolute;right:-3px;top:-5px;width:16px;height:16px;border-radius:999px;background:var(--danger);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;border:2px solid var(--panel)}
.content{padding:26px;max-width:1680px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.pagehead h1{font-size:26px;line-height:1.2;margin:0 0 5px;letter-spacing:-.02em}.pagehead p{margin:0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}.btn:hover{background:var(--panel2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{border-color:color-mix(in srgb,var(--danger) 35%,var(--line));color:var(--danger)}.btn.ghost{border-color:transparent;background:transparent}.btn.sm{padding:6px 9px;font-size:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.card-pad{padding:17px}.metric{padding:17px}.metric-top{display:flex;justify-content:space-between;align-items:flex-start}.metric-icon{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}.metric-label{font-size:12px;color:var(--muted);font-weight:650}.metric-value{font-size:22px;font-weight:800;margin-top:7px}.metric-trend{font-size:11px;color:var(--success);margin-top:5px}.split-main{display:grid;grid-template-columns:1.15fr 1.55fr .8fr;gap:14px;margin-top:14px}.card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.card-head h3{margin:0;font-size:14px}.list{padding:4px 0}.activity{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}.activity:last-child{border-bottom:0}.dot-icon{width:30px;height:30px;border-radius:9px;background:var(--panel2);display:grid;place-items:center}.activity-main{min-width:0;flex:1}.activity-main b{font-size:12px;display:block}.activity-main span,.activity-side{font-size:11px;color:var(--muted)}.activity-side{text-align:right}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:var(--muted);font-weight:700;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:11px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);white-space:nowrap}.table tbody tr:hover td{background:color-mix(in srgb,var(--panel2) 70%,transparent)}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800}.ok{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}.warn{background:color-mix(in srgb,var(--warning) 15%,transparent);color:#b45309}.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}.info{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.input,.select,.textarea{height:39px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:0 11px;outline:0}.textarea{height:auto;min-height:86px;padding:10px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px}.field .input,.field .select,.field .textarea{width:100%}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.divider{height:1px;background:var(--line);margin:14px 0}
.tables-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.table-card{padding:14px;cursor:pointer;transition:.15s;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.table-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.table-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}.table-card h3{margin:0 0 7px;font-size:15px}.order-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:13px;cursor:pointer;color:var(--text);text-align:left}.product:hover{border-color:var(--accent)}.product b{font-size:12px}.product span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.cart-line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.cart-line:last-child{border-bottom:0}.qty{display:inline-flex;gap:5px;align-items:center}.qty button{width:24px;height:24px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;cursor:pointer}.total{display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin-top:12px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 10px;border-bottom:2px solid transparent;font-weight:700;font-size:12px;cursor:pointer}.tab.active{color:var(--accent);border-color:var(--accent)}
.theme-fab{position:fixed;right:22px;bottom:22px;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);color:var(--text);cursor:pointer;z-index:50;font-size:18px}.theme-panel{position:fixed;right:20px;bottom:78px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:0 22px 60px rgba(15,23,42,.18);z-index:50;padding:16px}.theme-panel h3{margin:0 0 3px;font-size:14px}.theme-panel p{margin:0 0 14px;color:var(--muted);font-size:11px}.swatches{display:flex;gap:8px}.swatch{width:30px;height:30px;border-radius:9px;border:2px solid transparent;cursor:pointer}.swatch.active{border-color:var(--text)}.theme-row{margin-top:13px}.theme-row label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}.sandbox-note{font-size:11px;color:var(--muted);background:var(--panel2);border:1px dashed var(--line);padding:9px 11px;border-radius:10px}.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:1200px){.grid4{grid-template-columns:repeat(2,1fr)}.split-main{grid-template-columns:1fr 1fr}.split-main>:last-child{grid-column:1/-1}.tables-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.shell{display:block}.sidebar{position:fixed;left:0;transform:translateX(-100%);width:264px;transition:.2s}.sidebar.mobile-open{transform:none}.content{padding:18px 12px}.grid3,.grid2,.order-layout{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,1fr)}.tables-grid{grid-template-columns:repeat(2,1fr)}.user-pill{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import React,{useEffect,useState} from 'https://esm.sh/react@18.3.1';
import {createRoot} from 'https://esm.sh/react-dom@18.3.1/client';
import htm from 'https://esm.sh/htm@3.1.1';
const html=htm.bind(React.createElement);
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const navItems=[['dashboard','⌂','Dashboard'],['restaurante','♨','Restaurante / Mesas'],['ventas','🛒','Ventas / POS'],['compras','▣','Compras'],['inventario','◇','Inventarios / Kardex'],['tesoreria','🏦','Tesorería & Bancos'],['cartera','▤','Cartera'],['terceros','◉','Terceros'],['contabilidad','▥','Contabilidad'],['parametrizacion','☷','Parametrización Contable'],['configuracion','⚙','Configuración avanzada']];
const products=[{id:'p1',name:'Hamburguesa Clásica',price:22000,cat:'Platos'},{id:'p2',name:'Hamburguesa Especial',price:28500,cat:'Platos'},{id:'p3',name:'Papas Francesas',price:9000,cat:'Acompañantes'},{id:'p4',name:'Limonada Natural',price:6500,cat:'Bebidas'},{id:'p5',name:'Coca-Cola',price:5000,cat:'Bebidas'},{id:'p6',name:'Postre de la Casa',price:11000,cat:'Postres'}];
const seedTables=[{id:'M1',state:'Libre',guests:0,total:0},{id:'M2',state:'Ocupada',guests:3,total:64500},{id:'M3',state:'Libre',guests:0,total:0},{id:'M4',state:'Cuenta Pedida',guests:2,total:52000},{id:'M5',state:'Ocupada',guests:4,total:91000},{id:'M6',state:'Libre',guests:0,total:0},{id:'M7',state:'Libre',guests:0,total:0},{id:'M8',state:'Ocupada',guests:2,total:40500}];
const seedAccounts=[{code:'110505',name:'Caja General',nature:'Débito'},{code:'111005',name:'Bancos',nature:'Débito'},{code:'143505',name:'Inventarios',nature:'Débito'},{code:'220505',name:'Proveedores nacionales',nature:'Crédito'},{code:'413505',name:'Ventas',nature:'Crédito'}];
function Badge({type='info',children}){return html`<span className=${'badge '+type}>${children}</span>`}
function Metric({icon,label,value,trend}){return html`<div className="card metric"><div className="metric-top"><div><div className="metric-label">${label}</div><div className="metric-value">${value}</div><div className="metric-trend">↗ ${trend}</div></div><div className="metric-icon">${icon}</div></div></div>`}
function PageHead({title,subtitle,action}){return html`<div className="pagehead"><div><h1>${title}</h1><p>${subtitle}</p></div>${action||null}</div>`}
function Empty({children}){return html`<div className="empty">${children}</div>`}
function Dashboard(){const activities=[['🛒','Venta POS #POS-12548','Mesa 7 · Hace 5 min','$ 320.000'],['▣','Compra #COMP-0387','Proveedor del Sur · Hace 23 min','$ 1.450.000'],['🏦','Pago recibido #REC-2175','Distribuidora del Café · Hace 1 h','$ 2.800.000'],['↔','Transferencia a Bancos','Bancolombia · Hace 2 h','$ 5.000.000']];const sales=[['POS-12548','Consumidor final','$ 320.000','Pagada'],['POS-12547','Juan Pérez','$ 185.000','Pagada'],['FAC-08912','Distribuidora del Café','$ 2.800.000','Pendiente'],['POS-12545','Consumidor final','$ 140.000','Pagada']];return html`<><${PageHead} title="Dashboard" subtitle="Resumen general de la operación del tenant de prueba." action=${html`<button className="btn primary">＋ Nueva venta</button>`}/><div className="sandbox-note">UI Sandbox · Datos completamente locales. Ninguna acción de esta pantalla escribe en producción.</div><div className="grid4" style=${{marginTop:14}}><${Metric} icon="🛒" label="Ventas hoy" value="$ 24.850.000" trend="18,4%"/><${Metric} icon="▣" label="Compras" value="$ 8.650.000" trend="6,2%"/><${Metric} icon="🏦" label="Caja / Bancos" value="$ 152.350.000" trend="7,6%"/><${Metric} icon="▤" label="Cuentas por cobrar" value="$ 63.420.000" trend="9,3%"/></div><div className="split-main"><div className="card"><div className="card-head"><h3>Actividad reciente</h3><button className="btn ghost sm">Ver todo</button></div><div className="list">${activities.map(a=>html`<div className="activity"><div className="dot-icon">${a[0]}</div><div className="activity-main"><b>${a[1]}</b><span>${a[2]}</span></div><div className="activity-side">${a[3]}</div></div>`)}</div></div><div className="card"><div className="card-head"><h3>Ventas recientes</h3><button className="btn ghost sm">Ver todas</button></div><div className="table-wrap"><table className="table"><thead><tr><th>Documento</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody>${sales.map(s=>html`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td><td><${Badge} type=${s[3]==='Pagada'?'ok':'warn'}>${s[3]}</${Badge}></td></tr>`)}</tbody></table></div></div><div><div className="card"><div className="card-head"><h3>Estado del sistema</h3></div><div className="card-pad">${[['Base de datos','Operativo','ok'],['Servidor de aplicación','Operativo','ok'],['Integración DIAN','Advertencia','warn'],['Respaldos','Operativo','ok']].map(x=>html`<div style=${{display:'flex',justifyContent:'space-between',padding:'8px 0',fontSize:'12px'}}><span>${x[0]}</span><${Badge} type=${x[2]}>${x[1]}</${Badge}></div>`)}</div></div><div className="card" style=${{marginTop:14}}><div className="card-head"><h3>Restaurante en tiempo real</h3></div><div className="card-pad"><div style=${{fontSize:'12px',marginBottom:10}}>Mesas ocupadas <b style=${{float:'right'}}>3 / 8</b></div><div style=${{height:6,borderRadius:99,background:'var(--panel2)'}}><div style=${{height:'100%',width:'38%',background:'var(--success)',borderRadius:99}}></div></div><div className="divider"></div><div style=${{fontSize:'12px'}}>Pedidos en KDS <b style=${{float:'right'}}>8</b></div></div></div></div></div></>`}
function Restaurante(){const [tables,setTables]=useState(seedTables);const [selected,setSelected]=useState('M2');const [cart,setCart]=useState([{...products[0],qty:2},{...products[3],qty:2}]);const table=tables.find(t=>t.id===selected);const total=cart.reduce((s,x)=>s+x.price*x.qty,0);const stateType=s=>s==='Libre'?'ok':s==='Ocupada'?'info':'warn';const setState=state=>setTables(tables.map(t=>t.id===selected?{...t,state,total:state==='Libre'?0:total}:t));const add=p=>setCart(c=>{const e=c.find(x=>x.id===p.id);return e?c.map(x=>x.id===p.id?{...x,qty:x.qty+1}:x):[...c,{...p,qty:1}]});const qty=(id,d)=>setCart(c=>c.map(x=>x.id===id?{...x,qty:x.qty+d}:x).filter(x=>x.qty>0));return html`<><${PageHead} title="Restaurante / Mesas" subtitle="Prueba estados de mesa y una comanda local sin tocar datos reales." action=${html`<div className="row"><button className="btn">KDS</button><button className="btn primary">＋ Pedido manual</button></div>`}/><div className="tables-grid">${tables.map(t=>html`<div className=${'table-card '+(t.id===selected?'selected':'')} onClick=${()=>setSelected(t.id)}><div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}><h3>${t.id}</h3><${Badge} type=${stateType(t.state)}>${t.state}</${Badge}></div><div style=${{fontSize:'11px',color:'var(--muted)'}}>${t.guests||0} personas · ${t.total?money(t.total):'Sin consumo'}</div></div>`)}</div><div className="order-layout" style=${{marginTop:14}}><div className="card"><div className="card-head"><h3>Agregar a comanda · ${selected}</h3><span style=${{fontSize:'11px',color:'var(--muted)'}}>Haz clic en un producto</span></div><div className="card-pad"><div className="product-grid">${products.map(p=>html`<button className="product" onClick=${()=>add(p)}><b>${p.name}</b><span>${p.cat} · ${money(p.price)}</span></button>`)}</div></div></div><div className="card"><div className="card-head"><h3>Comanda borrador</h3><${Badge} type=${stateType(table.state)}>${table.state}</${Badge}></div><div className="card-pad">${cart.length?cart.map(x=>html`<div className="cart-line"><div><b style=${{fontSize:'12px'}}>${x.name}</b><div style=${{fontSize:'10px',color:'var(--muted)'}}>${money(x.price)} c/u</div></div><div className="qty"><button onClick=${()=>qty(x.id,-1)}>−</button><b>${x.qty}</b><button onClick=${()=>qty(x.id,1)}>＋</button></div><b style=${{fontSize:'12px'}}>${money(x.price*x.qty)}</b></div>`):html`<${Empty}>Comanda vacía</${Empty}>`}<div className="total"><span>Total</span><span>${money(total)}</span></div><div className="divider"></div><div className="row"><button className="btn" onClick=${()=>setState('Libre')}>Libre</button><button className="btn" onClick=${()=>setState('Ocupada')}>Ocupada</button><button className="btn primary" onClick=${()=>setState('Cuenta Pedida')}>Cuenta pedida</button></div></div></div></div></>`}
function Ventas(){const [cart,setCart]=useState([{...products[1],qty:1},{...products[4],qty:2}]);const [customer,setCustomer]=useState('Consumidor final');const total=cart.reduce((s,x)=>s+x.price*x.qty,0);const add=p=>setCart(c=>{const e=c.find(x=>x.id===p.id);return e?c.map(x=>x.id===p.id?{...x,qty:x.qty+1}:x):[...c,{...p,qty:1}]});const qty=(id,d)=>setCart(c=>c.map(x=>x.id===id?{...x,qty:x.qty+d}:x).filter(x=>x.qty>0));return html`<><${PageHead} title="Ventas / POS" subtitle="Construye una venta borrador y prueba el flujo visual de caja." action=${html`<button className="btn">Historial</button>`}/><div className="order-layout"><div className="card"><div className="card-head"><h3>Catálogo</h3><input className="input" placeholder="Buscar producto..." /></div><div className="card-pad"><div className="product-grid">${products.map(p=>html`<button className="product" onClick=${()=>add(p)}><b>${p.name}</b><span>${p.cat} · ${money(p.price)}</span></button>`)}</div></div></div><div className="card"><div className="card-head"><h3>Venta borrador</h3><${Badge}>LOCAL</${Badge}></div><div className="card-pad"><div className="field"><label>Cliente</label><input className="input" value=${customer} onInput=${e=>setCustomer(e.target.value)}/></div><div className="divider"></div>${cart.map(x=>html`<div className="cart-line"><div><b style=${{fontSize:'12px'}}>${x.name}</b></div><div className="qty"><button onClick=${()=>qty(x.id,-1)}>−</button><b>${x.qty}</b><button onClick=${()=>qty(x.id,1)}>＋</button></div><b style=${{fontSize:'12px'}}>${money(x.price*x.qty)}</b></div>`)}<div className="total"><span>Total</span><span>${money(total)}</span></div><div className="divider"></div><button className="btn primary" style=${{width:'100%',justifyContent:'center'}}>Emitir venta simulada</button></div></div></div></>`}
function SimpleTable({title,subtitle,columns,rows,action}){return html`<><${PageHead} title=${title} subtitle=${subtitle} action=${action}/><div className="card"><div className="toolbar" style=${{padding:14,margin:0,borderBottom:'1px solid var(--line)'}}><input className="input" placeholder="Buscar..."/><select className="select"><option>Todos los estados</option><option>Activo</option><option>Pendiente</option></select><button className="btn">Filtros</button></div><div className="table-wrap"><table className="table"><thead><tr>${columns.map(c=>html`<th>${c}</th>`)}</tr></thead><tbody>${rows.map(r=>html`<tr>${r.map((c,i)=>html`<td>${i===r.length-1&&['Activo','Pagada','OK'].includes(c)?html`<${Badge} type="ok">${c}</${Badge}>`:i===r.length-1&&['Pendiente','Por pagar'].includes(c)?html`<${Badge} type="warn">${c}</${Badge}>`:c}</td>`)}</tr>`)}</tbody></table></div></div></>`}

function Tesoreria(){return html`<><${PageHead} title="Tesorería & Bancos" subtitle="Saldos, caja, bancos y movimientos financieros." action=${html`<button className="btn primary">＋ Movimiento</button>`}/><div className="grid3"><${Metric} icon="💵" label="Caja General" value="$ 23.760.000" trend="4,8%"/><${Metric} icon="🏦" label="Bancolombia" value="$ 128.590.000" trend="2,1%"/><${Metric} icon="↔" label="Movimientos hoy" value="18" trend="12,0%"/></div><div style=${{marginTop:14}}><${SimpleTable} title="Movimientos recientes" subtitle="" columns=${['Tipo','Origen / Destino','Valor','Hora','Estado']} rows=${[['Ingreso','Venta POS','$ 320.000','10:35','OK'],['Transferencia','Caja → Banco','$ 5.000.000','09:40','OK'],['Egreso','Servicios públicos','$ 680.000','08:55','OK']]}/></div></>`}

function Contabilidad(){const [tab,setTab]=useState('asientos');const [accounts,setAccounts]=useState(seedAccounts);const [entries,setEntries]=useState([{id:'AU-202608-000002',detail:'Venta POS',debit:30360,credit:30360}]);const [entry,setEntry]=useState({detail:'',debit:'',credit:''});const [acc,setAcc]=useState({code:'',name:'',nature:'Débito'});const addEntry=e=>{e.preventDefault();if(!entry.detail)return;setEntries(x=>[...x,{id:'AU-MOCK-'+String(x.length+1).padStart(3,'0'),detail:entry.detail,debit:Number(entry.debit||0),credit:Number(entry.credit||0)}]);setEntry({detail:'',debit:'',credit:''})};const addAccount=e=>{e.preventDefault();if(!acc.code||!acc.name)return;setAccounts(x=>[...x,{...acc}]);setAcc({code:'',name:'',nature:'Débito'})};return html`<><${PageHead} title="Contabilidad" subtitle="Prueba formularios locales de asientos y plan de cuentas."/><div className="tabs"><button className=${'tab '+(tab==='asientos'?'active':'')} onClick=${()=>setTab('asientos')}>Asientos</button><button className=${'tab '+(tab==='cuentas'?'active':'')} onClick=${()=>setTab('cuentas')}>Plan de cuentas</button><button className=${'tab '+(tab==='reportes'?'active':'')} onClick=${()=>setTab('reportes')}>Reportes</button></div>${tab==='asientos'?html`<div className="grid2"><div className="card"><div className="card-head"><h3>Nuevo asiento mock</h3><${Badge}>LOCAL</${Badge}></div><form className="card-pad" onSubmit=${addEntry}><div className="field"><label>Detalle</label><input className="input" value=${entry.detail} onInput=${e=>setEntry({...entry,detail:e.target.value})} placeholder="Ej. Ajuste de caja"/></div><div className="form-grid" style=${{marginTop:12}}><div className="field"><label>Débito</label><input className="input" type="number" value=${entry.debit} onInput=${e=>setEntry({...entry,debit:e.target.value})}/></div><div className="field"><label>Crédito</label><input className="input" type="number" value=${entry.credit} onInput=${e=>setEntry({...entry,credit:e.target.value})}/></div></div><button className="btn primary" style=${{marginTop:12}} type="submit">Agregar asiento</button></form></div><div className="card"><div className="card-head"><h3>Asientos creados</h3></div><div className="table-wrap"><table className="table"><thead><tr><th>Número</th><th>Detalle</th><th>Débito</th><th>Crédito</th></tr></thead><tbody>${entries.map(x=>html`<tr><td>${x.id}</td><td>${x.detail}</td><td>${money(x.debit)}</td><td>${money(x.credit)}</td></tr>`)}</tbody></table></div></div></div>`:tab==='cuentas'?html`<div className="grid2"><div className="card"><div className="card-head"><h3>Nueva cuenta mock</h3></div><form className="card-pad" onSubmit=${addAccount}><div className="form-grid"><div className="field"><label>Código</label><input className="input" value=${acc.code} onInput=${e=>setAcc({...acc,code:e.target.value})}/></div><div className="field"><label>Naturaleza</label><select className="select" value=${acc.nature} onChange=${e=>setAcc({...acc,nature:e.target.value})}><option>Débito</option><option>Crédito</option></select></div></div><div className="field" style=${{marginTop:12}}><label>Nombre</label><input className="input" value=${acc.name} onInput=${e=>setAcc({...acc,name:e.target.value})}/></div><button className="btn primary" style=${{marginTop:12}} type="submit">Crear cuenta</button></form></div><div className="card"><div className="card-head"><h3>Plan de cuentas</h3></div><div className="table-wrap"><table className="table"><thead><tr><th>Código</th><th>Cuenta</th><th>Naturaleza</th></tr></thead><tbody>${accounts.map(x=>html`<tr><td><b>${x.code}</b></td><td>${x.name}</td><td>${x.nature}</td></tr>`)}</tbody></table></div></div></div>`:html`<div className="grid3"><${Metric} icon="↔" label="Débitos" value="$ 52.860" trend="Cuadra"/><${Metric} icon="↔" label="Créditos" value="$ 52.860" trend="Cuadra"/><${Metric} icon="✓" label="Diferencia" value="$ 0" trend="Balanceado"/></div>`}</>`}
function Parametrizacion(){const groups=[['Cuentas contables',['Plan de cuentas','Cuentas por terceros','Cuentas por productos']],['Terceros y proveedores',['Cuentas por cobrar','Cuentas por pagar','Anticipos y avances']],['Inventarios',['Cuentas de inventario','Variaciones y ajustes','Costos de venta']],['Ventas',['Cuentas de ingresos','Impuestos y retenciones','Descuentos y devoluciones']],['Compras',['Cuentas de gastos','Impuestos descontables','Costos y fletes']],['Tesorería & Bancos',['Cuentas bancarias','Conciliación bancaria','Comisiones e intereses']]];return html`<><${PageHead} title="Parametrización Contable" subtitle="Vista propuesta para configurar y validar el mapeo contable." action=${html`<button className="btn primary">Ver reporte</button>`}/><div className="grid3">${groups.map((g,gi)=>html`<div className="card card-pad"><div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:11}}><b style=${{fontSize:'13px'}}>${g[0]}</b><span style=${{fontSize:'10px',color:'var(--muted)'}}>${g[1].length} parámetros</span></div>${g[1].map((x,i)=>html`<div style=${{display:'flex',justifyContent:'space-between',gap:8,padding:'8px 0',borderTop:i?'1px solid var(--line)':'0',fontSize:'11px'}}><span>${x}</span><${Badge} type=${(gi+i)%4===2?'warn':'ok'}>${(gi+i)%4===2?'Pendiente':'Listo'}</${Badge}></div>`)}<button className="btn ghost sm" style=${{paddingLeft:0,color:'var(--accent)',marginTop:6}}>Ver detalle →</button></div>`)}</div></>`}
function Configuracion(){return html`<><${PageHead} title="Configuración avanzada" subtitle="Agrupación moderna de configuraciones transversales."/><div className="grid3">${[['DIAN','Facturación, numeración y proveedor tecnológico','Advertencia','warn'],['Roles y permisos','Usuarios, roles y permisos por módulo','Operativo','ok'],['Impresión','Formatos, impresoras y agente local','Operativo','ok'],['Nómina electrónica','Configuración y transmisión de nómina','Pendiente','warn'],['Notificaciones','Canales, plantillas y consentimiento','Operativo','ok']].map(x=>html`<div className="card card-pad"><div className="metric-icon">⚙</div><h3 style=${{fontSize:'14px',margin:'13px 0 5px'}}>${x[0]}</h3><p style=${{fontSize:'11px',color:'var(--muted)',minHeight:34}}>${x[1]}</p><${Badge} type=${x[3]}>${x[2]}</${Badge}><div><button className="btn ghost sm" style=${{paddingLeft:0,color:'var(--accent)',marginTop:12}}>Configurar →</button></div></div>`)}</div></>`}
const viewMap={dashboard:Dashboard,restaurante:Restaurante,ventas:Ventas,compras:Compras,inventario:Inventario,tesoreria:Tesoreria,cartera:Cartera,terceros:Terceros,contabilidad:Contabilidad,parametrizacion:Parametrizacion,configuracion:Configuracion};
function ThemePanel({theme,setTheme,onClose}){const accents=[['#2563eb','#eff6ff'],['#0d9488','#ecfdf5'],['#7c3aed','#f5f3ff'],['#ea580c','#fff7ed'],['#18181b','#f4f4f5']];return html`<div className="theme-panel"><div style=${{display:'flex',justifyContent:'space-between',gap:8}}><div><h3>Personalizar interfaz</h3><p>Solo afecta este sandbox.</p></div><button className="btn ghost sm" onClick=${onClose}>✕</button></div><div className="theme-row"><label>Color de acento</label><div className="swatches">${accents.map(a=>html`<button className=${'swatch '+(theme.accent===a[0]?'active':'')} style=${{background:a[0]}} onClick=${()=>setTheme({...theme,accent:a[0],soft:a[1]})}></button>`)}</div></div><div className="theme-row"><label>Modo</label><div className="row"><button className=${'btn sm '+(theme.mode==='light'?'primary':'')} onClick=${()=>setTheme({...theme,mode:'light'})}>Claro</button><button className=${'btn sm '+(theme.mode==='dark'?'primary':'')} onClick=${()=>setTheme({...theme,mode:'dark'})}>Oscuro</button></div></div><div className="theme-row"><label>Tipografía</label><select className="select" style=${{width:'100%'}} value=${theme.font} onChange=${e=>setTheme({...theme,font:e.target.value})}><option value="Inter,ui-sans-serif,system-ui,sans-serif">Inter / System</option><option value="'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif">Plus Jakarta Sans</option><option value="Roboto,Arial,sans-serif">Roboto</option><option value="Georgia,serif">Serif editorial</option></select></div><div className="theme-row"><button className="btn danger sm" onClick=${()=>setTheme({mode:'light',accent:'#2563eb',soft:'#eff6ff',font:'Inter,ui-sans-serif,system-ui,sans-serif'})}>Restablecer tema</button></div></div>`}
function App(){const [view,setView]=useState('dashboard');const [collapsed,setCollapsed]=useState(false);const [mobile,setMobile]=useState(false);const [themeOpen,setThemeOpen]=useState(false);const [theme,setTheme]=useState(()=>{try{return JSON.parse(localStorage.getItem('vantixgc_ui_sandbox_theme')||'null')||{mode:'light',accent:'#2563eb',soft:'#eff6ff',font:'Inter,ui-sans-serif,system-ui,sans-serif'}}catch{return {mode:'light',accent:'#2563eb',soft:'#eff6ff',font:'Inter,ui-sans-serif,system-ui,sans-serif'}}});useEffect(()=>{document.documentElement.style.setProperty('--accent',theme.accent);document.documentElement.style.setProperty('--accent-soft',theme.soft);document.documentElement.style.setProperty('--font',theme.font);document.body.classList.toggle('dark',theme.mode==='dark');localStorage.setItem('vantixgc_ui_sandbox_theme',JSON.stringify(theme))},[theme]);const Current=viewMap[view]||Dashboard;const label=navItems.find(x=>x[0]===view)?.[2]||'Dashboard';return html`<div className=${'shell '+(collapsed?'collapsed ':'')}><aside className=${'sidebar '+(mobile?'mobile-open':'')}><div className="brand"><div className="brandmark">V</div><div className="brandtext"><b>VantixGC</b><span>Super Core · V2 Preview</span></div></div><div className="section-title">Navegación</div><nav className="nav">${navItems.map(n=>html`<button className=${view===n[0]?'active':''} onClick=${()=>{setView(n[0]);setMobile(false)}}><span className="nav-icon">${n[1]}</span><span className="nav-label">${n[2]}</span></button>`)}</nav><div className="sidebar-foot"><button onClick=${()=>setCollapsed(!collapsed)}><span>⇤</span><span>${collapsed?'Expandir':'Colapsar sidebar'}</span></button></div></aside><main className="main"><header className="topbar"><div className="top-left"><button className="icon-btn" onClick=${()=>setMobile(!mobile)}>☰</button><div><div className="breadcrumb">V2 Preview / ${label}</div></div></div><div className="top-actions"><select className="tenant-select"><option>VantixGC Demo SAS</option><option>Restaurante Demo</option></select><button className="icon-btn notify">♧</button><div className="user-pill"><div className="avatar">AG</div><div><b style=${{display:'block',fontSize:'11px'}}>Andrés Gómez</b><span style=${{display:'block',fontSize:'9px',color:'var(--muted)'}}>Administrador</span></div></div></div></header><section className="content"><${Current}/></section></main><button className="theme-fab" title="Personalizar tema" onClick=${()=>setThemeOpen(!themeOpen)}>◐</button>${themeOpen?html`<${ThemePanel} theme=${theme} setTheme=${setTheme} onClose=${()=>setThemeOpen(false)}/>`:null}</div>`}
createRoot(document.getElementById('app')).render(html`<${App}/>`);
</script>
