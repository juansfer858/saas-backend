<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vantix Bike · Centro de control</title>
<style>
:root{--bg:#f4f5f4;--card:#fff;--line:#e2e7e4;--text:#18221d;--muted:#61706a;--green:#0d6b43;--green2:#118a57;--soft:#ddf3e8;--danger:#b42318;--nav:#18241e}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--nav);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:18px;font-weight:850;padding:3px 8px 18px}.brand small{display:block;color:#b9c9c1;font-size:11px;margin-top:3px}.tenant{padding:10px 11px;margin-bottom:14px;border:1px solid #ffffff1f;border-radius:11px;background:#ffffff0c}.tenant strong{display:block;font-size:12px}.tenant span{font-size:10px;color:#b9c9c1}.nav button,.nav a{appearance:none;width:100%;border:0;text-align:left;display:flex;gap:9px;align-items:center;padding:10px 11px;margin:3px 0;border-radius:9px;background:transparent;color:#dfe8e3;text-decoration:none;cursor:pointer}.nav button.active,.nav button:hover,.nav a:hover{background:#ffffff16;color:#fff}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.top small{color:var(--muted)}.content{max-width:1500px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.head h1{font-size:26px;margin:0 0 4px}.muted{color:var(--muted)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:16px}.stat b{display:block;font-size:28px;margin-top:6px}.panel{margin-top:14px;overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-body{padding:15px}.btn{border:1px solid #d0d5dd;background:#fff;color:var(--text);border-radius:9px;padding:8px 12px;font-weight:750;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.small{font-size:12px;padding:6px 8px}.btn.danger{color:var(--danger);border-color:#fecaca}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{background:#fafbfa;color:#475467;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:10px 12px;border-bottom:1px solid #eef1ef;vertical-align:top}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#f2f4f7;color:#475467}.badge.good{background:#ecfdf3;color:#027a48}.badge.warn{background:#fffaeb;color:#b54708}.badge.danger{background:#fef3f2;color:#b42318}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-size:11px;font-weight:800;margin:0 0 5px;color:#475467}.input,.select,textarea{width:100%;padding:9px 10px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.empty{padding:28px;text-align:center;color:var(--muted)}.notice,.error{padding:11px 13px;border-radius:10px;margin-bottom:12px}.notice{background:#eef8f3;border:1px solid #b8dec9;color:#166534}.error{background:#fff1f0;border:1px solid #fecaca;color:#b42318}.modal-back{position:fixed;inset:0;background:#10182899;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(900px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:15px;padding:20px}.modal h2{margin-top:0}.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px;cursor:pointer;text-align:left}.slot:hover,.slot.selected{border-color:var(--green2);background:var(--soft)}@media(max-width:1000px){.grid4,.form-grid,.slot-grid{grid-template-columns:1fr 1fr}}@media(max-width:760px){.app{display:block}.side{position:static;height:auto}.content{padding:12px}.top{position:static}.grid4,.form-grid,.slot-grid{grid-template-columns:1fr}.head{flex-direction:column}}
</style>
</head>
<body>
<div id="root"></div><div id="modalRoot"></div>
<script src="/bike/control-center.js?v=3"></script>
</body>
</html>
