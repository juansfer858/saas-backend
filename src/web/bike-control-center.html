<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vantix Bike · Centro de control</title>
<style>
:root{--bg:#f4f5f4;--card:#fff;--line:#e2e7e4;--text:#18221d;--muted:#61706a;--green:#0d6b43;--green2:#118a57;--soft:#ddf3e8;--gold:#d4a62a;--danger:#b42318;--nav:#18241e}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--nav);color:white;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:18px;font-weight:850;padding:3px 8px 18px}.brand small{display:block;color:#b9c9c1;font-size:11px;margin-top:3px}.tenant{padding:10px 11px;margin-bottom:14px;border:1px solid #ffffff1f;border-radius:11px;background:#ffffff0c}.tenant strong{display:block;font-size:12px}.tenant span{font-size:10px;color:#b9c9c1}.nav button,.nav a{appearance:none;width:100%;border:0;text-align:left;display:flex;gap:9px;align-items:center;padding:10px 11px;margin:3px 0;border-radius:9px;background:transparent;color:#dfe8e3;text-decoration:none;cursor:pointer}.nav button.active,.nav button:hover,.nav a:hover{background:#ffffff16;color:#fff}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.top small{color:var(--muted)}.content{max-width:1500px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.head h1{font-size:26px;margin:0 0 4px}.muted{color:var(--muted)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:16px}.stat b{display:block;font-size:28px;margin-top:6px}.panel{margin-top:14px;overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-body{padding:15px}.btn{border:1px solid #d0d5dd;background:#fff;color:var(--text);border-radius:9px;padding:8px 12px;font-weight:750;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.small{font-size:12px;padding:6px 8px}.btn.danger{color:var(--danger);border-color:#fecaca}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{background:#fafbfa;color:#475467;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:10px 12px;border-bottom:1px solid #eef1ef;vertical-align:top}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#f2f4f7;color:#475467}.badge.good{background:#ecfdf3;color:#027a48}.badge.warn{background:#fffaeb;color:#b54708}.badge.danger{background:#fef3f2;color:#b42318}.filters,.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-size:11px;font-weight:800;margin:0 0 5px;color:#475467}.input,.select,textarea{width:100%;padding:9px 10px;border:1px solid #d0d5dd;border-radius:9px;background:white}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.empty{padding:28px;text-align:center;color:var(--muted)}.notice,.error{padding:11px 13px;border-radius:10px;margin-bottom:12px}.notice{background:#eef8f3;border:1px solid #b8dec9;color:#166534}.error{background:#fff1f0;border:1px solid #fecaca;color:#b42318}.modal-back{position:fixed;inset:0;background:#10182899;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(900px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:15px;padding:20px}.modal h2{margin-top:0}.tabs{display:flex;gap:7px;flex-wrap:wrap}.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px;cursor:pointer;text-align:left}.slot:hover{border-color:var(--green2);background:var(--soft)}@media(max-width:1000px){.grid4,.filters,.form-grid,.slot-grid{grid-template-columns:1fr 1fr}}@media(max-width:760px){.app{display:block}.side{position:static;height:auto}.content{padding:12px}.top{position:static}.grid4,.filters,.form-grid,.slot-grid{grid-template-columns:1fr}.head{flex-direction:column}}
</style>
</head>
<body><div id="root"></div><div id="modalRoot"></div>
<script>
const SESSION_KEY='vantixgc_core_session_v1';let session=null;try{session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{}if(!session?.token||!session?.subdomain)location.replace('/app/login');
const st={tab:'resumen',status:null,bikes:[],orders:[],appointments:[],services:[],users:[],customers:[],rules:[],blocks:[]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmtDate(v){if(!v)return '—';return new Intl.DateTimeFormat('es-CO',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Bogota'}).format(new Date(v))}
function money(v){return new Intl.NumberFormat('es-CO',{style:'currency',currency:session?.tenant?.moneda||'COP',maximumFractionDigits:0}).format(Number(v||0))}
async function api(path,opts={}){const r=await fetch(path,{...opts,cache:'no-store',headers:{Authorization:`Bearer ${session.token}`,'x-tenant-subdomain':session.subdomain,...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});let b={};try{b=await r.json()}catch{}if(r.status===401){localStorage.removeItem(SESSION_KEY);location.replace('/app/login');throw new Error('Sesión vencida')}if(!r.ok)throw new Error(b?.error?.message||b?.message||`HTTP ${r.status}`);return b.data}
function statusBadge(s){const good=['READY','DELIVERED','COMPLETED','CONFIRMED','ACTIVE'];const warn=['DIAGNOSIS','WAITING_APPROVAL','APPROVED','IN_PROGRESS','FINAL_TEST','PENDING','RECEIVED'];const bad=['CANCELLED','NO_SHOW'];return `<span class="badge ${good.includes(s)?'good':bad.includes(s)?'danger':warn.includes(s)?'warn':''}">${esc(s||'—')}</span>`}
function navButton(tab,label){return `<button data-tab="${tab}" class="${st.tab===tab?'active':''}">${label}</button>`}
function shell(){return `<div class="app"><aside class="side"><div class="brand">VANTIX BIKE<small>Super Core · vertical ciclismo</small></div><div class="tenant"><strong>${esc(session.tenant?.nombreEmpresa||session.subdomain)}</strong><span>${esc(session.subdomain)}</span></div><nav class="nav">${navButton('resumen','Resumen')}${navButton('taller','Taller')}${navButton('agenda','Agenda')}${navButton('bicicletas','Bicicletas')}${navButton('horarios','Horarios de mecánicos')}<a href="/app/inventario">Inventario / Kardex</a><a href="/app/ventas">Ventas / Caja</a><a href="/app/terceros">Clientes / Terceros</a><a href="/app/dashboard">Super Core</a></nav></aside><main class="main"><header class="top"><div><strong>Centro Bike</strong><br><small>Operación de tienda y taller</small></div><button class="btn small" id="logout">Salir</button></header><section class="content"><div id="flash"></div><div id="view"></div></section></main></div>`}
function flash(msg,error=false){$('#flash').innerHTML=`<div class="${error?'error':'notice'}">${esc(msg)}</div>`;setTimeout(()=>{const f=$('#flash');if(f)f.innerHTML=''},5000)}
function modal(html){$('#modalRoot').innerHTML=`<div class="modal-back"><div class="modal">${html}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
async function loadBase(){const calls=[api('/api/v1/bike/status'),api('/api/v1/bike/bicicletas?limit=500'),api('/api/v1/bike/ordenes?limit=500'),api('/api/v1/bike/agenda/citas?limit=500'),api('/api/v1/bike/servicios?active=true&limit=500'),api('/api/v1/usuarios'),api('/api/v1/terceros?activo=true&limit=500'),api('/api/v1/bike/agenda/reglas?active=true'),api('/api/v1/bike/agenda/bloqueos')];const r=await Promise.all(calls);[st.status,st.bikes,st.orders,st.appointments,st.services,st.users,st.customers,st.rules,st.blocks]=r;st.bikes=st.bikes||[];st.orders=st.orders||[];st.appointments=st.appointments||[];st.services=st.services||[];st.users=Array.isArray(st.users)?st.users:(st.users?.items||[]);st.customers=(st.customers||[]).filter(x=>['CLIENTE','CLIENTE_PROVEEDOR'].includes(x.tipo));st.rules=st.rules||[];st.blocks=st.blocks||[]}
function render(){if(st.tab==='resumen')return renderSummary();if(st.tab==='taller')return renderWorkshop();if(st.tab==='agenda')return renderAgenda();if(st.tab==='bicicletas')return renderBikes();return renderSchedules()}
function renderSummary(){const open=st.orders.filter(x=>!['DELIVERED','CANCELLED'].includes(x.status)).length;const today=new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'});const apToday=st.appointments.filter(x=>new Date(x.startsAt).toLocaleDateString('en-CA',{timeZone:'America/Bogota'})===today&&!['CANCELLED','NO_SHOW'].includes(x.status)).length;const waiting=st.orders.filter(x=>x.status==='WAITING_APPROVAL').length;$('#view').innerHTML=`<div class="head"><div><h1>Operación Bike</h1><div class="muted">Tienda, taller y agenda sobre contratos del Super Core.</div></div><div class="toolbar"><button class="btn primary" data-new-appt>+ Cita</button><button class="btn" data-tab-go="taller">Ver taller</button></div></div><div class="grid4"><div class="stat"><span class="muted">Bicicletas</span><b>${st.bikes.length}</b></div><div class="stat"><span class="muted">OT abiertas</span><b>${open}</b></div><div class="stat"><span class="muted">Esperando autorización</span><b>${waiting}</b></div><div class="stat"><span class="muted">Citas hoy</span><b>${apToday}</b></div></div><div class="panel"><div class="panel-head"><strong>Últimas órdenes</strong></div>${ordersTable(st.orders.slice(0,8))}</div>`;bindCommon()}
function ordersTable(rows){if(!rows.length)return '<div class="empty">No hay órdenes.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>OT</th><th>Bicicleta</th><th>Estado</th><th>Asignado</th><th>Total</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.number)}</strong></td><td>${esc(x.bike?.brand||'')} ${esc(x.bike?.model||'')}</td><td>${statusBadge(x.status)}</td><td>${esc(x.assignedUserId||'Sin asignar')}</td><td>${money(x.total)}</td></tr>`).join('')}</tbody></table></div>`}
function renderWorkshop(){$('#view').innerHTML=`<div class="head"><div><h1>Taller</h1><div class="muted">Órdenes reales, diagnóstico, autorizaciones, repuestos y prueba final.</div></div></div><div class="panel"><div class="panel-head"><strong>Órdenes de trabajo</strong><span class="muted">${st.orders.length}</span></div>${ordersTable(st.orders)}</div>`}
function renderAgenda(){const rows=st.appointments.map(x=>`<tr><td>${fmtDate(x.startsAt)}</td><td>${esc(x.service?.name||'Servicio')}</td><td>${esc(st.users.find(u=>u.id===x.assignedUserId)?.nombre||x.assignedUserId||'—')}</td><td>${esc(x.bike?`${x.bike.brand} ${x.bike.model}`:'Sin bicicleta')}</td><td>${statusBadge(x.status)}</td><td><div class="toolbar">${x.status==='PENDING'?`<button class="btn small" data-confirm="${x.id}">Confirmar</button>`:''}${['PENDING','CONFIRMED'].includes(x.status)?`<button class="btn small danger" data-cancel-appt="${x.id}">Cancelar</button>`:''}${x.status==='CONFIRMED'&&x.bikeId?`<button class="btn small primary" data-convert="${x.id}">Ingresar al taller</button>`:''}</div></td></tr>`).join('');$('#view').innerHTML=`<div class="head"><div><h1>Agenda</h1><div class="muted">Recepción, portal y WhatsApp comparten los mismos cupos.</div></div><button class="btn primary" data-new-appt>+ Nueva cita</button></div><div class="panel"><div class="panel-head"><strong>Citas</strong><span class="muted">${st.appointments.length}</span></div>${rows?`<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Servicio</th><th>Mecánico</th><th>Bicicleta</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No hay citas.</div>'}</div>`;bindCommon();$$('[data-confirm]').forEach(b=>b.onclick=()=>action(`/api/v1/bike/agenda/citas/${b.dataset.confirm}/confirmar`,'POST','Cita confirmada'));$$('[data-cancel-appt]').forEach(b=>b.onclick=()=>cancelAppointment(b.dataset.cancelAppt));$$('[data-convert]').forEach(b=>b.onclick=()=>action(`/api/v1/bike/agenda/citas/${b.dataset.convert}/convertir-ot`,'POST','Cita convertida a OT'))}
function renderBikes(){const rows=st.bikes.map(x=>`<tr><td><strong>${esc(x.code)}</strong></td><td>${esc(x.brand)} ${esc(x.model)}</td><td>${esc(x.serial||'—')}</td><td>${esc(x.bikeType||'—')}</td><td>${esc(x.frameSize||'—')}</td><td>${statusBadge(x.status)}</td><td>${x._count?.workOrders||0}</td></tr>`).join('');$('#view').innerHTML=`<div class="head"><div><h1>Bicicletas</h1><div class="muted">Pasaporte permanente, serial y trazabilidad.</div></div><button class="btn primary" id="newBike">+ Bicicleta</button></div><div class="panel">${rows?`<div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Bicicleta</th><th>Serial</th><th>Tipo</th><th>Talla</th><th>Estado</th><th>OT</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No hay bicicletas.</div>'}</div>`;$('#newBike').onclick=openBikeModal}
function renderSchedules(){const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];const rows=st.rules.map(x=>`<tr><td>${esc(st.users.find(u=>u.id===x.userId)?.nombre||x.userId)}</td><td>${days[x.dayOfWeek]}</td><td>${String(Math.floor(x.startMinute/60)).padStart(2,'0')}:${String(x.startMinute%60).padStart(2,'0')} - ${String(Math.floor(x.endMinute/60)).padStart(2,'0')}:${String(x.endMinute%60).padStart(2,'0')}</td><td>${esc(x.timeZone)}</td></tr>`).join('');$('#view').innerHTML=`<div class="head"><div><h1>Horarios de mecánicos</h1><div class="muted">Estas reglas determinan la disponibilidad que ve el cliente.</div></div><button class="btn primary" id="newRule">+ Horario</button></div><div class="panel">${rows?`<div class="table-wrap"><table class="table"><thead><tr><th>Mecánico</th><th>Día</th><th>Horario</th><th>Zona</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No hay horarios configurados.</div>'}</div>`;$('#newRule').onclick=openRuleModal}
function userOptions(){return st.users.map(x=>`<option value="${x.id}">${esc(x.nombre||x.email)}</option>`).join('')}function customerOptions(){return st.customers.map(x=>`<option value="${x.id}">${esc(x.nombre||x.razonSocial)} · ${esc(x.telefono||x.identificacion)}</option>`).join('')}function serviceOptions(){return st.services.map(x=>`<option value="${x.id}">${esc(x.name)} · ${x.estimatedMinutes} min</option>`).join('')}
function openAppointmentModal(){modal(`<h2>Nueva cita</h2><form id="apptForm"><div class="form-grid"><div class="field"><label>Cliente</label><select class="select" id="aCustomer" required><option value="">Seleccione</option>${customerOptions()}</select></div><div class="field"><label>Bicicleta</label><select class="select" id="aBike"><option value="">Sin seleccionar</option></select></div><div class="field"><label>Servicio</label><select class="select" id="aService" required><option value="">Seleccione</option>${serviceOptions()}</select></div><div class="field"><label>Fecha</label><input class="input" id="aDate" type="date" required></div></div><div class="panel" id="slotPanel" style="display:none"><div class="panel-head"><strong>Cupos disponibles</strong></div><div class="panel-body"><div class="slot-grid" id="slots"></div></div></div><input type="hidden" id="aMechanic"><input type="hidden" id="aStart"><div class="field"><label>Nota del cliente</label><textarea id="aNote" rows="3"></textarea></div><div class="actions"><button type="button" class="btn" id="closeModal">Cancelar</button><button class="btn primary">Reservar</button></div></form>`);const cust=$('#aCustomer');const bikeSel=$('#aBike');cust.onchange=()=>{bikeSel.innerHTML='<option value="">Sin seleccionar</option>'+st.bikes.filter(b=>b.customerThirdPartyId===cust.value).map(b=>`<option value="${b.id}">${esc(b.brand)} ${esc(b.model)} · ${esc(b.code)}</option>`).join('')};async function loadSlots(){const d=$('#aDate').value,s=$('#aService').value;if(!d||!s)return;try{const slots=await api(`/api/v1/bike/agenda/disponibilidad?date=${encodeURIComponent(d)}&serviceCatalogId=${encodeURIComponent(s)}&stepMinutes=15`);$('#slotPanel').style.display='block';$('#slots').innerHTML=(slots||[]).length?(slots||[]).map(x=>`<button type="button" class="slot" data-slot-start="${x.startsAt}" data-slot-user="${x.assignedUserId}"><strong>${new Intl.DateTimeFormat('es-CO',{hour:'numeric',minute:'2-digit',timeZone:'America/Bogota'}).format(new Date(x.startsAt))}</strong><br><small>${esc(x.mechanicName||'Mecánico')} · ${x.durationMinutes} min</small></button>`).join(''):'<div class="empty">No hay cupos disponibles.</div>';$$('[data-slot-start]').forEach(b=>b.onclick=()=>{#slots.querySelectorAll?.('.slot');$$('.slot').forEach(x=>x.style.outline='');b.style.outline='2px solid #118a57';$('#aStart').value=b.dataset.slotStart;$('#aMechanic').value=b.dataset.slotUser})}catch(e){flash(e.message,true)}}$('#aDate').onchange=loadSlots;$('#aService').onchange=loadSlots;$('#closeModal').onclick=closeModal;$('#apptForm').onsubmit=async e=>{e.preventDefault();if(!$('#aStart').value)return flash('Selecciona un cupo.',true);try{await api('/api/v1/bike/agenda/citas',{method:'POST',body:JSON.stringify({customerThirdPartyId:cust.value,bikeId:bikeSel.value||null,serviceCatalogId:$('#aService').value,assignedUserId:$('#aMechanic').value,startsAt:$('#aStart').value,source:'INTERNAL',customerNotes:$('#aNote').value||null})});closeModal();await refresh();st.tab='agenda';render();flash('Cita creada.')}catch(err){flash(err.message,true)}}}
function openBikeModal(){modal(`<h2>Nueva bicicleta</h2><form id="bikeForm"><div class="form-grid"><div class="field"><label>Cliente</label><select id="bCustomer" class="select" required><option value="">Seleccione</option>${customerOptions()}</select></div><div class="field"><label>Código</label><input id="bCode" class="input" required placeholder="VB-0001"></div><div class="field"><label>Marca</label><input id="bBrand" class="input" required></div><div class="field"><label>Modelo</label><input id="bModel" class="input" required></div><div class="field"><label>Serial</label><input id="bSerial" class="input"></div><div class="field"><label>Tipo</label><input id="bType" class="input" placeholder="MTB / ruta / urbana"></div><div class="field"><label>Talla</label><input id="bSize" class="input"></div><div class="field"><label>Color</label><input id="bColor" class="input"></div></div><div class="actions"><button type="button" class="btn" id="closeModal">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);$('#closeModal').onclick=closeModal;$('#bikeForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/v1/bike/bicicletas',{method:'POST',body:JSON.stringify({customerThirdPartyId:$('#bCustomer').value,code:$('#bCode').value,brand:$('#bBrand').value,model:$('#bModel').value,serial:$('#bSerial').value||null,bikeType:$('#bType').value||null,frameSize:$('#bSize').value||null,color:$('#bColor').value||null})});closeModal();await refresh();st.tab='bicicletas';render();flash('Bicicleta registrada.')}catch(err){flash(err.message,true)}}}
function openRuleModal(){modal(`<h2>Horario del mecánico</h2><form id="ruleForm"><div class="form-grid"><div class="field"><label>Mecánico</label><select id="rUser" class="select" required><option value="">Seleccione</option>${userOptions()}</select></div><div class="field"><label>Día</label><select id="rDay" class="select"><option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option></select></div><div class="field"><label>Desde</label><input id="rStart" class="input" type="time" value="08:00" required></div><div class="field"><label>Hasta</label><input id="rEnd" class="input" type="time" value="17:00" required></div></div><div class="actions"><button type="button" class="btn" id="closeModal">Cancelar</button><button class="btn primary">Guardar</button></div></form>`);$('#closeModal').onclick=closeModal;$('#ruleForm').onsubmit=async e=>{e.preventDefault();const mins=v=>{const [h,m]=v.split(':').map(Number);return h*60+m};try{await api('/api/v1/bike/agenda/reglas',{method:'POST',body:JSON.stringify({userId:$('#rUser').value,dayOfWeek:Number($('#rDay').value),startMinute:mins($('#rStart').value),endMinute:mins($('#rEnd').value),timeZone:'America/Bogota'})});closeModal();await refresh();st.tab='horarios';render();flash('Horario guardado.')}catch(err){flash(err.message,true)}}}
async function action(path,method,msg){try{await api(path,{method});await refresh();render();flash(msg)}catch(e){flash(e.message,true)}}function cancelAppointment(id){const reason=prompt('Motivo de cancelación:');if(!reason)return;api(`/api/v1/bike/agenda/citas/${id}/cancelar`,{method:'POST',body:JSON.stringify({reason,source:'INTERNAL'})}).then(async()=>{await refresh();render();flash('Cita cancelada.')}).catch(e=>flash(e.message,true))}
function bindCommon(){$$('[data-new-appt]').forEach(b=>b.onclick=openAppointmentModal);$$('[data-tab-go]').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tabGo;render()})}
async function refresh(){await loadBase()}
async function boot(){document.getElementById('root').innerHTML=shell();$('#logout').onclick=()=>{localStorage.removeItem(SESSION_KEY);location.replace('/app/login')};$$('[data-tab]').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===st.tab));render()});try{await refresh();render()}catch(e){flash(e.message,true);$('#view').innerHTML='<div class="panel"><div class="empty">No se pudo cargar Bike. Verifica que el vertical BIKE esté habilitado para esta empresa.</div></div>'}}
boot();
</script></body></html>
