name: Restaurant Table Enable V55 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-table-enable-v55.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'scripts/restaurant-table-enable-v55-smoke.js'
      - '.github/workflows/restaurant-table-enable-v55-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-table-enable-v55.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'scripts/restaurant-table-enable-v55-smoke.js'
      - '.github/workflows/restaurant-table-enable-v55-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check V55
        run: node --check src/modules/restaurant/restaurant-table-enable-v55.public.routes.js
      - name: Validate staff-gated QR table enable flow
        run: node scripts/restaurant-table-enable-v55-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait exact V55 commit and browser surfaces in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              QRH="$(mktemp)"; QRJ="$(mktemp)"; UIH="$(mktemp)"; UIJ="$(mktemp)"
              if curl -fsS -D "$QRH" "$BASE/app/restaurant-qr-ui.js?v=table-enable-v55-$GITHUB_SHA" -o "$QRJ" \
                && curl -fsS -D "$UIH" "$BASE/app/restaurant-ui.js?v=table-enable-v55-$GITHUB_SHA" -o "$UIJ" \
                && grep -Fqi 'X-VantixGC-Table-Enable: v55-staff-gate' "$QRH" \
                && grep -Fq 'VANTIX_RESTAURANT_TABLE_ENABLE_V55' "$QRJ" \
                && grep -Fq 'habilitacion-mesa' "$QRJ" \
                && grep -Fq 'HABILITAR ' "$QRJ" \
                && grep -Fqi 'X-VantixGC-Table-Enable: v55-staff-gate' "$UIH" \
                && grep -Fq 'VANTIX_RESTAURANT_TABLE_ENABLE_STAFF_V55' "$UIJ" \
                && grep -Fq 'habilitaciones-mesa' "$UIJ"; then
                echo "V55 exact commit and staff-gated QR surfaces are live: $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "V55 did not become live for exact commit $GITHUB_SHA" >&2
          exit 1
