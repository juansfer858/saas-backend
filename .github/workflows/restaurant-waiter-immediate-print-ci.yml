name: Restaurant Waiter Immediate Print CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/edge/edge-restaurant-immediate-print-bridge.js'
      - 'src/modules/edge/edge-remote-agent.service.js'
      - 'src/modules/restaurant/restaurant-kds-reliability.public.routes.js'
      - 'edge/agent/restaurant-print-bridge.js'
      - 'edge/print-spooler/escpos.js'
      - 'edge/print-spooler/windows-printer.js'
      - 'edge/version.json'
      - 'scripts/restaurant-waiter-immediate-print-smoke.js'
      - '.github/workflows/restaurant-waiter-immediate-print-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/edge/edge-restaurant-immediate-print-bridge.js'
      - 'src/modules/edge/edge-remote-agent.service.js'
      - 'src/modules/restaurant/restaurant-kds-reliability.public.routes.js'
      - 'edge/agent/restaurant-print-bridge.js'
      - 'edge/print-spooler/escpos.js'
      - 'edge/print-spooler/windows-printer.js'
      - 'edge/version.json'
      - 'scripts/restaurant-waiter-immediate-print-smoke.js'
      - '.github/workflows/restaurant-waiter-immediate-print-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run build
      - name: Validate immediate print bridge syntax
        run: |
          node --check src/modules/edge/edge-restaurant-immediate-print-bridge.js
          node --check src/modules/edge/edge-remote-agent.service.js
          node --check edge/agent/restaurant-print-bridge.js
          node --check edge/print-spooler/escpos.js
          node --check edge/print-spooler/windows-printer.js
          node --check scripts/restaurant-waiter-immediate-print-smoke.js
      - name: Validate waiter send to immediate Edge print signal
        run: node scripts/restaurant-waiter-immediate-print-smoke.js

  verify-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact commit in production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://core.vantixgc.com/api/public/runtime-info'
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
                echo PRODUCTION_EXACT_COMMIT_OK
                exit 0
              fi
            fi
            echo "Waiting for production commit $GITHUB_SHA attempt=$attempt"
            sleep 10
          done
          exit 1
      - name: Verify waiter immediate print readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 -o /tmp/readiness.json https://core.vantixgc.com/api/public/restaurante/kds-print-readiness
          cat /tmp/readiness.json
          grep -q '"waiterImmediatePrint":true' /tmp/readiness.json
          grep -q '"immediatePrintSignal":"PRINT_QUEUE"' /tmp/readiness.json
          grep -q '"immediatePrintEdgeAction":"LOCAL_SYNC_NOW"' /tmp/readiness.json
          grep -q '"immediatePrintFallback":"PERIODIC_RESTAURANT_BOOTSTRAP"' /tmp/readiness.json
          grep -q '"windowsUsbPrinting":true' /tmp/readiness.json
          grep -q '"edgeVersion":"2.1.4-windows-usb-print.1"' /tmp/readiness.json
          echo PRODUCTION_WAITER_IMMEDIATE_PRINT_CORE_OK
