name: Restaurant QR Table Presence Realtime CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/realtime/tenant-realtime.service.js'
      - 'src/modules/realtime/tenant-realtime.routes.js'
      - 'src/modules/restaurant/restaurant-public-realtime-publisher.js'
      - 'src/modules/restaurant/restaurant-qr-presence-realtime.public.routes.js'
      - 'src/modules/restaurant/restaurant.routes.js'
      - 'src/web/restaurant-qr-realtime-ui.js'
      - 'scripts/restaurant-qr-table-presence-v25-smoke.js'
      - 'scripts/restaurant-qr-visual-realtime-v26-smoke.js'
      - '.github/workflows/restaurant-qr-table-presence-realtime-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/realtime/tenant-realtime.service.js'
      - 'src/modules/realtime/tenant-realtime.routes.js'
      - 'src/modules/restaurant/restaurant-public-realtime-publisher.js'
      - 'src/modules/restaurant/restaurant-qr-presence-realtime.public.routes.js'
      - 'src/modules/restaurant/restaurant.routes.js'
      - 'src/web/restaurant-qr-realtime-ui.js'
      - 'scripts/restaurant-qr-table-presence-v25-smoke.js'
      - 'scripts/restaurant-qr-visual-realtime-v26-smoke.js'
      - '.github/workflows/restaurant-qr-table-presence-realtime-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run build
      - name: Validate syntax
        run: |
          node --check src/modules/realtime/tenant-realtime.service.js
          node --check src/modules/restaurant/restaurant-public-realtime-publisher.js
          node --check src/modules/restaurant/restaurant-qr-presence-realtime.public.routes.js
          node --check src/web/restaurant-qr-realtime-ui.js
          node --check scripts/restaurant-qr-table-presence-v25-smoke.js
          node --check scripts/restaurant-qr-visual-realtime-v26-smoke.js
      - name: Validate table open and final payment close realtime contract
        run: node scripts/restaurant-qr-table-presence-v25-smoke.js
      - name: Validate customer QR visual open-close synchronization
        run: node scripts/restaurant-qr-visual-realtime-v26-smoke.js

  verify-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact commit in production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://core.vantixgc.com/api/public/runtime-info'
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
                echo PRODUCTION_EXACT_COMMIT_OK
                exit 0
              fi
            fi
            echo "Waiting for production commit $GITHUB_SHA attempt=$attempt"
            sleep 10
          done
          exit 1
      - name: Verify QR presence V26 hardening in production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 -D /tmp/qr.headers -o /tmp/qr.js 'https://core.vantixgc.com/app/restaurant-qr-ui.js?v=qr-presence-v26'
          grep -qi '^X-VantixGC-QR-Realtime: v24-table-presence' /tmp/qr.headers
          grep -qi '^X-VantixGC-QR-Presence-Hardening: v25-listener-ready-reconcile' /tmp/qr.headers
          grep -q 'VANTIX_QR_TABLE_PRESENCE_V25' /tmp/qr.js
          grep -q 'listenerReadyBeforeInitialState:true' /tmp/qr.js
          grep -q 'reconcileFallback:true' /tmp/qr.js
          grep -q 'automaticVisualRefresh:true' /tmp/qr.js
          grep -q 'initialStateRaceReconciled:true' /tmp/qr.js
          echo PRODUCTION_QR_TABLE_PRESENCE_V26_OK
