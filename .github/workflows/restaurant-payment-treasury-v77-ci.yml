name: Restaurant Payment Treasury V77 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/rest-b-payment-treasury-v77

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Auxiliary B payment methods and Treasury destinations
        run: node scripts/restaurant-payment-treasury-v77-smoke.js
