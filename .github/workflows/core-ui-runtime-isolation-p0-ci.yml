name: Core UI Runtime Isolation P0 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/web/panel-restaurant-entry.js'
      - 'src/web/panel-integration-extras.js'
      - 'src/web/panel-integration-extras-core.js'
      - 'scripts/core-ui-runtime-isolation-p0-smoke.js'
      - '.github/workflows/core-ui-runtime-isolation-p0-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/web/panel-restaurant-entry.js'
      - 'src/web/panel-integration-extras.js'
      - 'src/web/panel-integration-extras-core.js'
      - 'scripts/core-ui-runtime-isolation-p0-smoke.js'
      - '.github/workflows/core-ui-runtime-isolation-p0-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser source syntax
        run: |
          node --check src/web/panel-restaurant-entry.js
          node --check src/web/panel-integration-extras.js
          node --check src/web/panel-integration-extras-core.js
      - name: Validate Core ownership and runtime isolation
        run: node scripts/core-ui-runtime-isolation-p0-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait exact P0 commit and public Core assets in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              LOADER="$(mktemp)"
              RESTAURANT="$(mktemp)"
              ok=1
              curl -fsS "$BASE/app/panel-integration-extras.js?v=core-p0-$GITHUB_SHA" -o "$LOADER" || ok=0
              curl -fsS "$BASE/app/panel-restaurant-entry.js?v=core-p0-$GITHUB_SHA" -o "$RESTAURANT" || ok=0
              grep -Fq 'VantixGCCoreRuntimeIsolationP0' "$LOADER" || ok=0
              grep -Fq 'SUPER_CORE_ACCOUNTING_RUNTIME_ERROR' "$LOADER" || ok=0
              grep -Fq 'panel-integration-extras-core.js' "$LOADER" || ok=0
              grep -Fq 'No se mostrará Configuración de empresa como sustituto' "$LOADER" || ok=0
              if grep -Fq 'renameAccountingConfigurationHeading' "$RESTAURANT"; then ok=0; fi
              if grep -Fq 'Parametrización Contable' "$RESTAURANT"; then ok=0; fi
              if [ "$ok" -eq 1 ]; then
                echo "Core UI P0 isolation live at exact commit $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Core UI P0 isolation did not become live for exact commit $GITHUB_SHA" >&2
          exit 1
