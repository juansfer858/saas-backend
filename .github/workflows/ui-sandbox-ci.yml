name: UI Sandbox CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:dummy@localhost:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EDGE_AUTH_SECRET: edge-auth-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run build
      - name: Validate isolated interactive UI sandbox
        run: node scripts/ui-sandbox-smoke.js
      - name: Validate Restaurant QR mobile viewport fit
        run: node scripts/restaurant-qr-mobile-fit-smoke.js
      - name: Validate deferred Restaurant QR authorization at order submit
        run: node scripts/restaurant-qr-deferred-auth-v28-smoke.js
      - name: Validate real read-only restaurant control preview
        run: node scripts/restaurant-control-preview-smoke.js
      - name: Validate operational restaurant control center
        run: node scripts/restaurant-control-center-operational-smoke.js
      - name: Validate compact Restaurant cash workspace V30
        run: node scripts/restaurant-cash-compact-v30-smoke.js
      - name: Validate Restaurant cash shift recovery from Core
        run: node scripts/restaurant-cash-shift-recovery-smoke.js
      - name: Validate waiter QR visit code composition
        run: node scripts/restaurant-waiter-visit-code-composition-smoke.js
      - name: Validate isolated Super Core sidebar preview
        run: node scripts/super-core-sidebar-preview-smoke.js
