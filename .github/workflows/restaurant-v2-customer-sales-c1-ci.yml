name: Restaurant V2 Customer Sales C1 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-customer-sale-link.service.js'
      - 'src/modules/restaurant/restaurant-v2-cash.routes.js'
      - 'src/web/restaurant-v2-cash-tender-v18.js'
      - 'scripts/restaurant-v2-customer-sales-c1-db-smoke.js'
      - 'scripts/restaurant-v2-cash-tender-v18-smoke.js'
      - '.github/workflows/restaurant-v2-customer-sales-c1-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-customer-sale-link.service.js'
      - 'src/modules/restaurant/restaurant-v2-cash.routes.js'
      - 'src/web/restaurant-v2-cash-tender-v18.js'
      - 'scripts/restaurant-v2-customer-sales-c1-db-smoke.js'
      - 'scripts/restaurant-v2-cash-tender-v18-smoke.js'
      - '.github/workflows/restaurant-v2-customer-sales-c1-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESTAURANT_QR_VISIT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: vantixgc.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - name: Validate syntax
        run: |
          node --check src/modules/restaurant/restaurant-customer-sale-link.service.js
          node --check src/modules/restaurant/restaurant-v2-cash.routes.js
          node --check src/web/restaurant-v2-cash-tender-v18.js
          node --check scripts/restaurant-v2-customer-sales-c1-db-smoke.js
      - name: Validate UI and payload contract
        run: node scripts/restaurant-v2-cash-tender-v18-smoke.js
      - name: Validate Tercero to Venta link in PostgreSQL
        run: node scripts/restaurant-v2-customer-sales-c1-db-smoke.js
      - name: Regression Caja V2 P4
        run: node scripts/restaurant-v2-cash-p4-db-smoke.js
      - name: Regression Crédito V46
        run: node scripts/restaurant-credit-payment-v46-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact C1 release in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if [[ "$INFO" == *"$GITHUB_SHA"* ]]; then
              ASSET="$(curl -fsS "$BASE/app/restaurant-v2-cash-tender-v18.js?v=$GITHUB_SHA")"
              [[ "$ASSET" == *'VANTIX_RESTAURANT_V2_CASH_TENDER_V18'* ]]
              [[ "$ASSET" == *'customerMaster:true'* ]]
              [[ "$ASSET" == *'customerAnyPayment:true'* ]]
              [[ "$ASSET" == *'IDENTIFICAR CLIENTE'* ]]
              [[ "$ASSET" == *'body.terceroId='* ]]
              echo "Restaurant V2 Customer Sales C1 live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
