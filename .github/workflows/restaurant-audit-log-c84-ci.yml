name: Restaurant Audit Safe Recovery V86 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-audit-log-c84.service.js'
      - 'src/modules/restaurant/restaurant-test-data-reset-v68.service.js'
      - 'src/modules/restaurant/restaurant-test-data-reset-v68.routes.js'
      - 'src/modules/restaurant/restaurant-company-admin-advanced.public.routes.js'
      - 'src/web/restaurant-audit-log-c84.js'
      - 'scripts/restaurant-audit-log-c84-smoke.js'
      - '.github/workflows/restaurant-audit-log-c84-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-audit-log-c84.service.js'
      - 'src/modules/restaurant/restaurant-test-data-reset-v68.service.js'
      - 'src/modules/restaurant/restaurant-test-data-reset-v68.routes.js'
      - 'src/modules/restaurant/restaurant-company-admin-advanced.public.routes.js'
      - 'src/web/restaurant-audit-log-c84.js'
      - 'scripts/restaurant-audit-log-c84-smoke.js'
      - '.github/workflows/restaurant-audit-log-c84-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate audit recovery syntax
        run: |
          node --check src/modules/restaurant/restaurant-audit-log-c84.service.js
          node --check src/modules/restaurant/restaurant-test-data-reset-v68.service.js
          node --check src/modules/restaurant/restaurant-test-data-reset-v68.routes.js
          node --check src/modules/restaurant/restaurant-company-admin-advanced.public.routes.js
          node --check src/web/restaurant-audit-log-c84.js
          node --check scripts/restaurant-audit-log-c84-smoke.js
      - name: Validate safe audit recovery contract
        run: node scripts/restaurant-audit-log-c84-smoke.js
      - name: Validate existing V68 cleanup contract
        run: node scripts/restaurant-test-data-reset-v68-smoke.js
      - name: Load application graph
        run: node -e "require('./src/app')"

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact commit and recovery asset in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              JS="$(curl -fsS "$BASE/app/restaurant-audit-log-c84.js?v=$GITHUB_SHA" 2>/dev/null || true)"
              if echo "$JS" | grep -Fq 'VANTIX_RESTAURANT_AUDIT_SAFE_RECOVERY_V86' \
                && echo "$JS" | grep -Fq 'VER REGISTRO' \
                && echo "$JS" | grep -Fq 'DESCARGAR COPIA' \
                && echo "$JS" | grep -Fq '>RESTAURAR<' \
                && echo "$JS" | grep -Fq '/api/v1/restaurante/auditoria/v84'; then
                echo "V86 safe audit recovery is live for exact commit $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "V86 safe audit recovery did not become live for exact commit $GITHUB_SHA" >&2
          exit 1
