name: Restaurant V2 Only P12 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v2-only-p12.public.routes.js'
      - 'src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js'
      - 'src/modules/restaurant/restaurant-v1-retirement-p11.routes.js'
      - 'src/web/restaurant-v2-device-pwa-p8.js'
      - 'scripts/restaurant-v2-only-p12-smoke.js'
      - '.github/workflows/restaurant-v2-only-p12-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v2-only-p12.public.routes.js'
      - 'src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js'
      - 'src/modules/restaurant/restaurant-v1-retirement-p11.routes.js'
      - 'src/web/restaurant-v2-device-pwa-p8.js'
      - 'scripts/restaurant-v2-only-p12-smoke.js'
      - '.github/workflows/restaurant-v2-only-p12-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate P12 syntax
        run: |
          node --check src/modules/restaurant/restaurant-v2-only-p12.public.routes.js
          node --check src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js
          node --check src/modules/restaurant/restaurant-v1-retirement-p11.routes.js
          node --check src/web/restaurant-v2-device-pwa-p8.js
      - name: Validate V2-only runtime contract
        run: node scripts/restaurant-v2-only-p12-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Verify exact V2-only P12 in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'

          assert_redirect() {
            local path="$1"
            local expected="$2"
            local status location
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$path")"
            location="$(curl -sS -o /dev/null -w '%{redirect_url}' "$BASE$path")"
            [[ "$status" == '307' ]]
            [[ "$location" == "$BASE$expected"* ]]
          }

          for i in $(seq 1 70); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if [[ "$INFO" == *"$GITHUB_SHA"* ]]; then
              assert_redirect '/app/centro-de-control' '/app/centro-de-control-v2'
              assert_redirect '/app/restaurante' '/app/centro-de-control-v2'
              assert_redirect '/app/restaurante-v1' '/app/centro-de-control-v2'
              assert_redirect '/app/centro-de-control-p10' '/app/centro-de-control-v2'
              assert_redirect '/app/centro-de-control/mesero' '/app/centro-de-control/mesero-v2/'
              assert_redirect '/app/centro-de-control/mesero-v1' '/app/centro-de-control/mesero-v2/'
              assert_redirect '/app/produccion' '/app/produccion-v2/'
              assert_redirect '/app/produccion-v1' '/app/produccion-v2/'
              assert_redirect '/app/restaurante-v2/migracion' '/app/centro-de-control-v2'
              assert_redirect '/app/restaurante-v2/retiro-v1' '/app/centro-de-control-v2'

              curl -fsS "$BASE/app/centro-de-control-v2" | grep -q 'VANTIX_RESTAURANT_V2_NATIVE_CONTROL_P11'
              curl -fsS "$BASE/app/centro-de-control/mesero-v2" | grep -q 'data-waiter-ui="tablet-3col-v22"'
              curl -fsS "$BASE/app/produccion-v2" | grep -q 'VANTIX_RESTAURANT_V2_PRODUCTION_P8'

              WAITER_SW="$(curl -fsS "$BASE/app/centro-de-control/sw.js")"
              PROD_SW="$(curl -fsS "$BASE/app/produccion/sw.js")"
              [[ "$WAITER_SW" == *'VANTIX_RESTAURANT_V1_SW_RETIREMENT_P12'* ]]
              [[ "$PROD_SW" == *'VANTIX_RESTAURANT_V1_SW_RETIREMENT_P12'* ]]

              DEVICE_PWA="$(curl -fsS "$BASE/app/restaurant-v2-device-pwa-p8.js")"
              [[ "$DEVICE_PWA" == *"version:'12.0.0'"* ]]
              [[ "$DEVICE_PWA" == *'legacyWorkerRetired:true'* ]]

              echo "Restaurant V2 ONLY P12 live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo 'Exact P12 commit did not reach production in time.' >&2
          exit 1
