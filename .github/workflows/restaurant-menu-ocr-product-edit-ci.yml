name: Restaurant OCR Product Edit CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/modules/restaurant/restaurant-menu-item-edit.service.js'
      - 'src/modules/restaurant/restaurant-menu-import.routes.js'
      - 'src/modules/restaurant/restaurant-menu-import.public.routes.js'
      - 'src/web/restaurant-menu-ocr-product-edit-v6.js'
      - 'scripts/restaurant-menu-ocr-product-edit-smoke.js'
      - 'scripts/restaurant-menu-ocr-product-edit-db-smoke.js'
      - '.github/workflows/restaurant-menu-ocr-product-edit-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/modules/restaurant/restaurant-menu-item-edit.service.js'
      - 'src/modules/restaurant/restaurant-menu-import.routes.js'
      - 'src/modules/restaurant/restaurant-menu-import.public.routes.js'
      - 'src/web/restaurant-menu-ocr-product-edit-v6.js'
      - 'scripts/restaurant-menu-ocr-product-edit-smoke.js'
      - 'scripts/restaurant-menu-ocr-product-edit-db-smoke.js'
      - '.github/workflows/restaurant-menu-ocr-product-edit-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EDGE_AUTH_SECRET: edge-auth-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run build
      - name: Sync test database
        run: npx prisma db push
      - name: Validate OCR product editor syntax and contract
        run: |
          node --check src/modules/restaurant/restaurant-menu-item-edit.service.js
          node --check src/modules/restaurant/restaurant-menu-import.routes.js
          node --check src/modules/restaurant/restaurant-menu-import.public.routes.js
          node --check src/web/restaurant-menu-ocr-product-edit-v6.js
          node scripts/restaurant-menu-ocr-product-edit-smoke.js
      - name: Validate persisted OCR product edits against PostgreSQL
        run: node scripts/restaurant-menu-ocr-product-edit-db-smoke.js

  verify-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact commit in production
        shell: bash
        run: |
          set -euo pipefail
          URL="https://core.vantixgc.com/api/public/runtime-info"
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
                echo "PRODUCTION_EXACT_COMMIT_OK"
                exit 0
              fi
            fi
            echo "Waiting for exact production commit... attempt=$attempt expected=$GITHUB_SHA"
            sleep 10
          done
          echo "Production did not deploy commit $GITHUB_SHA in time" >&2
          exit 1

      - name: Verify production cloud readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 -o /tmp/health.json https://core.vantixgc.com/healthz
          curl -fsSL --max-time 15 -o /tmp/ready.json https://core.vantixgc.com/readyz
          grep -q '"status":"alive"' /tmp/health.json
          grep -q '"status":"ready"' /tmp/ready.json
          grep -q '"database":"OK"' /tmp/ready.json
          echo "PRODUCTION_CLOUD_READY_OK"

      - name: Verify OCR product editor readiness marker
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 -o /tmp/ocr.json https://core.vantixgc.com/api/public/restaurante/menu-ocr-readiness
          cat /tmp/ocr.json
          grep -q '"browserProductEditMarker":"VANTIX_MENU_OCR_EDIT_V6"' /tmp/ocr.json
          echo "PRODUCTION_MENU_OCR_EDIT_READINESS_OK"

      - name: Verify served OCR product editor asset
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 -D /tmp/menu-ui.headers -o /tmp/menu-ui.js https://core.vantixgc.com/app/restaurant-menu-import-ui.js
          grep -qi '^X-VantixGC-Menu-OCR-Product-Edit: persisted-v6' /tmp/menu-ui.headers
          grep -q 'VANTIX_MENU_OCR_EDIT_V6' /tmp/menu-ui.js
          grep -q 'carta-importacion/items/' /tmp/menu-ui.js
          grep -q 'Guardar cambios' /tmp/menu-ui.js
          echo "PRODUCTION_MENU_OCR_EDIT_BROWSER_OK"
