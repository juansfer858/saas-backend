name: Restaurant Shift Close History C86 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-shift-close-history-c86.service.js'
      - 'src/modules/restaurant/restaurant-shift-close-history-c86.routes.js'
      - 'src/modules/restaurant/restaurant-pos-receipt-print.service.js'
      - 'src/modules/restaurant/restaurant-v2-cash.routes.js'
      - 'src/modules/restaurant/restaurant-v2-cash.public.routes.js'
      - 'src/web/restaurant-v2-cash.js'
      - 'src/web/restaurant-shift-close-history-c86.html'
      - 'src/web/restaurant-shift-close-history-c86.js'
      - 'src/routes/core.routes.js'
      - 'scripts/restaurant-shift-close-history-c86-smoke.js'
      - '.github/workflows/restaurant-shift-close-history-c86-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-shift-close-history-c86.service.js'
      - 'src/modules/restaurant/restaurant-shift-close-history-c86.routes.js'
      - 'src/modules/restaurant/restaurant-pos-receipt-print.service.js'
      - 'src/modules/restaurant/restaurant-v2-cash.routes.js'
      - 'src/modules/restaurant/restaurant-v2-cash.public.routes.js'
      - 'src/web/restaurant-v2-cash.js'
      - 'src/web/restaurant-shift-close-history-c86.html'
      - 'src/web/restaurant-shift-close-history-c86.js'
      - 'src/routes/core.routes.js'
      - 'scripts/restaurant-shift-close-history-c86-smoke.js'
      - '.github/workflows/restaurant-shift-close-history-c86-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate C86 syntax
        run: |
          node --check src/modules/restaurant/restaurant-shift-close-history-c86.service.js
          node --check src/modules/restaurant/restaurant-shift-close-history-c86.routes.js
          node --check src/modules/restaurant/restaurant-pos-receipt-print.service.js
          node --check src/modules/restaurant/restaurant-v2-cash.routes.js
          node --check src/modules/restaurant/restaurant-v2-cash.public.routes.js
          node --check src/web/restaurant-v2-cash.js
          node --check src/web/restaurant-shift-close-history-c86.js
          node --check src/routes/core.routes.js
      - name: Validate C86 reconciliation and Epson receipt contract
        run: node scripts/restaurant-shift-close-history-c86-smoke.js
      - name: Validate existing POS receipt contract
        run: node scripts/restaurant-pos-receipt-v38-smoke.js
      - name: Load application graph
        run: node -e "require('./src/app')"

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact commit and C86 closure surface in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              PAGE="$(curl -fsS "$BASE/app/restaurante-v2/cierres?v=c86-$GITHUB_SHA" 2>/dev/null || true)"
              JS="$(curl -fsS "$BASE/app/restaurant-shift-close-history-c86.js?v=c86-$GITHUB_SHA" 2>/dev/null || true)"
              CASH="$(curl -fsS "$BASE/app/restaurant-v2-cash.js?v=c86-$GITHUB_SHA" 2>/dev/null || true)"
              if echo "$PAGE" | grep -Fq 'VANTIX_RESTAURANT_SHIFT_CLOSE_HISTORY_C86' \
                && echo "$JS" | grep -Fq 'VANTIX_RESTAURANT_SHIFT_CLOSE_HISTORY_C86' \
                && echo "$CASH" | grep -Fq 'printReceipt'; then
                echo "C86 shift closures are live for exact commit $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "C86 did not become live for exact commit $GITHUB_SHA" >&2
          exit 1