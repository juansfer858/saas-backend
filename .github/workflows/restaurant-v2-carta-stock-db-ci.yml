name: Restaurant V2 Carta Stock DB CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/web/restaurant-v2-menu.js'
      - 'src/modules/restaurant/restaurant.service.js'
      - 'src/modules/commercial/sales.service.js'
      - 'src/modules/inventory/**'
      - 'src/modules/consumption/**'
      - 'scripts/restaurant-v2-carta-stock-db-smoke.js'
      - '.github/workflows/restaurant-v2-carta-stock-db-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/web/restaurant-v2-menu.js'
      - 'src/modules/restaurant/restaurant.service.js'
      - 'src/modules/commercial/sales.service.js'
      - 'src/modules/inventory/**'
      - 'src/modules/consumption/**'
      - 'scripts/restaurant-v2-carta-stock-db-smoke.js'
      - '.github/workflows/restaurant-v2-carta-stock-db-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESTAURANT_QR_VISIT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: vantixgc.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - name: Probar Carta → venta → Inventario/Kardex
        run: node scripts/restaurant-v2-carta-stock-db-smoke.js
      - name: Validar sintaxis
        run: node --check scripts/restaurant-v2-carta-stock-db-smoke.js
