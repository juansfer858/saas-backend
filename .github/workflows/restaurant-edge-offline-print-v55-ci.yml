name: Restaurant Edge Offline Print V55 CI

on:
  pull_request:
    branches:
      - main

jobs:
  edge-offline-print-v55:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EDGE_AUTH_SECRET: edge-auth-secret-0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run build
      - name: Validate Edge offline print syntax
        run: |
          node --check src/modules/edge/edge-restaurant-offline-print-routing.js
          node --check src/modules/edge/edge-restaurant-immediate-print-bridge.js
          node --check edge/agent/restaurant-print-bridge.js
          node --check scripts/edge-restaurant-offline-print-v55-smoke.js
      - name: Prove local command spooling and reconnect dedupe
        run: node scripts/edge-restaurant-offline-print-v55-smoke.js
      - name: Keep immediate online print relay compatible
        run: node scripts/restaurant-waiter-immediate-print-smoke.js
