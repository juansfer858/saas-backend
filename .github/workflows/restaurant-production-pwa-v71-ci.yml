name: Restaurant Production PWA V71 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/restaurant-production-pwa-v71
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production PWA contract
        run: node scripts/restaurant-production-pwa-v71-smoke.js

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact commit in production
        shell: bash
        run: |
          set -euo pipefail
          URL="https://core.vantixgc.com/api/public/runtime-info"
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
                echo "PRODUCTION_EXACT_COMMIT_OK"
                exit 0
              fi
            fi
            echo "Waiting for production commit... attempt=$attempt expected=$GITHUB_SHA"
            sleep 10
          done
          echo "Production did not deploy commit $GITHUB_SHA" >&2
          exit 1

      - name: Verify V71 production entry is retired by P12 cutover
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://core.vantixgc.com"

          status="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/app/produccion")"
          location="$(curl -sS -o /dev/null -w '%{redirect_url}' "$BASE/app/produccion")"
          [[ "$status" == '307' ]]
          [[ "$location" == "$BASE/app/produccion-v2/"* ]]

          curl -fsSL --max-time 15 -o /tmp/production-v2.html "$BASE/app/produccion-v2"
          grep -q 'data-vantix-device="production"' /tmp/production-v2.html

          curl -fsSL --max-time 15 -D /tmp/sw.headers -o /tmp/sw.js "$BASE/app/produccion/sw.js"
          grep -qi '^service-worker-allowed: /app/produccion' /tmp/sw.headers
          grep -q 'VANTIX_RESTAURANT_V1_SW_RETIREMENT_P12' /tmp/sw.js

          echo "PRODUCTION_RESTAURANT_PRODUCTION_PWA_V71_RETIRED_BY_P12_OK"
