name: Restaurant V2 QR Commercial Categories CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'prisma/restaurant-commercial-categories-v26.prisma'
      - 'prisma/restaurant-phase2-v1.prisma'
      - 'src/modules/restaurant/restaurant-commercial-categories-v26.service.js'
      - 'src/modules/restaurant/restaurant-v2-client-qr.public.routes.js'
      - 'src/modules/restaurant/restaurant-menu-import.service.js'
      - 'scripts/restaurant-v2-qr-commercial-categories-smoke.js'
      - '.github/workflows/restaurant-v2-qr-commercial-categories-ci.yml'
  push:
    branches: [main]
    paths:
      - 'prisma/restaurant-commercial-categories-v26.prisma'
      - 'prisma/restaurant-phase2-v1.prisma'
      - 'src/modules/restaurant/restaurant-commercial-categories-v26.service.js'
      - 'src/modules/restaurant/restaurant-v2-client-qr.public.routes.js'
      - 'src/modules/restaurant/restaurant-menu-import.service.js'
      - 'scripts/restaurant-v2-qr-commercial-categories-smoke.js'
      - '.github/workflows/restaurant-v2-qr-commercial-categories-ci.yml'

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://vantix_ci:vantix_ci@127.0.0.1:5432/vantix_ci

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Verify dynamic commercial categories
        run: node scripts/restaurant-v2-qr-commercial-categories-smoke.js
