name: Restaurant POS Print Choice V75 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/restaurant-pos-print-choice-v75
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vantix_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run build
      - name: Validate POS print choice
        run: node scripts/restaurant-pos-print-choice-v75-smoke.js

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact commit in production
        shell: bash
        run: |
          set -euo pipefail
          URL="https://core.vantixgc.com/api/public/runtime-info"
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
                echo "PRODUCTION_EXACT_COMMIT_OK"
                exit 0
              fi
            fi
            echo "Waiting for production commit... attempt=$attempt expected=$GITHUB_SHA"
            sleep 10
          done
          exit 1

      - name: Verify production POS print choice
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://core.vantixgc.com"
          curl -fsSL --max-time 15 -D /tmp/ui.headers -o /tmp/ui.js "$BASE/app/restaurant-ui.js"
          grep -qi '^x-vantixgc-pos-print-choice: v75-explicit-choice' /tmp/ui.headers
          grep -q 'VANTIX_RESTAURANT_POS_PRINT_CHOICE_V75' /tmp/ui.js
          grep -q 'VantixGCPosPrintChoiceV75' /tmp/ui.js
          grep -q '¿Imprimir comprobante?' /tmp/ui.js
          grep -q 'No imprimir' /tmp/ui.js
          grep -q 'El pago ya fue registrado' /tmp/ui.js
          if grep -q 'if(shouldTrigger&&response.ok)queueReceiptSync();' /tmp/ui.js; then
            echo 'Direct automatic POS print trigger still present' >&2
            exit 1
          fi
          echo "PRODUCTION_RESTAURANT_POS_PRINT_CHOICE_V75_OK"
