name: One-off tenant identity race patch

on:
  push:
    branches:
      - feature/super-core-no-flicker-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/super-core-no-flicker-v1
          fetch-depth: 0
      - name: Apply tenant identity source-of-truth patch
        run: python scripts/_patch_tenant_identity.py
      - name: Commit patch and remove one-off files
        run: |
          rm .github/workflows/oneoff-tenant-identity-race.yml scripts/_patch_tenant_identity.py
          git config user.name "vantixgc-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js scripts/panel-ui-smoke.js .github/workflows/oneoff-tenant-identity-race.yml scripts/_patch_tenant_identity.py
          git commit -m "Use tenant session identity on every Super Core render"
          git push origin HEAD:feature/super-core-no-flicker-v1
