name: Demo Restaurante Cash Live Diagnostic

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant.public.routes.base.js'
      - '.github/workflows/demo-restaurant-cash-live-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-live-demo-cash:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact commit and inspect demo cash readiness
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for attempt in $(seq 1 60); do
            BODY="$(curl -fsS --max-time 15 "$BASE/api/public/restaurante/demo-cash-readiness" 2>/dev/null || true)"
            if echo "$BODY" | grep -q '"tenantFound":true'; then
              echo "$BODY"
              echo "DEMO_CASH_LIVE_DIAGNOSTIC_READ"
              exit 0
            fi
            echo "Waiting for demo cash diagnostic endpoint... attempt=$attempt"
            sleep 10
          done
          echo "Demo cash diagnostic endpoint not live in time" >&2
          exit 1
