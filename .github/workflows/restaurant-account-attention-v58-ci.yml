name: Restaurant Account Attention V58.1 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-account-attention-v58.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'scripts/restaurant-account-attention-v58-smoke.js'
      - '.github/workflows/restaurant-account-attention-v58-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-account-attention-v58.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'scripts/restaurant-account-attention-v58-smoke.js'
      - '.github/workflows/restaurant-account-attention-v58-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Syntax check V58.1
        run: node --check src/modules/restaurant/restaurant-account-attention-v58.public.routes.js
      - name: Validate direct Mesa to Caja handoff and waiter attention semantics
        run: node scripts/restaurant-account-attention-v58-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait exact V58.1 commit and direct cash handoff in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              ok=1
              for ASSET in restaurant-ui.js restaurant-waiter-runtime-v7.js; do
                HDR="$(mktemp)"
                JS="$(mktemp)"
                if ! curl -fsS -D "$HDR" "$BASE/app/$ASSET?v=account-attention-v58-1-$GITHUB_SHA" -o "$JS"; then ok=0; break; fi
                grep -Fqi 'X-VantixGC-Account-Attention: v58-account-attention' "$HDR" || ok=0
                grep -Fq 'VANTIX_RESTAURANT_ACCOUNT_ATTENTION_V58' "$JS" || ok=0
                grep -Fq 'ACCOUNT_ATTENTION' "$JS" || ok=0
                grep -Fq 'CUENTA SOLICITADA' "$JS" || ok=0
              done
              OP="$(mktemp)"
              curl -fsS "$BASE/app/restaurant-ui.js?v=v58-1-compose-$GITHUB_SHA" -o "$OP" || ok=0
              grep -Fq 'VANTIX_RESTAURANT_ACCOUNT_ATTENTION_DIRECT_CASH_V58_1' "$OP" || ok=0
              grep -Fq 'Cuenta solicitada · cobrar ahora' "$OP" || ok=0
              grep -Fq "setTab('caja')" "$OP" || ok=0
              grep -Fq 'accountAttentionChargeTarget' "$OP" || ok=0
              grep -Fq 'accountAttentionContinueCharge' "$OP" || ok=0
              grep -Fq 'row.click()' "$OP" || ok=0
              grep -Fq 'Abre Caja para cobrar' "$OP" || ok=0
              grep -Fq 'VANTIX_RESTAURANT_GLOBAL_PRODUCT_SEARCH_V57' "$OP" || ok=0
              if [ "$ok" -eq 1 ]; then
                echo "V58.1 exact commit and direct Mesa-to-Caja handoff are live: $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "V58.1 did not become live for exact commit $GITHUB_SHA" >&2
          exit 1
