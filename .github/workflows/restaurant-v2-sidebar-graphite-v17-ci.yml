name: Restaurant V2 Sidebar Graphite V17 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/web/restaurant-v2-native-control-p11.html'
      - 'src/web/restaurant-v2-sidebar-graphite-v17.css'
      - 'src/modules/restaurant/restaurant-v1-retirement-p11.public.routes.js'
      - 'scripts/restaurant-v2-sidebar-graphite-v17-smoke.js'
      - '.github/workflows/restaurant-v2-sidebar-graphite-v17-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/web/restaurant-v2-native-control-p11.html'
      - 'src/web/restaurant-v2-sidebar-graphite-v17.css'
      - 'src/modules/restaurant/restaurant-v1-retirement-p11.public.routes.js'
      - 'scripts/restaurant-v2-sidebar-graphite-v17-smoke.js'
      - '.github/workflows/restaurant-v2-sidebar-graphite-v17-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate graphite sidebar contracts
        run: node scripts/restaurant-v2-sidebar-graphite-v17-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact graphite sidebar V17 in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if [[ "$INFO" == *"$GITHUB_SHA"* ]]; then
              HTML="$(curl -fsS "$BASE/app/centro-de-control-v2")"
              CSS="$(curl -fsS "$BASE/app/restaurant-v2-sidebar-graphite-v17.css")"
              [[ "$HTML" == *'restaurant-v2-sidebar-graphite-v17.css?v=v17'* ]]
              [[ "$CSS" == *'VANTIX_RESTAURANT_V2_SIDEBAR_GRAPHITE_V17'* ]]
              [[ "$CSS" == *'--restaurant-sidebar-graphite:#111827'* ]]
              [[ "$CSS" == *'--restaurant-sidebar-graphite-active:#1f2937'* ]]
              [[ "$CSS" == *'--restaurant-sidebar-accent:#3b82f6'* ]]
              echo "Restaurant V2 Sidebar Graphite V17 live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
