name: Restaurant V2 Table Move P2B CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'prisma/restaurant-phase2-v1.prisma'
      - 'scripts/ensure-restaurant-runtime-schema.js'
      - 'src/modules/restaurant/restaurant-v2-table-move.*'
      - 'src/modules/restaurant/restaurant-visit-payments.service.js'
      - 'src/web/restaurant-qr-visit-ui.js'
      - 'src/web/restaurant-v2-tables.*'
      - 'src/routes/core.routes.js'
      - 'scripts/restaurant-v2-table-move-p2b-db-smoke.js'
      - '.github/workflows/restaurant-v2-table-move-p2b-ci.yml'
  push:
    branches: [main]
    paths:
      - 'prisma/restaurant-phase2-v1.prisma'
      - 'scripts/ensure-restaurant-runtime-schema.js'
      - 'src/modules/restaurant/restaurant-v2-table-move.*'
      - 'src/modules/restaurant/restaurant-visit-payments.service.js'
      - 'src/web/restaurant-qr-visit-ui.js'
      - 'src/web/restaurant-v2-tables.*'
      - 'src/routes/core.routes.js'
      - 'scripts/restaurant-v2-table-move-p2b-db-smoke.js'
      - '.github/workflows/restaurant-v2-table-move-p2b-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESTAURANT_QR_VISIT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: vantixgc.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - run: node scripts/restaurant-v2-table-move-p2b-db-smoke.js
      - run: node --check src/modules/restaurant/restaurant-v2-table-move.service.js
      - run: node --check src/modules/restaurant/restaurant-v2-table-move.routes.js
      - run: node --check src/modules/restaurant/restaurant-visit-payments.service.js
      - run: node --check src/web/restaurant-v2-tables.js
      - run: node --check src/web/restaurant-qr-visit-ui.js
  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact P2B assets and schema readiness in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              JS="$(curl -fsS "$BASE/app/restaurant-v2-tables.js?v=$GITHUB_SHA")"
              QR="$(curl -fsS "$BASE/app/restaurant-qr-visit-ui.js?v=$GITHUB_SHA")"
              echo "$JS" | grep -Fq 'VANTIX_RESTAURANT_V2_TABLE_MOVE_P2B'
              echo "$JS" | grep -Fq '/mover-v2'
              echo "$QR" | grep -Fq 'relocatedToPath'
              echo "Restaurant V2 P2B live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
