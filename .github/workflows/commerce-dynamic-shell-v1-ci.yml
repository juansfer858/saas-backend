name: Commerce Dynamic Shell V1 CI

on:
  pull_request:
    branches:
      - main

jobs:
  commerce-dynamic-shell:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EDGE_AUTH_SECRET: edge-auth-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_EXPIRES_IN: 8h
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run build

      - name: Sync disposable PostgreSQL
        run: npx prisma db push

      - name: Validate dynamic shell with cashier, warehouse, accountant and admin
        run: node scripts/check-commerce-dynamic-shell-postgres.js

      - name: Syntax check isolated shell adapter
        run: |
          node --check src/modules/platform/modules/dynamic-shell.service.js
          node --check src/modules/platform/modules/dynamic-shell-lab.routes.js
