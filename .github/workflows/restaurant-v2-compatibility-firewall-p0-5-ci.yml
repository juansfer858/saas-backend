name: Restaurant V2 Compatibility Firewall P0.5 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-qr.service.js'
      - 'src/modules/restaurant/restaurant-qr-compatibility.service.js'
      - 'src/modules/restaurant/restaurant.routes.js'
      - 'prisma/restaurant-phase2-v1.prisma'
      - 'scripts/ensure-restaurant-runtime-schema.js'
      - 'scripts/restaurant-v2-compatibility-firewall-p0-5-smoke.js'
      - '.github/workflows/restaurant-v2-compatibility-firewall-p0-5-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-qr.service.js'
      - 'src/modules/restaurant/restaurant-qr-compatibility.service.js'
      - 'src/modules/restaurant/restaurant.routes.js'
      - 'prisma/restaurant-phase2-v1.prisma'
      - 'scripts/ensure-restaurant-runtime-schema.js'
      - 'scripts/restaurant-v2-compatibility-firewall-p0-5-smoke.js'
      - '.github/workflows/restaurant-v2-compatibility-firewall-p0-5-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESTAURANT_QR_VISIT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: vantixgc.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - name: Validate QR compatibility firewall against PostgreSQL
        run: node scripts/restaurant-v2-compatibility-firewall-p0-5-smoke.js
      - name: Validate runtime readiness includes QR guard
        run: node -e "require('./scripts/ensure-restaurant-runtime-schema').ensureRestaurantRuntimeSchema().then(x=>{if(!x.ready)process.exit(1)}).finally(()=>require('./src/config/prisma').prisma.$disconnect())"

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait exact compatibility firewall commit in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              API_CODE="$(curl -sS -o /tmp/qr-compat.json -w '%{http_code}' "$BASE/api/public/restaurante/qr/compatibility-contract-invalid-token" || true)"
              if [ "$API_CODE" = '404' ]; then
                echo "Restaurant QR compatibility firewall live at exact commit $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Restaurant QR compatibility firewall did not become live for exact commit $GITHUB_SHA" >&2
          exit 1
