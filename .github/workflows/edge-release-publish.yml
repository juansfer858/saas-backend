name: Edge Release Publish

on:
  pull_request:
    branches:
      - main
    paths:
      - 'edge/**'
      - 'scripts/edge-supervisor-restart-smoke.js'
      - '.github/workflows/edge-release-publish.yml'
  push:
    branches:
      - main
    paths:
      - 'edge/**'
      - 'scripts/edge-supervisor-restart-smoke.js'
      - '.github/workflows/edge-release-publish.yml'

permissions:
  contents: write

jobs:
  package-edge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Read Edge release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./edge/version.json').version")"
          CHANNEL="$(node -p "require('./edge/version.json').channel")"
          if [[ -z "$VERSION" || -z "$CHANNEL" ]]; then
            echo 'edge/version.json must define version and channel' >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Edge version: $VERSION" >&2
            exit 1
          fi
          if [[ "$CHANNEL" != "PILOT" && "$CHANNEL" != "STABLE" ]]; then
            echo "Invalid Edge channel: $CHANNEL" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=edge-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=vantixgc-edge-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Build deterministic Edge ZIP
        shell: bash
        env:
          EDGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import stat
          import subprocess
          import zipfile

          root = pathlib.Path('.').resolve()
          version = os.environ['EDGE_VERSION']
          out = root / f'vantixgc-edge-{version}.zip'
          files = subprocess.check_output(['git', 'ls-files', 'edge'], text=True).splitlines()
          excluded_prefixes = ('edge/data/', 'edge/releases/')
          excluded_files = {'edge/runtime/node.exe'}
          files = [f for f in files if not f.startswith(excluded_prefixes) and f not in excluded_files]
          files.sort()
          if not files:
              raise SystemExit('No tracked Edge files found')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for tracked in files:
                  src = root / tracked
                  if not src.is_file():
                      continue
                  relative = pathlib.PurePosixPath(tracked).relative_to('edge').as_posix()
                  info = zipfile.ZipInfo(relative, date_time=(2026, 1, 1, 0, 0, 0))
                  mode = stat.S_IMODE(src.stat().st_mode)
                  info.external_attr = (mode & 0xFFFF) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  with src.open('rb') as handle:
                      zf.writestr(info, handle.read(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          print(out)
          PY

      - name: Validate updater package contract
        shell: bash
        env:
          EDGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="vantixgc-edge-$EDGE_VERSION.zip"
          unzip -t "$ZIP"
          unzip -Z1 "$ZIP" | grep -Fx 'agent/server.js'
          unzip -Z1 "$ZIP" | grep -Fx 'agent/store.js'
          unzip -Z1 "$ZIP" | grep -Fx 'agent/universal-entry.js'
          unzip -Z1 "$ZIP" | grep -Fx 'agent/offline-qr-self-order.js'
          unzip -Z1 "$ZIP" | grep -Fx 'agent/offline-waiter-hard-gate.js'
          unzip -Z1 "$ZIP" | grep -Fx 'runtime/vertical-registry.js'
          unzip -Z1 "$ZIP" | grep -Fx 'print-spooler/escpos.js'
          unzip -Z1 "$ZIP" | grep -Fx 'supervisor/supervisor.js'
          unzip -Z1 "$ZIP" | grep -Fx 'version.json'
          if unzip -Z1 "$ZIP" | grep -E '^(data|releases)/' >/dev/null; then
            echo 'Mutable Edge runtime data leaked into release package' >&2
            exit 1
          fi
          if unzip -Z1 "$ZIP" | grep -Fx 'runtime/node.exe' >/dev/null; then
            echo 'Embedded Node binary must not be shipped inside managed Edge release ZIP' >&2
            exit 1
          fi

      - name: Verify supervisor restart liveness
        run: node scripts/edge-supervisor-restart-smoke.js

      - name: Boot extracted Edge release
        shell: bash
        env:
          EDGE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="vantixgc-edge-$EDGE_VERSION.zip"
          ROOT="$RUNNER_TEMP/edge-release-boot"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/data"
          unzip -q "$ZIP" -d "$ROOT"
          export EDGE_INSTALL_ROOT="$ROOT"
          export EDGE_DATA_DIR="$ROOT/data"
          export EDGE_DB_PATH="$ROOT/data/edge.sqlite"
          export EDGE_HOST="127.0.0.1"
          export EDGE_PORT="18788"
          export EDGE_AUTO_UPDATE_ENABLED="false"
          export CORE_BASE_URL=""
          export EDGE_AGENT_ID=""
          export EDGE_AGENT_KEY=""
          export EDGE_LOCAL_ENCRYPTION_KEY="release-smoke-local-encryption-key-123456"
          export EDGE_LAN_KEY="release-smoke-lan-key-123456"
          node "$ROOT/agent/universal-entry.js" >"$RUNNER_TEMP/edge-release-boot.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" >/dev/null 2>&1 || true' EXIT
          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18788/api/status" >"$RUNNER_TEMP/edge-release-status.json" 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo 'Extracted Edge process exited before health check' >&2
              cat "$RUNNER_TEMP/edge-release-boot.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          if [[ "$READY" != "1" ]]; then
            echo 'Extracted Edge release never became healthy' >&2
            cat "$RUNNER_TEMP/edge-release-boot.log" >&2 || true
            exit 1
          fi
          cat "$RUNNER_TEMP/edge-release-status.json"

      - name: Generate SHA-256 manifest
        id: manifest
        shell: bash
        env:
          EDGE_VERSION: ${{ steps.identity.outputs.version }}
          EDGE_CHANNEL: ${{ steps.identity.outputs.channel }}
          EDGE_ASSET: ${{ steps.identity.outputs.asset }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$EDGE_ASSET" | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          export SHA256="$SHA"
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = {
            schema: 'vantixgc-edge-release-v1',
            version: process.env.EDGE_VERSION,
            channel: process.env.EDGE_CHANNEL,
            artifact: process.env.EDGE_ASSET,
            sha256: process.env.SHA256,
            sourceCommit: process.env.GITHUB_SHA
          };
          fs.writeFileSync('edge-release-manifest.json', JSON.stringify(payload, null, 2) + '\n');
          NODE
          cat edge-release-manifest.json

      - name: Bundle validated Edge ZIP into Core release store
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          EDGE_VERSION: ${{ steps.identity.outputs.version }}
          EDGE_CHANNEL: ${{ steps.identity.outputs.channel }}
          EDGE_ASSET: ${{ steps.identity.outputs.asset }}
          EDGE_SHA256: ${{ steps.manifest.outputs.sha256 }}
        run: |
          set -euo pipefail
          DEST_DIR="public/edge-releases"
          mkdir -p "$DEST_DIR"
          cp "$EDGE_ASSET" "$DEST_DIR/$EDGE_ASSET"
          ACTUAL="$(sha256sum "$DEST_DIR/$EDGE_ASSET" | awk '{print $1}')"
          test "$ACTUAL" = "$EDGE_SHA256"
          export DEST_DIR
          python - <<'PY'
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ['DEST_DIR'])
          manifest_path = root / 'manifest.json'
          try:
              manifest = json.loads(manifest_path.read_text('utf-8'))
          except Exception:
              manifest = {'schema': 'vantixgc-edge-core-artifacts-v1', 'releases': {}}
          manifest.setdefault('schema', 'vantixgc-edge-core-artifacts-v1')
          releases = manifest.setdefault('releases', {})
          releases[os.environ['EDGE_VERSION']] = {
              'channel': os.environ['EDGE_CHANNEL'],
              'file': os.environ['EDGE_ASSET'],
              'sha256': os.environ['EDGE_SHA256'],
              'sourceCommit': os.environ['GITHUB_SHA']
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', 'utf-8')
          PY
          git add "$DEST_DIR/$EDGE_ASSET" "$DEST_DIR/manifest.json"
          if git diff --cached --quiet; then
            echo "Core already contains exact Edge artifact $EDGE_VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(edge): bundle $EDGE_VERSION for Core distribution"
          git push origin "HEAD:$GITHUB_HEAD_REF"

      - name: Upload PR validation artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: edge-${{ steps.identity.outputs.version }}-validation
          path: |
            ${{ steps.identity.outputs.asset }}
            edge-release-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EDGE_VERSION: ${{ steps.identity.outputs.version }}
          EDGE_CHANNEL: ${{ steps.identity.outputs.channel }}
          EDGE_TAG: ${{ steps.identity.outputs.tag }}
          EDGE_ASSET: ${{ steps.identity.outputs.asset }}
          EDGE_SHA256: ${{ steps.manifest.outputs.sha256 }}
        run: |
          set -euo pipefail
          cat > edge-release-notes.md <<EOF
          VantixGC Restaurantes Edge $EDGE_VERSION

          Canal: $EDGE_CHANNEL
          Commit fuente: $GITHUB_SHA
          SHA-256: $EDGE_SHA256

          El ZIP contiene el runtime Edge versionado requerido por el arranque. CI exige arranque real del agente y supervivencia del Supervisor ante el handoff de actualización exit 75. El updater valida SHA-256, crea backup, activa de forma atómica y puede hacer rollback.
          EOF
          if gh release view "$EDGE_TAG" >/dev/null 2>&1; then
            gh release edit "$EDGE_TAG" --title "VantixGC Edge $EDGE_VERSION" --notes-file edge-release-notes.md
          else
            ARGS=("$EDGE_TAG" --target "$GITHUB_SHA" --title "VantixGC Edge $EDGE_VERSION" --notes-file edge-release-notes.md)
            if [[ "$EDGE_CHANNEL" == "PILOT" ]]; then ARGS+=(--prerelease); fi
            gh release create "${ARGS[@]}"
          fi
          gh release upload "$EDGE_TAG" "$EDGE_ASSET" edge-release-manifest.json --clobber

      - name: Release summary
        shell: bash
        env:
          EDGE_VERSION: ${{ steps.identity.outputs.version }}
          EDGE_CHANNEL: ${{ steps.identity.outputs.channel }}
          EDGE_TAG: ${{ steps.identity.outputs.tag }}
          EDGE_ASSET: ${{ steps.identity.outputs.asset }}
          EDGE_SHA256: ${{ steps.manifest.outputs.sha256 }}
        run: |
          {
            echo '## VantixGC Edge release package'
            echo
            echo "- Version: \`$EDGE_VERSION\`"
            echo "- Channel: \`$EDGE_CHANNEL\`"
            echo "- Asset: \`$EDGE_ASSET\`"
            echo "- SHA-256: \`$EDGE_SHA256\`"
            echo "- Tag: \`$EDGE_TAG\`"
            echo '- Boot smoke: `PASS` required before publish'
            echo '- Supervisor exit-75 restart smoke: `PASS` required before publish'
            echo '- Core local distribution: validated ZIP committed on same-repo PRs'
          } >> "$GITHUB_STEP_SUMMARY"
