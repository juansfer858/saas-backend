name: Restaurant PC Mesero V60 Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/restaurant-pc-mesero-v60-diagnostic.js'
      - '.github/workflows/restaurant-pc-mesero-v60-diagnostic.yml'
      - 'src/modules/restaurant/**'
      - 'src/web/restaurant-ui.js'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EDGE_AUTH_SECRET: edge-auth-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Inspect final served Restaurant staff asset
        run: node scripts/restaurant-pc-mesero-v60-diagnostic.js
