name: Temporary P3 Canonical Options
on:
  push:
    branches: [feat/restaurant-v2-orders-p3]
    paths:
      - 'scripts/tmp-p3-core-options.py'
      - '.github/workflows/tmp-p3-core-options.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/restaurant-v2-orders-p3
          fetch-depth: 0
      - run: python scripts/tmp-p3-core-options.py
      - run: |
          node --check src/modules/restaurant/restaurant.service.js
          node --check src/modules/restaurant/restaurant-identity.service.js
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add src/modules/restaurant/restaurant.service.js src/modules/restaurant/restaurant-identity.service.js
          git commit -m "feat(restaurante): opciones opt-in de piso compartido y personas V2 P3"
          git push origin HEAD:feat/restaurant-v2-orders-p3
