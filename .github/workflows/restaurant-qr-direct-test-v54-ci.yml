name: Restaurant QR Direct Test V54 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-qr-direct-test-v54.**'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'edge/agent/offline-qr-self-order-v54.js'
      - 'edge/agent/restaurant-entry-v2.js'
      - 'edge/version.json'
      - 'scripts/restaurant-qr-direct-test-v54-smoke.js'
      - '.github/workflows/restaurant-qr-direct-test-v54-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-qr-direct-test-v54.**'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'edge/agent/offline-qr-self-order-v54.js'
      - 'edge/agent/restaurant-entry-v2.js'
      - 'edge/version.json'
      - 'scripts/restaurant-qr-direct-test-v54-smoke.js'
      - '.github/workflows/restaurant-qr-direct-test-v54-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate direct QR test mode in Cloud and Edge
        run: node scripts/restaurant-qr-direct-test-v54-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait exact V54 commit and browser asset in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              HDR="$(mktemp)"
              JS="$(mktemp)"
              if curl -fsS -D "$HDR" "$BASE/app/restaurant-qr-ui.js?v=qr-direct-test-v54-$GITHUB_SHA" -o "$JS" \
                && grep -Fqi 'X-VantixGC-QR-Direct-Test: v54-no-pin' "$HDR" \
                && grep -Fq 'VANTIX_RESTAURANT_QR_DIRECT_TEST_V54' "$JS" \
                && grep -Fq '/autorizar-directo' "$JS" \
                && grep -Fq 'pinRequired:false' "$JS"; then
                echo "V54 exact commit and direct QR asset are live: $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "V54 did not become live for exact commit $GITHUB_SHA" >&2
          exit 1
