name: Fix Phase2 Salon QR Smoke Temp

on:
  push:
    branches:
      - feature/restaurant-tables-qr-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/restaurant-tables-qr-v2
          fetch-depth: 0
      - name: Patch phase2 smoke
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/restaurant-phase2-ui-smoke.js')
          s=p.read_text()
          s=s.replace("assert.match(operator, /restaurant-ui\\.js\\?v=kds-v2/);", "assert.match(operator, /restaurant-ui\\.js\\?v=salon-qr-v2/);")
          s=s.replace("assert.match(operatorUi, /Zonas y mesas/);", "assert.match(operatorUi, /OPERACIÓN DEL SALÓN/);")
          old="""for (const token of [
  'selectedZoneId',
  'loadZones',
  '/api/v1/restaurante/zonas',
  'Organización del salón',
  'Zonas y mesas',
  '+ Crear zona',
  '+ Agregar mesa',
  'Renombrar zona',
  'Eliminar zona',
  'zoneId:zone.id',
  'tablesInSelectedZone'
]) assert.ok(operatorUi.includes(token), `Restaurant zones UI must contain ${token}`);"""
          new="""for (const token of [
  'selectedZoneId',
  'loadZones',
  '/api/v1/restaurante/zonas',
  'OPERACIÓN DEL SALÓN',
  'Gestionar zonas',
  'Gestionar QR',
  '+ Mesa',
  'Editar plano',
  'data-salon-view=\"PLANO\"',
  'data-salon-view=\"LISTA\"',
  'zoneId:zone.id',
  'tablesInSelectedZone'
]) assert.ok(operatorUi.includes(token), `Restaurant Salon V2 UI must contain ${token}`);"""
          if old not in s: raise SystemExit('old phase2 zones block not found')
          s=s.replace(old,new,1)
          s=s.replace("console.log('RESTAURANT PHASE 2 + ZONAS/MESAS + CAJA V2 + NOTICE DIALOG SMOKE OK');", "console.log('RESTAURANT PHASE 2 + SALÓN/QR V2 + CAJA V2 + NOTICE DIALOG SMOKE OK');")
          p.write_text(s)
          PY
          node --check scripts/restaurant-phase2-ui-smoke.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/restaurant-phase2-ui-smoke.js
          git commit -m "test(restaurante): alinear Fase 2 con Salón QR V2"
          git push origin HEAD:feature/restaurant-tables-qr-v2
