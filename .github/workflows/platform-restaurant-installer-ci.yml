name: Platform Restaurant Installer CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/modules/public-installer/**'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/web/public-installer.html'
      - 'src/web/platform-restaurant-fiscal-governance.js'
      - 'scripts/public-installer-workspace-smoke.js'
      - 'public/edge-releases/manifest.json'
      - '.github/workflows/platform-restaurant-installer-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/modules/public-installer/**'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/web/public-installer.html'
      - 'src/web/platform-restaurant-fiscal-governance.js'
      - 'scripts/public-installer-workspace-smoke.js'
      - 'public/edge-releases/manifest.json'
      - '.github/workflows/platform-restaurant-installer-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public installer and recommended Edge contract
        run: node scripts/public-installer-workspace-smoke.js

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact commit in production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 75); do
            BODY="$(curl -fsS --max-time 8 https://core.vantixgc.com/api/public/runtime-info 2>/dev/null || true)"
            if grep -q "\"commit\":\"${GITHUB_SHA}\"" <<<"$BODY"; then
              echo "INSTALLER_V53_EXACT_PRODUCTION_COMMIT_OK attempt=$attempt"
              exit 0
            fi
            echo "Esperando commit exacto del instalador V53... attempt=$attempt expected=$GITHUB_SHA"
            sleep 10
          done
          echo "Producción no desplegó el commit $GITHUB_SHA dentro del tiempo esperado." >&2
          exit 1

      - name: Verify installer V53 and recommended Edge in production
        shell: bash
        run: |
          set -euo pipefail
          PAGE="$(curl -fsS --max-time 12 https://core.vantixgc.com/instalar)"
          PANEL="$(curl -fsS --max-time 12 https://core.vantixgc.com/platform/restaurant-fiscal-governance.js)"
          PS1="$(curl -fsS --max-time 15 https://core.vantixgc.com/instalar/windows.ps1)"
          MANIFEST="$(curl -fsS --max-time 15 https://core.vantixgc.com/edge-releases/manifest.json)"
          grep -q 'Instalar VantixGC Restaurantes' <<<"$PAGE"
          grep -q 'VANTIXGC_PLATFORM_RESTAURANT_INSTALLER_V1' <<<"$PANEL"
          grep -q '/edge-releases/manifest.json' <<<"$PS1"
          grep -q '\$StableCandidates = @()' <<<"$PS1"
          grep -q '\$ReleaseManifest.installRecommended' <<<"$PS1"
          ! grep -q 'github.com/juansfer858/saas-backend/archive/\$Commit.zip' <<<"$PS1"
          grep -q '"installRecommended"' <<<"$MANIFEST"
          RECOMMENDED="$(node -e 'const m=JSON.parse(process.argv[1]); const v=m.installRecommended; if(!v || !m.releases?.[v]) process.exit(2); process.stdout.write(v)' "$MANIFEST")"
          FILE="$(node -e 'const m=JSON.parse(process.argv[1]); process.stdout.write(m.releases[m.installRecommended].file)' "$MANIFEST")"
          SHA="$(node -e 'const m=JSON.parse(process.argv[1]); process.stdout.write(m.releases[m.installRecommended].sha256)' "$MANIFEST")"
          test -n "$RECOMMENDED"
          test "$RECOMMENDED" = '2.1.15-offline-print.1'
          test "$SHA" = '89d9ebe50239cf328bc6c2b5e76a2386e7e9321b80ddcebe5c12f9b105e2bef0'
          curl -fsS --max-time 30 -o /tmp/recommended-edge.zip "https://core.vantixgc.com/edge-releases/$FILE"
          ACTUAL="$(sha256sum /tmp/recommended-edge.zip | awk '{print $1}')"
          test "$ACTUAL" = "$SHA"
          echo "INSTALLER_V53_RECOMMENDED_EDGE_PRODUCTION_OK version=$RECOMMENDED sha=$SHA"
