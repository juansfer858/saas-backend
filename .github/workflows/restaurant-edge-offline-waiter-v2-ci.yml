name: Restaurant Edge Offline Waiter V2 CI

on:
  pull_request:
    branches:
      - main

jobs:
  restaurant-edge-offline-waiter-v2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EDGE_AUTH_SECRET: edge-auth-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run build
      - name: Sync isolated PostgreSQL
        run: npx prisma db push
      - name: Validate offline waiter runtime syntax
        run: |
          node --check edge/agent/offline-waiter-hard-gate.js
          node --check edge/agent/restaurant-entry-v2.js
          node --check edge/workspace/public/offline-waiter-v2.js
          node --check src/modules/edge/edge-restaurant-sync.service.js
          node --check scripts/edge-restaurant-offline-waiter-v2-smoke.js
          node --check scripts/edge-restaurant-offline-reconnect-db-smoke.js
      - name: Prove real local SQLite waiter hard gate with Core unavailable
        run: node scripts/edge-restaurant-offline-waiter-v2-smoke.js
      - name: Prove PostgreSQL reconnect preserves persons and idempotency
        run: node scripts/edge-restaurant-offline-reconnect-db-smoke.js
