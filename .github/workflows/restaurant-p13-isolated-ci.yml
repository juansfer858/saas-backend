name: Restaurant P13 Full Local Isolated CI

on:
  pull_request:
    paths:
      - 'lab/restaurant-p13/**'
      - 'scripts/restaurant-p13-*.js'
      - 'docs/restaurant-*p13*.md'
      - 'package.json'
      - '.github/workflows/restaurant-p13-isolated-ci.yml'
  workflow_dispatch:

jobs:
  isolated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vantix_p13
          POSTGRES_PASSWORD: p13-ci-only-password
          POSTGRES_DB: vantix_p13_lab
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U vantix_p13 -d vantix_p13_lab"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      VANTIX_P13_LAB_ENABLED: 'true'
      P13_HOST: 127.0.0.1
      P13_PORT: '8790'
      P13_MUTATIONS_ENABLED: 'false'
      P13_TENANT_SUBDOMAIN: demo-restaurante
      P13_JWT_SECRET: p13-ci-jwt-secret-that-is-longer-than-thirty-two-characters
      P13_ADMIN_PASSWORD: p13-ci-admin-password-only
      DATABASE_URL: postgresql://vantix_p13:p13-ci-only-password@127.0.0.1:55432/vantix_p13_lab
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure PostgreSQL recovery tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pg_dump >/dev/null 2>&1 || ! command -v pg_restore >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          pg_dump --version
          pg_restore --version

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare isolated P13 PostgreSQL
        run: npx prisma db push

      - name: Validate P13 canonical local isolation
        run: npm run lab:p13:smoke

      - name: Bootstrap disposable single-tenant lab
        run: npm run lab:p13:bootstrap

      - name: Validate offline license and signed updater contract
        run: npm run lab:p13:security-smoke

      - name: Validate local outbox/inbox idempotency against PostgreSQL
        run: npm run lab:p13:sync-smoke

      - name: Validate snapshot, replacement-PC restore and continuity
        run: npm run lab:p13:recovery-smoke

      - name: Validate E1 local users roles permissions restart and transactional outbox
        run: npm run lab:p13:e1-smoke

      - name: Validate E2 local tables visits restart and transactional outbox
        run: npm run lab:p13:e2-smoke

      - name: Validate E3 local orders persons commands restart and transactional outbox
        run: npm run lab:p13:e3-smoke

      - name: Assert production Edge remains untouched by P13 files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/${{ github.base_ref }}...HEAD > /tmp/p13-files.txt
          if grep -E '^(edge/agent|edge/workspace|edge/updater|edge/supervisor)/' /tmp/p13-files.txt; then
            echo 'P13 aislado no puede modificar Edge productivo.' >&2
            exit 1
          fi
          if grep -E '^src/' /tmp/p13-files.txt; then
            echo 'P13 aislado no puede modificar src/ en esta fase.' >&2
            exit 1
          fi
          echo 'P13_ISOLATION_OK'
