name: Restaurant Public Standalone Demo CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-public-demo-access.public.routes.js'
      - 'src/middleware/restaurant-public-demo-guard.js'
      - 'src/modules/public-installer/public-installer.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-public-demo.html'
      - 'src/web/restaurant-public-demo-modal.js'
      - 'scripts/restaurant-public-real-demo-smoke.js'
      - 'scripts/restaurant-self-service-v1-smoke.js'
      - '.github/workflows/restaurant-public-real-demo-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-public-demo-access.public.routes.js'
      - 'src/middleware/restaurant-public-demo-guard.js'
      - 'src/modules/public-installer/public-installer.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-public-demo.html'
      - 'src/web/restaurant-public-demo-modal.js'
      - 'scripts/restaurant-public-real-demo-smoke.js'
      - 'scripts/restaurant-self-service-v1-smoke.js'
      - '.github/workflows/restaurant-public-real-demo-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check src/modules/public-installer/public-installer.routes.js
          node --check src/routes/core.routes.js
          node --check src/web/restaurant-public-demo-modal.js
          node --check scripts/restaurant-public-real-demo-smoke.js
          node --check scripts/restaurant-self-service-v1-smoke.js
      - name: Validate standalone commercial demo contract
        run: node scripts/restaurant-public-real-demo-smoke.js
      - name: Validate public self-service compatibility
        run: node scripts/restaurant-self-service-v1-smoke.js
      - name: Validate self-service marketing copy
        run: |
          grep -Fq 'Autoatención del cliente' src/modules/public-installer/public-installer.routes.js
          grep -Fq 'Autoatención: pedido y pago desde la mesa' src/modules/public-installer/public-installer.routes.js
          grep -Fq 'reduciendo esperas, filas y carga operativa del personal' src/modules/public-installer/public-installer.routes.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Verify standalone demo is live at exact commit
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 70); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if [[ "$INFO" == *"$GITHUB_SHA"* ]]; then
              PAGE="$(curl -fsS "$BASE/restaurantes/demo")"
              [[ "$PAGE" == *'MODO DEMOSTRACIÓN'* ]]
              [[ "$PAGE" == *'AISLADO DEL SISTEMA REAL'* ]]
              [[ "$PAGE" == *'ENVIAR A COCINA / BARRA'* ]]
              [[ "$PAGE" == *'COBRAR EN EL DEMO'* ]]
              [[ "$PAGE" != *'/api/'* ]]
              [[ "$PAGE" != *'/app/'* ]]
              [[ "$PAGE" != *'demo-restaurante'* ]]

              HEADERS="$(curl -fsSI "$BASE/restaurantes/demo")"
              echo "$HEADERS" | grep -qi 'x-vantixgc-restaurant-demo-isolation: standalone-commercial-v1'
              echo "$HEADERS" | grep -qi "connect-src 'none'"

              MODAL="$(curl -fsS "$BASE/restaurantes/demo-modal-v1.js")"
              [[ "$MODAL" == *'sandbox="allow-scripts"'* ]]
              [[ "$MODAL" != *'allow-same-origin'* ]]

              LANDING="$(curl -fsS "$BASE/restaurantes")"
              [[ "$LANDING" == *'/restaurantes/demo-modal-v1.js'* ]]
              [[ "$LANDING" == *'Autoatención del cliente'* ]]
              [[ "$LANDING" == *'Autoatención: pedido y pago desde la mesa'* ]]
              [[ "$LANDING" == *'reduciendo esperas, filas y carga operativa del personal'* ]]
              [[ "$LANDING" != *'QR de mesas'* ]]

              SESSION_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/public/restaurantes/demo-session")"
              [[ "$SESSION_STATUS" == '404' ]]

              echo "Restaurant standalone commercial demo live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo 'Exact standalone commercial demo commit did not reach production in time.' >&2
          exit 1
