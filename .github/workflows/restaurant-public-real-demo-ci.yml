name: Restaurant Public Real Demo CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-public-demo-access.public.routes.js'
      - 'src/middleware/restaurant-public-demo-guard.js'
      - 'src/modules/public-installer/public-installer.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-public-demo.html'
      - 'scripts/restaurant-public-real-demo-smoke.js'
      - '.github/workflows/restaurant-public-real-demo-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-public-demo-access.public.routes.js'
      - 'src/middleware/restaurant-public-demo-guard.js'
      - 'src/modules/public-installer/public-installer.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-public-demo.html'
      - 'scripts/restaurant-public-real-demo-smoke.js'
      - '.github/workflows/restaurant-public-real-demo-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check src/modules/restaurant/restaurant-public-demo-access.public.routes.js
          node --check src/middleware/restaurant-public-demo-guard.js
          node --check src/modules/public-installer/public-installer.routes.js
          node --check src/routes/core.routes.js
          node --check scripts/restaurant-public-real-demo-smoke.js
      - name: Validate public real-demo contract
        run: node scripts/restaurant-public-real-demo-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Verify real demo is live at exact commit
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 70); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if [[ "$INFO" == *"$GITHUB_SHA"* ]]; then
              PAGE="$(curl -fsS "$BASE/restaurantes/demo")"
              [[ "$PAGE" == *'MODO DEMOSTRACIÓN'* ]]
              [[ "$PAGE" == *'/api/public/restaurantes/demo-session'* ]]
              [[ "$PAGE" == *"/app/centro-de-control-v2"* ]]
              SESSION="$(curl -fsS "$BASE/api/public/restaurantes/demo-session")"
              [[ "$SESSION" == *'"demo":true'* ]]
              [[ "$SESSION" == *'"demoMode":"PUBLIC_REAL_V2"'* ]]
              [[ "$SESSION" == *'"subdomain":"demo-restaurante"'* ]]
              echo "Restaurant public real demo live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo 'Exact public real-demo commit did not reach production in time.' >&2
          exit 1
