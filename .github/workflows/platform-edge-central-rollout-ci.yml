name: Platform Edge Central Rollout CI

on:
  pull_request:
    paths:
      - 'src/modules/platform/saas/**'
      - 'src/modules/edge/**'
      - 'src/modules/restaurant/restaurant-edge-managed.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/web/edge-tenant-managed.js'
      - 'src/web/platform-edge-rollout.js'
      - 'src/routes/core.routes.js'
      - 'scripts/platform-edge-central-rollout-smoke.js'
      - '.github/workflows/platform-edge-central-rollout-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/platform/saas/**'
      - 'src/modules/edge/**'
      - 'src/modules/restaurant/restaurant-edge-managed.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/web/edge-tenant-managed.js'
      - 'src/web/platform-edge-rollout.js'
      - 'src/routes/core.routes.js'
      - 'scripts/platform-edge-central-rollout-smoke.js'
      - '.github/workflows/platform-edge-central-rollout-ci.yml'
  workflow_dispatch:

jobs:
  verify-central-rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify tenant cannot manage Edge releases
        run: node scripts/platform-edge-central-rollout-smoke.js
