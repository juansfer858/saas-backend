name: Restaurant KDS Print Reliability CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-kds-reliability.public.routes.js'
      - 'src/modules/restaurant/restaurant-kds-windows-printer.public.routes.js'
      - 'src/modules/restaurant/restaurant-kds-windows-printer-asset.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/modules/platform/printing/printing.routes.js'
      - 'src/modules/platform/printing/printing.service.js'
      - 'src/modules/edge/edge-restaurant-print-bridge.js'
      - 'src/modules/edge/edge-restaurant-immediate-print-bridge.js'
      - 'src/modules/edge/edge-remote-agent.service.js'
      - 'edge/agent/restaurant-print-bridge.js'
      - 'edge/print-spooler/escpos.js'
      - 'edge/print-spooler/windows-printer.js'
      - 'edge/version.json'
      - 'scripts/restaurant-kds-print-reliability-smoke.js'
      - 'scripts/restaurant-windows-usb-printer-smoke.js'
      - '.github/workflows/restaurant-kds-print-reliability-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-kds-reliability.public.routes.js'
      - 'src/modules/restaurant/restaurant-kds-windows-printer.public.routes.js'
      - 'src/modules/restaurant/restaurant-kds-windows-printer-asset.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/modules/platform/printing/printing.routes.js'
      - 'src/modules/platform/printing/printing.service.js'
      - 'src/modules/edge/edge-restaurant-print-bridge.js'
      - 'src/modules/edge/edge-restaurant-immediate-print-bridge.js'
      - 'src/modules/edge/edge-remote-agent.service.js'
      - 'edge/agent/restaurant-print-bridge.js'
      - 'edge/print-spooler/escpos.js'
      - 'edge/print-spooler/windows-printer.js'
      - 'edge/version.json'
      - 'scripts/restaurant-kds-print-reliability-smoke.js'
      - 'scripts/restaurant-windows-usb-printer-smoke.js'
      - '.github/workflows/restaurant-kds-print-reliability-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://localhost:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run build
      - name: Validate KDS and Edge print bridge syntax
        run: |
          node --check src/modules/restaurant/restaurant-kds-reliability.public.routes.js
          node --check src/modules/restaurant/restaurant-kds-windows-printer.public.routes.js
          node --check src/modules/restaurant/restaurant-kds-windows-printer-asset.public.routes.js
          node --check src/modules/platform/printing/printing.routes.js
          node --check src/modules/platform/printing/printing.service.js
          node --check src/modules/edge/edge-restaurant-print-bridge.js
          node --check src/modules/edge/edge-restaurant-immediate-print-bridge.js
          node --check edge/agent/restaurant-print-bridge.js
          node --check edge/print-spooler/escpos.js
          node --check edge/print-spooler/windows-printer.js
      - name: Validate pending visibility and single-printer kitchen routing
        run: node scripts/restaurant-kds-print-reliability-smoke.js
      - name: Validate Windows USB printer contract and browser asset loading
        run: node scripts/restaurant-windows-usb-printer-smoke.js

  verify-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact commit in production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://core.vantixgc.com/api/public/runtime-info'
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
                echo PRODUCTION_EXACT_COMMIT_OK
                exit 0
              fi
            fi
            echo "Waiting for production commit $GITHUB_SHA attempt=$attempt"
            sleep 10
          done
          exit 1
      - name: Verify KDS and print readiness
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_EDGE_VERSION="$(node -p "require('./edge/version.json').version")"
          curl -fsSL --max-time 15 -o /tmp/kds-print.json https://core.vantixgc.com/api/public/restaurante/kds-print-readiness
          cat /tmp/kds-print.json
          grep -q 'VANTIX_RESTAURANT_KDS_RELIABILITY_V2' /tmp/kds-print.json
          grep -q '"pendingNeverHidden":true' /tmp/kds-print.json
          grep -q '"waiterImmediatePrint":true' /tmp/kds-print.json
          grep -q '"windowsUsbPrinting":true' /tmp/kds-print.json
          grep -q '"windowsPrinterDiscoveryViaRelay":true' /tmp/kds-print.json
          grep -q '"windowsRawSpooler":"WIN32_WRITE_PRINTER_RAW"' /tmp/kds-print.json
          grep -q '"onePrinterPerEndpoint":true' /tmp/kds-print.json
          grep -q '"kitchenQueueCoversNamedStations":true' /tmp/kds-print.json
          grep -Fq "\"edgeVersion\":\"${EXPECTED_EDGE_VERSION}\"" /tmp/kds-print.json
      - name: Verify final KDS browser assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 -D /tmp/kds.headers -o /tmp/kds.js https://core.vantixgc.com/app/restaurant-ui.js
          grep -qi '^X-VantixGC-KDS-Reliability: v2-inline-hidden-rescue' /tmp/kds.headers
          grep -q 'VANTIX_RESTAURANT_KDS_RELIABILITY_V2' /tmp/kds.js
          grep -q 'kdsRescueHiddenPendingLanes' /tmp/kds.js

          curl -fsSL --max-time 15 -D /tmp/windows.headers -o /tmp/windows.js https://core.vantixgc.com/app/restaurant-kds-windows-printer.js
          grep -qi '^content-type: application/javascript' /tmp/windows.headers
          grep -qi '^X-VantixGC-KDS-Windows-Printer-Asset: v3-relay-first-js' /tmp/windows.headers
          grep -q 'VANTIX_RESTAURANT_KDS_WINDOWS_PRINTER_ASSET_V3' /tmp/windows.js
          grep -q 'VANTIX_RESTAURANT_KDS_WINDOWS_PRINTER_V1' /tmp/windows.js
          grep -q 'WINDOWS_PRINTERS' /tmp/windows.js
          grep -q 'WINDOWS_TEST' /tmp/windows.js
          grep -q 'Detectar impresoras' /tmp/windows.js
          grep -q 'Probar impresión' /tmp/windows.js
          grep -q 'relayConnected===true' /tmp/windows.js
          ! grep -q 'El Edge del restaurante no está en línea' /tmp/windows.js

          curl -fsSL --max-time 15 -D /tmp/control.headers -o /tmp/control.html https://core.vantixgc.com/app/centro-de-control?view=kds
          grep -qi '^content-type: text/html' /tmp/control.headers
          grep -qi '^X-VantixGC-KDS-Windows-Printer-Loader: v3-relay-first-asset' /tmp/control.headers
          grep -q 'VANTIX_RESTAURANT_KDS_WINDOWS_PRINTER_ASSET_V3' /tmp/control.html
          grep -q '/app/restaurant-kds-windows-printer.js?v=windows-printer-v3-relay-first' /tmp/control.html
          echo PRODUCTION_KDS_WINDOWS_USB_PRINT_OK
