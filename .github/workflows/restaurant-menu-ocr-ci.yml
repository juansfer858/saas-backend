name: Restaurant Menu OCR CI

on:
  pull_request:
    branches:
      - main

jobs:
  menu-ocr:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EDGE_AUTH_SECRET: edge-auth-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install local OCR runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa poppler-utils
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run build
      - name: Sync test database
        run: npx prisma db push
      - name: Validate OCR browser, layout, strict and cleanup syntax
        run: |
          node --check src/web/restaurant-menu-layout-parser-v3.js
          node --check src/web/restaurant-menu-ocr-strict-v4.js
          node --check src/web/restaurant-menu-browser-ocr.js
          node --check src/web/restaurant-menu-browser-ocr-v4.js
          node --check src/web/restaurant-menu-ocr-quality-v2.js
          node --check src/web/restaurant-menu-ocr-cleanup-ui.js
          node --check src/modules/restaurant/restaurant-menu-ocr-cleanup.service.js
      - name: Validate OCR V4 regression and cleanup contracts
        run: node scripts/restaurant-menu-ocr-v4-smoke.js
      - name: Validate local OCR runtime, layout and browser fallback
        run: node scripts/restaurant-menu-local-ocr-smoke.js
      - name: Validate OCR import contracts and UI
        run: node scripts/restaurant-menu-import-smoke.js
      - name: Validate transactional menu import against PostgreSQL
        run: node scripts/restaurant-menu-import-db-smoke.js
