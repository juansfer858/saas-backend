name: Temporary Delivery UI Patch

on:
  push:
    branches:
      - feature/restaurant-delivery-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/restaurant-delivery-v1
      - name: Stabilize delivery dashboard observer and remove this temporary workflow
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'src/web/restaurant-delivery-ui.js';
          let s = fs.readFileSync(file, 'utf8');
          const from1 = "    const actions = $('.cc-actions');\n    if (!actions) return;\n    injectStyles();";
          const to1 = "    const actions = $('.cc-actions');\n    if (!actions) return;\n    if (actions.dataset.deliveryLayoutReady === '1') return;\n    injectStyles();";
          if (!s.includes('deliveryLayoutReady')) {
            if (!s.includes(from1)) throw new Error('No se encontró punto de guardia');
            s = s.replace(from1, to1);
          }
          const from2 = "    [cash, tables, deliveryButton, newOrder, orders, waiter, kds, menu].filter(Boolean).forEach((node) => actions.appendChild(node));\n  }";
          const to2 = "    [cash, tables, deliveryButton, newOrder, orders, waiter, kds, menu].filter(Boolean).forEach((node) => actions.appendChild(node));\n    actions.dataset.deliveryLayoutReady = '1';\n  }";
          if (!s.includes("actions.dataset.deliveryLayoutReady = '1'")) {
            if (!s.includes(from2)) throw new Error('No se encontró punto de estabilización');
            s = s.replace(from2, to2);
          }
          fs.writeFileSync(file, s);
          NODE
          rm -f .github/workflows/temp-delivery-ui-patch.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/web/restaurant-delivery-ui.js .github/workflows/temp-delivery-ui-patch.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(restaurante): estabilizar observer de domicilios"
          git push origin HEAD:feature/restaurant-delivery-v1
