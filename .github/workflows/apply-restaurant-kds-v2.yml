name: Apply Restaurant KDS V2

on:
  push:
    branches:
      - ui/restaurant-kds-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/restaurant-kds-v2
          fetch-depth: 0

      - name: Apply KDS V2 product changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Enrich command reads with zone + waiter identity.
          service_path = Path('src/modules/restaurant/restaurant.service.js')
          service = service_path.read_text()
          old = '''  return prisma.restaurantCommand.findMany({
            where,
            include: { order: { include: { items: true, session: { include: { table: true } } } } },
            orderBy: { creadoEn: 'asc' },
            take: Math.min(Number(filters.limit) || 200, 500)
          });'''
          new = '''  const commands = await prisma.restaurantCommand.findMany({
            where,
            include: {
              order: {
                include: {
                  items: true,
                  session: { include: { table: { include: { zone: true } } } }
                }
              }
            },
            orderBy: { creadoEn: 'asc' },
            take: Math.min(Number(filters.limit) || 200, 500)
          });
          const waiterIds = [...new Set(commands.map((command) => command.order?.createdByUserId).filter(Boolean))];
          const waiters = waiterIds.length ? await prisma.user.findMany({
            where: { tenantId, id: { in: waiterIds } },
            select: { id: true, nombre: true }
          }) : [];
          const waiterById = new Map(waiters.map((row) => [row.id, row]));
          return commands.map((command) => ({
            ...command,
            waiter: command.order?.source === 'MESERO' ? waiterById.get(command.order?.createdByUserId) || null : null
          }));'''
          if old not in service:
              raise SystemExit('listCommands canonical block not found')
          service = service.replace(old, new, 1)
          service_path.write_text(service)

          # 2) KDS V2 state + canonical renderer in restaurant-ui.js.
          ui_path = Path('src/web/restaurant-ui.js')
          ui = ui_path.read_text()
          old_state = "    waiterSearch: '',\n    draft: null,"
          new_state = """    waiterSearch: '',
    kdsFilter: 'ALL',
    kdsZone: 'ALL',
    kdsWaiter: 'ALL',
    kdsSearch: '',
    kdsSoundEnabled: localStorage.getItem('restaurant_kds_sound_v1') !== 'off',
    kdsKnownIds: new Set(),
    draft: null,"""
          if old_state not in ui:
              raise SystemExit('KDS state insertion point not found')
          ui = ui.replace(old_state, new_state, 1)

          block_start = ui.index('  function commandItems(command)')
          block_end = ui.index('\n  function printCommand(command)', block_start)
          kds_block = r'''  const KDS_OVERDUE_MINUTES = 12;

          function commandItems(command) { return (command.order?.items || []).filter((x) => x.station === command.station); }
          function kdsAgeMinutes(command) {
            const created = new Date(command?.creadoEn || 0).getTime();
            if (!Number.isFinite(created) || !created) return 0;
            return Math.max(0, Math.floor((Date.now() - created) / 60000));
          }
          function kdsAgeLabel(command) {
            const minutes = kdsAgeMinutes(command);
            if (minutes < 1) return 'ahora';
            if (minutes < 60) return `hace ${minutes} min`;
            return `hace ${Math.floor(minutes / 60)} h ${minutes % 60} min`;
          }
          function kdsIsLate(command) {
            return ['PENDIENTE','EN_PREPARACION'].includes(String(command?.state || '')) && kdsAgeMinutes(command) >= KDS_OVERDUE_MINUTES;
          }
          function kdsStatus(command) {
            if (kdsIsLate(command)) return { key:'ATRASADA', label:'ATRASADA' };
            if (command.state === 'PENDIENTE') return { key:'PENDIENTE', label:'PENDIENTE' };
            if (command.state === 'EN_PREPARACION') return { key:'EN_PREPARACION', label:'EN PREPARACIÓN' };
            if (command.state === 'LISTA') return { key:'LISTA', label:'LISTA' };
            return { key:String(command.state || ''), label:String(command.state || '').replaceAll('_',' ') };
          }
          function kdsZoneLabel(command) { return command.order?.session?.table?.zone?.name || 'Sin zona'; }
          function kdsWaiterLabel(command) {
            if (String(command.order?.source || '').toUpperCase() === 'QR') return 'Cliente · QR';
            return command.waiter?.nombre || 'Mesero';
          }
          function kdsOrderLabel(command) { return `#${String(command.order?.id || command.id || '').slice(0, 6).toUpperCase()}`; }
          function kdsStationIcon(station) { return station === 'COCINA' ? '♨' : station === 'BARRA' ? '▥' : '♢'; }
          function kdsStations() {
            const role = String(S.context?.user?.rol || '').toUpperCase();
            if (['COCINA','BARRA','POSTRES'].includes(role)) return [role];
            return ['COCINA','BARRA','POSTRES'];
          }
          function kdsVisibleCommands() { return S.commands.filter((row) => !['ENTREGADA','CANCELADA'].includes(String(row.state || ''))); }
          function kdsUnique(rows, getter) { return [...new Set(rows.map(getter).filter(Boolean))].sort((a,b) => String(a).localeCompare(String(b), 'es')); }
          function kdsMatches(command) {
            if (S.kdsFilter !== 'ALL' && command.state !== S.kdsFilter) return false;
            if (S.kdsZone !== 'ALL' && kdsZoneLabel(command) !== S.kdsZone) return false;
            if (S.kdsWaiter !== 'ALL' && kdsWaiterLabel(command) !== S.kdsWaiter) return false;
            const search = String(S.kdsSearch || '').trim().toLocaleLowerCase('es');
            if (!search) return true;
            const haystack = [
              command.order?.session?.table?.name,
              kdsZoneLabel(command),
              kdsWaiterLabel(command),
              command.order?.id,
              command.id,
              ...commandItems(command).map((item) => item.description),
              ...commandItems(command).map((item) => item.notes)
            ].filter(Boolean).join(' ').toLocaleLowerCase('es');
            return haystack.includes(search);
          }
          function kdsKpis(rows) {
            const active = rows.filter((row) => ['PENDIENTE','EN_PREPARACION','LISTA'].includes(row.state));
            const average = active.length ? Math.round(active.reduce((sum,row) => sum + kdsAgeMinutes(row), 0) / active.length) : 0;
            return {
              pending: rows.filter((row) => row.state === 'PENDIENTE').length,
              preparing: rows.filter((row) => row.state === 'EN_PREPARACION').length,
              ready: rows.filter((row) => row.state === 'LISTA').length,
              late: rows.filter(kdsIsLate).length,
              average
            };
          }
          function kdsFocusSnapshot() {
            const active = document.activeElement;
            if (!active?.id || !['kdsSearch','kdsZoneFilter','kdsWaiterFilter'].includes(active.id)) return null;
            return { id:active.id, start:active.selectionStart, end:active.selectionEnd };
          }
          function kdsRestoreFocus(snapshot) {
            if (!snapshot) return;
            const node = document.getElementById(snapshot.id);
            if (!node) return;
            node.focus();
            if (typeof node.setSelectionRange === 'function' && Number.isInteger(snapshot.start)) node.setSelectionRange(snapshot.start, snapshot.end ?? snapshot.start);
          }
          function playKdsTone() {
            if (!S.kdsSoundEnabled) return;
            try {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return;
              const ctx = new AudioCtx();
              const oscillator = ctx.createOscillator();
              const gain = ctx.createGain();
              oscillator.frequency.value = 880;
              gain.gain.setValueAtTime(0.0001, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.01);
              gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
              oscillator.connect(gain); gain.connect(ctx.destination);
              oscillator.start(); oscillator.stop(ctx.currentTime + 0.2);
              oscillator.onended = () => ctx.close?.();
            } catch {}
          }
          function kdsRememberCommands(rows, fromPoll) {
            const current = new Set(rows.filter((row) => !['ENTREGADA','CANCELADA'].includes(row.state)).map((row) => row.id));
            const hadKnown = S.kdsKnownIds.size > 0;
            const hasNew = fromPoll && hadKnown && [...current].some((id) => !S.kdsKnownIds.has(id));
            S.kdsKnownIds = current;
            if (hasNew) playKdsTone();
          }
          function kdsMetricCard(icon, label, value, extraClass = '') {
            return `<article class="kds-kpi ${extraClass}"><span class="kds-kpi-icon">${icon}</span><div><small>${label}</small><b>${value}</b></div></article>`;
          }
          function kdsCommandCard(command) {
            const items = commandItems(command);
            const status = kdsStatus(command);
            const late = kdsIsLate(command);
            const table = command.order?.session?.table?.name || 'Mesa';
            const zone = kdsZoneLabel(command);
            const waiter = kdsWaiterLabel(command);
            const cardClass = command.state === 'LISTA' ? 'kds-ready' : command.state === 'EN_PREPARACION' ? 'kds-preparing' : 'kds-pending';
            let actions = '';
            if (command.state === 'PENDIENTE') actions = `<button class="ri-btn primary" data-command="${command.id}" data-command-state="EN_PREPARACION">♨ Tomar</button><button class="ri-btn" data-kds-detail="${command.id}">☷ Ver detalle</button>`;
            if (command.state === 'EN_PREPARACION') actions = `<button class="ri-btn primary kds-wide-action" data-command="${command.id}" data-command-state="LISTA">✓ Marcar listo</button><button class="ri-btn" data-kds-detail="${command.id}">☷ Ver detalle</button>`;
            if (command.state === 'LISTA') actions = `<div class="kds-ready-notice">✓ Mesero avisado en vivo</div><button class="ri-btn" data-command="${command.id}" data-command-state="ENTREGADA">Marcar entregada</button><button class="ri-btn" data-kds-detail="${command.id}">☷ Ver detalle</button>`;
            return `<article class="kds-command-card ${cardClass} ${late ? 'kds-overdue' : ''}" data-kds-command="${command.id}">
              <div class="kds-card-top"><div><b>${esc(table)} · ${esc(zone)}</b><small>${esc(waiter)} · ${esc(kdsAgeLabel(command))}</small></div><div class="kds-card-status"><small>Pedido ${esc(kdsOrderLabel(command))}</small><span class="state-stamp ${status.key}">${status.label}</span></div></div>
              <div class="kds-items">${items.map((item) => `<div class="kds-item"><span><b>${esc(item.quantity)}×</b> ${esc(item.description)}</span>${item.notes ? `<em>${esc(item.notes)}</em>` : ''}</div>`).join('') || '<div class="empty-ticket">Sin productos visibles en esta estación.</div>'}</div>
              <div class="kds-card-actions">${actions}</div>
            </article>`;
          }
          function kdsLaneMarkup(station, rows) {
            const stationRows = rows.filter((row) => row.station === station);
            return `<section class="kds-v2-lane" data-station="${station}"><header><div><span class="kds-station-icon">${kdsStationIcon(station)}</span><h2>${esc(station.replaceAll('_',' '))}</h2></div><span class="kds-count">${stationRows.length} comanda(s)</span></header><div class="kds-lane-scroll">${stationRows.map(kdsCommandCard).join('') || `<div class="kds-empty"><b>Sin comandas pendientes</b><span>Los nuevos pedidos de ${esc(station.toLowerCase())} aparecerán aquí automáticamente.</span></div>`}</div></section>`;
          }
          function kdsDetailMarkup(command) {
            const status = kdsStatus(command);
            const table = command.order?.session?.table?.name || 'Mesa';
            return `<div class="kds-detail-head"><div><div class="ri-eyebrow">Detalle de comanda</div><h2>${esc(table)} · ${esc(kdsZoneLabel(command))}</h2><p class="ri-muted">${esc(kdsWaiterLabel(command))} · ${esc(kdsAgeLabel(command))} · Pedido ${esc(kdsOrderLabel(command))}</p></div><button type="button" class="ri-btn" data-kds-close>Cerrar</button></div><span class="state-stamp ${status.key}">${status.label}</span><div class="kds-detail-items">${commandItems(command).map((item) => `<div><b>${esc(item.quantity)}× ${esc(item.description)}</b>${item.notes ? `<span>Nota: ${esc(item.notes)}</span>` : ''}</div>`).join('')}</div><div class="ri-actions"><button type="button" class="ri-btn" data-kds-print="${command.id}">PDF / Imprimir</button></div>`;
          }
          function openKdsDetail(id) {
            const command = S.commands.find((row) => row.id === id);
            const dialog = $('#kdsDetailDialog');
            if (!command || !dialog) return;
            dialog.innerHTML = kdsDetailMarkup(command);
            dialog.querySelector('[data-kds-close]')?.addEventListener('click', () => dialog.close?.());
            dialog.querySelector('[data-kds-print]')?.addEventListener('click', () => printCommand(command));
            if (typeof dialog.showModal === 'function') dialog.showModal(); else dialog.setAttribute('open','');
          }

          async function renderKds(fromPoll = false, localOnly = false) {
            const focus = kdsFocusSnapshot();
            if (!localOnly) {
              const rows = await api('/api/v1/restaurante/comandas?limit=200');
              kdsRememberCommands(rows, fromPoll);
              S.commands = rows;
            }
            const visible = kdsVisibleCommands();
            const filtered = visible.filter(kdsMatches);
            const kpis = kdsKpis(visible);
            const zones = kdsUnique(visible, kdsZoneLabel);
            const waiters = kdsUnique(visible, kdsWaiterLabel);
            if (S.kdsZone !== 'ALL' && !zones.includes(S.kdsZone)) S.kdsZone = 'ALL';
            if (S.kdsWaiter !== 'ALL' && !waiters.includes(S.kdsWaiter)) S.kdsWaiter = 'ALL';
            const seconds = Math.max(1, Math.round((S.context.polling.kdsMs || 2000) / 1000));
            $('#view').innerHTML = `<section class="kds-v2">
              <header class="kds-v2-header"><div><div class="ri-eyebrow">PRODUCCIÓN EN VIVO</div><h1 class="ri-title">Cocina / Barra</h1></div><div class="kds-v2-header-right"><span class="cc-live-pill">Actualización automática cada ${seconds} s · En vivo</span><div class="kds-header-actions"><button type="button" class="ri-btn" id="kdsRefresh">↻ Actualizar</button><button type="button" class="ri-btn" id="kdsSound">${S.kdsSoundEnabled ? '🔊 Sonido ON' : '🔇 Sonido OFF'}</button><button type="button" class="ri-btn" id="kdsFullscreen">${document.fullscreenElement ? 'Salir pantalla completa' : '⛶ Pantalla completa'}</button></div></div></header>
              <div class="kds-kpis">${kdsMetricCard('▤','Pendientes',kpis.pending)}${kdsMetricCard('♨','En preparación',kpis.preparing)}${kdsMetricCard('✓','Listas',kpis.ready,'ready')}${kdsMetricCard('◷','Atrasadas',kpis.late,'late')}${kdsMetricCard('◴','Tiempo prom.',`${kpis.average} min`,'time')}</div>
              <div class="kds-filterbar"><div class="kds-state-filters">${[['ALL','Todas'],['PENDIENTE','Pendientes'],['EN_PREPARACION','En preparación'],['LISTA','Listas']].map(([value,label]) => `<button type="button" class="ri-btn ${S.kdsFilter === value ? 'primary' : ''}" data-kds-filter="${value}">${label}</button>`).join('')}</div><select id="kdsZoneFilter" class="ri-select"><option value="ALL">Zona · Todas</option>${zones.map((zone) => `<option value="${esc(zone)}" ${S.kdsZone === zone ? 'selected' : ''}>${esc(zone)}</option>`).join('')}</select><select id="kdsWaiterFilter" class="ri-select"><option value="ALL">Mesero · Todos</option>${waiters.map((waiter) => `<option value="${esc(waiter)}" ${S.kdsWaiter === waiter ? 'selected' : ''}>${esc(waiter)}</option>`).join('')}</select><label class="kds-search"><span>⌕</span><input id="kdsSearch" class="ri-input" value="${esc(S.kdsSearch)}" placeholder="Buscar mesa o pedido"></label></div>
              <div class="kds-v2-lanes">${kdsStations().map((station) => kdsLaneMarkup(station, filtered)).join('')}</div>
              <dialog id="kdsDetailDialog" class="kds-detail-dialog ri-card"></dialog>
            </section>`;
            bindKds();
            kdsRestoreFocus(focus);
            if (!fromPoll) {
              stopPoll();
              S.poll = setInterval(() => { if (S.tab === 'kds') renderKds(true).catch(() => {}); }, S.context.polling.kdsMs || 2000);
            }
          }
          function bindKds() {
            $$('[data-command]').forEach((button) => button.addEventListener('click', () => setCommand(button.dataset.command, button.dataset.commandState)));
            $$('[data-kds-detail]').forEach((button) => button.addEventListener('click', () => openKdsDetail(button.dataset.kdsDetail)));
            $$('[data-kds-filter]').forEach((button) => button.addEventListener('click', () => { S.kdsFilter = button.dataset.kdsFilter; renderKds(true, true).catch((error) => message(error.message, true)); }));
            $('#kdsZoneFilter')?.addEventListener('change', (event) => { S.kdsZone = event.target.value; renderKds(true, true).catch((error) => message(error.message, true)); });
            $('#kdsWaiterFilter')?.addEventListener('change', (event) => { S.kdsWaiter = event.target.value; renderKds(true, true).catch((error) => message(error.message, true)); });
            $('#kdsSearch')?.addEventListener('input', (event) => { S.kdsSearch = event.target.value; renderKds(true, true).catch((error) => message(error.message, true)); });
            $('#kdsRefresh')?.addEventListener('click', () => renderKds(true).catch((error) => message(error.message, true)));
            $('#kdsSound')?.addEventListener('click', () => { S.kdsSoundEnabled = !S.kdsSoundEnabled; localStorage.setItem('restaurant_kds_sound_v1', S.kdsSoundEnabled ? 'on' : 'off'); if (S.kdsSoundEnabled) playKdsTone(); renderKds(true, true).catch(() => {}); });
            $('#kdsFullscreen')?.addEventListener('click', async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); await renderKds(true, true); } catch (error) { message('Pantalla completa no está disponible en este dispositivo.', true); } });
            $('#kdsDetailDialog')?.addEventListener('click', (event) => { if (event.target.id === 'kdsDetailDialog') event.target.close?.(); });
          }
          async function setCommand(id, state) {
            try {
              const result = await api(`/api/v1/restaurante/comandas/${id}`, { method:'PATCH', body:JSON.stringify({ state }) });
              if (state === 'LISTA') message('Comanda lista. El Mesero V2 la verá en su panel en vivo.');
              else if (state === 'ENTREGADA') message('Comanda entregada y retirada del tablero.');
              else message('Comanda tomada. Producción actualizada.');
              if (result.notification?.queued) message('Pedido listo; notificación al cliente también fue encolada.');
              await renderKds(true);
            } catch (error) { message(error.message, true); }
          }
'''
          ui = ui[:block_start] + kds_block + ui[block_end:]
          ui_path.write_text(ui)

          # 3) Replace obsolete KDS layout CSS in the canonical stylesheet and append V2.
          css_path = Path('src/web/restaurant-control-center.css')
          css = css_path.read_text()
          for selector in ['kds-head','kds-lanes','kds-lane','kds-lane-title','kds-lane-count']:
              css = re.sub(r'\\.' + re.escape(selector) + r'\\{[^{}]*\\}', '', css)
          css += r'''

/* KDS V2 — tablero de producción canónico, táctil y adaptable por rol/estación. */
.kds-v2{display:grid;gap:14px}.kds-v2-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.kds-v2-header-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}.kds-header-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.kds-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.kds-kpi{min-height:98px;padding:14px 16px;border:1px solid var(--cc-line);border-radius:16px;background:#fff;box-shadow:0 5px 16px rgba(15,23,42,.05);display:flex;align-items:center;gap:13px}.kds-kpi-icon{display:grid;place-items:center;width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:#fff3e8;color:var(--cc-orange-dark);font-size:23px;font-weight:950}.kds-kpi small{display:block;color:var(--cc-muted);font-size:13px;font-weight:850}.kds-kpi b{display:block;margin-top:2px;font-size:25px;line-height:1;color:var(--cc-ink)}.kds-kpi.ready .kds-kpi-icon{background:#eaf8ee;color:var(--cc-green)}.kds-kpi.late .kds-kpi-icon{background:#fff0f0;color:var(--cc-red)}.kds-kpi.late b{color:var(--cc-red)}.kds-kpi.time .kds-kpi-icon{background:#edf4ff;color:var(--cc-blue)}.kds-filterbar{display:grid;grid-template-columns:auto minmax(150px,190px) minmax(150px,190px) minmax(230px,1fr);gap:10px;align-items:center;padding:10px;border:1px solid var(--cc-line);border-radius:15px;background:#fff}.kds-state-filters{display:flex;gap:7px;flex-wrap:wrap}.kds-filterbar .ri-btn,.kds-filterbar .ri-select,.kds-filterbar .ri-input{min-height:44px!important}.kds-search{position:relative;display:block}.kds-search>span{position:absolute;left:13px;top:50%;transform:translateY(-50%);z-index:1;color:var(--cc-muted);font-size:18px}.kds-search .ri-input{width:100%;padding-left:38px!important}.kds-v2-lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}.kds-v2-lane{min-width:0;border:1px solid var(--cc-line);border-radius:17px;background:#fff;box-shadow:0 7px 20px rgba(15,23,42,.055);overflow:hidden}.kds-v2-lane>header{min-height:58px;padding:12px 14px;border-bottom:1px solid #e8edf3;display:flex;align-items:center;justify-content:space-between;gap:10px}.kds-v2-lane>header>div{display:flex;align-items:center;gap:8px}.kds-v2-lane h2{margin:0;font-size:18px;color:var(--cc-ink)}.kds-station-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#f1f5f9;color:var(--cc-orange-dark);font-size:16px;font-weight:950}.kds-count{padding:5px 9px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:900}.kds-lane-scroll{height:clamp(420px,calc(100vh - 355px),690px);padding:10px;overflow-y:auto;overscroll-behavior:contain;display:grid;align-content:start;gap:9px}.kds-command-card{padding:12px;border:1px solid #f2d8bb;border-left:4px solid #f59e0b;border-radius:13px;background:#fffaf2;box-shadow:0 4px 12px rgba(15,23,42,.045);display:grid;gap:10px}.kds-command-card.kds-preparing{border-color:#f8d58a;border-left-color:#f59e0b;background:#fffbeb}.kds-command-card.kds-ready{border-color:#bde7c7;border-left-color:var(--cc-green);background:#f4fbf5}.kds-command-card.kds-overdue{border-color:#fecaca;border-left-color:var(--cc-red);background:#fff7f7}.kds-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.kds-card-top>div:first-child{display:grid;gap:3px}.kds-card-top b{font-size:14px;color:var(--cc-ink)}.kds-card-top small{font-size:11px;color:var(--cc-muted)}.kds-card-status{display:grid;justify-items:end;gap:5px;text-align:right}.kds-card-status>small{font-size:10px;font-weight:850;color:#475569}.kds-command-card .state-stamp.ATRASADA{background:#fff0f0;color:#dc2626;border:1px solid #fecaca}.kds-command-card .state-stamp.PENDIENTE{background:#fff7e6;color:#d97706;border:1px solid #fde68a}.kds-command-card .state-stamp.EN_PREPARACION{background:#fff4df;color:#ea580c;border:1px solid #fed7aa}.kds-command-card .state-stamp.LISTA{background:#eaf8ee;color:#15803d;border:1px solid #bbf7d0}.kds-items{display:grid;gap:2px;padding:7px 0;border-top:1px solid rgba(148,163,184,.22);border-bottom:1px solid rgba(148,163,184,.22)}.kds-item{min-height:28px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}.kds-item em{max-width:42%;color:var(--cc-orange-dark);font-size:11px;font-style:normal;font-weight:900;text-align:right}.kds-card-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.kds-card-actions .ri-btn{min-height:40px!important;padding:8px 10px!important;font-size:12px!important}.kds-card-actions .kds-wide-action{grid-column:1/-1}.kds-ready-notice{grid-column:1/-1;min-height:38px;padding:9px 11px;border-radius:10px;background:#eaf8ee;color:#166534;font-size:12px;font-weight:900;text-align:center}.kds-empty{min-height:220px;padding:24px;border:1px dashed #cbd5e1;border-radius:13px;color:var(--cc-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px}.kds-empty:before{content:'◇';font-size:38px;color:#94a3b8}.kds-empty b{color:#475569;font-size:14px}.kds-empty span{max-width:240px;font-size:12px}.kds-detail-dialog{width:min(620px,calc(100vw - 28px));max-height:86vh;overflow:auto;border:0!important}.kds-detail-dialog::backdrop{background:rgba(15,23,42,.38)}.kds-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.kds-detail-head h2{margin:3px 0;font-size:23px}.kds-detail-items{display:grid;gap:8px;margin:15px 0}.kds-detail-items>div{padding:11px 0;border-bottom:1px solid #eef2f7;display:grid;gap:3px}.kds-detail-items span{font-size:12px;color:var(--cc-orange-dark);font-weight:850}.state-stamp{display:inline-flex!important;align-items:center!important;min-height:28px!important;padding:5px 9px!important;border-radius:999px!important;font-size:11px!important;line-height:1.15!important;font-weight:950!important}
@media(max-width:1180px){.kds-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kds-filterbar{grid-template-columns:1fr 1fr}.kds-state-filters,.kds-search{grid-column:1/-1}.kds-v2-lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:780px){.kds-v2-header{display:grid}.kds-v2-header-right{align-items:stretch}.kds-header-actions{justify-content:flex-start}.kds-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kds-filterbar{grid-template-columns:1fr}.kds-state-filters,.kds-search{grid-column:auto}.kds-v2-lanes{grid-template-columns:1fr}.kds-lane-scroll{height:auto;max-height:640px}.kds-card-top{align-items:flex-start}}
@media(max-width:480px){.kds-kpis{grid-template-columns:1fr}.kds-kpi{min-height:78px}.kds-header-actions .ri-btn{flex:1 1 140px}.kds-state-filters{display:grid;grid-template-columns:1fr 1fr}.kds-card-actions{grid-template-columns:1fr}.kds-ready-notice,.kds-card-actions .kds-wide-action{grid-column:auto}}
@media(pointer:coarse){.kds-command-card .ri-btn,.kds-filterbar .ri-btn,.kds-filterbar .ri-select{min-height:48px!important}.kds-item{min-height:34px}}
'''
          css_path.write_text(css)

          # 4) Cache-bust canonical Restaurant assets.
          html_path = Path('src/web/restaurant.html')
          html = html_path.read_text()
          html = html.replace('/app/restaurant-control-center.css?v=workspace-v6', '/app/restaurant-control-center.css?v=workspace-v7-kds')
          html = html.replace('/app/restaurant-ui.js?v=waiter-v2', '/app/restaurant-ui.js?v=kds-v2')
          html_path.write_text(html)

          # 5) Extend existing waiter PostgreSQL smoke to verify KDS command enrichment.
          smoke_path = Path('scripts/restaurant-waiter-v2-smoke.js')
          smoke = smoke_path.read_text()
          old = """  const stamp = Date.now().toString().slice(-8);
          const table = await prisma.restaurantTable.create({
            data: {
              tenantId: demo.tenantId,
              code: `WV2-${stamp}`,
              name: `Mesa Mesero V2 ${stamp}`,
              seats: 6,
              assignedWaiterId: waiter.id
            }
          });"""
          new = """  const stamp = Date.now().toString().slice(-8);
          const admin = await prisma.user.findUnique({ where: { id: demo.users.ADMIN } });
          assert.ok(admin, 'demo admin must exist');
          const zone = await prisma.restaurantZone.create({ data: { tenantId: demo.tenantId, name: `KDS Smoke ${stamp}`, sortOrder: 999 } });
          const table = await prisma.restaurantTable.create({
            data: {
              tenantId: demo.tenantId,
              zoneId: zone.id,
              code: `WV2-${stamp}`,
              name: `Mesa Mesero V2 ${stamp}`,
              seats: 6,
              assignedWaiterId: waiter.id
            }
          });"""
          if old not in smoke:
              raise SystemExit('waiter smoke table block not found')
          smoke = smoke.replace(old, new, 1)
          marker = """  const sent = await identity.sendWaiterDraft(demo.tenantId, waiter, opened.session.id);
          assert.equal(sent.state, 'ENVIADO');
          assert.ok(sent.commands.length >= 1);
"""
          replacement = marker + """
          const kdsRows = await restaurant.listCommands(demo.tenantId, admin, { limit: 200 });
          const kdsCommand = kdsRows.find((row) => row.orderId === sent.id);
          assert.ok(kdsCommand, 'KDS must expose the waiter order command');
          assert.equal(kdsCommand.waiter?.id, waiter.id);
          assert.equal(kdsCommand.waiter?.nombre, waiter.nombre);
          assert.equal(kdsCommand.order?.session?.table?.zone?.id, zone.id);
          assert.equal(kdsCommand.order?.session?.table?.zone?.name, zone.name);
"""
          if marker not in smoke:
              raise SystemExit('waiter smoke send marker not found')
          smoke = smoke.replace(marker, replacement, 1)
          smoke = smoke.replace("    newRoundReopensService: true", "    newRoundReopensService: true,\n    kdsZoneAndWaiterContext: true")
          smoke_path.write_text(smoke)

          # 6) Update canonical operational smoke and cache-key expectations in scripts.
          for path in Path('scripts').glob('*.js'):
              text = path.read_text()
              text = text.replace('restaurant-ui\\.js\\?v=waiter-v2', 'restaurant-ui\\.js\\?v=kds-v2')
              text = text.replace('restaurant-ui.js?v=waiter-v2', 'restaurant-ui.js?v=kds-v2')
              text = text.replace('restaurant-control-center\\.css\\?v=workspace-v6', 'restaurant-control-center\\.css\\?v=workspace-v7-kds')
              text = text.replace('restaurant-control-center.css?v=workspace-v6', 'restaurant-control-center.css?v=workspace-v7-kds')
              path.write_text(text)

          op_path = Path('scripts/restaurant-control-center-operational-smoke.js')
          op = op_path.read_text()
          op = re.sub(r"  assert\.match\(shellCss, /\\\.kds-lanes\\\{\[\^\}\]\*grid-template-columns:repeat\\\(3,minmax\\\(0,1fr\\\)\\\)!important/\);", "  assert.match(shellCss, /\\.kds-v2-lanes\\{[^}]*grid-template-columns:repeat\\(3,minmax\\(0,1fr\\)\\)/);", op)
          op = re.sub(r"  assert\.match\(shellCss, /@media\\\(max-width:780px\\\)\[\\s\\S\]\*?\\\.kds-lanes\\\{grid-template-columns:1fr!important/\);", "  assert.match(shellCss, /@media\\(max-width:780px\\)[\\s\\S]*?\\.kds-v2-lanes\\{grid-template-columns:1fr\\}/);", op)
          kds_assertions = r'''

          // KDS V2: KPIs reales, filtros, sonido, fullscreen, detalle y contexto zona/mesero.
          for (const token of [
            'KDS_OVERDUE_MINUTES = 12', 'kdsFilter:', 'kdsSoundEnabled:', 'Pendientes', 'En preparación', 'Tiempo prom.',
            'data-kds-filter', 'kdsZoneFilter', 'kdsWaiterFilter', 'kdsSearch', 'Sonido ON', 'Pantalla completa',
            'kds-command-card', 'Ver detalle', 'Marcar listo', 'Mesero avisado en vivo', 'kdsDetailDialog',
            'playKdsTone', 'requestFullscreen', 'kdsZoneLabel', 'kdsWaiterLabel'
          ]) assert.ok(operationalEngine.includes(token), `KDS V2 must contain ${token}`);
          assert.match(shellCss, /\/\* KDS V2 — tablero de producción canónico, táctil y adaptable por rol\/estación\. \*\//);
          assert.match(shellCss, /\.kds-kpis\{[^}]*grid-template-columns:repeat\(5,minmax\(0,1fr\)\)/);
          assert.match(shellCss, /\.kds-v2-lanes\{[^}]*grid-template-columns:repeat\(3,minmax\(0,1fr\)\)/);
          assert.match(shellCss, /@media\(max-width:1180px\)[\s\S]*?\.kds-v2-lanes\{grid-template-columns:repeat\(2,minmax\(0,1fr\)\)\}/);
          assert.match(shellCss, /@media\(max-width:780px\)[\s\S]*?\.kds-v2-lanes\{grid-template-columns:1fr\}/);
          assert.ok(!shellCss.includes('.kds-lanes{'), 'KDS V1 lane layout must be removed from the canonical stylesheet');
'''
          marker = "  // Mesero V2: zona, mesa, cuenta conjunta/individual, personas y envío explícito a Caja."
          if marker not in op:
              raise SystemExit('operational smoke KDS insertion marker not found')
          op = op.replace(marker, kds_assertions + "\n" + marker, 1)
          op = op.replace("FLOATING NOTICES + CAJA V2 + ADAPTIVE INTERNAL UX", "FLOATING NOTICES + CAJA V2 + KDS V2 + ADAPTIVE INTERNAL UX")
          op_path.write_text(op)
          PY

          node - <<'NODE'
          const fs = require('node:fs');
          new Function(fs.readFileSync('src/web/restaurant-ui.js','utf8'));
          new Function(fs.readFileSync('scripts/restaurant-control-center-operational-smoke.js','utf8'));
          const ui=fs.readFileSync('src/web/restaurant-ui.js','utf8');
          if (/#[0-9a-fA-F]{6}/.test(ui)) throw new Error('KDS JS must not own theme hex colors');
          if (!ui.includes('KDS_OVERDUE_MINUTES = 12')) throw new Error('KDS V2 missing');
          console.log('RESTAURANT_KDS_V2_SOURCE_OK');
          NODE
          git diff --check

      - name: Commit KDS V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/restaurant/restaurant.service.js src/web/restaurant-ui.js src/web/restaurant-control-center.css src/web/restaurant.html scripts/restaurant-waiter-v2-smoke.js scripts/*.js
          git commit -m "feat(restaurante): implementar KDS V2 operativo"
          git push origin HEAD:ui/restaurant-kds-v2
