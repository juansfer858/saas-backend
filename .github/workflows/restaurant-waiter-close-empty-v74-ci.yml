name: Restaurant Waiter Close Empty V74 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/restaurant-waiter-close-empty-v74
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vantix_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run build
      - name: Validate waiter empty-opening close
        run: node scripts/restaurant-waiter-close-empty-v74-smoke.js

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact commit in production
        shell: bash
        run: |
          set -euo pipefail
          URL="https://core.vantixgc.com/api/public/runtime-info"
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
                echo "PRODUCTION_EXACT_COMMIT_OK"
                exit 0
              fi
            fi
            echo "Waiting for production commit... attempt=$attempt expected=$GITHUB_SHA"
            sleep 10
          done
          exit 1

      - name: Verify production waiter close-empty runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://core.vantixgc.com"
          curl -fsSL --max-time 15 -D /tmp/waiter.headers -o /tmp/waiter.js "$BASE/app/restaurant-waiter-runtime-v7.js"
          grep -qi '^x-vantixgc-waiter-close-empty: v74-owner-only' /tmp/waiter.headers
          grep -q 'VANTIX_WAITER_CLOSE_EMPTY_OPENING_V74' /tmp/waiter.js
          grep -q 'Cerrar mesa abierta por error' /tmp/waiter.js
          grep -q 'cancelar-apertura-v67' /tmp/waiter.js
          echo "PRODUCTION_RESTAURANT_WAITER_CLOSE_EMPTY_V74_OK"
