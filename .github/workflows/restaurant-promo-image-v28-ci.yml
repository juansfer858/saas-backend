name: Restaurant Promo Image QR V28 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-theme.service.js'
      - 'src/modules/restaurant/restaurant-menu-import.routes.js'
      - 'src/modules/restaurant/restaurant-v2-menu.public.routes.js'
      - 'src/modules/restaurant/restaurant-v2-client-qr.public.routes.js'
      - 'src/web/restaurant-promo-image-editor-v28.js'
      - 'src/web/restaurant-v2-client-promo-v28.js'
      - 'scripts/restaurant-client-spotlight-smoke.js'
      - '.github/workflows/restaurant-promo-image-v28-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-theme.service.js'
      - 'src/modules/restaurant/restaurant-menu-import.routes.js'
      - 'src/modules/restaurant/restaurant-v2-menu.public.routes.js'
      - 'src/modules/restaurant/restaurant-v2-client-qr.public.routes.js'
      - 'src/web/restaurant-promo-image-editor-v28.js'
      - 'src/web/restaurant-v2-client-promo-v28.js'
      - 'scripts/restaurant-client-spotlight-smoke.js'
      - '.github/workflows/restaurant-promo-image-v28-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EDGE_AUTH_SECRET: edge-auth-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - name: Validate Promo Image V28
        run: |
          node --check src/web/restaurant-promo-image-editor-v28.js
          node --check src/web/restaurant-v2-client-promo-v28.js
          node --check src/modules/restaurant/restaurant-theme.service.js
          node --check src/modules/restaurant/restaurant-menu-import.routes.js
          node scripts/restaurant-client-spotlight-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact V28 in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if [[ "$INFO" == *"$GITHUB_SHA"* ]]; then
              CARTA="$(curl -fsS "$BASE/app/restaurante-v2/carta")"
              EDITOR="$(curl -fsS "$BASE/app/restaurant-promo-image-editor-v28.js")"
              QRJS="$(curl -fsS "$BASE/app/restaurant-v2-client-promo-v28.js")"
              [[ "$CARTA" == *'restaurant-promo-image-editor-v28.js?v=v28'* ]]
              [[ "$EDITOR" == *'VANTIX_RESTAURANT_PROMO_IMAGE_EDITOR_V28'* ]]
              [[ "$EDITOR" == *'type="file"'* ]]
              [[ "$QRJS" == *'VANTIX_RESTAURANT_CLIENT_PROMO_POPUP_V28'* ]]
              [[ "$QRJS" == *'AGREGAR AL PEDIDO'* ]]
              [[ "$QRJS" == *'CERRAR Y VER LA CARTA'* ]]
              echo "RESTAURANT_PROMO_IMAGE_QR_V28_LIVE"
              exit 0
            fi
            sleep 10
          done
          exit 1
