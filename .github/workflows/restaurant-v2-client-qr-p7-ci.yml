name: Restaurant V2 Client QR P7 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v2-client-qr.public.routes.js'
      - 'src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js'
      - 'src/web/restaurant-v2-client-qr.*'
      - 'scripts/restaurant-v2-client-qr-p7-db-smoke.js'
      - '.github/workflows/restaurant-v2-client-qr-p7-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v2-client-qr.public.routes.js'
      - 'src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js'
      - 'src/web/restaurant-v2-client-qr.*'
      - 'scripts/restaurant-v2-client-qr-p7-db-smoke.js'
      - '.github/workflows/restaurant-v2-client-qr-p7-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESTAURANT_QR_VISIT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: vantixgc.com
      FCM_SERVICE_ACCOUNT_JSON: ''
      FCM_PROJECT_ID: ''
      FCM_CLIENT_EMAIL: ''
      FCM_PRIVATE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - run: node scripts/restaurant-v2-client-qr-p7-db-smoke.js
      - run: node --check src/modules/restaurant/restaurant-v2-client-qr.public.routes.js
      - run: node --check src/web/restaurant-v2-client-qr.js
      - run: node --check scripts/restaurant-v2-client-qr-p7-db-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact permanent QR P7 in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          PROBE="p7-contract-probe-$GITHUB_SHA"
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              H="$(mktemp)"; P="$(mktemp)"; J="$(mktemp)"; C="$(mktemp)"
              curl -fsS -D "$H" "$BASE/r/$PROBE?v=$GITHUB_SHA" -o "$P"
              curl -fsS "$BASE/app/restaurant-v2-client-qr.js?v=$GITHUB_SHA" -o "$J"
              curl -fsS "$BASE/app/restaurant-v2-client-qr.css?v=$GITHUB_SHA" -o "$C"
              grep -Fqi 'X-VantixGC-Restaurant-V2-Client-QR: p7-permanent-qr-client' "$H"
              grep -Fq 'VANTIX_RESTAURANT_V2_CLIENT_QR_P7' "$P"
              grep -Fq 'VANTIX_RESTAURANT_V2_CLIENT_QR_P7' "$J"
              grep -Fq 'VANTIX_RESTAURANT_V2_CLIENT_QR_P7' "$C"
              grep -Fq '/autorizar' "$J"
              grep -Fq '/mis-pedidos/stream' "$J"
              grep -Fq '/llamar-mesero/stream' "$J"
              grep -Fq '/visita/realtime' "$J"
              if grep -Eq 'MutationObserver|setInterval|POLL_MS' "$J"; then exit 1; fi
              echo "Restaurant Client QR V2 P7 live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
