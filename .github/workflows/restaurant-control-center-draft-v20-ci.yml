name: Restaurant Control Center Draft V20 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-table-live-detail-v67.service.js'
      - 'src/modules/restaurant/restaurant-table-live-detail-v67.routes.js'
      - 'src/web/restaurant-v2-tables.js'
      - 'src/web/restaurant-v2-tables.html'
      - 'src/web/restaurant-v2-tables.css'
      - 'scripts/restaurant-control-center-draft-v20-smoke.js'
      - '.github/workflows/restaurant-control-center-draft-v20-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-table-live-detail-v67.service.js'
      - 'src/modules/restaurant/restaurant-table-live-detail-v67.routes.js'
      - 'src/web/restaurant-v2-tables.js'
      - 'src/web/restaurant-v2-tables.html'
      - 'src/web/restaurant-v2-tables.css'
      - 'scripts/restaurant-control-center-draft-v20-smoke.js'
      - '.github/workflows/restaurant-control-center-draft-v20-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V20 syntax
        run: |
          node --check src/modules/restaurant/restaurant-table-live-detail-v67.service.js
          node --check src/modules/restaurant/restaurant-table-live-detail-v67.routes.js
          node --check src/web/restaurant-v2-tables.js
      - name: Validate Center Control draft management
        run: node scripts/restaurant-control-center-draft-v20-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact Control Center Draft V20 in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if [[ "$INFO" == *"$GITHUB_SHA"* ]]; then
              HTML="$(curl -fsS "$BASE/app/restaurante-v2/mesas")"
              JS="$(curl -fsS "$BASE/app/restaurant-v2-tables.js")"
              [[ "$HTML" == *'restaurant-v2-tables.js?v=v20'* ]]
              [[ "$JS" == *'VANTIX_RESTAURANT_CONTROL_CENTER_DRAFT_V20'* ]]
              [[ "$JS" == *'RETIRAR'* ]]
              [[ "$JS" == *'retirar-v20'* ]]
              echo "Restaurant Control Center Draft V20 live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
