name: Restaurant Company Config Control Center CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-company-config-control-center.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/web/restaurant-company-config-control-center.js'
      - 'scripts/restaurant-company-config-control-center-smoke.js'
      - '.github/workflows/restaurant-company-config-control-center-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-company-config-control-center.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/web/restaurant-company-config-control-center.js'
      - 'scripts/restaurant-company-config-control-center-smoke.js'
      - '.github/workflows/restaurant-company-config-control-center-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate syntax
        run: |
          node --check src/modules/restaurant/restaurant-company-config-control-center.public.routes.js
          node --check src/modules/restaurant/restaurant.public.routes.js
          node --check src/web/restaurant-company-config-control-center.js
          node --check scripts/restaurant-company-config-control-center-smoke.js
      - name: Validate visible Company Config composition
        run: node scripts/restaurant-company-config-control-center-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact commit in production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://core.vantixgc.com/api/public/runtime-info'
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
                echo 'PRODUCTION_EXACT_COMMIT_OK'
                exit 0
              fi
            fi
            echo "Waiting for exact production commit... attempt=$attempt expected=$GITHUB_SHA"
            sleep 10
          done
          echo "Production did not deploy commit $GITHUB_SHA in time" >&2
          exit 1

      - name: Verify Configuración avanzada composition in production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 -D /tmp/config-page.headers -o /tmp/config-page.html 'https://core.vantixgc.com/app/centro-de-control?view=config'
          grep -qi 'x-vantixgc-restaurant-company-config: v1-control-center' /tmp/config-page.headers
          grep -q 'VANTIX_RESTAURANT_COMPANY_CONFIG_CONTROL_CENTER_V1' /tmp/config-page.html
          grep -q '/app/restaurant-company-config-control-center.js?v=1' /tmp/config-page.html

          curl -fsSL --max-time 20 -D /tmp/config-js.headers -o /tmp/config.js 'https://core.vantixgc.com/app/restaurant-company-config-control-center.js?v=1'
          grep -qi 'x-vantixgc-restaurant-company-config: v1-control-center' /tmp/config-js.headers
          grep -q 'VANTIX_RESTAURANT_COMPANY_CONFIG_CONTROL_CENTER_V1' /tmp/config.js
          grep -q 'Configuración avanzada' /tmp/config.js
          grep -q 'Información de la empresa' /tmp/config.js
          grep -q '/api/v1/impresion/empresa' /tmp/config.js
          echo 'PRODUCTION_RESTAURANT_COMPANY_CONFIG_CONTROL_CENTER_OK'
