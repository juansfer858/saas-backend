name: Restaurant Company Admin Placement CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-company-admin-advanced.public.routes.js'
      - 'src/modules/restaurant/restaurant-company-config-control-center.public.routes.js'
      - 'src/modules/restaurant/restaurant-company-profile.service.js'
      - 'src/modules/restaurant/restaurant-pos-receipt-print.service.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/web/restaurant-company-admin-advanced.js'
      - 'src/web/restaurant-company-config-control-center.js'
      - 'src/web/restaurant-signup.html'
      - 'scripts/restaurant-company-config-control-center-smoke.js'
      - '.github/workflows/restaurant-company-config-control-center-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-company-admin-advanced.public.routes.js'
      - 'src/modules/restaurant/restaurant-company-config-control-center.public.routes.js'
      - 'src/modules/restaurant/restaurant-company-profile.service.js'
      - 'src/modules/restaurant/restaurant-pos-receipt-print.service.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/web/restaurant-company-admin-advanced.js'
      - 'src/web/restaurant-company-config-control-center.js'
      - 'src/web/restaurant-signup.html'
      - 'scripts/restaurant-company-config-control-center-smoke.js'
      - '.github/workflows/restaurant-company-config-control-center-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vantix_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate syntax
        run: |
          node --check src/modules/restaurant/restaurant-company-admin-advanced.public.routes.js
          node --check src/modules/restaurant/restaurant-company-profile.service.js
          node --check src/modules/restaurant/restaurant-pos-receipt-print.service.js
          node --check src/modules/restaurant/restaurant.public.routes.js
          node --check src/web/restaurant-company-admin-advanced.js
          node --check scripts/restaurant-company-config-control-center-smoke.js
      - name: Validate administrative placement, shared trial source and POS title
        run: node scripts/restaurant-company-config-control-center-smoke.js
      - name: Validate existing POS company profile contract
        run: node scripts/restaurant-company-profile-smoke.js
      - name: Validate POS receipt company identity path
        run: node scripts/restaurant-pos-receipt-v38-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact commit in production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://core.vantixgc.com/api/public/runtime-info'
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
                echo 'PRODUCTION_EXACT_COMMIT_OK'
                exit 0
              fi
            fi
            echo "Waiting for exact production commit... attempt=$attempt expected=$GITHUB_SHA"
            sleep 10
          done
          echo "Production did not deploy commit $GITHUB_SHA in time" >&2
          exit 1

      - name: Verify Empresa and POS title in Administración Configuración avanzada
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 -D /tmp/admin.headers -o /tmp/admin.html 'https://core.vantixgc.com/app/configuracion-avanzada'
          grep -qi 'x-vantixgc-restaurant-company-admin: v2-advanced' /tmp/admin.headers
          grep -q 'VANTIX_RESTAURANT_COMPANY_ADMIN_ADVANCED_V2' /tmp/admin.html
          grep -q '/app/restaurant-company-admin-advanced.js?v=2' /tmp/admin.html

          curl -fsSL --max-time 20 -D /tmp/company-js.headers -o /tmp/company-admin.js 'https://core.vantixgc.com/app/restaurant-company-admin-advanced.js?v=2'
          grep -qi 'x-vantixgc-restaurant-company-admin: v2-advanced' /tmp/company-js.headers
          grep -q 'VANTIX_RESTAURANT_COMPANY_ADMIN_ADVANCED_V3' /tmp/company-admin.js
          grep -q 'Información de la empresa' /tmp/company-admin.js
          grep -q "button.textContent = 'Empresa'" /tmp/company-admin.js
          grep -q 'prueba de 14 días' /tmp/company-admin.js
          grep -q 'Nombre del documento POS' /tmp/company-admin.js
          grep -q 'rcaReceiptTitle' /tmp/company-admin.js
          grep -q 'COMPROBANTE DE VENTA' /tmp/company-admin.js
          grep -q '/api/v1/impresion/empresa' /tmp/company-admin.js

      - name: Verify Centro de control remains operational-only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 -D /tmp/control.headers -o /tmp/control.html 'https://core.vantixgc.com/app/centro-de-control'
          if grep -q 'VANTIX_RESTAURANT_COMPANY_CONFIG_CONTROL_CENTER_V1' /tmp/control.html; then
            echo 'Legacy company configuration marker is still present in Centro de control' >&2
            exit 1
          fi
          if grep -q '/app/restaurant-company-config-control-center.js' /tmp/control.html; then
            echo 'Legacy company configuration asset is still injected in Centro de control' >&2
            exit 1
          fi
          if grep -qi 'x-vantixgc-restaurant-company-config: v1-control-center' /tmp/control.headers; then
            echo 'Legacy company configuration header is still present in Centro de control' >&2
            exit 1
          fi
          echo 'PRODUCTION_RESTAURANT_COMPANY_ADMIN_POS_TITLE_OK'
