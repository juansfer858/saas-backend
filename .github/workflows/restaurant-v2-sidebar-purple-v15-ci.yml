name: Restaurant V2 Sidebar Purple V15 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/web/restaurant-v2-native-control-p11.html'
      - 'src/web/restaurant-v2-sidebar-purple-v15.css'
      - 'src/modules/restaurant/restaurant-v1-retirement-p11.public.routes.js'
      - 'scripts/restaurant-v2-sidebar-purple-v15-smoke.js'
      - '.github/workflows/restaurant-v2-sidebar-purple-v15-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/web/restaurant-v2-native-control-p11.html'
      - 'src/web/restaurant-v2-sidebar-purple-v15.css'
      - 'src/modules/restaurant/restaurant-v1-retirement-p11.public.routes.js'
      - 'scripts/restaurant-v2-sidebar-purple-v15-smoke.js'
      - '.github/workflows/restaurant-v2-sidebar-purple-v15-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sidebar contracts
        run: node scripts/restaurant-v2-sidebar-purple-v15-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify historical Purple V15 is retained but not active under V16/V17
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if [[ "$INFO" == *"$GITHUB_SHA"* ]]; then
              SHELL="$(curl -fsS "$BASE/app/centro-de-control-v2")"
              V15="$(curl -fsS "$BASE/app/restaurant-v2-sidebar-purple-v15.css")"
              V16="$(curl -fsS "$BASE/app/restaurant-v2-sidebar-super-core-v16.css")"
              V17="$(curl -fsS "$BASE/app/restaurant-v2-sidebar-graphite-v17.css")"
              [[ "$SHELL" == *'restaurant-v2-sidebar-super-core-v16.css?v=v16'* ]]
              [[ "$SHELL" == *'restaurant-v2-sidebar-graphite-v17.css?v=v17'* ]]
              [[ "$SHELL" != *'restaurant-v2-sidebar-purple-v15.css?v=v15'* ]]
              [[ "$V15" == *'VANTIX_RESTAURANT_SIDEBAR_PURPLE_V15'* ]]
              [[ "$V15" == *'#8B5CF6'* ]]
              [[ "$V15" == *'#6D28D9'* ]]
              [[ "$V16" == *'VANTIX_RESTAURANT_SIDEBAR_SUPER_CORE_V16'* ]]
              [[ "$V17" == *'VANTIX_RESTAURANT_SIDEBAR_GRAPHITE_V17'* ]]
              echo "Restaurant Sidebar V15 historical rescue retained; V16/V17 active at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
