name: Restaurant V2 KDS Push P6 CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v2-kds*'
      - 'src/modules/restaurant/restaurant-v2-orders.routes.js'
      - 'src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js'
      - 'src/modules/realtime/tenant-realtime.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-v2-kds.*'
      - 'src/web/vantix-tenant-realtime.js'
      - 'src/modules/notifications/push-v65.*'
      - 'scripts/restaurant-v2-kds-p6-db-smoke.js'
      - 'scripts/restaurant-v2-kds-order-cancel-v98-db-smoke.js'
      - '.github/workflows/restaurant-v2-kds-p6-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v2-kds*'
      - 'src/modules/restaurant/restaurant-v2-orders.routes.js'
      - 'src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js'
      - 'src/modules/realtime/tenant-realtime.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-v2-kds.*'
      - 'src/web/vantix-tenant-realtime.js'
      - 'src/modules/notifications/push-v65.*'
      - 'scripts/restaurant-v2-kds-p6-db-smoke.js'
      - 'scripts/restaurant-v2-kds-order-cancel-v98-db-smoke.js'
      - '.github/workflows/restaurant-v2-kds-p6-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESTAURANT_QR_VISIT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: vantixgc.com
      FCM_SERVICE_ACCOUNT_JSON: ''
      FCM_PROJECT_ID: ''
      FCM_CLIENT_EMAIL: ''
      FCM_PRIVATE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - run: node scripts/restaurant-v2-kds-p6-db-smoke.js
      - run: node scripts/restaurant-v2-kds-order-cancel-v98-db-smoke.js
      - run: node --check src/modules/restaurant/restaurant-v2-kds.service.js
      - run: node --check src/modules/restaurant/restaurant-v2-kds-push.service.js
      - run: node --check src/modules/restaurant/restaurant-v2-kds.routes.js
      - run: node --check src/modules/restaurant/restaurant-v2-kds.public.routes.js
      - run: node --check src/web/restaurant-v2-kds.js
  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact KDS V2 P6 + Cancel V98 in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              H="$(mktemp)"; P="$(mktemp)"; J="$(mktemp)"; C="$(mktemp)"; R="$(mktemp)"
              curl -fsS -D "$H" "$BASE/app/restaurante-v2/kds?v=$GITHUB_SHA" -o "$P"
              curl -fsS "$BASE/app/restaurant-v2-kds.js?v=$GITHUB_SHA" -o "$J"
              curl -fsS "$BASE/app/restaurant-v2-kds.css?v=$GITHUB_SHA" -o "$C"
              curl -fsS "$BASE/app/restaurant-v2-realtime.js?v=$GITHUB_SHA" -o "$R"
              grep -Fqi 'X-VantixGC-Restaurant-V2-KDS: p6-kds-realtime-push' "$H"
              grep -Fq 'COCINA/KDS/PUSH P6' "$P"
              grep -Fq 'VANTIX_RESTAURANT_V2_KDS_P6' "$J"
              grep -Fq 'VANTIX_RESTAURANT_V2_KDS_P6' "$C"
              grep -Fq 'VANTIX_RESTAURANT_V2_KDS_ORDER_CANCEL_V98' "$J"
              grep -Fq 'VANTIX_RESTAURANT_V2_KDS_ORDER_CANCEL_V98' "$C"
              grep -Fq 'vantix:tenant-realtime' "$J"
              grep -Fq 'transport:'"'"'SSE+PG_NOTIFY'"'"'' "$R"
              grep -Fq 'restaurant-push-v65.js' "$P"
              echo "KDS V2 P6 + Cancel V98 live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
