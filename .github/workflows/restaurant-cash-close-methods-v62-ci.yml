name: Restaurant Cash Close Methods V62 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-cash-close-methods-v62.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'scripts/restaurant-cash-close-methods-v62-smoke.js'
      - '.github/workflows/restaurant-cash-close-methods-v62-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-cash-close-methods-v62.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'scripts/restaurant-cash-close-methods-v62-smoke.js'
      - '.github/workflows/restaurant-cash-close-methods-v62-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Validate exact payment-method breakdown
        run: node scripts/restaurant-cash-close-methods-v62-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait exact V62 commit and cash-close surface in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              HDR="$(mktemp)"
              JS="$(mktemp)"
              if curl -fsS -D "$HDR" "$BASE/app/restaurant-ui.js?v=cash-close-methods-v62-$GITHUB_SHA" -o "$JS" \
                && grep -Fqi 'X-VantixGC-Restaurant-Cash-Close-Methods: v62-transfer-card-exact' "$HDR" \
                && grep -Fq 'VANTIX_RESTAURANT_CASH_CLOSE_METHODS_V62' "$JS" \
                && grep -Fq 'Transferencias / QR' "$JS" \
                && grep -Fq 'Tarjetas' "$JS" \
                && grep -Fq 'VANTIX_RESTAURANT_CASH_CLOSE_BREAKDOWN_V45' "$JS"; then
                echo "V62 exact commit and cash-close payment-method surface are live: $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "V62 did not become live for exact commit $GITHUB_SHA" >&2
          exit 1
