name: Restaurant Business Audit C85 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-business-audit-c85.service.js'
      - 'src/middleware/restaurant-business-audit-c85.js'
      - 'src/modules/restaurant/restaurant-audit-log-c84.service.js'
      - 'src/web/restaurant-audit-log-c84.js'
      - 'src/routes/core.routes.js'
      - 'scripts/restaurant-business-audit-c85-smoke.js'
      - '.github/workflows/restaurant-business-audit-c85-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-business-audit-c85.service.js'
      - 'src/middleware/restaurant-business-audit-c85.js'
      - 'src/modules/restaurant/restaurant-audit-log-c84.service.js'
      - 'src/web/restaurant-audit-log-c84.js'
      - 'src/routes/core.routes.js'
      - 'scripts/restaurant-business-audit-c85-smoke.js'
      - '.github/workflows/restaurant-business-audit-c85-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate C85 syntax
        run: |
          node --check src/modules/restaurant/restaurant-business-audit-c85.service.js
          node --check src/middleware/restaurant-business-audit-c85.js
          node --check src/modules/restaurant/restaurant-audit-log-c84.service.js
          node --check src/web/restaurant-audit-log-c84.js
          node --check src/routes/core.routes.js
      - name: Validate central business audit contract
        run: node scripts/restaurant-business-audit-c85-smoke.js
      - name: Validate existing persistent audit contract
        run: node scripts/restaurant-audit-log-c84-smoke.js
      - name: Load application graph
        run: node -e "require('./src/app')"

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact commit and C85 audit surface in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              JS="$(curl -fsS "$BASE/app/restaurant-audit-log-c84.js?v=c85-$GITHUB_SHA" 2>/dev/null || true)"
              if echo "$JS" | grep -Fq 'VANTIX_RESTAURANT_BUSINESS_AUDIT_C85' \
                && echo "$JS" | grep -Fq 'No registra clics, consultas ni eventos técnicos repetitivos'; then
                echo "C85 business audit is live for exact commit $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "C85 did not become live for exact commit $GITHUB_SHA" >&2
          exit 1
