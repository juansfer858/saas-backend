name: Restaurant V2 No Code Multi Device V11 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v2-qr-no-code.service.js'
      - 'src/modules/restaurant/restaurant-visit.public.routes.js'
      - 'src/modules/restaurant/restaurant-waiter-device.service.js'
      - 'src/web/restaurant-v2-client-qr-open-request.js'
      - 'src/web/restaurant-v2-client-qr.html'
      - 'src/web/restaurant-waiter-pair.html'
      - 'src/web/restaurant-waiter-device-admin.js'
      - 'scripts/restaurant-v2-no-code-multidevice-v11-db-smoke.js'
      - '.github/workflows/restaurant-v2-no-code-multidevice-v11-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v2-qr-no-code.service.js'
      - 'src/modules/restaurant/restaurant-visit.public.routes.js'
      - 'src/modules/restaurant/restaurant-waiter-device.service.js'
      - 'src/web/restaurant-v2-client-qr-open-request.js'
      - 'src/web/restaurant-v2-client-qr.html'
      - 'src/web/restaurant-waiter-pair.html'
      - 'src/web/restaurant-waiter-device-admin.js'
      - 'scripts/restaurant-v2-no-code-multidevice-v11-db-smoke.js'
      - '.github/workflows/restaurant-v2-no-code-multidevice-v11-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESTAURANT_DEVICE_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESTAURANT_QR_VISIT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: vantixgc.com
      FCM_SERVICE_ACCOUNT_JSON: ''
      FCM_PROJECT_ID: ''
      FCM_CLIENT_EMAIL: ''
      FCM_PRIVATE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - run: node scripts/restaurant-v2-no-code-multidevice-v11-db-smoke.js
      - run: node --check src/modules/restaurant/restaurant-v2-qr-no-code.service.js
      - run: node --check src/modules/restaurant/restaurant-visit.public.routes.js
      - run: node --check src/modules/restaurant/restaurant-waiter-device.service.js
      - run: node --check src/web/restaurant-v2-client-qr-open-request.js
      - run: node --check src/web/restaurant-waiter-device-admin.js
      - run: node --check scripts/restaurant-v2-no-code-multidevice-v11-db-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact V11 no-code and reusable waiter QR in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              ADDON="$(mktemp)"; PAGE="$(mktemp)"; PAIR="$(mktemp)"; ADMIN="$(mktemp)"; BODY="$(mktemp)"
              curl -fsS "$BASE/app/restaurant-v2-client-qr-open-request.js?v=$GITHUB_SHA" -o "$ADDON"
              curl -fsS "$BASE/r/v11-contract-probe-$GITHUB_SHA" -o "$PAGE"
              curl -fsS "$BASE/app/centro-de-control/conectar?t=v11-contract-probe" -o "$PAIR"
              curl -fsS "$BASE/app/restaurant-waiter-device-admin.js?v=$GITHUB_SHA" -o "$ADMIN"
              grep -Fq 'VANTIX_RESTAURANT_V2_QR_NO_CODE_V11' "$ADDON"
              grep -Fq '/iniciar-visita' "$ADDON"
              grep -Fq 'visibleAccessCode:false' "$ADDON"
              if grep -Fq '/autorizar' "$ADDON"; then exit 1; fi
              grep -Fq 'VANTIX_RESTAURANT_V2_QR_NO_CODE_V11' "$PAGE"
              grep -Fq 'varias tablets' "$PAIR"
              grep -Fq 'QR reutilizable' "$ADMIN"
              STATUS="$(curl -sS -o "$BODY" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"seatNumber":1}' "$BASE/api/public/restaurante/qr/v11-contract-probe-$GITHUB_SHA/iniciar-visita")"
              test "$STATUS" = '404'
              grep -Fq 'RESTAURANT_QR_NOT_FOUND' "$BODY"
              echo "Restaurant V2 No Code Multi Device V11 live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
