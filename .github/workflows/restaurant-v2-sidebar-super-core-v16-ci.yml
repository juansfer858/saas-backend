name: Restaurant V2 Sidebar Super Core V16 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/web/restaurant-v2-native-control-p11.html'
      - 'src/web/restaurant-v2-sidebar-super-core-v16.css'
      - 'src/modules/restaurant/restaurant-v1-retirement-p11.public.routes.js'
      - 'scripts/restaurant-v2-sidebar-super-core-v16-smoke.js'
      - '.github/workflows/restaurant-v2-sidebar-super-core-v16-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/web/restaurant-v2-native-control-p11.html'
      - 'src/web/restaurant-v2-sidebar-super-core-v16.css'
      - 'src/modules/restaurant/restaurant-v1-retirement-p11.public.routes.js'
      - 'scripts/restaurant-v2-sidebar-super-core-v16-smoke.js'
      - '.github/workflows/restaurant-v2-sidebar-super-core-v16-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Super Core sidebar parity
        run: node scripts/restaurant-v2-sidebar-super-core-v16-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact Super Core sidebar V16 in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if [[ "$INFO" == *"$GITHUB_SHA"* ]]; then
              SHELL="$(curl -fsS "$BASE/app/centro-de-control-v2")"
              CSS="$(curl -fsS "$BASE/app/restaurant-v2-sidebar-super-core-v16.css")"
              [[ "$SHELL" == *'restaurant-v2-sidebar-super-core-v16.css?v=v16'* ]]
              [[ "$SHELL" != *'restaurant-v2-sidebar-purple-v15.css'* ]]
              [[ "$CSS" == *'VANTIX_RESTAURANT_V2_SIDEBAR_SUPER_CORE_V16'* ]]
              [[ "$CSS" == *'--restaurant-sidebar-bg:#10241b'* ]]
              [[ "$CSS" == *'--restaurant-sidebar-active:#173429'* ]]
              [[ "$CSS" == *'--restaurant-sidebar-text:#d9e6e0'* ]]
              echo "Restaurant V2 Super Core sidebar V16 live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
