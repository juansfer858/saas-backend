name: Restaurant Unified POS Number V104 Invariants CI

on:
  pull_request:
    paths:
      - 'src/modules/restaurant/restaurant-pos-number.service.js'
      - 'src/modules/restaurant/restaurant-pos-operational-mode.js'
      - 'scripts/restaurant-unified-pos-number-v104-invariants.js'
      - '.github/workflows/restaurant-unified-pos-number-v104-invariants-ci.yml'
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restaurant-unified-pos-number-v104-invariants.js
