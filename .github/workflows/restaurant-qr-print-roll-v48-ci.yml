name: Restaurant QR Print Roll V48 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-qr-print-roll-v48.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'scripts/restaurant-qr-print-roll-v48-smoke.js'
      - '.github/workflows/restaurant-qr-print-roll-v48-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-qr-print-roll-v48.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'scripts/restaurant-qr-print-roll-v48-smoke.js'
      - '.github/workflows/restaurant-qr-print-roll-v48-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check src/modules/restaurant/restaurant-qr-print-roll-v48.public.routes.js
          node --check src/modules/restaurant/restaurant.public.routes.js
          node --check scripts/restaurant-qr-print-roll-v48-smoke.js
      - name: Validate Epson roll layout contract
        run: node scripts/restaurant-qr-print-roll-v48-smoke.js

  verify-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact commit in production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://core.vantixgc.com/api/public/runtime-info'
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
                echo PRODUCTION_EXACT_COMMIT_OK
                exit 0
              fi
            fi
            echo "Waiting for production commit $GITHUB_SHA attempt=$attempt"
            sleep 10
          done
          exit 1
      - name: Verify QR roll CSS in production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 -D /tmp/qr-roll.headers -o /tmp/qr-roll.css 'https://core.vantixgc.com/app/restaurant-control-center.css?v=qr-roll-v48'
          grep -qi '^X-VantixGC-QR-Print-Roll: v48-full-width' /tmp/qr-roll.headers
          grep -q 'VANTIX_QR_PRINT_ROLL_V48' /tmp/qr-roll.css
          grep -q 'page-break-after:always' /tmp/qr-roll.css
          grep -q 'width:56mm' /tmp/qr-roll.css
          echo PRODUCTION_QR_PRINT_ROLL_V48_OK
