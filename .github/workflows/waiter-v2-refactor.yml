name: Apply Waiter V2 Refactor

on:
  push:
    branches:
      - feature/restaurant-waiter-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/restaurant-waiter-v2
          fetch-depth: 0

      - name: Apply canonical Waiter V2 refactor
        run: node scripts/apply-waiter-v2-refactor.js

      - name: Commit final product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(restaurante): completar Mesero V2 operativo"
          git push origin HEAD:feature/restaurant-waiter-v2
