name: Temporary Exact Production Revision Probe

on:
  push:
    branches:
      - diag-menu-ocr-deploy-20260828

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Centro de control Mesero revision
        run: |
          set -euo pipefail
          EXPECTED='deb7da805940d0d44615c8a1b0b9f76c1d6668f6'
          for attempt in $(seq 1 60); do
            info_code=$(curl -sS --max-time 12 -o /tmp/runtime.json -w '%{http_code}' https://core.vantixgc.com/api/public/runtime-info || true)
            ready_code=$(curl -sS --max-time 12 -o /tmp/ready.json -w '%{http_code}' https://core.vantixgc.com/readyz || true)
            admin_code=$(curl -sS --max-time 12 -o /tmp/admin.js -w '%{http_code}' https://core.vantixgc.com/app/restaurant-waiter-device-admin.js || true)
            current=$(python - <<'PY'
          import json
          try:
              print(json.load(open('/tmp/runtime.json')).get('data',{}).get('commit',''))
          except Exception:
              print('')
          PY
            )
            echo "attempt=$attempt runtime=$info_code ready=$ready_code admin=$admin_code commit=$current"
            if [ "$info_code" = '200' ] && [ "$ready_code" = '200' ] && [ "$admin_code" = '200' ] && [ "$current" = "$EXPECTED" ] && grep -q '"phase":"READY"' /tmp/runtime.json && grep -q '"database":"OK"' /tmp/ready.json && grep -q 'normalizePrimaryCenterAction' /tmp/admin.js && grep -q "button.dataset.ccTab = 'mesero'" /tmp/admin.js && grep -q "button.textContent = '👤 Mesero'" /tmp/admin.js && grep -q 'Conectar tablet o celular' /tmp/admin.js; then
              cat /tmp/runtime.json
              echo
              cat /tmp/ready.json
              echo
              grep -E "normalizePrimaryCenterAction|dataset.ccTab = 'mesero'|textContent = '👤 Mesero'" /tmp/admin.js
              echo 'PRODUCTION_CONTROL_CENTER_MESERO_OK'
              exit 0
            fi
            sleep 5
          done
          echo 'Expected Centro de control Mesero revision did not become live in time' >&2
          cat /tmp/runtime.json 2>/dev/null || true
          cat /tmp/ready.json 2>/dev/null || true
          exit 1
