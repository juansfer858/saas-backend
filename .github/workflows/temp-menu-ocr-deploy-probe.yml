name: Temporary Exact Production Revision Probe

on:
  push:
    branches:
      - diag-menu-ocr-deploy-20260828

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Restaurant rail without Estado
        run: |
          set -euo pipefail
          EXPECTED='d437ba82c0d984f667cf7d0810bac7fa5295fb35'
          for attempt in $(seq 1 60); do
            info_code=$(curl -sS --max-time 12 -o /tmp/runtime.json -w '%{http_code}' https://core.vantixgc.com/api/public/runtime-info || true)
            ready_code=$(curl -sS --max-time 12 -o /tmp/ready.json -w '%{http_code}' https://core.vantixgc.com/readyz || true)
            ui_code=$(curl -sS --max-time 12 -o /tmp/restaurant-ui.js -w '%{http_code}' https://core.vantixgc.com/app/restaurant-ui.js || true)
            current=$(python - <<'PY'
          import json
          try:
              print(json.load(open('/tmp/runtime.json')).get('data',{}).get('commit',''))
          except Exception:
              print('')
          PY
            )
            echo "attempt=$attempt runtime=$info_code ready=$ready_code ui=$ui_code commit=$current"
            if [ "$info_code" = '200' ] && [ "$ready_code" = '200' ] && [ "$ui_code" = '200' ] && [ "$current" = "$EXPECTED" ] && grep -q '"phase":"READY"' /tmp/runtime.json && grep -q '"database":"OK"' /tmp/ready.json && grep -q "id:'salon', kicker:'01', label:'Mesas'" /tmp/restaurant-ui.js && grep -q "id:'caja', kicker:'04', label:'Caja'" /tmp/restaurant-ui.js && ! grep -q "id:'estado', kicker:'05'" /tmp/restaurant-ui.js; then
              cat /tmp/runtime.json
              echo
              cat /tmp/ready.json
              echo
              grep -F "id:'caja', kicker:'04', label:'Caja'" /tmp/restaurant-ui.js
              echo 'PRODUCTION_RESTAURANT_ESTADO_RAIL_REMOVED_OK'
              exit 0
            fi
            sleep 5
          done
          echo 'Expected Restaurant rail without Estado did not become live in time' >&2
          cat /tmp/runtime.json 2>/dev/null || true
          cat /tmp/ready.json 2>/dev/null || true
          exit 1
