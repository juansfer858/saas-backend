name: Temporary Exact Production Revision Probe

on:
  push:
    branches:
      - diag-menu-ocr-deploy-20260828

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Estado label production revision
        run: |
          set -euo pipefail
          EXPECTED='e848315db2d25c2d0d630002b407f92640500da6'
          for attempt in $(seq 1 60); do
            info_code=$(curl -sS --max-time 12 -o /tmp/runtime.json -w '%{http_code}' https://core.vantixgc.com/api/public/runtime-info || true)
            ready_code=$(curl -sS --max-time 12 -o /tmp/ready.json -w '%{http_code}' https://core.vantixgc.com/readyz || true)
            ui_code=$(curl -sS --max-time 12 -o /tmp/restaurant-ui.js -w '%{http_code}' https://core.vantixgc.com/app/restaurant-ui.js || true)
            center_code=$(curl -sS --max-time 12 -o /tmp/control-center.js -w '%{http_code}' https://core.vantixgc.com/app/restaurant-control-center.js || true)
            current=$(python - <<'PY'
          import json
          try:
              print(json.load(open('/tmp/runtime.json')).get('data',{}).get('commit',''))
          except Exception:
              print('')
          PY
            )
            echo "attempt=$attempt runtime=$info_code ready=$ready_code ui=$ui_code center=$center_code commit=$current"
            if [ "$info_code" = '200' ] && [ "$ready_code" = '200' ] && [ "$ui_code" = '200' ] && [ "$center_code" = '200' ] && [ "$current" = "$EXPECTED" ] && grep -q '"phase":"READY"' /tmp/runtime.json && grep -q '"database":"OK"' /tmp/ready.json && grep -q "id:'estado', kicker:'05', label:'Estado'" /tmp/restaurant-ui.js && ! grep -q 'Tema / Estado' /tmp/restaurant-ui.js && grep -q "estado:'Estado'" /tmp/control-center.js && ! grep -q 'Tema / Estado' /tmp/control-center.js; then
              cat /tmp/runtime.json
              echo
              cat /tmp/ready.json
              echo
              grep -F "id:'estado', kicker:'05', label:'Estado'" /tmp/restaurant-ui.js
              grep -F "estado:'Estado'" /tmp/control-center.js
              echo 'PRODUCTION_RESTAURANT_ESTADO_LABEL_OK'
              exit 0
            fi
            sleep 5
          done
          echo 'Expected Estado label revision did not become live in time' >&2
          cat /tmp/runtime.json 2>/dev/null || true
          cat /tmp/ready.json 2>/dev/null || true
          exit 1
