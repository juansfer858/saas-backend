name: Restaurant Payment Methods CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/restaurant-payment-methods-cash-report
      - hotfix/restaurant-control-center-timeout

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EDGE_AUTH_SECRET: edge-auth-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_EXPIRES_IN: 8h
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run build
      - name: Sync database
        run: npx prisma db push
      - name: Validate configurable payment methods and cash close report
        run: node scripts/restaurant-payment-methods-smoke.js
      - name: Validate Centro de control resilience against stalled Restaurant API
        run: node scripts/restaurant-control-center-resilience-smoke.js
