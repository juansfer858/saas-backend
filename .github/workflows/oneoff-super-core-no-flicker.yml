name: One-off Super Core no flicker patch

on:
  push:
    branches:
      - feature/super-core-no-flicker-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/super-core-no-flicker-v1
          fetch-depth: 0
      - name: Apply static first-paint theme patch
        run: python scripts/oneoff-super-core-no-flicker.py
      - name: Commit first-paint fix and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/oneoff-super-core-no-flicker.yml
          rm scripts/oneoff-super-core-no-flicker.py
          git config user.name "vantixgc-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Render Super Core V6 styles before first paint"
          git push origin HEAD:feature/super-core-no-flicker-v1
