name: Temporary Estado Test Patch

on:
  push:
    branches:
      - fix/restaurant-estado-label

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restaurant-estado-label
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Actualizar expectativa del smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/restaurant-control-center-operational-smoke.js')
          text = path.read_text(encoding='utf-8')
          old = "estado:'Tema / Estado'"
          new = "estado:'Estado'"
          if old not in text:
              raise SystemExit(f'No se encontró {old!r}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/temp-estado-test-patch.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add scripts/restaurant-control-center-operational-smoke.js .github/workflows/temp-estado-test-patch.yml
          git commit -m "test(restaurante): esperar etiqueta Estado"
          git push origin HEAD:fix/restaurant-estado-label
