name: Restaurant Table Enable V56 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-table-enable-v56.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/web/restaurant-qr-ui.js'
      - 'scripts/restaurant-table-enable-v56-smoke.js'
      - '.github/workflows/restaurant-table-enable-v56-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-table-enable-v56.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/web/restaurant-qr-ui.js'
      - 'scripts/restaurant-table-enable-v56-smoke.js'
      - '.github/workflows/restaurant-table-enable-v56-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Syntax check V56
        run: node --check src/modules/restaurant/restaurant-table-enable-v56.public.routes.js
      - name: Validate order-first table enable semantics
        run: node scripts/restaurant-table-enable-v56-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait exact V56 commit and QR browser asset in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              HDR="$(mktemp)"
              JS="$(mktemp)"
              if curl -fsS -D "$HDR" "$BASE/app/restaurant-qr-ui.js?v=table-enable-v56-$GITHUB_SHA" -o "$JS" \
                && grep -Fqi 'X-VantixGC-Table-Enable: v56-order-first' "$HDR" \
                && grep -Fq 'VANTIX_RESTAURANT_TABLE_ENABLE_V56' "$JS" \
                && grep -Fq 'menuWhileClosed:true' "$JS" \
                && grep -Fq 'requestOnlyOnConfirm:true' "$JS" \
                && grep -Fq 'LA MESA SE HABILITA AL ENVIAR' "$JS"; then
                echo "V56 exact commit and QR order-first asset are live: $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "V56 did not become live for exact commit $GITHUB_SHA" >&2
          exit 1
