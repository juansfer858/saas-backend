name: Restaurant Shift Closures C86 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-shift-close-v111.service.js'
      - 'src/modules/restaurant/restaurant.service.js'
      - 'src/modules/restaurant/restaurant-identity.service.js'
      - 'src/modules/restaurant/restaurant-v2-cash.service.js'
      - 'src/modules/treasury/treasury.service.js'
      - 'src/modules/restaurant/restaurant-v2-table-move.service.js'
      - 'src/modules/restaurant/restaurant-delivery.service.js'
      - 'scripts/restaurant-shift-close-v111-db-smoke.js'
      - 'src/modules/restaurant/restaurant-cash-close-summary.service.js'
      - 'scripts/restaurant-cash-close-receipt-c82-smoke.js'
      - 'src/modules/restaurant/restaurant-shift-complete-report.service.js'
      - 'src/modules/restaurant/restaurant-pos-receipt-print.service.js'
      - 'src/modules/restaurant/restaurant-shift-close-history-c86.service.js'
      - 'src/modules/restaurant/restaurant-shift-close-history-c86.runtime.js'
      - 'src/modules/restaurant/restaurant-shift-close-history-c86.routes.js'
      - 'src/modules/restaurant/restaurant-v2-cash.routes.js'
      - 'src/modules/restaurant/restaurant-v2-cash.public.routes.js'
      - 'src/web/restaurant-shift-close-c86.css'
      - 'src/web/restaurant-shift-close-c86-cash.js'
      - 'src/web/restaurant-shift-closures-c86.html'
      - 'src/web/restaurant-v2-native-control-p11.js'
      - 'src/web/restaurant-shift-closures-c86.css'
      - 'src/web/restaurant-shift-closures-c86.js'
      - 'src/web/restaurant-shift-closures-c86-dashboard.js'
      - 'scripts/restaurant-shift-closures-c86-smoke.js'
      - 'scripts/restaurant-shift-closures-c86-db-smoke.js'
      - 'scripts/restaurant-close-delivery-payment-v127-db-smoke.js'
      - '.github/workflows/restaurant-shift-closures-c86-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-shift-close-v111.service.js'
      - 'src/modules/restaurant/restaurant.service.js'
      - 'src/modules/restaurant/restaurant-identity.service.js'
      - 'src/modules/restaurant/restaurant-v2-cash.service.js'
      - 'src/modules/treasury/treasury.service.js'
      - 'src/modules/restaurant/restaurant-v2-table-move.service.js'
      - 'src/modules/restaurant/restaurant-delivery.service.js'
      - 'scripts/restaurant-shift-close-v111-db-smoke.js'
      - 'src/modules/restaurant/restaurant-cash-close-summary.service.js'
      - 'scripts/restaurant-cash-close-receipt-c82-smoke.js'
      - 'src/modules/restaurant/restaurant-shift-complete-report.service.js'
      - 'src/modules/restaurant/restaurant-pos-receipt-print.service.js'
      - 'src/modules/restaurant/restaurant-shift-close-history-c86.service.js'
      - 'src/modules/restaurant/restaurant-shift-close-history-c86.runtime.js'
      - 'src/modules/restaurant/restaurant-shift-close-history-c86.routes.js'
      - 'src/modules/restaurant/restaurant-v2-cash.routes.js'
      - 'src/modules/restaurant/restaurant-v2-cash.public.routes.js'
      - 'src/web/restaurant-shift-close-c86.css'
      - 'src/web/restaurant-shift-close-c86-cash.js'
      - 'src/web/restaurant-shift-closures-c86.html'
      - 'src/web/restaurant-v2-native-control-p11.js'
      - 'src/web/restaurant-shift-closures-c86.css'
      - 'src/web/restaurant-shift-closures-c86.js'
      - 'src/web/restaurant-shift-closures-c86-dashboard.js'
      - 'scripts/restaurant-shift-closures-c86-smoke.js'
      - 'scripts/restaurant-shift-closures-c86-db-smoke.js'
      - 'scripts/restaurant-close-delivery-payment-v127-db-smoke.js'
      - '.github/workflows/restaurant-shift-closures-c86-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESTAURANT_QR_VISIT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - name: Validate C86 syntax
        run: |
          node --check src/modules/restaurant/restaurant-shift-close-history-c86.service.js
          node --check src/modules/restaurant/restaurant-shift-close-history-c86.runtime.js
          node --check src/modules/restaurant/restaurant-shift-close-history-c86.routes.js
          node --check src/modules/restaurant/restaurant-v2-cash.routes.js
          node --check src/modules/restaurant/restaurant-v2-cash.public.routes.js
          node --check src/web/restaurant-shift-close-c86-cash.js
          node --check src/web/restaurant-v2-native-control-p11.js
          node --check src/web/restaurant-shift-closures-c86.js
          node --check src/web/restaurant-shift-closures-c86-dashboard.js
          node --check scripts/restaurant-shift-closures-c86-db-smoke.js
          node --check scripts/restaurant-close-delivery-payment-v127-db-smoke.js
      - name: Validate C86 close/history contract
        run: node scripts/restaurant-shift-closures-c86-smoke.js
      - name: Validate bounded receipt summary for 58 and 80 mm
        run: node scripts/restaurant-cash-close-receipt-c82-smoke.js
      - name: Validate C86 with PostgreSQL real
        run: node scripts/restaurant-shift-closures-c86-db-smoke.js
      - name: Validate V127 delivery payment reconciliation with PostgreSQL real
        run: node scripts/restaurant-close-delivery-payment-v127-db-smoke.js
      - name: Validate V111 atomic operational closure and concurrent sender
        run: node scripts/restaurant-shift-close-v111-db-smoke.js
      - name: Validate Caja P4 existing source graph
        run: node -e "require('./src/modules/restaurant/restaurant-v2-cash.routes')"
      - name: Load application graph
        run: node -e "require('./src/app')"

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for exact C86 commit in production
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              HISTORY="$(curl -fsS "$BASE/app/restaurant-shift-closures-c86.js?v=86-$GITHUB_SHA" 2>/dev/null || true)"
              CASH="$(curl -fsS "$BASE/app/restaurant-shift-close-c86-cash.js?v=86-$GITHUB_SHA" 2>/dev/null || true)"
              DASH="$(curl -fsS "$BASE/app/restaurant-shift-closures-c86-dashboard.js?v=86-$GITHUB_SHA" 2>/dev/null || true)"
              NAV="$(curl -fsS "$BASE/app/restaurant-v2-native-control-p11.js?v=$GITHUB_SHA" 2>/dev/null || true)"
              if [[ "$NAV" == *"Historial de cierres"* ]] && echo "$HISTORY" | grep -Fq 'VANTIX_RESTAURANT_CASH_CLOSE_SUMMARY_V110' \
                && echo "$CASH" | grep -Fq 'VANTIX_RESTAURANT_SHIFT_CLOSE_ALL_TABLES_V111' \
                && echo "$DASH" | grep -Fq 'VANTIX_RESTAURANT_SHIFT_CLOSURES_C86_DASHBOARD'; then
                echo "C86 closures are live for exact commit $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "C86 did not become live for exact commit $GITHUB_SHA" >&2
          exit 1
