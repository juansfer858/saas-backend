name: Restaurant V2 Cash Tender V18 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/web/restaurant-v2-cash-tender-v18.js'
      - 'src/web/restaurant-v2-cash.html'
      - 'src/web/restaurant-v2-split.html'
      - 'src/modules/restaurant/restaurant-customer-display-name.js'
      - 'src/modules/restaurant/restaurant-customer-display-name.service.js'
      - 'src/modules/restaurant/restaurant-v2-cash.routes.js'
      - 'src/modules/restaurant/restaurant-pos-receipt-layout.service.js'
      - 'src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js'
      - 'scripts/restaurant-v2-cash-tender-v18-smoke.js'
      - '.github/workflows/restaurant-v2-cash-tender-v18-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/web/restaurant-v2-cash-tender-v18.js'
      - 'src/web/restaurant-v2-cash.html'
      - 'src/web/restaurant-v2-split.html'
      - 'src/modules/restaurant/restaurant-customer-display-name.js'
      - 'src/modules/restaurant/restaurant-customer-display-name.service.js'
      - 'src/modules/restaurant/restaurant-v2-cash.routes.js'
      - 'src/modules/restaurant/restaurant-pos-receipt-layout.service.js'
      - 'src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js'
      - 'scripts/restaurant-v2-cash-tender-v18-smoke.js'
      - '.github/workflows/restaurant-v2-cash-tender-v18-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V18 syntax
        run: |
          node --check src/web/restaurant-v2-cash-tender-v18.js
          node --check src/modules/restaurant/restaurant-customer-display-name.js
          node --check src/modules/restaurant/restaurant-customer-display-name.service.js
          node --check src/modules/restaurant/restaurant-v2-cash.routes.js
          node --check src/modules/restaurant/restaurant-pos-receipt-layout.service.js
      - name: Validate customer and cash change contracts
        run: node scripts/restaurant-v2-cash-tender-v18-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact Cash Tender V18 in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if [[ "$INFO" == *"$GITHUB_SHA"* ]]; then
              CASH="$(curl -fsS "$BASE/app/restaurante-v2/caja")"
              SPLIT="$(curl -fsS "$BASE/app/restaurante-v2/division")"
              ASSET="$(curl -fsS "$BASE/app/restaurant-v2-cash-tender-v18.js")"
              [[ "$CASH" == *'restaurant-v2-cash-tender-v18.js?v=v18'* ]]
              [[ "$SPLIT" == *'restaurant-v2-cash-tender-v18.js?v=v18'* ]]
              [[ "$ASSET" == *'VANTIX_RESTAURANT_V2_CASH_TENDER_V18'* ]]
              [[ "$ASSET" == *'Cliente genérico'* ]]
              [[ "$ASSET" == *'Efectivo recibido'* ]]
              [[ "$ASSET" == *'Devolución'* ]]
              echo "Restaurant V2 Cash Tender V18 live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
