name: Apply Restaurant KDS V2 Runner

on:
  push:
    branches:
      - 'ui/restaurant-kds-v2'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/restaurant-kds-v2
          fetch-depth: 0
      - name: Apply saved KDS V2 script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('.github/workflows/apply-restaurant-kds-v2.yml').read_text()
          match = re.search(r"          python3 - <<'PY'\n(.*?)\n          PY\n", source, re.S)
          if not match:
              raise SystemExit('saved KDS application script not found')
          lines = match.group(1).splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'apply-kds-v2', 'exec'))
          PY
          node - <<'NODE'
          const fs=require('node:fs');
          new Function(fs.readFileSync('src/web/restaurant-ui.js','utf8'));
          new Function(fs.readFileSync('scripts/restaurant-control-center-operational-smoke.js','utf8'));
          const ui=fs.readFileSync('src/web/restaurant-ui.js','utf8');
          if (/#[0-9a-fA-F]{6}/.test(ui)) throw new Error('KDS JS must not own theme hex colors');
          if (!ui.includes('KDS_OVERDUE_MINUTES = 12')) throw new Error('KDS V2 missing');
          console.log('RESTAURANT_KDS_V2_SOURCE_OK');
          NODE
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/restaurant/restaurant.service.js src/web/restaurant-ui.js src/web/restaurant-control-center.css src/web/restaurant.html scripts/
          git commit -m "feat(restaurante): implementar KDS V2 operativo"
          git push origin HEAD:ui/restaurant-kds-v2
