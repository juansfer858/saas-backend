name: One-off fix no-flicker smoke

on:
  push:
    branches:
      - feature/super-core-no-flicker-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/super-core-no-flicker-v1
          fetch-depth: 0
      - name: Remove obsolete runtime-style assertions
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('scripts/panel-ui-smoke.js'); s=p.read_text(); keys=('Persistent CSS, never per-element JS patches','background:rgba\\\\(250,252,253,.66\\\\)!important','\\\\.core-tenant-sidebar \\\\.nav a\\\\.active\\\\{background:linear-gradient','color:\\\\$\\\\{SIDEBAR_TEXT_COLOR\\\\}!important'); p.write_text(''.join(line for line in s.splitlines(True) if not any(k in line for k in keys)))"
      - name: Commit smoke correction and remove helper
        shell: bash
        run: |
          rm .github/workflows/oneoff-fix-no-flicker-smoke.yml
          git config user.name "vantixgc-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update no-flicker sidebar smoke expectations"
          git push origin HEAD:feature/super-core-no-flicker-v1
