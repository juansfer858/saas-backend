name: One-off tenant identity bootstrap v2

on:
  push:
    branches:
      - feature/super-core-no-flicker-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/super-core-no-flicker-v1
          fetch-depth: 0
      - name: Apply tenant identity bootstrap v2
        run: python scripts/_patch_tenant_identity_v2.py
      - name: Commit patch and remove one-off files
        run: |
          rm .github/workflows/oneoff-tenant-identity-v2.yml scripts/_patch_tenant_identity_v2.py
          git config user.name "vantixgc-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js scripts/panel-ui-smoke.js SUPER_CORE_TENANT_IDENTITY_V1.md .github/workflows/oneoff-tenant-identity-v2.yml scripts/_patch_tenant_identity_v2.py
          git commit -m "Use a single tenant identity bootstrap across Super Core shells"
          git push origin HEAD:feature/super-core-no-flicker-v1
