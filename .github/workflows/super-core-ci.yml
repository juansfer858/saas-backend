name: Super Core CI

on:
  push:
    branches:
      - super-core-v1
      - super-core-tests
      - super-core-step1-schema-v2
      - super-core-step2-middlewares-v2
      - super-core-step3-seed-v2
      - super-core-step4-api-v2
      - super-core-integral-hardening-v1
      - accounting-ui-v1
      - web-panel-sales-v1
      - panel-demo-view-v1
      - production-demo-tenant-v1
      - accounting-suite-v1
      - accounting-core-complete-v2
      - accounting-qa-blockers-v2
      - core-accounting-integration-v1-work2
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:dummy@localhost:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_EXPIRES_IN: 8h
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema and generate client
        run: npm run build

      - name: Load complete application graph
        run: node -e "require('./src/app'); console.log('SUPER CORE LOAD OK')"

      - name: Validate Accounting V2 operational UI
        run: node scripts/accounting-ui-smoke.js

      - name: Validate global Panel and Sales UI
        run: node scripts/panel-ui-smoke.js

      - name: Validate operational Purchases UI
        run: node scripts/purchases-ui-smoke.js

      - name: Validate read-only demo panel
        run: node scripts/demo-ui-smoke.js

  integration:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_EXPIRES_IN: 8h
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run build

      - name: Sync integration database
        run: npx prisma db push

      - name: Run Super Core smoke test
        run: node scripts/super-core-smoke.js

      - name: Run tenant welcome seed smoke test
        run: node scripts/step3-seed-smoke.js

      - name: Run transactional lifecycle smoke test
        run: node scripts/step4-lifecycle-smoke.js

      - name: Run integral hardening matrix
        run: node scripts/integral-hardening-smoke.js

      - name: Validate permanent production demo tenant bootstrap
        run: node scripts/production-demo-tenant-smoke.js

      - name: Validate Accounting Suite compatibility
        run: node scripts/accounting-suite-smoke.js

      - name: Validate Accounting Core V2 governance and fiscal workflows
        run: node scripts/accounting-core-v2-smoke.js

      - name: Validate Accounting QA blocker endpoints and resilient loading
        run: node scripts/accounting-qa-blockers-smoke.js

      - name: Validate cross-module accounting integration
        run: node scripts/core-accounting-integration-smoke.js

      - name: Validate Purchases operational acceptance criteria
        run: node scripts/purchases-operational-smoke.js
