name: Super Core CI

on:
  push:
    branches:
      - super-core-v1
      - super-core-tests
      - super-core-step1-schema-v2
      - super-core-step2-middlewares-v2
      - super-core-step3-seed-v2
      - super-core-step4-api-v2
      - super-core-integral-hardening-v1
      - accounting-ui-v1
      - web-panel-sales-v1
      - panel-demo-view-v1
      - production-demo-tenant-v1
      - accounting-suite-v1
      - accounting-core-complete-v2
      - accounting-qa-blockers-v2
      - core-accounting-integration-v1-work2
      - platform-core-dian-rbac-print-saas-v1
      - restaurant-prereqs-core-v1
      - restaurant-phase2-simulated-v1
      - edge-offline-first-core-v1
      - edge-offline-production-closure-v1
      - notifications-whatsapp-tracking-core-v1
      - meta-real-connection-closure-v1
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:dummy@localhost:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EDGE_AUTH_SECRET: edge-auth-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_EXPIRES_IN: 8h
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema and generate client
        run: npm run build

      - name: Load complete application graph
        run: node -e "require('./src/app'); console.log('SUPER CORE LOAD OK')"

      - name: Validate Accounting V2 operational UI
        run: node scripts/accounting-ui-smoke.js

      - name: Validate global Panel and Sales UI
        run: node scripts/panel-ui-smoke.js

      - name: Validate operational Sales V1 UI
        run: node scripts/sales-operational-ui-smoke.js

      - name: Validate operational Purchases UI
        run: node scripts/purchases-ui-smoke.js

      - name: Validate Platform Core tenant and SaaS UIs
        run: node scripts/platform-core-ui-smoke.js

      - name: Validate Restaurant Phase1 surfaces and gate
        run: node scripts/phase1-prereqs-ui-smoke.js

      - name: Validate Restaurant Phase2 simulated UI and production gate
        run: node scripts/restaurant-phase2-ui-smoke.js

      - name: Validate Restaurant simulated fiscal governance authorization and warnings
        run: node scripts/restaurant-fiscal-governance-ui-smoke.js

      - name: Validate Edge Offline-First local agent source
        run: node -e "require('./edge/agent/crypto-store'); require('./edge/agent/store'); console.log('EDGE AGENT LOAD OK')"

      - name: Validate Edge production-closure policy UI, backoff and evidence store
        run: node scripts/edge-offline-closure-ui-smoke.js

      - name: Validate Edge V2 architecture 1-10, secure LAN, updater and remote queues
        run: node scripts/edge-platform-v2-smoke.js

      - name: Validate Edge Workspace normal local Restaurant runtime
        run: node scripts/edge-workspace-v1-smoke.js

      - name: Validate public installer Workspace revision
        run: node scripts/public-installer-workspace-smoke.js

      - name: Validate Notifications fifth block and Embedded Signup contract
        run: node scripts/notifications-ui-smoke.js

      - name: Validate read-only demo panel
        run: node scripts/demo-ui-smoke.js

  integration:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EDGE_AUTH_SECRET: edge-auth-secret-0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_EXPIRES_IN: 8h
      TENANT_BASE_DOMAIN: example.com
      TENANT_PLATFORM_SUBDOMAINS: core
      PUBLIC_TENANT_REGISTRATION_ENABLED: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run build

      - name: Sync integration database
        run: npx prisma db push

      - name: Run Super Core smoke test
        run: node scripts/super-core-smoke.js

      - name: Run tenant welcome seed smoke test
        run: node scripts/step3-seed-smoke.js

      - name: Run transactional lifecycle smoke test
        run: node scripts/step4-lifecycle-smoke.js

      - name: Run integral hardening matrix
        run: node scripts/integral-hardening-smoke.js

      - name: Validate permanent production demo tenant bootstrap
        run: node scripts/production-demo-tenant-smoke.js

      - name: Validate Accounting Suite compatibility
        run: node scripts/accounting-suite-smoke.js

      - name: Validate Accounting Core V2 governance and fiscal workflows
        run: node scripts/accounting-core-v2-smoke.js

      - name: Validate Accounting QA blocker endpoints and resilient loading
        run: node scripts/accounting-qa-blockers-smoke.js

      - name: Validate cross-module accounting integration
        run: node scripts/core-accounting-integration-smoke.js

      - name: Validate Purchases operational acceptance criteria
        run: node scripts/purchases-operational-smoke.js

      - name: Validate Platform Core DIAN, payroll, RBAC, printing and SaaS admin
        run: node scripts/platform-core-v1-smoke.js

      - name: Validate Platform tenant provisioning and secure Master bootstrap source
        run: node scripts/platform-tenant-provisioning-smoke.js

      - name: Validate Restaurant Phase1 consumption and Sales prerequisites
        run: node scripts/restaurant-prereqs-phase1-smoke.js

      - name: Validate dedicated Restaurant demo tenant bootstrap
        run: node scripts/restaurant-demo-tenant-smoke.js

      - name: Validate Restaurant Phase2 simulated six-criteria acceptance
        run: node scripts/restaurant-phase2-simulated-smoke.js

      - name: Validate Restaurant simulated fiscal governance, audit and immutable history
        run: node scripts/restaurant-fiscal-governance-smoke.js

      - name: Validate The Factory HKA real HTTP adapter contract
        run: node scripts/hka-provider-adapter-smoke.js

      - name: Validate offline RAW ESC-POS local spooler
        run: node scripts/escpos-spooler-smoke.js

      - name: Validate Edge central reconciliation, negative stock, policy and audited drift review
        run: node scripts/edge-offline-core-smoke.js

      - name: Validate Edge runtime schema self-heal after missing V2 tables
        run: node scripts/edge-runtime-schema-self-heal-smoke.js

      - name: Validate Edge Workspace one-time user grant against PostgreSQL
        run: node scripts/edge-workspace-v1-db-smoke.js

      - name: Validate Edge V2 heartbeat persistence and installations listing against PostgreSQL
        run: node scripts/edge-platform-v2-runtime-db-smoke.js

      - name: Validate Edge actual network drop, policy UI, evidence and automatic reconnect
        run: node scripts/edge-agent-real-network-drop-smoke.js

      - name: Validate Notifications Core, consent, Meta contract and Magic Links
        run: node scripts/notifications-core-v1-smoke.js

      - name: Validate Meta real-connection Tech Provider token and signup contract
        run: node scripts/meta-real-connection-smoke.js
