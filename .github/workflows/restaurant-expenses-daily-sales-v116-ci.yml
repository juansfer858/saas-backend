name: Restaurant Expenses Daily Sales V116 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-expenses-v116.service.js'
      - 'src/modules/restaurant/restaurant-expenses-v116.routes.js'
      - 'src/modules/restaurant/restaurant-expenses-v116.public.routes.js'
      - 'src/modules/restaurant/restaurant-close-sales-reconcile-v116.js'
      - 'src/modules/restaurant/restaurant-cash-close-summary.service.js'
      - 'src/modules/restaurant/restaurant-v2-cash.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-v2-native-control-p11.js'
      - 'src/web/restaurant-v2-expenses-v117.html'
      - 'src/web/restaurant-v2-expenses-v117.js'
      - 'scripts/restaurant-expenses-daily-sales-v116-smoke.js'
      - '.github/workflows/restaurant-expenses-daily-sales-v116-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-expenses-v116.service.js'
      - 'src/modules/restaurant/restaurant-expenses-v116.routes.js'
      - 'src/modules/restaurant/restaurant-expenses-v116.public.routes.js'
      - 'src/modules/restaurant/restaurant-close-sales-reconcile-v116.js'
      - 'src/modules/restaurant/restaurant-cash-close-summary.service.js'
      - 'src/modules/restaurant/restaurant-v2-cash.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-v2-native-control-p11.js'
      - 'src/web/restaurant-v2-expenses-v117.html'
      - 'src/web/restaurant-v2-expenses-v117.js'
      - 'scripts/restaurant-expenses-daily-sales-v116-smoke.js'
      - '.github/workflows/restaurant-expenses-daily-sales-v116-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate expenses, close reconciliation and daily sales report
        run: node scripts/restaurant-expenses-daily-sales-v116-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact commit and Restaurant V116/V117 runtime in production
        shell: bash
        run: |
          set -euo pipefail
          INFO='https://core.vantixgc.com/api/public/runtime-info'
          LEGACY='https://core.vantixgc.com/app/restaurant-control-center.js'
          NAV='https://core.vantixgc.com/app/restaurant-v2-native-control-p11.js'
          EXPENSES='https://core.vantixgc.com/app/restaurante-v2/gastos'
          EXPENSES_JS='https://core.vantixgc.com/app/restaurant-v2-expenses-v117.js'
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$INFO" 2>/dev/null); then
              if echo "$body" | grep -Fq "\"commit\":\"${GITHUB_SHA}\""; then
                legacy=$(curl -fsSL --max-time 12 "$LEGACY?v=${GITHUB_SHA}" 2>/dev/null || true)
                nav=$(curl -fsSL --max-time 12 "$NAV?v=${GITHUB_SHA}" 2>/dev/null || true)
                expenses=$(curl -fsSL --max-time 12 "$EXPENSES?v=${GITHUB_SHA}" 2>/dev/null || true)
                expenses_js=$(curl -fsSL --max-time 12 "$EXPENSES_JS?v=${GITHUB_SHA}" 2>/dev/null || true)
                if echo "$legacy" | grep -Fq 'VANTIX_RESTAURANT_EXPENSES_DAILY_SALES_V116' \
                  && echo "$nav" | grep -Fq "gastos:{ label:'Gastos'" \
                  && echo "$nav" | grep -Fq "route:'/app/restaurante-v2/gastos'" \
                  && echo "$expenses" | grep -Fq 'VANTIX_RESTAURANT_V2_EXPENSES_NATIVE_V117' \
                  && echo "$expenses" | grep -Fq 'Registrar gasto' \
                  && echo "$expenses_js" | grep -Fq 'VANTIX_RESTAURANT_V2_EXPENSES_NATIVE_V117' \
                  && echo "$expenses_js" | grep -Fq '/api/v1/restaurante/gastos-v116'; then
                  echo RESTAURANT_EXPENSES_DAILY_SALES_V116_V117_PRODUCTION_OK
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          exit 1
