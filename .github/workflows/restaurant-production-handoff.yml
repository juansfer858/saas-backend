name: Restaurant Production Handoff Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate handoff contract on pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -f server.js
          test -f scripts/runtime-stability-smoke.js
          test -f scripts/runtime-stability-db-smoke.js
          grep -q "app.get('/healthz'" server.js
          grep -q "app.get('/readyz'" server.js
          grep -q "app.get('/api/public/runtime-info'" server.js
          grep -q "menu-ocr-readiness" src/modules/restaurant/restaurant-menu-import.public.routes.js
          echo "RESTAURANT_PRODUCTION_HANDOFF_CONTRACT_OK"

      - name: Wait for Restaurant V2 marker in production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://core.vantixgc.com/api/public/restaurante/build-marker"
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q 'LA_RIEL_CONNECTED_V1' && echo "$body" | grep -q 'ROTATED_V2_2026_08_21'; then
                echo "PRODUCTION_RESTAURANT_MARKER_OK"
                exit 0
              fi
            fi
            echo "Waiting for production deploy... attempt=$attempt"
            sleep 10
          done
          echo "Production did not expose expected Restaurant V2 marker in time" >&2
          exit 1

      - name: Verify production liveness and readiness
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            health_code=$(curl -sS --max-time 12 -o /tmp/healthz.json -w '%{http_code}' https://core.vantixgc.com/healthz || true)
            ready_code=$(curl -sS --max-time 12 -o /tmp/readyz.json -w '%{http_code}' https://core.vantixgc.com/readyz || true)
            if [ "$health_code" = "200" ] && [ "$ready_code" = "200" ]; then
              cat /tmp/healthz.json
              cat /tmp/readyz.json
              grep -q '"status":"alive"' /tmp/healthz.json
              grep -q '"status":"ready"' /tmp/readyz.json
              grep -q '"database":"OK"' /tmp/readyz.json
              echo "PRODUCTION_RUNTIME_READY_OK"
              exit 0
            fi
            echo "Waiting for runtime readiness... attempt=$attempt health=$health_code ready=$ready_code"
            sleep 5
          done
          echo "Production runtime did not become ready in time" >&2
          exit 1

      - name: Verify deployed runtime identity surface
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsSL --max-time 15 https://core.vantixgc.com/api/public/runtime-info)
          echo "$body"
          echo "$body" | grep -q '"phase":"READY"'
          echo "$body" | grep -q '"uptimeSeconds"'
          echo "$body" | grep -q '"commit"'
          echo "PRODUCTION_RUNTIME_IDENTITY_OK"

      - name: Verify local Restaurant OCR runtime in production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://core.vantixgc.com/api/public/restaurante/menu-ocr-readiness"
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 15 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q '"configured":true' && \
                 echo "$body" | grep -q '"provider":"LOCAL_OCR"' && \
                 echo "$body" | grep -q '"imageOcr":true' && \
                 echo "$body" | grep -q '"pdfText":true' && \
                 echo "$body" | grep -q '"pdfScan":true'; then
                echo "PRODUCTION_RESTAURANT_LOCAL_OCR_READY"
                exit 0
              fi
            fi
            echo "Waiting for local OCR runtime... attempt=$attempt"
            sleep 10
          done
          echo "Production local Restaurant OCR did not become ready in time" >&2
          exit 1

      - name: Verify Super Core Restaurant runtime status
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsSL --max-time 15 https://core.vantixgc.com/api/v1/status)
          echo "$body"
          echo "$body" | grep -q 'PHASE2_FUNCTIONAL_SIMULATED_PRINT_PRODUCTION_BLOCKED'
          echo "$body" | grep -q 'restaurantVertical'
          echo "PRODUCTION_CORE_STATUS_OK"

      - name: Verify supported central tenant login entrypoint
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -L --max-time 15 -o /tmp/core-login.html -w '%{http_code}' https://core.vantixgc.com/app)
          test "$code" = "200"
          grep -qi 'VantixGC Super Core' /tmp/core-login.html
          grep -qi 'Subdominio de empresa' /tmp/core-login.html
          echo "PRODUCTION_CENTRAL_TENANT_LOGIN_OK"

      - name: Verify demo Restaurant tenant is seeded in production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://core.vantixgc.com/api/public/restaurante/demo-readiness"
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q '"ready":true' && \
                 echo "$body" | grep -q '"tenantFound":true' && \
                 echo "$body" | grep -q '"users":6' && \
                 echo "$body" | grep -q '"tables":6' && \
                 echo "$body" | grep -q '"menuItems":4' && \
                 echo "$body" | grep -q '"recipes":4'; then
                echo "PRODUCTION_DEMO_RESTAURANT_READY"
                exit 0
              fi
            fi
            echo "Waiting for demo tenant bootstrap... attempt=$attempt"
            sleep 10
          done
          echo "demo-restaurante was not fully seeded in production" >&2
          exit 1
