name: Restaurant Production Handoff Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate handoff contract on pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -f server.js
          test -f scripts/runtime-stability-smoke.js
          test -f scripts/runtime-stability-db-smoke.js
          test -f src/web/restaurant-menu-layout-parser-v3.js
          test -f src/web/restaurant-menu-browser-ocr.js
          test ! -f railpack.json
          grep -q "app.get('/healthz'" server.js
          grep -q "app.get('/readyz'" server.js
          grep -q "app.get('/api/public/runtime-info'" server.js
          grep -q "menu-ocr-readiness" src/modules/restaurant/restaurant-menu-import.public.routes.js
          grep -q "VANTIX_BROWSER_OCR_V1" src/web/restaurant-menu-browser-ocr.js
          grep -q "VANTIX_BROWSER_OCR_MULTIPASS_V2" src/web/restaurant-menu-browser-ocr.js
          grep -q "VANTIX_MENU_OCR_LAYOUT_V3" src/web/restaurant-menu-layout-parser-v3.js
          grep -q "blocks:true" src/web/restaurant-menu-browser-ocr.js
          grep -q "detectVerticalCategories" src/web/restaurant-menu-browser-ocr.js
          grep -q "PSM_MODES = \['6', '11', '4'\]" src/web/restaurant-menu-browser-ocr.js
          grep -q "preserveOriginalImage:true" src/web/restaurant-menu-browser-ocr.js
          grep -q "browserLayoutMarker: 'VANTIX_MENU_OCR_LAYOUT_V3'" src/modules/restaurant/restaurant-menu-import.public.routes.js
          grep -q "browserFallback: true" src/modules/restaurant/restaurant-menu-import.public.routes.js
          echo "RESTAURANT_PRODUCTION_HANDOFF_CONTRACT_OK"

      - name: Wait for exact commit in production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://core.vantixgc.com/api/public/runtime-info"
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
                echo "PRODUCTION_EXACT_COMMIT_OK"
                exit 0
              fi
            fi
            echo "Waiting for exact production commit... attempt=$attempt expected=$GITHUB_SHA"
            sleep 10
          done
          echo "Production did not deploy commit $GITHUB_SHA in time" >&2
          exit 1

      - name: Wait for Restaurant V2 marker in production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://core.vantixgc.com/api/public/restaurante/build-marker"
          for attempt in $(seq 1 30); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q 'LA_RIEL_CONNECTED_V1' && echo "$body" | grep -q 'ROTATED_V2_2026_08_21'; then
                echo "PRODUCTION_RESTAURANT_MARKER_OK"
                exit 0
              fi
            fi
            echo "Waiting for production marker... attempt=$attempt"
            sleep 5
          done
          echo "Production did not expose expected Restaurant V2 marker in time" >&2
          exit 1

      - name: Verify production liveness and readiness
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            health_code=$(curl -sS --max-time 12 -o /tmp/healthz.json -w '%{http_code}' https://core.vantixgc.com/healthz || true)
            ready_code=$(curl -sS --max-time 12 -o /tmp/readyz.json -w '%{http_code}' https://core.vantixgc.com/readyz || true)
            if [ "$health_code" = "200" ] && [ "$ready_code" = "200" ]; then
              cat /tmp/healthz.json
              cat /tmp/readyz.json
              grep -q '"status":"alive"' /tmp/healthz.json
              grep -q '"status":"ready"' /tmp/readyz.json
              grep -q '"database":"OK"' /tmp/readyz.json
              echo "PRODUCTION_RUNTIME_READY_OK"
              exit 0
            fi
            echo "Waiting for runtime readiness... attempt=$attempt health=$health_code ready=$ready_code"
            sleep 5
          done
          echo "Production runtime did not become ready in time" >&2
          exit 1

      - name: Verify deployed runtime identity surface
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsSL --max-time 15 https://core.vantixgc.com/api/public/runtime-info)
          echo "$body"
          echo "$body" | grep -q '"phase":"READY"'
          echo "$body" | grep -q '"uptimeSeconds"'
          echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""
          echo "PRODUCTION_RUNTIME_IDENTITY_OK"

      - name: Verify Restaurant OCR layout V3 in production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 -o /tmp/ocr-readiness.json https://core.vantixgc.com/api/public/restaurante/menu-ocr-readiness
          cat /tmp/ocr-readiness.json
          grep -q '"browserFallback":true' /tmp/ocr-readiness.json
          grep -q '"browserMarker":"VANTIX_BROWSER_OCR_V1"' /tmp/ocr-readiness.json
          grep -q '"browserQualityMarker":"VANTIX_BROWSER_OCR_MULTIPASS_V2"' /tmp/ocr-readiness.json
          grep -q '"browserLayoutMarker":"VANTIX_MENU_OCR_LAYOUT_V3"' /tmp/ocr-readiness.json
          grep -q '"browserPostprocessMarker":"VANTIX_MENU_OCR_QUALITY_POSTPROCESS_V2"' /tmp/ocr-readiness.json
          curl -fsSL --max-time 20 -o /tmp/restaurant-menu-import-ui.js https://core.vantixgc.com/app/restaurant-menu-import-ui.js
          grep -q 'VANTIX_BROWSER_OCR_V1' /tmp/restaurant-menu-import-ui.js
          grep -q 'VANTIX_BROWSER_OCR_MULTIPASS_V2' /tmp/restaurant-menu-import-ui.js
          grep -q 'VANTIX_MENU_OCR_LAYOUT_V3' /tmp/restaurant-menu-import-ui.js
          grep -q 'VANTIX_MENU_OCR_QUALITY_POSTPROCESS_V2' /tmp/restaurant-menu-import-ui.js
          grep -q 'detectVerticalCategories' /tmp/restaurant-menu-import-ui.js
          grep -q 'blocks:true' /tmp/restaurant-menu-import-ui.js
          grep -q "PSM_MODES = \['6', '11', '4'\]" /tmp/restaurant-menu-import-ui.js
          grep -q "user_defined_dpi:'220'" /tmp/restaurant-menu-import-ui.js
          grep -q 'preserveOriginalImage:true' /tmp/restaurant-menu-import-ui.js
          grep -q 'tesseract.js@5' /tmp/restaurant-menu-import-ui.js
          grep -q 'pdfjs-dist@3.11.174' /tmp/restaurant-menu-import-ui.js
          echo "PRODUCTION_RESTAURANT_BROWSER_OCR_LAYOUT_V3_READY"

      - name: Verify Super Core Restaurant runtime status
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsSL --max-time 15 https://core.vantixgc.com/api/v1/status)
          echo "$body"
          echo "$body" | grep -q 'PHASE2_FUNCTIONAL_SIMULATED_PRINT_PRODUCTION_BLOCKED'
          echo "$body" | grep -q 'restaurantVertical'
          echo "PRODUCTION_CORE_STATUS_OK"

      - name: Verify supported central tenant login entrypoint
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -L --max-time 15 -o /tmp/core-login.html -w '%{http_code}' https://core.vantixgc.com/app)
          test "$code" = "200"
          grep -qi 'VantixGC Super Core' /tmp/core-login.html
          grep -qi 'Subdominio de empresa' /tmp/core-login.html
          echo "PRODUCTION_CENTRAL_TENANT_LOGIN_OK"

      - name: Verify demo Restaurant tenant is seeded in production
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://core.vantixgc.com/api/public/restaurante/demo-readiness"
          for attempt in $(seq 1 30); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q '"ready":true' && \
                 echo "$body" | grep -q '"tenantFound":true' && \
                 echo "$body" | grep -q '"users":6' && \
                 echo "$body" | grep -q '"tables":6' && \
                 echo "$body" | grep -q '"menuItems":4' && \
                 echo "$body" | grep -q '"recipes":4'; then
                echo "PRODUCTION_DEMO_RESTAURANT_READY"
                exit 0
              fi
            fi
            echo "Waiting for demo tenant bootstrap... attempt=$attempt"
            sleep 5
          done
          echo "demo-restaurante was not fully seeded in production" >&2
          exit 1
