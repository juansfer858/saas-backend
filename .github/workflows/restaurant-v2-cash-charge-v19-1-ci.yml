name: Restaurant V2 Cash Charge V19.1 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/web/restaurant-v2-cash-print-choice-v19.js'
      - 'src/web/restaurant-v2-cash.html'
      - 'src/modules/restaurant/restaurant-pos-operational-mode.js'
      - 'src/modules/restaurant/restaurant-v2-cash.service.js'
      - 'src/modules/restaurant/restaurant-pos-receipt-hooks.js'
      - 'scripts/restaurant-v2-cash-charge-v19-1-smoke.js'
      - '.github/workflows/restaurant-v2-cash-charge-v19-1-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/web/restaurant-v2-cash-print-choice-v19.js'
      - 'src/web/restaurant-v2-cash.html'
      - 'src/modules/restaurant/restaurant-pos-operational-mode.js'
      - 'src/modules/restaurant/restaurant-v2-cash.service.js'
      - 'src/modules/restaurant/restaurant-pos-receipt-hooks.js'
      - 'scripts/restaurant-v2-cash-charge-v19-1-smoke.js'
      - '.github/workflows/restaurant-v2-cash-charge-v19-1-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V19.1 syntax
        run: |
          node --check src/web/restaurant-v2-cash-print-choice-v19.js
          node --check src/modules/restaurant/restaurant-pos-operational-mode.js
      - name: Validate charge visibility and deferred receipt contracts
        run: node scripts/restaurant-v2-cash-charge-v19-1-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact Cash Charge V19.1 in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if [[ "$INFO" == *"$GITHUB_SHA"* ]]; then
              CASH="$(curl -fsS "$BASE/app/restaurante-v2/caja")"
              ASSET="$(curl -fsS "$BASE/app/restaurant-v2-cash-print-choice-v19.js")"
              [[ "$CASH" == *'restaurant-v2-cash-print-choice-v19.js?v=v19.1'* ]]
              [[ "$ASSET" == *"version:'19.1.0'"* ]]
              [[ "$ASSET" == *'COBRO NO REALIZADO'* ]]
              [[ "$ASSET" == *'¿Imprimir recibo?'* ]]
              echo "Restaurant V2 Cash Charge V19.1 live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
