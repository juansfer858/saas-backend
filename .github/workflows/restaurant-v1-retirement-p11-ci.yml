name: Restaurant V1 Retirement P11 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v1-retirement-p11.*'
      - 'src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js'
      - 'src/modules/restaurant/restaurant-v2-control-center.public.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-v1-retirement-p11*'
      - 'src/web/restaurant-v2-native-control-p11*'
      - 'src/web/restaurant-v2-module-host-p11.js'
      - 'src/web/restaurant-v2-employees-p11.html'
      - 'src/web/restaurant-v2-delivery-p11.html'
      - 'src/web/restaurant-v2-control-center-bridge.js'
      - 'scripts/restaurant-v1-retirement-p11-db-smoke.js'
      - '.github/workflows/restaurant-v1-retirement-p11-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v1-retirement-p11.*'
      - 'src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js'
      - 'src/modules/restaurant/restaurant-v2-control-center.public.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-v1-retirement-p11*'
      - 'src/web/restaurant-v2-native-control-p11*'
      - 'src/web/restaurant-v2-module-host-p11.js'
      - 'src/web/restaurant-v2-employees-p11.html'
      - 'src/web/restaurant-v2-delivery-p11.html'
      - 'src/web/restaurant-v2-control-center-bridge.js'
      - 'scripts/restaurant-v1-retirement-p11-db-smoke.js'
      - '.github/workflows/restaurant-v1-retirement-p11-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TENANT_BASE_DOMAIN: vantixgc.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create ephemeral test secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "RESTAURANT_DEVICE_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "RESTAURANT_QR_VISIT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "EDGE_AUTH_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - run: node scripts/restaurant-v1-retirement-p11-db-smoke.js
      - run: node --check src/modules/restaurant/restaurant-v1-retirement-p11.service.js
      - run: node --check src/modules/restaurant/restaurant-v1-retirement-p11.routes.js
      - run: node --check src/modules/restaurant/restaurant-v1-retirement-p11.public.routes.js
      - run: node --check src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js
      - run: node --check src/modules/restaurant/restaurant-v2-control-center.public.routes.js
      - run: node --check src/web/restaurant-v1-retirement-p11-launch.js
      - run: node --check src/web/restaurant-v1-retirement-p11.js
      - run: node --check src/web/restaurant-v2-native-control-p11.js
      - run: node --check src/web/restaurant-v2-module-host-p11.js
      - run: node --check src/web/restaurant-v2-control-center-bridge.js
      - run: node --check scripts/restaurant-v1-retirement-p11-db-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify retired V1/P10 surfaces redirect to P12 V2 in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'

          assert_redirect() {
            local path="$1"
            local expected="$2"
            local status location
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$path")"
            location="$(curl -sS -o /dev/null -w '%{redirect_url}' "$BASE$path")"
            [[ "$status" == '307' ]]
            [[ "$location" == "$BASE$expected"* ]]
          }

          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              N="$(mktemp)"; E="$(mktemp)"; D="$(mktemp)"; NJ="$(mktemp)"
              assert_redirect '/app/centro-de-control' '/app/centro-de-control-v2'
              assert_redirect '/app/centro-de-control-p10' '/app/centro-de-control-v2'
              assert_redirect '/app/restaurante-v1' '/app/centro-de-control-v2'
              assert_redirect '/app/restaurante-v2/retiro-v1' '/app/centro-de-control-v2'
              assert_redirect '/app/centro-de-control/mesero-v1' '/app/centro-de-control/mesero-v2/'
              assert_redirect '/app/produccion-v1' '/app/produccion-v2/'
              curl -fsS "$BASE/app/centro-de-control-v2?v=$GITHUB_SHA" -o "$N"
              curl -fsS "$BASE/app/restaurante-v2/empleados?v=$GITHUB_SHA" -o "$E"
              curl -fsS "$BASE/app/restaurante-v2/domicilios?v=$GITHUB_SHA" -o "$D"
              curl -fsS "$BASE/app/restaurant-v2-native-control-p11.js?v=$GITHUB_SHA" -o "$NJ"
              grep -Fq 'data-v2-native-control="p11"' "$N"
              grep -Fq 'data-p11-module-host="employees"' "$E"
              grep -Fq 'data-p11-module-host="delivery"' "$D"
              grep -Fq 'VANTIX_RESTAURANT_V2_NATIVE_CONTROL_P11' "$NJ"
              echo "Restaurant P11 retirement compatibility is live under P12 at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
