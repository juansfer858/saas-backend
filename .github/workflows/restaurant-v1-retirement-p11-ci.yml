name: Restaurant V1 Retirement P11 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v1-retirement-p11.*'
      - 'src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js'
      - 'src/modules/restaurant/restaurant-v2-control-center.public.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-v1-retirement-p11*'
      - 'src/web/restaurant-v2-native-control-p11*'
      - 'src/web/restaurant-v2-module-host-p11.js'
      - 'src/web/restaurant-v2-employees-p11.html'
      - 'src/web/restaurant-v2-delivery-p11.html'
      - 'src/web/restaurant-v2-control-center-bridge.js'
      - 'scripts/restaurant-v1-retirement-p11-db-smoke.js'
      - '.github/workflows/restaurant-v1-retirement-p11-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v1-retirement-p11.*'
      - 'src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js'
      - 'src/modules/restaurant/restaurant-v2-control-center.public.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-v1-retirement-p11*'
      - 'src/web/restaurant-v2-native-control-p11*'
      - 'src/web/restaurant-v2-module-host-p11.js'
      - 'src/web/restaurant-v2-employees-p11.html'
      - 'src/web/restaurant-v2-delivery-p11.html'
      - 'src/web/restaurant-v2-control-center-bridge.js'
      - 'scripts/restaurant-v1-retirement-p11-db-smoke.js'
      - '.github/workflows/restaurant-v1-retirement-p11-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TENANT_BASE_DOMAIN: vantixgc.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create ephemeral test secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "RESTAURANT_DEVICE_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "RESTAURANT_QR_VISIT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "EDGE_AUTH_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - run: node scripts/restaurant-v1-retirement-p11-db-smoke.js
      - run: node --check src/modules/restaurant/restaurant-v1-retirement-p11.service.js
      - run: node --check src/modules/restaurant/restaurant-v1-retirement-p11.routes.js
      - run: node --check src/modules/restaurant/restaurant-v1-retirement-p11.public.routes.js
      - run: node --check src/modules/restaurant/restaurant-operational-v2-preview.public.routes.js
      - run: node --check src/modules/restaurant/restaurant-v2-control-center.public.routes.js
      - run: node --check src/web/restaurant-v1-retirement-p11-launch.js
      - run: node --check src/web/restaurant-v1-retirement-p11.js
      - run: node --check src/web/restaurant-v2-native-control-p11.js
      - run: node --check src/web/restaurant-v2-module-host-p11.js
      - run: node --check src/web/restaurant-v2-control-center-bridge.js
      - run: node --check scripts/restaurant-v1-retirement-p11-db-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact P11 retirement surfaces in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              HC="$(mktemp)"; C="$(mktemp)"; HN="$(mktemp)"; N="$(mktemp)"; HP="$(mktemp)"; P="$(mktemp)"; H10="$(mktemp)"; P10="$(mktemp)"; HR="$(mktemp)"; R="$(mktemp)"; HW="$(mktemp)"; W="$(mktemp)"; HPR="$(mktemp)"; PR="$(mktemp)"
              curl -fsS -D "$HC" "$BASE/app/centro-de-control?v=$GITHUB_SHA" -o "$C"
              curl -fsS -D "$HN" "$BASE/app/centro-de-control-v2?v=$GITHUB_SHA" -o "$N"
              curl -fsS -D "$HP" "$BASE/app/restaurante-v2/retiro-v1?v=$GITHUB_SHA" -o "$P"
              curl -fsS -D "$H10" "$BASE/app/centro-de-control-p10?v=$GITHUB_SHA" -o "$P10"
              curl -fsS -D "$HR" "$BASE/app/restaurante-v1?v=$GITHUB_SHA" -o "$R"
              curl -fsS -D "$HW" "$BASE/app/centro-de-control/mesero-v1?v=$GITHUB_SHA" -o "$W"
              curl -fsS -D "$HPR" "$BASE/app/produccion-v1?v=$GITHUB_SHA" -o "$PR"
              grep -Fqi 'X-VantixGC-Restaurant-V1-Retirement: p11-v1-retirement' "$HC"
              grep -Fq 'data-p11-launch="true"' "$C"
              if grep -Eq 'restaurant-ui\.js|restaurant-control-center\.js|MutationObserver' "$C"; then exit 1; fi
              grep -Fqi 'X-VantixGC-Restaurant-V1-Retirement: p11-v1-retirement' "$HN"
              grep -Fq 'data-v2-native-control="p11"' "$N"
              if grep -Eq 'restaurant-ui\.js|restaurant-control-center\.js|restaurant\.html|MutationObserver' "$N"; then exit 1; fi
              grep -Fq 'Retiro operativo de V1' "$P"
              grep -Fqi 'X-VantixGC-Restaurant-Control-P10-Compatibility: true' "$H10"
              grep -Fq 'restaurant-v2-control-center-bridge.js' "$P10"
              grep -Fqi 'X-VantixGC-Restaurant-V2-Pilot-Rollback: v1-direct-shell' "$HR"
              grep -Fqi 'X-VantixGC-Restaurant-V2-Cutover-Rollback: waiter-v1-direct' "$HW"
              grep -Fqi 'X-VantixGC-Restaurant-V2-Cutover-Rollback: production-v1-direct' "$HPR"
              curl -fsS "$BASE/app/restaurante-v2/empleados?v=$GITHUB_SHA" | grep -Fq 'data-p11-module-host="employees"'
              curl -fsS "$BASE/app/restaurante-v2/domicilios?v=$GITHUB_SHA" | grep -Fq 'data-p11-module-host="delivery"'
              curl -fsS "$BASE/app/restaurant-v2-native-control-p11.js?v=$GITHUB_SHA" | grep -Fq 'VANTIX_RESTAURANT_V2_NATIVE_CONTROL_P11'
              echo "Restaurant P11 V1 retirement live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
