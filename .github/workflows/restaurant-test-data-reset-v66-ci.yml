name: Restaurant Test Data Reset V66 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-test-data-reset-v66.service.js'
      - 'src/modules/restaurant/restaurant-test-data-reset-v66.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-company-admin-advanced.js'
      - 'scripts/restaurant-test-data-reset-v66-smoke.js'
      - '.github/workflows/restaurant-test-data-reset-v66-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-test-data-reset-v66.service.js'
      - 'src/modules/restaurant/restaurant-test-data-reset-v66.routes.js'
      - 'src/routes/core.routes.js'
      - 'src/web/restaurant-company-admin-advanced.js'
      - 'scripts/restaurant-test-data-reset-v66-smoke.js'
      - '.github/workflows/restaurant-test-data-reset-v66-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vantix_v66_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client from complete schema directory
        run: npx prisma generate
      - name: Validate syntax
        run: |
          node --check src/modules/restaurant/restaurant-test-data-reset-v66.service.js
          node --check src/modules/restaurant/restaurant-test-data-reset-v66.routes.js
          node --check src/routes/core.routes.js
          node --check src/web/restaurant-company-admin-advanced.js
          node --check scripts/restaurant-test-data-reset-v66-smoke.js
      - name: Load reset service with generated Prisma client
        run: node -e "require('./src/modules/restaurant/restaurant-test-data-reset-v66.service.js'); console.log('V66_SERVICE_LOAD_OK')"
      - name: Validate destructive scope and preserved master data
        run: node scripts/restaurant-test-data-reset-v66-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact commit in production
        shell: bash
        run: |
          set -euo pipefail
          URL='https://core.vantixgc.com/api/public/runtime-info'
          for attempt in $(seq 1 60); do
            if body=$(curl -fsSL --max-time 12 "$URL" 2>/dev/null); then
              echo "$body"
              if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
                echo 'PRODUCTION_EXACT_COMMIT_OK'
                exit 0
              fi
            fi
            echo "Waiting for exact production commit... attempt=$attempt expected=$GITHUB_SHA"
            sleep 10
          done
          echo "Production did not deploy commit $GITHUB_SHA in time" >&2
          exit 1

      - name: Verify V66 client asset in production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 -o /tmp/company-admin.js 'https://core.vantixgc.com/app/restaurant-company-admin-advanced.js?v=2'
          grep -q 'VANTIX_RESTAURANT_TEST_DATA_RESET_V66' /tmp/company-admin.js
          grep -q 'Limpieza de pruebas' /tmp/company-admin.js
          grep -q 'Eliminar facturas, comandas y transacciones de prueba' /tmp/company-admin.js
          grep -q '/api/v1/restaurante/limpieza-pruebas/v66/resumen' /tmp/company-admin.js
          grep -q '/api/v1/restaurante/limpieza-pruebas/v66/ejecutar' /tmp/company-admin.js
          echo 'PRODUCTION_RESTAURANT_TEST_RESET_V66_READY'
