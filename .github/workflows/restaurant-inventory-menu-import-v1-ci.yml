name: Restaurant Inventory Menu Import V1 CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/web/restaurant-inventory-workspace-v1.js'
      - 'src/web/restaurant-inventory-menu-import-loader-v1.js'
      - 'src/modules/commercial/commercial.routes.js'
      - 'src/web/restaurant-menu-import-ui.js'
      - 'src/modules/restaurant/restaurant-menu-import.*'
      - 'src/modules/inventory/**'
      - 'src/modules/consumption/**'
      - 'scripts/restaurant-inventory-menu-import-v1-smoke.js'
      - '.github/workflows/restaurant-inventory-menu-import-v1-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/web/restaurant-inventory-workspace-v1.js'
      - 'src/web/restaurant-inventory-menu-import-loader-v1.js'
      - 'src/modules/commercial/commercial.routes.js'
      - 'src/web/restaurant-menu-import-ui.js'
      - 'src/modules/restaurant/restaurant-menu-import.*'
      - 'src/modules/inventory/**'
      - 'src/modules/consumption/**'
      - 'scripts/restaurant-inventory-menu-import-v1-smoke.js'
      - '.github/workflows/restaurant-inventory-menu-import-v1-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate runtime syntax
        run: |
          node --check src/web/restaurant-inventory-workspace-v1.js
          node --check src/web/restaurant-inventory-menu-import-loader-v1.js
          node --check src/modules/commercial/commercial.routes.js
      - name: Validate inventory, recipes and canonical menu import contracts
        run: node scripts/restaurant-inventory-menu-import-v1-smoke.js
  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact production SHA
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if [[ "$INFO" == *"$GITHUB_SHA"* ]]; then
              ASSET="$(curl -fsS "$BASE/app/restaurant-menu-import-ui.js?v=$GITHUB_SHA")"
              [[ "$ASSET" == *"VANTIX_MENU_OCR_END_TO_END_10MB_V7"* ]]
              [[ "$ASSET" == *"VANTIX_MENU_OCR_DYNAMIC_CATEGORIES_V8"* ]]
              echo "Restaurant Inventory/Menu Import V1 live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
