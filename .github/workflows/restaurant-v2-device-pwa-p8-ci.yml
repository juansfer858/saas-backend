name: Restaurant V2 Device PWA P8 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v2-device-pwa-p8.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/web/restaurant-v2-*-p8.*'
      - 'scripts/restaurant-v2-device-pwa-p8-db-smoke.js'
      - '.github/workflows/restaurant-v2-device-pwa-p8-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/modules/restaurant/restaurant-v2-device-pwa-p8.public.routes.js'
      - 'src/modules/restaurant/restaurant.public.routes.js'
      - 'src/web/restaurant-v2-*-p8.*'
      - 'scripts/restaurant-v2-device-pwa-p8-db-smoke.js'
      - '.github/workflows/restaurant-v2-device-pwa-p8-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESTAURANT_DEVICE_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESTAURANT_QR_VISIT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TENANT_BASE_DOMAIN: vantixgc.com
      FCM_SERVICE_ACCOUNT_JSON: ''
      FCM_PROJECT_ID: ''
      FCM_CLIENT_EMAIL: ''
      FCM_PRIVATE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx prisma db push
      - run: node scripts/restaurant-v2-device-pwa-p8-db-smoke.js
      - run: node --check src/modules/restaurant/restaurant-v2-device-pwa-p8.public.routes.js
      - run: node --check src/web/restaurant-v2-device-sdk-p8.js
      - run: node --check src/web/restaurant-v2-device-realtime-p8.js
      - run: node --check src/web/restaurant-v2-device-pwa-p8.js
      - run: node --check src/web/restaurant-v2-waiter-sw-p8.js
      - run: node --check src/web/restaurant-v2-production-sw-p8.js
      - run: node --check scripts/restaurant-v2-device-pwa-p8-db-smoke.js

  verify-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact P8 device PWAs in production
        run: |
          set -euo pipefail
          BASE='https://core.vantixgc.com'
          for i in $(seq 1 60); do
            INFO="$(curl -fsS "$BASE/api/public/runtime-info" 2>/dev/null || true)"
            if echo "$INFO" | grep -Fq "$GITHUB_SHA"; then
              WH="$(mktemp)"; W="$(mktemp)"; PH="$(mktemp)"; P="$(mktemp)"; SDK="$(mktemp)"; RT="$(mktemp)"; WP="$(mktemp)"; PP="$(mktemp)"
              curl -fsS -D "$WH" "$BASE/app/centro-de-control/mesero-v2/?v=$GITHUB_SHA" -o "$W"
              curl -fsS -D "$PH" "$BASE/app/produccion-v2/?v=$GITHUB_SHA" -o "$P"
              curl -fsS "$BASE/app/restaurant-v2-device-sdk-p8.js?v=$GITHUB_SHA" -o "$SDK"
              curl -fsS "$BASE/app/restaurant-v2-device-realtime-p8.js?v=$GITHUB_SHA" -o "$RT"
              curl -fsS "$BASE/app/centro-de-control/mesero-v2/manifest.webmanifest?v=$GITHUB_SHA" -o "$WP"
              curl -fsS "$BASE/app/produccion-v2/manifest.webmanifest?v=$GITHUB_SHA" -o "$PP"
              grep -Fqi 'X-VantixGC-Restaurant-V2-Device: waiter-p8' "$WH"
              grep -Fqi 'X-VantixGC-Restaurant-V2-Device: production-p8' "$PH"
              grep -Fq 'RESTAURANTE V2 · MESERO P8' "$W"
              grep -Fq 'RESTAURANTE V2 · PRODUCCIÓN P8' "$P"
              grep -Fq 'VANTIX_RESTAURANT_V2_DEVICE_SDK_P8' "$SDK"
              grep -Fq 'vantixgc_restaurant_production_device_v63' "$SDK"
              grep -Fq 'VANTIX_RESTAURANT_V2_DEVICE_REALTIME_P8' "$RT"
              grep -Fq 'SSE+PG_NOTIFY' "$RT"
              grep -Fq '"scope": "/app/centro-de-control/mesero-v2/"' "$WP"
              grep -Fq '"scope": "/app/produccion-v2/"' "$PP"
              if grep -Eq 'MutationObserver|setInterval|POLL_MS' "$SDK" "$RT"; then exit 1; fi
              echo "Restaurant V2 Device PWA P8 live at $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          exit 1
