<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VantixGC Edge POS</title>
<style>:root{--bg:#f4f4f5;--card:#fff;--line:#e4e4e7;--text:#18221d;--muted:#61706a;--green:#0d6b43;--red:#b42318;--amber:#b54708}*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.status{padding:8px 12px;border-radius:999px;font-weight:800}.online{background:#ecfdf3;color:#027a48}.offline{background:#fffaeb;color:#b54708}.revoked{background:#fef3f2;color:#b42318}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.line{display:grid;grid-template-columns:2fr .7fr auto;gap:8px;margin:8px 0}.btn,input,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #d0d5dd}.btn{cursor:pointer;font-weight:750;background:#fff}.primary{background:var(--green);color:#fff;border-color:var(--green)}.primary:disabled{opacity:.45;cursor:not-allowed}.danger{color:var(--red)}.muted{color:var(--muted)}.big{font-size:24px;font-weight:850}.notice{padding:11px;border-radius:9px;background:#eff8ff;margin:10px 0}.error{background:#fff1f0;color:#b42318}.warning{color:#b54708}.policy{padding:12px;border:1px solid #fed7aa;background:#fffaeb;border-radius:10px;margin:12px 0}.pay-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}@media(max-width:650px){.line,.pay-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head>
<body><div class="wrap"><div class="top"><div><h1>VantixGC Edge POS</h1><div class="muted" id="point">Punto local</div></div><div id="status" class="status offline">Cargando…</div></div><div id="flash"></div><div id="policyBox" class="policy">Cargando política offline…</div>
<div class="card"><h3>Venta local-first</h3><div id="lines"></div><button class="btn" id="add">+ Agregar producto</button><div class="pay-grid" style="margin-top:16px"><div><label>Forma de cobro</label><br><select id="paymentMode"><option value="CASH">Efectivo</option></select></div><div id="cashWrap"><label>Efectivo recibido</label><br><input id="cash" type="number" min="0" step="1"></div><div style="text-align:right"><div class="muted">Total</div><div id="total" class="big">$0</div><button id="pay" class="btn primary">Cobrar e imprimir</button></div></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3>Inventario local</h3><div><button id="evidence" class="btn">Evidencia de campo</button> <button id="sync" class="btn">Sincronizar ahora</button></div></div><div id="catalog"></div></div>
<div class="card"><h3>Ventas recientes del punto</h3><div id="recent"></div></div></div>
<script>
let catalog=null;let lines=[{productId:'',quantity:1}];let edgeStatus={connected:false,pending:0,offlinePolicy:{paymentPolicy:'CASH_ONLY'}};
const money=v=>new Intl.NumberFormat('es-CO',{style:'currency',currency:catalog?.tenant?.moneda||'COP',maximumFractionDigits:0}).format(Number(v||0));const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]));async function api(p,o={}){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});const b=await r.json();if(!r.ok)throw new Error(b.message||`HTTP ${r.status}`);return b}function flash(t,e=false){document.querySelector('#flash').innerHTML=`<div class="notice ${e?'error':''}">${esc(t)}</div>`;setTimeout(()=>document.querySelector('#flash').innerHTML='',6000)}
function opts(sel){return '<option value="">Seleccione…</option>'+(catalog?.products||[]).filter(x=>x.activo!==false).map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.sku)} · ${esc(p.nombre)} · ${money(p.precio1)}</option>`).join('')}function renderLines(){linesEl.innerHTML=lines.map((l,i)=>`<div class="line"><select data-i="${i}" class="product">${opts(l.productId)}</select><input data-i="${i}" class="qty" type="number" min="0.0001" step="0.0001" value="${l.quantity}"><button data-i="${i}" class="btn danger del">×</button></div>`).join('');document.querySelectorAll('.product').forEach(x=>x.onchange=()=>{lines[x.dataset.i].productId=x.value;calc()});document.querySelectorAll('.qty').forEach(x=>x.oninput=()=>{lines[x.dataset.i].quantity=Number(x.value||0);calc()});document.querySelectorAll('.del').forEach(x=>x.onclick=()=>{lines.splice(Number(x.dataset.i),1);if(!lines.length)lines=[{productId:'',quantity:1}];renderLines();calc()});calc()}function calc(){const map=new Map((catalog?.products||[]).map(p=>[p.id,p]));let total=0;for(const l of lines){const p=map.get(l.productId);if(!p)continue;const sub=Number(p.precio1||0)*Number(l.quantity||0);total+=sub+sub*Number(p.ivaPct||0)/100+sub*Number(p.impoconsumoPct||0)/100}totalEl.textContent=money(total);totalEl.dataset.value=String(total.toFixed(2));if(paymentMode.value==='CASH'&&!cash.value)cash.value=String(Math.ceil(total))}
function renderPolicy(){const p=catalog?.offlinePolicy||edgeStatus.offlinePolicy||{paymentPolicy:'CASH_ONLY'};const offline=!edgeStatus.connected;const previous=paymentMode.value||'CASH';const allowsManual=p.paymentPolicy==='MANUAL_EXTERNAL_PENDING';paymentMode.innerHTML='<option value="CASH">Efectivo</option>'+(allowsManual?'<option value="MANUAL_EXTERNAL_PENDING">Datáfono/QR externo · pendiente de confirmar</option>':'');paymentMode.value=(previous==='MANUAL_EXTERNAL_PENDING'&&allowsManual)?previous:'CASH';if(p.paymentPolicy==='CASH_ONLY')policyBox.innerHTML=offline?'<strong>Sin conexión: solo se aceptan pagos en efectivo.</strong> Tarjeta/QR no están disponibles hasta recuperar conexión.':'Política offline: <strong>solo efectivo</strong>.';if(p.paymentPolicy==='MANUAL_EXTERNAL_PENDING')policyBox.innerHTML=`Política offline: <strong>efectivo o datáfono/QR externo</strong>. El cobro externo queda pendiente de confirmar en Tesorería.${p.manualPaymentNote?`<br>${esc(p.manualPaymentNote)}`:''}`;if(p.paymentPolicy==='PAUSE_SALES')policyBox.innerHTML=offline?'<strong>Sin conexión: nuevas ventas pausadas por configuración del negocio.</strong>':'Política offline: <strong>pausar nuevas ventas si se pierde conexión</strong>.';pay.disabled=offline&&p.paymentPolicy==='PAUSE_SALES';paymentMode.onchange=()=>{cashWrap.style.display=paymentMode.value==='CASH'?'block':'none';calc()};cashWrap.style.display=paymentMode.value==='CASH'?'block':'none'}
async function loadStatus(){try{const s=await api('/api/status');edgeStatus=s;const el=document.querySelector('#status');if(s.revoked){el.className='status revoked';el.textContent='ACCESO REVOCADO'}else if(s.connected){el.className='status online';el.textContent=`Conectado · ${s.pending} pendiente(s)`}else{el.className='status offline';el.textContent=`Modo offline — ${s.pending} pendiente(s)`}if(s.lastError)el.title=s.lastError;renderPolicy()}catch{}}
async function loadCatalog(){try{const r=await api('/api/catalog');catalog=r.data;point.textContent=`${catalog.tenant?.nombreEmpresa||''} · ${catalog.edge?.pointCode||''}`;renderLines();renderPolicy();catalogEl.innerHTML=(catalog.products||[]).filter(p=>p.controlaInventario).slice(0,100).map(p=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:7px 0"><span>${esc(p.sku)} · ${esc(p.nombre)}</span><strong class="${Number(p.stockLocal)<0?'warning':''}">${Number(p.stockLocal).toLocaleString('es-CO')} ${esc(p.unidadMedida)}</strong></div>`).join('')}catch(e){catalogEl.innerHTML=`<div class="warning">${esc(e.message)}</div>`}}
async function loadRecent(){try{const r=await api('/api/sales/recent');recentEl.innerHTML=(r.data||[]).map(x=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:7px 0"><span>${esc(x.localNumber)} · ${new Date(x.createdAt).toLocaleString()}<br><small class="muted">${x.paymentStatus==='PENDING_CONFIRMATION'?'Pago externo pendiente de confirmar':'Pagada en efectivo'}</small></span><strong>${money(x.total)}</strong></div>`).join('')||'<span class="muted">Sin ventas locales.</span>'}catch{}}
const linesEl=document.querySelector('#lines'),totalEl=document.querySelector('#total'),catalogEl=document.querySelector('#catalog'),recentEl=document.querySelector('#recent');add.onclick=()=>{lines.push({productId:'',quantity:1});renderLines()};pay.onclick=async()=>{try{const valid=lines.filter(x=>x.productId&&x.quantity>0);if(!valid.length)throw new Error('Agregue al menos un producto');const mode=paymentMode.value;const r=await api('/api/sales',{method:'POST',body:JSON.stringify({lines:valid,paymentMode:mode,cashReceived:mode==='CASH'?Number(cash.value||0):0})});flash(`Venta ${r.data.localNumber} registrada. ${r.data.paymentStatus==='PENDING_CONFIRMATION'?'Pago externo pendiente de confirmar. ':''}${r.data.mode==='OFFLINE'?'Quedó en cola local.':'Sincronización en curso.'}${r.data.print?.ok?' Ticket impreso.':''}`);lines=[{productId:'',quantity:1}];cash.value='';await Promise.all([loadStatus(),loadCatalog(),loadRecent()])}catch(e){flash(e.message,true)}};sync.onclick=async()=>{try{await api('/api/sync-now',{method:'POST',body:'{}'});await Promise.all([loadStatus(),loadCatalog(),loadRecent()]);flash('Sincronización ejecutada.')}catch(e){flash(e.message,true)}};evidence.onclick=()=>window.open('/api/field-evidence','_blank');(async()=>{await Promise.all([loadStatus(),loadCatalog(),loadRecent()]);setInterval(loadStatus,2000);setInterval(loadCatalog,10000)})();
</script></body></html>
