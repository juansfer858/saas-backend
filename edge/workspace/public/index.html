<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VantixGC Restaurantes · Centro de Control</title>
<style>
:root{--bg:#eef1f0;--card:#fff;--line:#d9dfdc;--text:#18221d;--muted:#61706a;--green:#0d6b43;--green2:#118a57;--soft:#ddf3e8;--amber:#b54708;--red:#b42318;--silver:#667178;--dark:#384147}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.rail{background:linear-gradient(160deg,#899399,#5d676d 55%,#3e474c);color:#fff;padding:18px 13px}.brand{display:flex;gap:10px;align-items:center;margin:4px 7px 22px}.mark{width:38px;height:38px;border-radius:10px;background:var(--green2);display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand small{color:#d8dfe1}.nav{display:grid;gap:6px}.nav button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.12);color:#fff;text-align:left;padding:11px 12px;border-radius:10px;font-weight:750;cursor:pointer}.nav button.active{background:linear-gradient(90deg,rgba(17,138,87,.55),rgba(255,255,255,.16));border-color:rgba(255,255,255,.3)}.rail-foot{margin-top:24px;padding:12px 8px;border-top:1px solid rgba(255,255,255,.15);font-size:12px;color:#d9dfe2}.main{padding:20px;min-width:0}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.top h1{margin:0;font-size:25px}.top .push{margin-left:auto}.pill{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:850}.pill.online{background:#dff5e8;color:#067647}.pill.offline{background:#fff3d6;color:#9a4d00}.btn{border:1px solid #cbd3cf;background:#fff;border-radius:9px;padding:9px 12px;font-weight:780;cursor:pointer}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.amber{background:#fff7ed;border-color:#fed7aa;color:#9a4d00}.btn.danger{color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px}.metric small{color:var(--muted);font-weight:700}.metric strong{display:block;font-size:26px;margin:7px 0}.muted{color:var(--muted)}.section-head{display:flex;align-items:center;gap:10px;margin:0 0 12px}.section-head h2{margin:0}.section-head .push{margin-left:auto}.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}.table{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.table.OCUPADA{border-left:5px solid var(--green2)}.table.CUENTA_PEDIDA{border-left:5px solid var(--amber)}.table.LIBRE{border-left:5px solid #98a2a8}.table h3{margin:5px 0}.state{font-size:11px;font-weight:900;letter-spacing:.07em;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.menu-item{border:1px solid var(--line);border-radius:12px;padding:12px}.menu-item b{display:block}.menu-item small{color:var(--muted)}.qty{display:flex;gap:6px;align-items:center;margin-top:10px}.qty input{width:70px;padding:8px;border:1px solid #cfd6d2;border-radius:8px}.select,input{padding:9px;border:1px solid #cfd6d2;border-radius:8px;background:#fff}.form-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.form-row label{display:grid;gap:5px;font-size:12px;font-weight:760}.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.lane h3{margin-top:0}.command{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0;background:#fff}.command .stamp{font-size:10px;font-weight:900;color:var(--muted)}.command .item{padding:5px 0;border-bottom:1px dashed #e7ebe9}.command .item:last-child{border-bottom:0}.bill{font-size:22px;font-weight:900}.notice{border:1px solid #b8e0ca;background:#eefaf3;padding:11px 13px;border-radius:10px;margin:10px 0}.error{border-color:#f1b7b4;background:#fff2f1;color:var(--red)}.hidden{display:none!important}.empty{padding:20px;text-align:center;color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.rail{position:sticky;top:0;z-index:10;padding:10px}.brand{margin:0 0 8px}.nav{grid-template-columns:repeat(5,1fr);overflow:auto}.nav button{white-space:nowrap;text-align:center;padding:9px}.rail-foot{display:none}.grid{grid-template-columns:1fr 1fr}.kds{grid-template-columns:1fr}.main{padding:12px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top .push{margin-left:0;width:100%}}
</style>
</head>
<body><div class="shell"><aside class="rail"><div class="brand"><div class="mark">V</div><div><b>VantixGC</b><small>Restaurantes · Edge</small></div></div><div class="nav" id="nav"><button data-view="dashboard" class="active">Centro</button><button data-view="tables">Mesas</button><button data-view="waiter">Mesero</button><button data-view="kds">KDS</button><button data-view="cash">Caja</button></div><div class="rail-foot"><div id="pointName">Punto local</div><div id="userLine">Usuario</div></div></aside><main class="main"><div class="top"><div><h1 id="title">Centro de Control</h1><div class="muted" id="subtitle">Operación local-first de esta sede</div></div><span id="connection" class="pill offline push">Comprobando…</span><button class="btn" id="sync">Sincronizar</button><a class="btn" id="cloud" href="https://core.vantixgc.com/app/centro-de-control" target="_blank" rel="noopener">Administración en nube</a><form method="post" action="/workspace/logout"><button class="btn" type="submit">Salir</button></form></div><div id="flash"></div><div id="view"></div></main></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let state=null,view='dashboard',selectedTable=null;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>new Intl.NumberFormat('es-CO',{style:'currency',currency:state?.catalog?.tenant?.moneda||'COP',maximumFractionDigits:0}).format(Number(v||0));async function api(path,opts={}){const r=await fetch(path,{...opts,cache:'no-store',headers:{'Content-Type':'application/json',...(opts.headers||{})}});let b={};try{b=await r.json()}catch{}if(r.status===401){location.href='/';throw new Error('Sesión local vencida')}if(!r.ok)throw new Error(b.message||b?.error?.message||`HTTP ${r.status}`);return b.data}function flash(text,error=false){$('#flash').innerHTML=text?`<div class="notice ${error?'error':''}">${esc(text)}</div>`:'';if(text)setTimeout(()=>$('#flash').innerHTML='',6000)}function can(code){const p=state?.permissions||[];return p.includes('*')||p.includes(code)}function tableBill(id){return Number(state?.ledger?.tables?.[id]?.total||0)}function activeShift(){return (state?.restaurant?.cashShifts||[]).find(x=>x.estado==='ABIERTA'&&x.userId===state?.session?.user?.id)||(state?.restaurant?.cashShifts||[]).find(x=>x.estado==='ABIERTA')||null}async function load(){state=await api('/workspace/api/state');$('#connection').className=`pill ${state.connected?'online':'offline'}`;$('#connection').textContent=state.connected?`LOCAL + NUBE · ${state.local.pending} pendiente(s)`:`LOCAL · SIN INTERNET · ${state.local.pending} pendiente(s)`;$('#pointName').textContent=`${state.session.edge.pointCode} · ${state.session.edge.name}`;$('#userLine').textContent=`${state.session.user.nombre} · ${state.session.user.rol}`;$('#cloud').classList.toggle('hidden',!state.connected);render()}function setView(next){view=next;$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}function render(){if(!state)return;if(view==='dashboard')renderDashboard();if(view==='tables')renderTables();if(view==='waiter')renderWaiter();if(view==='kds')renderKds();if(view==='cash')renderCash()}function renderDashboard(){const tables=state.restaurant.tables||[],commands=state.restaurant.commands||[],open=tables.filter(x=>x.activeSession).length,ready=commands.filter(x=>x.state==='LISTA').length;$('#title').textContent='Centro de Control';$('#view').innerHTML=`<div class="grid"><div class="card metric"><small>Mesas abiertas</small><strong>${open}</strong><span class="muted">de ${tables.length}</span></div><div class="card metric"><small>Comandas activas</small><strong>${commands.filter(x=>!['ENTREGADA','CANCELADA'].includes(x.state)).length}</strong><span class="muted">${ready} listas</span></div><div class="card metric"><small>Operaciones por sincronizar</small><strong>${state.local.pending}</strong><span class="muted">SQLite local</span></div><div class="card metric"><small>Caja</small><strong>${activeShift()?'ABIERTA':'CERRADA'}</strong><span class="muted">turno local</span></div></div><div class="card" style="margin-top:12px"><div class="section-head"><h2>Operación de la sede</h2><span class="muted push">${state.connected?'Sincronización automática con Core':'La sede continúa operando sobre Edge'}</span></div><div class="actions"><button class="btn primary" onclick="setView('waiter')">Nuevo pedido</button><button class="btn" onclick="setView('tables')">Ver mesas</button><button class="btn" onclick="setView('kds')">Abrir KDS</button><button class="btn" onclick="setView('cash')">Caja</button></div></div>`}function tableCard(t){const bill=tableBill(t.id);return `<article class="table ${esc(t.state)}"><div class="state">${esc(t.state)}</div><h3>${esc(t.name)}</h3><div class="muted">${t.activeSession?`${t.activeSession.guestCount||1} comensal(es)`:`${t.seats||0} puestos`}</div>${bill?`<div class="bill">${money(bill)}</div>`:''}<div class="actions">${!t.activeSession&&can('MESAS.CREAR')?`<button class="btn primary" onclick="openTable('${t.id}')">Abrir</button>`:''}${t.activeSession&&can('PEDIDOS.CREAR')?`<button class="btn" onclick="orderFor('${t.id}')">Pedido</button>`:''}${t.activeSession&&can('MESAS.EDITAR')&&t.state!=='CUENTA_PEDIDA'?`<button class="btn amber" onclick="requestAccount('${t.id}')">Pedir cuenta</button>`:''}${t.activeSession&&can('RESTAURANTE.CERRAR')?`<button class="btn" onclick="cashFor('${t.id}')">Cobrar</button>`:''}</div></article>`}function renderTables(){const rows=state.restaurant.tables||[];$('#title').textContent='Mesas';$('#view').innerHTML=`<div class="section-head"><h2>Salón</h2><span class="muted push">Estado guardado localmente y reconciliado con Core</span></div><div class="tables">${rows.map(tableCard).join('')||'<div class="empty card">No hay mesas configuradas.</div>'}</div>`}async function openTable(id){try{await api(`/workspace/api/tables/${id}/open`,{method:'POST',body:JSON.stringify({guestCount:1})});selectedTable=id;await load();setView('waiter')}catch(e){flash(e.message,true)}}async function requestAccount(id){try{await api(`/workspace/api/tables/${id}/account`,{method:'POST',body:'{}'});flash('Cuenta solicitada.');await load()}catch(e){flash(e.message,true)}}function orderFor(id){selectedTable=id;setView('waiter')}function renderWaiter(){const tables=(state.restaurant.tables||[]).filter(x=>x.activeSession),menu=(state.restaurant.menu||[]).filter(x=>x.available!==false);if(!selectedTable||!tables.some(x=>x.id===selectedTable))selectedTable=tables[0]?.id||null;$('#title').textContent='Mesero';$('#view').innerHTML=`<div class="card"><div class="section-head"><h2>Tomar pedido</h2><select id="waiterTable" class="select push">${tables.map(t=>`<option value="${t.id}" ${t.id===selectedTable?'selected':''}>${esc(t.name)} · ${money(tableBill(t.id))}</option>`).join('')}</select></div>${selectedTable?`<div class="menu">${menu.map(m=>`<div class="menu-item"><small>${esc(m.category)} · ${esc(m.station)}</small><b>${esc(m.product?.nombre||'Producto')}</b><strong>${money(m.product?.precio1)}</strong><div class="qty"><input type="number" min="0" step="1" value="0" data-menu="${m.id}"></div></div>`).join('')}</div><div class="actions"><button class="btn primary" id="sendOrder">Enviar pedido</button></div>`:'<div class="empty">No hay mesas abiertas.</div>'}</div>`;$('#waiterTable')?.addEventListener('change',e=>{selectedTable=e.target.value;renderWaiter()});$('#sendOrder')?.addEventListener('click',sendOrder)}async function sendOrder(){const items=$$('[data-menu]').map(x=>({menuItemId:x.dataset.menu,quantity:Number(x.value||0)})).filter(x=>x.quantity>0);if(!items.length)return flash('Agrega al menos un producto.',true);try{await api(`/workspace/api/tables/${selectedTable}/orders`,{method:'POST',body:JSON.stringify({items})});flash('Pedido registrado y enviado a KDS.');await load()}catch(e){flash(e.message,true)}}function commandItems(c){return c.items||c.order?.items?.filter(x=>x.station===c.station)||[]}function commandCard(c){return `<div class="command"><div class="stamp">${esc(c.state)}</div><b>${esc(c.table?.name||c.order?.session?.table?.name||'Mesa')} · ${esc(c.station)}</b>${commandItems(c).map(i=>`<div class="item"><strong>${Number(i.quantity)}×</strong> ${esc(i.description||i.name||'Producto')}</div>`).join('')}<div class="actions">${c.state==='PENDIENTE'?`<button class="btn" onclick="commandState('${encodeURIComponent(c.id)}','EN_PREPARACION')">Preparar</button>`:''}${c.state==='EN_PREPARACION'?`<button class="btn primary" onclick="commandState('${encodeURIComponent(c.id)}','LISTA')">Listo</button>`:''}${c.state==='LISTA'?`<button class="btn" onclick="commandState('${encodeURIComponent(c.id)}','ENTREGADA')">Entregar</button>`:''}</div></div>`}function renderKds(){const commands=(state.restaurant.commands||[]).filter(x=>!['ENTREGADA','CANCELADA'].includes(x.state)),stations=['COCINA','BARRA','POSTRES'];$('#title').textContent='KDS';$('#view').innerHTML=`<div class="kds">${stations.map(st=>`<section class="card lane"><h3>${st}</h3>${commands.filter(x=>x.station===st).map(commandCard).join('')||'<div class="empty">Sin comandas.</div>'}</section>`).join('')}</div>`}async function commandState(id,next){try{await api(`/workspace/api/commands/${id}`,{method:'PATCH',body:JSON.stringify({state:next})});await load()}catch(e){flash(e.message,true)}}function cashFor(id){selectedTable=id;setView('cash')}function renderCash(){const shift=activeShift(),tables=(state.restaurant.tables||[]).filter(x=>x.activeSession),accounts=(state.catalog?.cashAccounts||[]).filter(x=>x.tipo==='CAJA');if(!selectedTable||!tables.some(x=>x.id===selectedTable))selectedTable=tables[0]?.id||null;$('#title').textContent='Caja';$('#view').innerHTML=`<div class="grid" style="grid-template-columns:1fr 1fr"><section class="card"><div class="section-head"><h2>Turno</h2></div>${shift?`<div class="notice">Caja abierta desde ${new Date(shift.abiertoEn).toLocaleString('es-CO')}</div><div class="form-row"><label>Conteo final<input id="finalCash" type="number" value="0"></label><button class="btn amber" id="closeShift">Cerrar turno</button></div>`:`<div class="form-row"><label>Caja<select id="cashAccount" class="select">${accounts.map(a=>`<option value="${a.id}">${esc(a.nombre)}</option>`).join('')}</select></label><label>Fondo inicial<input id="initialCash" type="number" value="0"></label><button class="btn primary" id="openShift">Abrir caja</button></div>`}</section><section class="card"><div class="section-head"><h2>Cobrar mesa</h2></div>${selectedTable?`<div class="form-row"><label>Mesa<select id="cashTable" class="select">${tables.map(t=>`<option value="${t.id}" ${t.id===selectedTable?'selected':''}>${esc(t.name)} · ${money(tableBill(t.id))}</option>`).join('')}</select></label><label>Pago<select id="payMethod" class="select"><option value="EFECTIVO">Efectivo</option><option value="BANCO">Tarjeta / QR / transferencia</option><option value="CREDITO">Crédito</option></select></label><label>Propina<input id="tip" type="number" value="0"></label><button class="btn primary" id="closeTable">Cobrar y cerrar</button></div><div class="bill" id="cashTotal">${money(tableBill(selectedTable))}</div>`:'<div class="empty">No hay mesas abiertas.</div>'}</section></div>`;$('#cashTable')?.addEventListener('change',e=>{selectedTable=e.target.value;$('#cashTotal').textContent=money(tableBill(selectedTable))});$('#openShift')?.addEventListener('click',openShift);$('#closeShift')?.addEventListener('click',closeShift);$('#closeTable')?.addEventListener('click',closeTable)}async function openShift(){try{await api('/workspace/api/cash/open',{method:'POST',body:JSON.stringify({cajaBancoId:$('#cashAccount').value,saldoInicial:Number($('#initialCash').value||0)})});flash('Caja abierta.');await load()}catch(e){flash(e.message,true)}}async function closeShift(){const shift=activeShift();if(!shift)return;try{await api(`/workspace/api/cash/${encodeURIComponent(shift.id)}/close`,{method:'POST',body:JSON.stringify({saldoFinal:Number($('#finalCash').value||0)})});flash('Turno cerrado localmente; se sincronizará con Core.');await load()}catch(e){flash(e.message,true)}}async function closeTable(){if(!selectedTable)return;try{await api(`/workspace/api/tables/${selectedTable}/close`,{method:'POST',body:JSON.stringify({formaPago:$('#payMethod').value,tipAmount:Number($('#tip').value||0)})});flash('Mesa cobrada y cerrada.');selectedTable=null;await load()}catch(e){flash(e.message,true)}}$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});$('#sync').onclick=async()=>{try{await api('/workspace/api/sync',{method:'POST',body:'{}'});flash('Sincronización ejecutada.');await load()}catch(e){flash(e.message,true)}};(async()=>{try{await load();setInterval(()=>load().catch(()=>{}),3000)}catch(e){flash(e.message,true)}})();
</script></body></html>
